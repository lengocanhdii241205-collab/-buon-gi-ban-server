
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>BUÔN GÌ BÁN</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b8e7bd;font-family:Arial,sans-serif;touch-action:none}
#game{position:relative;width:100%;height:100dvh;overflow:hidden;background:#b8e7bd}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;padding:8px;gap:6px;pointer-events:none}
.pill{background:#fff4d9ed;border:2px solid #a97b54;border-radius:12px;padding:7px 10px;color:#65452f;font-size:12px;font-weight:bold;box-shadow:0 2px 0 #77563b30}
#stats{display:flex;gap:5px;flex-wrap:wrap;max-width:80%}
#menuBtn{pointer-events:auto;border:2px solid #a97b54;background:#fff4d9;border-radius:12px;padding:9px;font-weight:bold;color:#65452f}
#location{position:absolute;top:65px;left:50%;transform:translateX(-50%);max-width:85%;text-align:center;background:#fff4d9ed;border:2px solid #a97b54;border-radius:12px;padding:7px 12px;font-size:12px;font-weight:bold;color:#65452f;pointer-events:none}
#joystick{position:absolute;left:15px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:132px;height:132px;border-radius:50%;background:#fff4d966;border:3px solid #fff9e7;box-shadow:0 2px 12px #543d292c;touch-action:none}
#stick{position:absolute;left:38px;top:38px;width:50px;height:50px;border-radius:50%;background:#f6d49b;border:3px solid #9b704e;box-shadow:0 3px 0 #87603d55;pointer-events:none}
#actions{position:absolute;right:12px;bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.act{width:69px;height:69px;border-radius:50%;border:3px solid #fff3d7;background:#e9a65f;color:#593b29;font-weight:bold;font-size:12px;box-shadow:0 4px 0 #8b5d3b;touch-action:manipulation}
.act:active{transform:translateY(3px);box-shadow:0 1px 0 #8b5d3b}
#interact{width:83px;height:83px;background:#91d9a0;font-size:13px}
#hint{position:absolute;bottom:calc(158px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#fff4d9eF;border:2px solid #a97b54;border-radius:12px;padding:7px 10px;color:#65452f;font-size:12px;font-weight:bold;text-align:center;max-width:76%;pointer-events:none}
#panel{display:none;position:absolute;left:4%;right:4%;top:13%;bottom:15%;overflow:auto;background:#fff3d9;border:3px solid #a97b54;border-radius:18px;padding:12px;color:#65452f;box-shadow:0 6px 30px #0004;touch-action:pan-y}
#panel h2{font-size:19px;margin:4px 0 12px}
#panel p{font-size:13px;line-height:1.5}
#panel button{background:#e0f4d9;border:2px solid #89b87e;color:#365d37;border-radius:10px;padding:9px;font-weight:bold}
#panel .close{background:#f9d5c9;border-color:#d99b83}
.item{display:flex;align-items:center;justify-content:space-between;gap:7px;background:#fffaf0;border:1px solid #dfc49b;border-radius:10px;padding:9px;margin:6px 0;font-size:12px}
.item span{line-height:1.5}
.item button{flex-shrink:0}
#toast{position:absolute;top:110px;left:50%;transform:translateX(-50%);background:#fff8e9;border:2px solid #a97b54;border-radius:12px;padding:9px 12px;font-size:13px;font-weight:bold;color:#65452f;display:none;max-width:88%;text-align:center;pointer-events:none}
@media(min-width:760px){
 #joystick{width:150px;height:150px;left:25px;bottom:22px}
 #stick{left:45px;top:45px}
 #actions{right:25px;bottom:25px;flex-direction:row;align-items:flex-end}
 .act{width:76px;height:76px}
 #interact{width:90px;height:90px}
 #hint{bottom:35px;max-width:45%;left:50%}
 #panel{left:25%;right:25%;top:12%;bottom:12%}
}
</style>
</head>
<body>
<div id="game">
 <canvas id="screen"></canvas>
 <div id="hud">
  <div id="stats">
   <span class="pill">💵 <b id="money">1.500.000</b>đ</span>
   <span class="pill">⭐ Cấp <b id="level">1</b></span>
   <span class="pill">📅 Ngày <b id="day">1</b></span>
   <span class="pill">🕒 <b id="clock">06:00</b></span>
  </div>
  <button id="menuBtn">☰</button>
 </div>
 <div id="location">🏡 THỊ TRẤN</div>
 <div id="hint">Dùng joystick để đi bộ · Đến cửa rồi nhấn TƯƠNG TÁC</div>
 <div id="joystick"><div id="stick"></div></div>
 <div id="actions">
  <button class="act" id="bagBtn">🎒<br>KHO ĐỒ</button>
  <button class="act" id="interact">🤝<br>TƯƠNG<br>TÁC</button>
 </div>
 <div id="toast"></div>
 <div id="panel"></div>
</div>

<script>
"use strict";
const canvas=document.getElementById("screen");
const ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);
let W=innerWidth,H=innerHeight,DPR=1;
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener("resize",resize);resize();

const foods=[
 ["Mì trứng",18000,["Mì","Trứng"]],["Cơm gà",32000,["Gạo","Gà"]],
 ["Bánh mì thịt",22000,["Bánh mì","Thịt"]],["Mì bò",42000,["Mì","Thịt bò"]],
 ["Cơm sườn",45000,["Gạo","Thịt"]],["Gà chiên",38000,["Gà","Dầu ăn"]],
 ["Khoai chiên",20000,["Khoai tây","Dầu ăn"]],["Mì cay",48000,["Mì","Ớt"]],
 ["Cơm bò sốt",55000,["Gạo","Thịt bò"]],["Phở bò",50000,["Bánh phở","Thịt bò"]],
 ["Bún thịt nướng",42000,["Bún","Thịt"]],["Cơm cá",39000,["Gạo","Cá"]],
 ["Bánh xèo",35000,["Bột","Thịt"]],["Lẩu mini",85000,["Rau","Thịt"]],
 ["Pizza",95000,["Bột","Phô mai"]],["Hamburger",65000,["Bánh mì","Thịt"]],
 ["Bít tết",150000,["Thịt bò","Rau"]],["Sushi",120000,["Gạo","Cá"]],
 ["Tôm sốt",250000,["Tôm","Bơ"]],["Combo đặc biệt",180000,["Gạo","Thịt","Rau"]]
];
const drinks=[
 ["Nước lọc",8000],["Trà đá",10000],["Trà chanh",18000],["Nước cam",25000],
 ["Trà đào",28000],["Cà phê đen",22000],["Cà phê sữa",28000],["Bạc xỉu",30000],
 ["Sinh tố dâu",35000],["Sinh tố xoài",35000],["Trà sữa",38000],["Trà sữa trân châu",45000],
 ["Matcha latte",42000],["Chocolate nóng",40000],["Soda trái cây",32000],
 ["Nước ép táo",30000],["Cappuccino",48000],["Latte",50000],["Đồ uống đặc biệt",75000]
];
const ingredients=["Gạo","Mì","Trứng","Gà","Bánh mì","Thịt","Thịt bò","Dầu ăn","Khoai tây","Ớt","Bánh phở","Bún","Cá","Bột","Rau","Phô mai","Tôm","Bơ"];
const prices={"Gạo":12000,"Mì":10000,"Trứng":5000,"Gà":18000,"Bánh mì":8000,"Thịt":20000,"Thịt bò":35000,"Dầu ăn":12000,"Khoai tây":10000,"Ớt":5000,"Bánh phở":12000,"Bún":10000,"Cá":22000,"Bột":10000,"Rau":8000,"Phô mai":18000,"Tôm":40000,"Bơ":15000};

const initial={
 money:1500000,level:1,exp:0,day:1,minutes:360,
 inventory:{},cooked:{},bank:0,debt:0,rented:false,rentDays:0,staff:0,
 sold:0,location:"Thị trấn",scene:"town",x:600,y:490,
 quests:{serve:0,earn:0,discover:0},unlocked:["Thị trấn"]
};
let S;
try{S={...initial,...JSON.parse(localStorage.getItem("bgb-save")||"{}")};}catch(e){S={...initial};}
S.inventory ||= {};S.cooked ||= {};S.quests ||= {...initial.quests};S.unlocked ||= ["Thị trấn"];

let joystick={x:0,y:0,active:false,pointer:null};
let keys={};let toastTimer;
let npcs=Array.from({length:13},(_,i)=>({
 x:180+(i*113)%850,y:365+(i*53)%300,
 tx:200+(i*173)%820,ty:370+(i*89)%290,
 name:["An","Bình","Chi","Dũng","Hà","Lan","Minh","Nam","Ngọc","Phúc","Trang","Vy","Tú"][i],
 speed:20+i%3*5
}));
const buildings=[
 {id:"home",name:"Nhà dân",x:100,y:190,w:150,h:115,color:"#f1d39c",roof:"#df7e65",icon:"🏡",scene:"home"},
 {id:"restaurant",name:"Quán ăn",x:345,y:175,w:185,h:130,color:"#ffe2a2",roof:"#e87572",icon:"🍜",scene:"restaurant"},
 {id:"market",name:"Chợ nguyên liệu",x:640,y:175,w:185,h:130,color:"#fff0c4",roof:"#70b9d8",icon:"🛒",scene:"market"},
 {id:"cafe",name:"Quán cà phê",x:925,y:175,w:185,h:130,color:"#ffdfc2",roof:"#b58bd6",icon:"☕",scene:"cafe"},
 {id:"bank",name:"Ngân hàng",x:110,y:570,w:180,h:120,color:"#d8edff",roof:"#73b8df",icon:"🏦",scene:"bank"},
 {id:"shop",name:"Cửa hàng",x:390,y:570,w:180,h:120,color:"#ffe0df",roof:"#e98c87",icon:"🏪",scene:"shop"},
 {id:"apartment",name:"Chung cư",x:700,y:560,w:175,h:130,color:"#e2d5ff",roof:"#9d89d0",icon:"🏢",scene:"apartment"},
 {id:"warehouse",name:"Kho hàng",x:960,y:570,w:160,h:120,color:"#d6ebf4",roof:"#7aafc8",icon:"📦",scene:"warehouse"}
];
const interiors={
 restaurant:{title:"BÊN TRONG QUÁN ĂN",wall:"#ffe8bf",floor:"#eac995",door:{x:400,y:550},counter:{x:520,y:220},objects:"restaurant"},
 market:{title:"BÊN TRONG CHỢ",wall:"#fff0ce",floor:"#e4d0a3",door:{x:400,y:550},counter:{x:580,y:260},objects:"market"},
 cafe:{title:"BÊN TRONG QUÁN CÀ PHÊ",wall:"#f8dfc7",floor:"#dcb991",door:{x:400,y:550},counter:{x:530,y:220},objects:"cafe"},
 home:{title:"BÊN TRONG NHÀ",wall:"#f9e8c9",floor:"#c9a982",door:{x:400,y:550},counter:{x:590,y:290},objects:"home"},
 bank:{title:"BÊN TRONG NGÂN HÀNG",wall:"#d9edfa",floor:"#d0c8b8",door:{x:400,y:550},counter:{x:550,y:260},objects:"bank"},
 shop:{title:"BÊN TRONG CỬA HÀNG",wall:"#ffe6dc",floor:"#e2c5aa",door:{x:400,y:550},counter:{x:555,y:260},objects:"shop"},
 apartment:{title:"SẢNH CHUNG CƯ",wall:"#e7dafa",floor:"#c9bddb",door:{x:400,y:550},counter:{x:600,y:280},objects:"apartment"},
 warehouse:{title:"BÊN TRONG KHO HÀNG",wall:"#d9eaf0",floor:"#c7b99e",door:{x:400,y:550},counter:{x:550,y:280},objects:"warehouse"}
};

function fmt(n){return Math.floor(n).toLocaleString("vi-VN");}
function toast(t){$("toast").textContent=t;$("toast").style.display="block";clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("toast").style.display="none",2300);}
function save(){try{localStorage.setItem("bgb-save",JSON.stringify(S));}catch(e){}updateHud();}
function updateHud(){
 $("money").textContent=fmt(S.money);$("level").textContent=S.level;$("day").textContent=S.day;
 $("clock").textContent=String(Math.floor(S.minutes/60)%24).padStart(2,"0")+":"+String(S.minutes%60).padStart(2,"0");
 $("location").textContent=S.scene==="town"?"🏡 THỊ TRẤN":(interiors[S.scene]?.title||S.location).replace("BÊN TRONG ","");
 $("hint").textContent=S.scene==="town"?"Dùng joystick đi đến cửa · Nhấn TƯƠNG TÁC để vào": "Đi bộ đến cửa dưới màn hình để ra ngoài";
}
function rounded(x,y,w,h,r,fill,stroke="#956b49",lw=3){
 ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();
 if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}
}
function text(t,x,y,size=16,color="#65452f",align="center",bold=true){
 ctx.fillStyle=color;ctx.font=(bold?"bold ":"")+size+"px Arial";ctx.textAlign=align;ctx.fillText(t,x,y);
}
function tree(x,y,s=1){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 ctx.fillStyle="#9c6948";ctx.fillRect(-7,-2,14,35);
 [[-15,-18,24,"#50ad68"],[13,-24,25,"#68c77c"],[0,-42,25,"#7ad489"],[21,0,19,"#48a75f"]].forEach(a=>{
 ctx.beginPath();ctx.arc(a[0],a[1],a[2],0,Math.PI*2);ctx.fillStyle=a[3];ctx.fill();ctx.strokeStyle="#438b55";ctx.lineWidth=2;ctx.stroke();
 });
 ctx.restore();
}
function drawCharacter(x,y,isPlayer=false){
 ctx.save();ctx.translate(x,y);
 ctx.fillStyle="#00000020";ctx.beginPath();ctx.ellipse(0,14,11,5,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle=isPlayer?"#e76b65":"#70b6df";ctx.fillRect(-8,-1,16,15);
 ctx.strokeStyle="#76513e";ctx.lineWidth=2;ctx.strokeRect(-8,-1,16,15);
 ctx.fillStyle="#ffe0bd";ctx.beginPath();ctx.arc(0,-10,9,0,Math.PI*2);ctx.fill();ctx.stroke();
 ctx.fillStyle=isPlayer?"#593d31":"#705040";ctx.beginPath();ctx.arc(0,-14,9,Math.PI,Math.PI*2);ctx.lineTo(8,-10);ctx.lineTo(-8,-10);ctx.fill();
 ctx.fillStyle="#44342b";ctx.beginPath();ctx.arc(-3,-10,1.2,0,7);ctx.arc(3,-10,1.2,0,7);ctx.fill();
 ctx.fillStyle="#fff7dc";ctx.font="bold 10px Arial";ctx.textAlign="center";ctx.fillText(isPlayer?"Bạn":"",0,-27);
 ctx.restore();
}
function drawBuilding(b){
 ctx.save();
 // bóng công trình
 rounded(b.x+5,b.y+7,b.w,b.h,8,"#8b6c4d35",null);
 ctx.fillStyle=b.color;ctx.strokeStyle="#87674a";ctx.lineWidth=4;
 ctx.beginPath();ctx.rect(b.x,b.y+25,b.w,b.h-25);ctx.fill();ctx.stroke();
 ctx.fillStyle=b.roof;ctx.beginPath();ctx.moveTo(b.x-12,b.y+28);ctx.lineTo(b.x+b.w/2,b.y-25);ctx.lineTo(b.x+b.w+12,b.y+28);ctx.closePath();ctx.fill();ctx.stroke();
 // cửa thật ở cạnh dưới
 ctx.fillStyle="#9b6949";ctx.fillRect(b.x+b.w/2-17,b.y+b.h-53,34,53);
 ctx.strokeStyle="#65452f";ctx.strokeRect(b.x+b.w/2-17,b.y+b.h-53,34,53);
 ctx.fillStyle="#f6d17d";ctx.beginPath();ctx.arc(b.x+b.w/2+8,b.y+b.h-27,2,0,7);ctx.fill();
 ctx.fillStyle="#91cbe7";ctx.fillRect(b.x+17,b.y+48,31,30);ctx.fillRect(b.x+b.w-48,b.y+48,31,30);
 ctx.strokeStyle="#87674a";ctx.lineWidth=2;ctx.strokeRect(b.x+17,b.y+48,31,30);ctx.strokeRect(b.x+b.w-48,b.y+48,31,30);
 text(b.icon,b.x+b.w/2,b.y+20,20);
 text(b.name,b.x+b.w/2,b.y+b.h+19,14,"#684630");
 ctx.restore();
}
function drawTown(){
 ctx.fillStyle="#c7e8b6";ctx.fillRect(0,0,1200,800);
 // cỏ
 for(let y=0;y<800;y+=44)for(let x=0;x<1200;x+=50){
 ctx.fillStyle=((x/50+y/44)%2<1)?"#c7e8b6":"#c0e3b1";ctx.fillRect(x,y,50,44);
 }
 // công viên
 rounded(25,25,300,115,20,"#9cdb99","#70bb79",4);
 text("🌳 CÔNG VIÊN",175,50,18,"#376d44");
 for(let i=0;i<5;i++)tree(65+i*55,100,.55);
 // đường ngang dọc
 ctx.fillStyle="#d6c7a5";ctx.fillRect(0,325,1200,75);ctx.fillRect(0,510,1200,65);
 ctx.fillRect(310,0,60,800);ctx.fillRect(600,0,65,800);ctx.fillRect(890,0,60,800);
 ctx.strokeStyle="#fff0ce";ctx.lineWidth=3;ctx.setLineDash([18,14]);
 ctx.beginPath();ctx.moveTo(0,363);ctx.lineTo(1200,363);ctx.moveTo(0,542);ctx.lineTo(1200,542);ctx.moveTo(340,0);ctx.lineTo(340,800);ctx.moveTo(632,0);ctx.lineTo(632,800);ctx.moveTo(920,0);ctx.lineTo(920,800);ctx.stroke();ctx.setLineDash([]);
 buildings.forEach(drawBuilding);
 [[35,470],[300,465],[580,450],[860,460],[1160,460],[320,710],[620,710],[900,710],[1150,710]].forEach((p,i)=>tree(p[0],p[1],i%2?.7:.85));
 // đài phun nước
 ctx.fillStyle="#a3d9e9";ctx.beginPath();ctx.ellipse(770,440,48,24,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#fff1d4";ctx.lineWidth=6;ctx.stroke();
 ctx.fillStyle="#65b9de";ctx.beginPath();ctx.ellipse(770,440,31,14,0,0,Math.PI*2);ctx.fill();
 npcs.forEach(n=>drawCharacter(n.x,n.y,false));
}
function drawInterior(){
 let it=interiors[S.scene];if(!it)return;
 ctx.fillStyle=it.wall;ctx.fillRect(0,0,800,600);
 // nền lát gạch
 ctx.fillStyle=it.floor;ctx.fillRect(0,110,800,490);
 ctx.strokeStyle="#ffffff55";ctx.lineWidth=1;
 for(let y=120;y<600;y+=45){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(800,y);ctx.stroke();}
 for(let x=0;x<800;x+=55){ctx.beginPath();ctx.moveTo(x,110);ctx.lineTo(x,600);ctx.stroke();}
 // tường trên và cửa sổ
 ctx.fillStyle=it.wall;ctx.fillRect(0,0,800,115);
 ctx.fillStyle="#fff8dc";ctx.fillRect(50,35,100,55);ctx.fillRect(650,35,100,55);
 ctx.strokeStyle="#956b49";ctx.lineWidth=4;ctx.strokeRect(50,35,100,55);ctx.strokeRect(650,35,100,55);
 ctx.beginPath();ctx.moveTo(100,35);ctx.lineTo(100,90);ctx.moveTo(50,62);ctx.lineTo(150,62);ctx.moveTo(700,35);ctx.lineTo(700,90);ctx.moveTo(650,62);ctx.lineTo(750,62);ctx.stroke();
 text(it.title,400,24,17);
 // quầy
 if(["restaurant","market","cafe","bank","shop","warehouse"].includes(S.scene)){
 rounded(490,175,235,72,8,S.scene==="bank"?"#9bcbe6":"#b98156","#80573d",4);
 ctx.fillStyle="#e7bd87";ctx.fillRect(505,187,205,18);
 text(S.scene==="bank"?"QUẦY GIAO DỊCH":S.scene==="market"?"QUẦY NGUYÊN LIỆU":S.scene==="shop"?"QUẦY THU NGÂN":S.scene==="warehouse"?"KỆ HÀNG":S.scene==="cafe"?"QUẦY PHA CHẾ":"QUẦY PHỤC VỤ",607,166,12);
 }
 if(S.scene==="restaurant"){
 // bếp và bàn ăn
 rounded(65,145,160,90,10,"#e6a36c","#956b49",3);text("🍳 BẾP",145,195,20);
 for(let y of [300,410])for(let x of [120,290]){
 rounded(x,y,100,55,10,"#c58d5b","#876347",3);
 for(let j=0;j<2;j++){ctx.fillStyle="#e6c69a";ctx.beginPath();ctx.arc(x+28+j*43,y+27,13,0,7);ctx.fill();}
 }
 }
 if(S.scene==="market"||S.scene==="shop"||S.scene==="warehouse"){
 for(let y of [145,280,415]){rounded(70,y,320,52,7,"#a66e4b","#80573d",3);for(let i=0;i<5;i++){ctx.fillStyle=["#e76e68","#edc55e","#7dc789","#80c5e7","#bd9be1"][i];rounded(82+i*60,y+7,42,36,5,ctx.fillStyle,null);text(["🥬","🍅","🥚","🥖","🥫"][i],103+i*60,y+30,18);}}
 }
 if(S.scene==="cafe"){
 for(let y of [315,440])for(let x of [100,300]){rounded(x,y,100,55,8,"#ba8d66","#80573d",3);text("☕",x+50,y+34,22);ctx.fillStyle="#a67b55";ctx.fillRect(x+5,y+48,8,25);ctx.fillRect(x+87,y+48,8,25);}
 }
 if(S.scene==="home"){
 rounded(95,180,190,120,8,"#d6b18b","#956b49",3);text("🛏️ GIƯỜNG",190,245,22);
 rounded(460,350,145,85,8,"#d6b18b","#956b49",3);text("🪑 BÀN",532,395,20);
 }
 if(S.scene==="bank"){
 for(let x of [100,290]){rounded(x,290,120,75,8,"#8cb8d6","#547d99",3);text("🏦",x+60,335,24);}
 }
 if(S.scene==="apartment"){
 for(let x of [100,300,500]){rounded(x,250,120,110,8,"#c1a9dd","#8a70a8",3);text("🚪",x+60,310,25);}
 }
 // cửa ra ngoài
 ctx.fillStyle="#855638";ctx.fillRect(350,520,100,80);
 ctx.strokeStyle="#fff0cb";ctx.lineWidth=4;ctx.strokeRect(350,520,100,80);
 ctx.fillStyle="#f3ce78";ctx.beginPath();ctx.arc(430,560,4,0,7);ctx.fill();
 text("CỬA RA",400,510,12);
 // nhân viên đứng ở quầy
 drawCharacter(450,260,false);
 drawCharacter(S.x,S.y,true);
}
function drawWorld(){
 ctx.clearRect(0,0,W,H);
 let sceneW=S.scene==="town"?1200:800,sceneH=S.scene==="town"?800:600;
 let scale=Math.min(W/sceneW,H/sceneH);
 // dùng màn hình rộng, vẫn giữ toàn bộ cảnh trong khung nhìn
 let viewW=W/scale,viewH=H/scale;
 let camX=clamp(S.x-viewW/2,0,Math.max(0,sceneW-viewW));
 let camY=clamp(S.y-viewH/2,0,Math.max(0,sceneH-viewH));
 ctx.save();ctx.scale(scale,scale);ctx.translate(-camX,-camY);
 if(S.scene==="town")drawTown();else drawInterior();
 if(S.scene==="town")drawCharacter(S.x,S.y,true);
 ctx.restore();
 // tối nhẹ ban đêm
 let hour=Math.floor(S.minutes/60)%24;
 if(hour>=19||hour<5){ctx.fillStyle="#17265035";ctx.fillRect(0,0,W,H);}
}
function nearestBuilding(){
 if(S.scene!=="town")return null;
 let best=null,dist=Infinity;
 for(let b of buildings){
 let dx=S.x-(b.x+b.w/2),dy=S.y-(b.y+b.h);
 let d=Math.hypot(dx,dy);
 if(d<dist){dist=d;best=b;}
 }
 return dist<85?best:null;
}
function movePlayer(dt){
 let dx=joystick.x,dy=joystick.y;
 if(keys.ArrowLeft||keys.a)dx-=1;if(keys.ArrowRight||keys.d)dx+=1;
 if(keys.ArrowUp||keys.w)dy-=1;if(keys.ArrowDown||keys.s)dy+=1;
 let len=Math.hypot(dx,dy);if(len>1){dx/=len;dy/=len;}
 const speed=S.scene==="town"?175:155;
 let nx=S.x+dx*speed*dt,ny=S.y+dy*speed*dt;
 if(S.scene==="town"){
 S.x=clamp(nx,18,1180);S.y=clamp(ny,145,780);
 // cản đơn giản trước mặt công trình, cửa vẫn có thể đi đến
 }else{
 S.x=clamp(nx,18,782);S.y=clamp(ny,125,585);
 }
}
function enterBuilding(b){
 S.scene=b.scene;S.location=b.name;S.x=400;S.y=480;
 if(!S.unlocked.includes(b.name)){S.unlocked.push(b.name);S.quests.discover++;}
 updateHud();save();toast("🚪 Bạn đã đi vào "+b.name+"!");
}
function exitBuilding(){
 S.scene="town";
 const b=buildings.find(v=>v.scene===S.location.toLowerCase())||buildings.find(v=>v.name===S.location);
 let found=buildings.find(v=>v.name===S.location);
 if(!found)found=buildings.find(v=>v.scene===S.scene);
 // đưa nhân vật ra ngay trước cửa đúng công trình
 const original=buildings.find(v=>v.name===S.location);
 if(original){S.x=original.x+original.w/2;S.y=original.y+original.h+20;}
 else {S.x=600;S.y=480;}
 S.location="Thị trấn";updateHud();save();toast("🚶 Bạn đã ra đường phố.");
}
function interact(){
 if($("panel").style.display==="block")return;
 if(S.scene==="town"){
 let b=nearestBuilding();
 if(b){enterBuilding(b);return;}
 let n=npcs.find(v=>Math.hypot(v.x-S.x,v.y-S.y)<45);
 if(n){let reward=5000+S.level*1000;S.money+=reward;S.exp+=5;S.quests.serve++;S.quests.earn+=reward;levelCheck();save();toast(n.name+": Cảm ơn bạn! Tiền boa "+fmt(reward)+"đ.");return;}
 toast("Đi sát cửa quán, chợ hoặc cửa hàng rồi nhấn TƯƠNG TÁC.");return;
 }
 if(S.y>465&&Math.abs(S.x-400)<90){exitBuilding();return;}
 const it=interiors[S.scene];
 if(it&&Math.hypot(S.x-it.counter.x,S.y-it.counter.y)<150){openBusiness(S.scene);return;}
 if(S.scene==="home"){toast("🏡 Bạn đang nghỉ ngơi trong nhà.");return;}
 openBusiness(S.scene);
}
function levelCheck(){while(S.exp>=S.level*100){S.exp-=S.level*100;S.level++;toast("🎉 Bạn lên cấp "+S.level+"!");}}
function showPanel(title,html){
 let p=$("panel");p.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2>${title}</h2><button class="close" onclick="closePanel()">✖ Đóng</button></div>${html}`;p.style.display="block";
}
function closePanel(){$("panel").style.display="none";}
function openBusiness(scene){
 if(scene==="market"||scene==="shop"){openMarket();return;}
 if(scene==="restaurant"||scene==="cafe"){openKitchen();return;}
 if(scene==="bank"){openBank();return;}
 if(scene==="warehouse"){openBag();return;}
 if(scene==="home"){showPanel("🏡 NHÀ DÂN",`<p>Đây là nhà của bạn. Có thể ra cửa để trở lại thành phố.</p><button onclick="exitBuilding()">🚪 RA NGOÀI</button>`);return;}
 if(scene==="apartment"){showPanel("🏢 CHUNG CƯ",`<p>Sảnh chung cư của thị trấn.</p><button onclick="exitBuilding()">🚪 RA NGOÀI</button>`);}
}
function openMarket(){
 let html="<p>🛒 Bạn đang ở bên trong cửa hàng. Đi đến quầy và chọn nguyên liệu muốn mua.</p>";
 html+=ingredients.map(n=>`<div class="item"><span>📦 ${n}<br>${fmt(prices[n])}đ · Có ${S.inventory[n]||0}</span><button onclick="buy('${n}',1)">MUA 1</button><button onclick="buy('${n}',5)">MUA 5</button></div>`).join("");
 showPanel("🛒 CHỢ & CỬA HÀNG",html);
}
function buy(n,q){
 let p=(prices[n]||10000)*q;
 if(S.money<p){toast("❌ Không đủ tiền!");return;}
 S.money-=p;S.inventory[n]=(S.inventory[n]||0)+q;save();toast("Đã mua "+q+" "+n);openMarket();
}
function openKitchen(){
 let html="<p>🍳 Chế biến đồ ăn trong quán. Mày cần mua đủ nguyên liệu trước khi nấu.</p>";
 html+="<h3>MÓN ĂN</h3>"+foods.map((f,i)=>`<div class="item"><span>🍲 ${f[0]}<br>Giá bán ${fmt(f[1]+(S.level-1)*1000)}đ<br>Cần: ${f[2].join(", ")}<br>Đã nấu: ${S.cooked[f[0]]||0}</span><button onclick="cook(${i})">NẤU</button><button onclick="sellFood(${i})">BÁN</button></div>`).join("");
 html+="<h3>🥤 ĐỒ UỐNG</h3>"+drinks.map((v,i)=>`<div class="item"><span>${v[0]}<br>${fmt(v[1]+(S.level-1)*500)}đ · Có ${S.cooked[v[0]]||0}</span><button onclick="makeDrink(${i})">PHA</button><button onclick="sellDrink(${i})">BÁN</button></div>`).join("");
 showPanel("🍜 QUÁN ĂN & PHA CHẾ",html);
}
function cook(i){
 let f=foods[i];
 for(let n of f[2])if((S.inventory[n]||0)<1){toast("Thiếu nguyên liệu: "+n);return;}
 f[2].forEach(n=>S.inventory[n]--);
 S.cooked[f[0]]=(S.cooked[f[0]]||0)+1;S.exp+=4;levelCheck();save();toast("🍳 Đã nấu "+f[0]);openKitchen();
}
function makeDrink(i){let d=drinks[i];S.cooked[d[0]]=(S.cooked[d[0]]||0)+1;S.exp+=2;levelCheck();save();toast("🥤 Đã pha "+d[0]);openKitchen();}
function sellFood(i){
 let f=foods[i];if(!(S.cooked[f[0]]||0)){toast("Chưa có món này để bán.");return;}
 S.cooked[f[0]]--;let p=f[1]+(S.level-1)*1000;S.money+=p;S.sold++;S.quests.earn+=p;S.quests.serve++;S.exp+=8;levelCheck();save();toast("💵 Bán "+f[0]+" được "+fmt(p)+"đ");openKitchen();
}
function sellDrink(i){
 let d=drinks[i];if(!(S.cooked[d[0]]||0)){toast("Chưa pha món này.");return;}
 S.cooked[d[0]]--;let p=d[1]+(S.level-1)*500;S.money+=p;S.sold++;S.quests.earn+=p;S.quests.serve++;S.exp+=4;levelCheck();save();toast("💵 Bán "+d[0]+" được "+fmt(p)+"đ");openKitchen();
}
function openBag(){
 let html="<h3>📦 NGUYÊN LIỆU</h3>"+ingredients.map(n=>`<div class="item"><span>${n}</span><b>${S.inventory[n]||0}</b></div>`).join("");
 html+="<h3>🍱 MÓN ĐÃ CHẾ BIẾN</h3>"+[...foods.map(f=>f[0]),...drinks.map(d=>d[0])].map(n=>`<div class="item"><span>${n}</span><b>${S.cooked[n]||0}</b></div>`).join("");
 showPanel("🎒 KHO HÀNG",html);
}
function openBank(){
 showPanel("🏦 NGÂN HÀNG",`<p>💵 Tiền mặt: ${fmt(S.money)}đ<br>🏦 Tiền gửi: ${fmt(S.bank)}đ<br>💳 Nợ: ${fmt(S.debt)}đ</p>
 <div class="item"><span>Gửi 100.000đ</span><button onclick="deposit()">GỬI</button></div>
 <div class="item"><span>Rút 100.000đ</span><button onclick="withdraw()">RÚT</button></div>
 <div class="item"><span>Vay 500.000đ (có lãi)</span><button onclick="borrow()">VAY</button></div>
 <div class="item"><span>Trả nợ 100.000đ</span><button onclick="repay()">TRẢ NỢ</button></div>`);
}
function deposit(){if(S.money<100000)return toast("Không đủ tiền.");S.money-=100000;S.bank+=100000;save();openBank();}
function withdraw(){if(S.bank<100000)return toast("Số dư không đủ.");S.bank-=100000;S.money+=100000;save();openBank();}
function borrow(){S.money+=500000;S.debt+=550000;save();openBank();toast("Đã vay 500.000đ, khoản nợ 550.000đ.");}
function repay(){let n=Math.min(100000,S.debt);if(S.money<n)return toast("Không đủ tiền trả nợ.");S.money-=n;S.debt-=n;save();openBank();}
function openMenu(){
 showPanel("📱 MENU GAME",`<div class="item"><span>🗺️ Bản đồ thành phố</span><button onclick="showMap()">XEM</button></div>
 <div class="item"><span>🎒 Kho hàng</span><button onclick="openBag()">MỞ</button></div>
 <div class="item"><span>🍜 Quán ăn / chế biến</span><button onclick="openKitchen()">MỞ</button></div>
 <div class="item"><span>🛒 Chợ nguyên liệu</span><button onclick="openMarket()">MỞ</button></div>
 <div class="item"><span>🏦 Ngân hàng</span><button onclick="openBank()">MỞ</button></div>
 <div class="item"><span>💾 Lưu tiến trình</span><button onclick="save();toast('Đã lưu game!')">LƯU</button></div>
 <div class="item"><span>🚪 Tiếp tục chơi</span><button onclick="closePanel()">ĐÓNG MENU</button></div>`);
}
function showMap(){
 let html="<p>Chọn địa điểm để xem vị trí. Nhân vật vẫn phải tự đi đến cửa mới vào được.</p>";
 html+=buildings.map(b=>`<div class="item"><span>${b.icon} ${b.name}</span><button onclick="closePanel();S.x=${b.x+b.w/2};S.y=${b.y+b.h+20};toast('Đã đánh dấu '+${JSON.stringify(b.name)})">ĐÁNH DẤU</button></div>`).join("");
 showPanel("🗺️ THÀNH PHỐ",html);
}
function resetGame(){if(confirm("Xóa toàn bộ dữ liệu và chơi lại?")){localStorage.removeItem("bgb-save");location.reload();}}

$("interact").addEventListener("pointerdown",e=>{e.preventDefault();interact();});
$("bagBtn").addEventListener("pointerdown",e=>{e.preventDefault();openBag();});
$("menuBtn").addEventListener("pointerdown",e=>{e.preventDefault();openMenu();});

const joy=$("joystick"),stick=$("stick");
function setJoy(e){
 const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy;
 let max=r.width*.31,len=Math.hypot(dx,dy);
 if(len>max){dx=dx/len*max;dy=dy/len*max;}
 joystick.x=dx/max;joystick.y=dy/max;
 stick.style.transform=`translate(${dx}px,${dy}px)`;
}
joy.addEventListener("pointerdown",e=>{e.preventDefault();joystick.active=true;joystick.pointer=e.pointerId;joy.setPointerCapture(e.pointerId);setJoy(e);});
joy.addEventListener("pointermove",e=>{if(joystick.active&&e.pointerId===joystick.pointer)setJoy(e);});
function endJoy(e){if(e.pointerId!==joystick.pointer)return;joystick.active=false;joystick.pointer=null;joystick.x=0;joystick.y=0;stick.style.transform="translate(0,0)";}
joy.addEventListener("pointerup",endJoy);joy.addEventListener("pointercancel",endJoy);
addEventListener("keydown",e=>{keys[e.key]=true;keys[e.key.toLowerCase()]=true;if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();if(e.key.toLowerCase()==="e")interact();if(e.key==="Escape")closePanel();});
addEventListener("keyup",e=>{keys[e.key]=false;keys[e.key.toLowerCase()]=false;});

let last=performance.now(),autosave=0;
function loop(now){
 let dt=Math.min((now-last)/1000,.05);last=now;
 if($("panel").style.display!=="block"){
  movePlayer(dt);
  if(S.scene==="town"){
   npcs.forEach(n=>{
    if(Math.hypot(n.tx-n.x,n.ty-n.y)<12){n.tx=80+Math.random()*1040;n.ty=350+Math.random()*360;}
    let dx=n.tx-n.x,dy=n.ty-n.y,d=Math.hypot(dx,dy)||1;
    n.x+=dx/d*n.speed*dt;n.y+=dy/d*n.speed*dt;
   });
  }
 }
 drawWorld();
 autosave+=dt;
 if(autosave>1){autosave=0;S.minutes+=1;if(S.minutes>=1440){S.minutes=0;S.day++;}updateHud();save();}
 requestAnimationFrame(loop);
}
updateHud();requestAnimationFrame(loop);
</script>
</body>
</html>
