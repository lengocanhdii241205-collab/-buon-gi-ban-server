<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>Buông Gì Bán</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #8fd3ff;
      color: #fff;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      color: #fff;
    }

    /* =========================
       LOADING
    ========================= */

    #loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at center, #214b68 0%, #07131d 75%);
      transition: opacity 0.5s ease;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-logo {
      font-size: clamp(30px, 8vw, 58px);
      font-weight: 900;
      margin-bottom: 10px;
      text-shadow: 0 5px 20px rgba(0, 0, 0, 0.45);
    }

    .loading-text {
      opacity: 0.85;
      font-size: 15px;
      margin-bottom: 20px;
    }

    .loading-bar {
      width: min(300px, 70vw);
      height: 8px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.18);
    }

    .loading-bar-inner {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: #55e69b;
      animation: loading 1.8s ease forwards;
    }

    @keyframes loading {
      from {
        width: 0;
      }

      to {
        width: 100%;
      }
    }

    /* =========================
       LOGIN
    ========================= */

    #login {
      position: fixed;
      inset: 0;
      z-index: 5000;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: rgba(2, 10, 17, 0.62);
      backdrop-filter: blur(7px);
    }

    .login-card {
      width: min(430px, 94vw);
      padding: 28px;
      border-radius: 24px;
      background: rgba(16, 27, 38, 0.95);
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    .login-title {
      font-size: 31px;
      font-weight: 900;
      margin-bottom: 5px;
    }

    .login-subtitle {
      font-size: 14px;
      color: #b8c7d5;
      margin-bottom: 22px;
    }

    #player-name {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      outline: none;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      margin-bottom: 15px;
    }

    #player-name::placeholder {
      color: #8fa1b2;
    }

    .gender-title {
      font-size: 13px;
      color: #9fb0bf;
      margin-bottom: 8px;
    }

    .gender-row {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .gender-btn {
      flex: 1;
      padding: 12px;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.08);
      color: #dbe6ef;
      border: 1px solid transparent;
    }

    .gender-btn.active {
      border-color: #63d99d;
      background: rgba(99, 217, 157, 0.18);
    }

    #play-btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      background: linear-gradient(135deg, #35c77c, #1da85f);
      font-weight: 800;
      font-size: 16px;
    }

    #play-btn:active {
      transform: scale(0.98);
    }

    /* =========================
       HUD
    ========================= */

    #hud {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
    }

    .hud-card {
      background: rgba(9, 18, 27, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.18);
    }

    #player-info {
      position: absolute;
      top: 12px;
      left: 12px;
      min-width: 220px;
      padding: 11px 13px;
      border-radius: 15px;
    }

    #player-name-display {
      font-weight: 800;
      margin-bottom: 4px;
    }

    #money {
      color: #71efad;
      font-weight: 800;
    }

    #job {
      color: #c8d4df;
      font-size: 13px;
      margin-top: 3px;
    }

    #world-info {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 10px 13px;
      border-radius: 15px;
      text-align: right;
      font-size: 13px;
      line-height: 1.55;
    }

    #world-info strong {
      color: #fff;
    }

    #menu-buttons {
      position: absolute;
      top: 95px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      pointer-events: auto;
    }

    .hud-button {
      min-width: 105px;
      padding: 9px 11px;
      border-radius: 12px;
      background: rgba(9, 18, 27, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 13px;
    }

    .hud-button:active {
      transform: scale(0.96);
    }

    /* =========================
       NOTICE
    ========================= */

    #notices {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: min(450px, 72vw);
      display: flex;
      flex-direction: column;
      gap: 7px;
      align-items: center;
    }

    .notice {
      max-width: 100%;
      padding: 9px 13px;
      border-radius: 12px;
      background: rgba(8, 16, 24, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 13px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      animation: noticeIn 0.2s ease;
    }

    .notice.error {
      border-color: rgba(255, 80, 80, 0.45);
    }

    @keyframes noticeIn {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       CHAT
    ========================= */

    #chat-box {
      position: absolute;
      left: 12px;
      bottom: 12px;
      width: min(350px, 50vw);
      pointer-events: auto;
    }

    #chat-messages {
      max-height: 170px;
      overflow-y: auto;
      margin-bottom: 7px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      scrollbar-width: none;
    }

    #chat-messages::-webkit-scrollbar {
      display: none;
    }

    .chat-message {
      width: fit-content;
      max-width: 100%;
      padding: 6px 9px;
      border-radius: 9px;
      background: rgba(9, 18, 27, 0.72);
      font-size: 12px;
      word-break: break-word;
    }

    .chat-message .chat-name {
      color: #76e9ae;
      font-weight: 800;
      margin-right: 5px;
    }

    #chat-form {
      display: flex;
      gap: 5px;
    }

    #chat-input {
      flex: 1;
      min-width: 0;
      padding: 9px 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 11px;
      outline: none;
      color: #fff;
      background: rgba(8, 16, 24, 0.86);
    }

    #chat-send {
      padding: 9px 12px;
      border-radius: 11px;
      background: #2cb86f;
      font-weight: 800;
    }

    /* =========================
       JOYSTICK
    ========================= */

    #joystick {
      position: absolute;
      left: 20px;
      bottom: 105px;
      width: 125px;
      height: 125px;
      border-radius: 50%;
      background: rgba(10, 20, 30, 0.28);
      border: 2px solid rgba(255, 255, 255, 0.18);
      pointer-events: auto;
      touch-action: none;
    }

    #joystick-stick {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 52px;
      height: 52px;
      margin-left: -26px;
      margin-top: -26px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
    }

    /* =========================
       ACTIONS
    ========================= */

    #actions {
      position: absolute;
      right: 18px;
      bottom: 105px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      pointer-events: auto;
    }

    .action-button {
      width: 105px;
      padding: 13px 10px;
      border-radius: 16px;
      background: rgba(9, 18, 27, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-weight: 800;
    }

    .action-button:active {
      transform: scale(0.95);
    }

    /* =========================
       MENUS
    ========================= */

    .menu {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 15px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(5px);
      pointer-events: auto;
    }

    .menu-card {
      width: min(650px, 94vw);
      max-height: 86vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border-radius: 20px;
      background: #101b26;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
    }

    .menu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .menu-title {
      font-size: 20px;
      font-weight: 900;
    }

    .close-menu {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
    }

    .menu-content {
      overflow-y: auto;
      padding: 15px;
    }

    .menu-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.055);
    }

    .menu-row:last-child {
      margin-bottom: 0;
    }

    .menu-row-info {
      min-width: 0;
      flex: 1;
    }

    .menu-row-title {
      font-weight: 800;
      margin-bottom: 3px;
    }

    .menu-row-sub {
      font-size: 12px;
      color: #aab9c6;
      line-height: 1.45;
    }

    .menu-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: flex-end;
    }

    .small-button {
      padding: 8px 10px;
      border-radius: 9px;
      background: #287d55;
      font-size: 12px;
      font-weight: 800;
    }

    .small-button.blue {
      background: #326fa8;
    }

    .small-button.orange {
      background: #a96425;
    }

    .small-button.red {
      background: #9e4141;
    }

    .small-button.gray {
      background: #485461;
    }

    .empty-text {
      padding: 20px;
      text-align: center;
      color: #9aaab8;
    }

    .section-title {
      font-size: 14px;
      font-weight: 900;
      margin: 15px 0 8px;
      color: #76e9ae;
    }

    .business-summary {
      padding: 14px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.05);
      line-height: 1.6;
      margin-bottom: 10px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {
      #player-info {
        min-width: 175px;
        max-width: 50vw;
      }

      #world-info {
        max-width: 42vw;
      }

      #menu-buttons {
        top: 96px;
        right: 8px;
      }

      .hud-button {
        min-width: 90px;
        padding: 8px;
        font-size: 12px;
      }

      #chat-box {
        left: 8px;
        bottom: 8px;
        width: 54vw;
      }

      #joystick {
        left: 14px;
        bottom: 100px;
        width: 115px;
        height: 115px;
      }

      #actions {
        right: 10px;
        bottom: 100px;
      }

      .action-button {
        width: 92px;
        padding: 11px 8px;
      }

      #notices {
        top: 90px;
        width: 65vw;
      }
    }

    @media (max-width: 450px) {
      #player-info {
        font-size: 12px;
      }

      #world-info {
        font-size: 11px;
      }

      .menu-row {
        align-items: flex-start;
        flex-direction: column;
      }

      .menu-actions {
        width: 100%;
        justify-content: flex-start;
      }

      #chat-box {
        width: 60vw;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       LOADING
  ========================== -->

  <div id="loading">
    <div class="loading-logo">🏪 Buông Gì Bán</div>
    <div class="loading-text">Đang xây dựng thành phố...</div>

    <div class="loading-bar">
      <div class="loading-bar-inner"></div>
    </div>
  </div>

  <!-- =========================
       LOGIN
  ========================== -->

  <div id="login">
    <div class="login-card">

      <div class="login-title">
        🏪 Buông Gì Bán
      </div>

      <div class="login-subtitle">
        Thành phố mở — làm việc, mua bán và xây dựng cửa hàng của bạn.
      </div>

      <input
        id="player-name"
        type="text"
        maxlength="20"
        placeholder="Nhập tên nhân vật..."
        autocomplete="off"
      />

      <div class="gender-title">
        Chọn nhân vật
      </div>

      <div class="gender-row">
        <button
          type="button"
          class="gender-btn active"
          data-gender="male"
        >
          👨 Nam
        </button>

        <button
          type="button"
          class="gender-btn"
          data-gender="female"
        >
          👩 Nữ
        </button>
      </div>

      <button id="play-btn" type="button">
        🎮 Vào thành phố
      </button>

    </div>
  </div>

  <!-- =========================
       HUD
  ========================== -->

  <div id="hud">

    <div id="player-info" class="hud-card">
      <div id="player-name-display">
        Người chơi
      </div>

      <div>
        💰 <span id="money">0$</span>
      </div>

      <div id="job">
        Nghề: Tự do
      </div>
    </div>

    <div id="world-info" class="hud-card">
      <div>
        🕐 <strong id="time">08:00</strong>
      </div>

      <div>
        📅 Ngày <strong id="day">1</strong>
      </div>

      <div id="weather">
        ☀️ Trời nắng
      </div>
    </div>

    <div id="menu-buttons">

      <button
        class="hud-button"
        type="button"
        onclick="openMenu('inventory-menu')"
      >
        🎒 Túi đồ
      </button>

      <button
        class="hud-button"
        type="button"
        onclick="openMenu('shop-menu')"
      >
        🛒 Chợ
      </button>

      <button
        class="hud-button"
        type="button"
        onclick="openMenu('job-menu')"
      >
        💼 Nghề
      </button>

      <button
        class="hud-button"
        type="button"
        onclick="openMenu('business-menu')"
      >
        🏪 Kinh doanh
      </button>

      <button
        class="hud-button"
        type="button"
        onclick="openMenu('furniture-menu')"
      >
        🪑 Nội thất
      </button>

      <button
        class="hud-button"
        type="button"
        onclick="toggleBike()"
      >
        🛵 Xe máy
      </button>

    </div>

    <div id="notices"></div>

    <!-- CHAT -->

    <div id="chat-box">

      <div id="chat-messages"></div>

      <form id="chat-form">

        <input
          id="chat-input"
          type="text"
          maxlength="200"
          placeholder="Nhập tin nhắn..."
          autocomplete="off"
        />

        <button
          id="chat-send"
          type="submit"
        >
          Gửi
        </button>

      </form>

    </div>

    <!-- JOYSTICK -->

    <div id="joystick">
      <div id="joystick-stick"></div>
    </div>

    <!-- ACTIONS -->

    <div id="actions">

      <button
        class="action-button"
        type="button"
        onclick="interactNearby()"
      >
        👋 Tương tác
      </button>

      <button
        class="action-button"
        type="button"
        onclick="requestRide()"
      >
        🛵 Gọi xe
      </button>

    </div>

  </div>

  <!-- =========================
       INVENTORY
  ========================== -->

  <div id="inventory-menu" class="menu">
    <div class="menu-card">

      <div class="menu-header">
        <div class="menu-title">🎒 Túi đồ</div>

        <button
          class="close-menu"
          onclick="closeMenus()"
          type="button"
        >
          ✕
        </button>
      </div>

      <div
        id="inventory-list"
        class="menu-content"
      ></div>

    </div>
  </div>

  <!-- =========================
       SHOP
  ========================== -->

  <div id="shop-menu" class="menu">
    <div class="menu-card">

      <div class="menu-header">
        <div class="menu-title">🛒 Chợ</div>

        <button
          class="close-menu"
          onclick="closeMenus()"
          type="button"
        >
          ✕
        </button>
      </div>

      <div
        id="market-list"
        class="menu-content"
      ></div>

    </div>
  </div>

  <!-- =========================
       JOB
  ========================== -->

  <div id="job-menu" class="menu">
    <div class="menu-card">

      <div class="menu-header">
        <div class="menu-title">💼 Nghề nghiệp</div>

        <button
          class="close-menu"
          onclick="closeMenus()"
          type="button"
        >
          ✕
        </button>
      </div>

      <div
        id="job-list"
        class="menu-content"
      ></div>

    </div>
  </div>

  <!-- =========================
       BUSINESS
  ========================== -->

  <div id="business-menu" class="menu">
    <div class="menu-card">

      <div class="menu-header">
        <div class="menu-title">🏪 Kinh doanh</div>

        <button
          class="close-menu"
          onclick="closeMenus()"
          type="button"
        >
          ✕
        </button>
      </div>

      <div
        id="business-content"
        class="menu-content"
      ></div>

    </div>
  </div>

  <!-- =========================
       FURNITURE
  ========================== -->

  <div id="furniture-menu" class="menu">
    <div class="menu-card">

      <div class="menu-header">
        <div class="menu-title">🪑 Nội thất</div>

        <button
          class="close-menu"
          onclick="closeMenus()"
          type="button"
        >
          ✕
        </button>
      </div>

      <div
        id="furniture-list"
        class="menu-content"
      ></div>

    </div>
  </div>

  <!-- =========================
       THREE.JS
  ========================== -->

  <script type="module">

    import * as THREE from
      "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    /* =====================================================
       GLOBAL
    ===================================================== */

    let scene;
    let camera;
    let renderer;

    let socket = null;

    let myId = null;

    let latestState = null;
    let latestMe = null;

    let playerObject = null;

    const playerObjects = new Map();
    const npcObjects = new Map();

    let keys = {};

    const ITEM_NAMES = {

      rice: "Gạo",
      coffee: "Cà phê",

      food: "Đồ ăn",

    const FURNITURE_DATA = {
      table: {

      },

      chair: {

      },

      pot: {

      },

      coffeeMachine: {
        name: "Máy pha cà phê",
        price: 400,
        icon: "☕",
      },

      milkTeaMachine: {
        name: "Máy trà sữa",

    /* =====================================================
       UTILS
    ===================================================== */

    function num(value, fallback = 0) {
      const n = Number(value);
      return Number.isFinite(n) ? n : fallback;
    }

    function safeArray(value) {
      return Array.isArray(value) ? value : [];
    }

    function safeObject(value) {
      return value && typeof value === "object"
        ? value
        : {};
    }

    function formatMoney(value) {
      return `${Math.floor(num(value))}$`;
    }

    function formatTime(minutes) {
      minutes = Math.floor(num(minutes));

      minutes =
        ((minutes % 1440) + 1440) % 1440;

      const hour = Math.floor(minutes / 60);
      const minute = minutes % 60;

      return (
        String(hour).padStart(2, "0") +
        ":" +
        String(minute).padStart(2, "0")
      );
    }

    function distance2D(a, b) {
      const dx = num(a.x) - num(b.x);
      const dz = num(a.z) - num(b.z);

      return Math.sqrt(dx * dx + dz * dz);
    }

    function lerpAngle(a, b, t) {
      let diff = b - a;

      while (diff > Math.PI) {
        diff -= Math.PI * 2;
      }

      while (diff < -Math.PI) {
        diff += Math.PI * 2;
      }

      return a + diff * t;
    }

    function escapeHTML(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    ===================================================== */

    function createRoads() {

      createRoad(0, 0, 220, 12, "horizontal");
      createRoad(0, -45, 220, 10, "horizontal");
      createRoad(0, 45, 220, 10, "horizontal");

      createRoad(0, 0, 12, 150, "vertical");
      createRoad(-65, 0, 9, 150, "vertical");
      createRoad(65, 0, 9, 150, "vertical");
    }

    function createRoad(
      x,
      z,
      width,
      depth,
      direction
    ) {

      const geometry =
        new THREE.PlaneGeometry(
          width,
          depth
        );

      const material =
        new THREE.MeshStandardMaterial({
          color: 0x343b43,
          roughness: 0.9,
        });

      const road =
        new THREE.Mesh(
          geometry,
          material
        );

      road.rotation.x = -Math.PI / 2;

      road.position.set(
        x,
        0.015,
        z
      );

      scene.add(road);

      const dashMaterial =
        new THREE.MeshBasicMaterial({
          color: 0xffdc55,
        });

      if (direction === "horizontal") {

        for (
          let px = x - width / 2 + 7;
          px < x + width / 2 - 7;
          px += 12
        ) {

          const dash =
            new THREE.Mesh(
              new THREE.PlaneGeometry(
                5,
                0.35
              ),
              dashMaterial
            );

          dash.rotation.x =
            -Math.PI / 2;

          dash.position.set(
            px,
            0.025,
            z
          );

          scene.add(dash);
        }

      } else {

        for (
          let pz = z - depth / 2 + 7;
          pz < z + depth / 2 - 7;
          pz += 12
        ) {

          const dash =
            new THREE.Mesh(
              new THREE.PlaneGeometry(
                0.35,
                5
              ),
              dashMaterial
            );

          dash.rotation.x =
            -Math.PI / 2;

          dash.position.set(
            x,
            0.025,
            pz
          );

          scene.add(dash);
        }
      }
    }

    /* =====================================================
       TEXT SPRITE
    ===================================================== */

    function createTextSprite(text) {

      const canvas =
        document.createElement("canvas");

      canvas.width = 512;
      canvas.height = 128;

      const ctx =
        canvas.getContext("2d");

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      ctx.fillStyle =
        "rgba(8,16,24,0.78)";

      if (typeof ctx.roundRect === "function") {

        ctx.beginPath();

        ctx.roundRect(
          10,
          20,
          492,
          88,
          18
        );

        ctx.fill();

      } else {

        ctx.fillRect(
          10,
          20,
          492,
          88
        );
      }

      ctx.fillStyle = "#ffffff";

      ctx.font =
        "bold 38px Arial";

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.fillText(
        String(text).slice(0, 32),
        256,
        64
      );

      const texture =
        new THREE.CanvasTexture(canvas);

      texture.needsUpdate = true;

      const material =
        new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          depthWrite: false,
        });

      const sprite =
        new THREE.Sprite(material);

      sprite.scale.set(
        7,
        1.75,
        1
      );

      return sprite;
    }

    /* =====================================================
       BUILDINGS
    ===================================================== */

    function createBuilding(data) {

      if (!data || !data.id) {
        return;
      }

      if (buildingObjects.has(data.id)) {
        const existing =
          buildingObjects.get(data.id);

        existing.position.set(
          num(data.x),
          0,
          num(data.z)
        );

        return;
      }

      const group =
        new THREE.Group();

      const width =
        Math.max(2, num(data.width, 8));

      const depth =
        Math.max(2, num(data.depth, 8));

      const height =
        Math.max(2, num(data.height, 4));

      const color =
        num(data.color, 0xffffff);

      const roof =
        num(data.roof, 0x444444);

      const body =
        new THREE.Mesh(
          new THREE.BoxGeometry(
            width,
            height,
            depth
          ),
          new THREE.MeshStandardMaterial({
            color,
            roughness: 0.78,
          })
        );

      body.position.y =
        height / 2;

      body.castShadow = true;
      body.receiveShadow = true;

      group.add(body);

      const roofMesh =
        new THREE.Mesh(
          new THREE.ConeGeometry(
            Math.max(width, depth) *
              0.72,
            Math.max(
              1.2,
              height * 0.35
            ),
            4
          ),
          new THREE.MeshStandardMaterial({
            color: roof,
          })
        );

      roofMesh.rotation.y =
        Math.PI / 4;

      roofMesh.position.y =
        height + height * 0.17;

      roofMesh.scale.z =
        depth / width;

      roofMesh.castShadow = true;

      group.add(roofMesh);

      const door =
        new THREE.Mesh(
          new THREE.BoxGeometry(
            1.15,
            2.1,
            0.15
          ),
          new THREE.MeshStandardMaterial({
            color: 0x4b2f24,
          })
        );

      door.position.set(
        0,
        1.05,
        depth / 2 + 0.09
      );

      door.castShadow = true;

      group.add(door);

      const label =
        createTextSprite(
          data.name || "Nhà"
        );

      label.position.y =
        height + 2.3;

      group.add(label);

      group.position.set(
        num(data.x),
        0,
        num(data.z)
      );

      scene.add(group);

      buildingObjects.set(
        data.id,
        group
      );
    }

    function getNPCRoleColor(role) {

      const colors = {
        customer: 0x70a7ff,
        hotel_guest: 0xffca67,
        restaurant_guest: 0xff8e8e,
        server: 0xffffff,
        kitchen: 0xd7d7d7,
        barista: 0x9b6a4d,
        supermarket_staff: 0x58c47a,
        tourist: 0x69d7cf,
        resident: 0x9e83dc,
        worker: 0xf0a05e,
        student: 0x78b5e9,
        delivery: 0xe0e0e0,
      };

      return (
        colors[role] ??
        0xa97bd4
      );
    }

    function createNPCMesh(npc) {

      const group =
        createPlayerMesh(
          npc.gender
        );

      group.scale.setScalar(0.8);

      const body =
        group.children[0];

      if (body?.material) {
        body.material =
          body.material.clone();

        body.material.color.set(
          getNPCRoleColor(
            npc.role
          )
        );
      }

      return group;
    }

    /* =====================================================
       VEHICLE MESH
    ===================================================== */

    function createVehicleMesh(type) {

      const group =
        new THREE.Group();

      let bodyColor = 0xaaaaaa;

      if (type === "taxi") {
        bodyColor = 0xffd447;
      } else if (type === "bus") {
        bodyColor = 0x4c9cff;
      } else if (type === "delivery") {
        bodyColor = 0xf0f0f0;
      } else if (type === "motorbike") {
        bodyColor = 0xe85555;
      } else if (type === "bicycle") {
        bodyColor = 0x55b77a;
      } else if (type === "car") {
        bodyColor = 0x777d88;
      }

      const isBike =
        type === "motorbike" ||
        type === "bicycle";

      const body =
        new THREE.Mesh(
          new THREE.BoxGeometry(
            isBike ? 0.9 : type === "bus" ? 2.5 : 1.5,
            0.8,
            isBike ? 2.0 : type === "bus" ? 5 : 3
          ),
          new THREE.MeshStandardMaterial({
            color: bodyColor,
          })
        );

      body.position.y = 0.65;

      body.castShadow = true;

      group.add(body);

      if (!isBike) {

        const roof =
          new THREE.Mesh(
            new THREE.BoxGeometry(
              type === "bus" ? 2.15 : 1.2,
              0.45,
              type === "bus" ? 3.8 : 2
            ),
            new THREE.MeshStandardMaterial({
              color:
                type === "taxi"
                  ? 0xffe58a
                  : 0x313944,
            })
          );

        roof.position.y = 1.15;

        roof.castShadow = true;

        group.add(roof);
      }

      return group;
    }

    /* =====================================================
       WORLD UPDATE
    ===================================================== */

    function updateWorldObjects() {

      if (!latestState) {
        return;
      }

      const buildings =
        safeArray(
          latestState.buildings
        );

      const players =
        safeArray(
          latestState.players
        );

      const npcs =
        safeArray(
          latestState.npcs
        );

      const vehicles =
        safeArray(
          latestState.vehicles
        );

      /* BUILDINGS */

      const buildingIds =
        new Set();

      for (const building of buildings) {

        buildingIds.add(
          building.id
        );

        createBuilding(
          building
        );
      }

      for (
        const [
          id,
          object
        ] of buildingObjects
      ) {

        if (
          !buildingIds.has(id)
        ) {

          scene.remove(object);

          object.traverse(
            child => {

              if (
                child.material
              ) {
                child.material.dispose?.();
              }

              if (
                child.geometry
              ) {
                child.geometry.dispose?.();
              }
            }
          );

          buildingObjects.delete(id);
        }
      }

      /* PLAYERS */

      const playerIds =
        new Set();

      for (const player of players) {

        playerIds.add(
          player.id
        );

        let object =
          playerObjects.get(
            player.id
          );

        if (!object) {

          object =
            createPlayerMesh(
              player.gender
            );

          object.userData =
            {
              player,
              initialized: false,
            };

          playerObjects.set(
            player.id,
            object
          );

          scene.add(object);
        }

        object.userData.player =
          player;

        if (!object.userData.initialized) {

          object.position.set(
            num(player.x),
            0,
            num(player.z)
          );

          object.rotation.y =
            num(player.rotation);

          object.userData.initialized =
            true;
        }
      }

      for (
        const [
          id,
          object
        ] of playerObjects
      ) {

        if (!playerIds.has(id)) {

          scene.remove(object);

          playerObjects.delete(id);
        }
      }

      playerObject =
        playerObjects.get(
          myId
        ) || null;

      /* NPCS */

      const npcIds =
        new Set();

      for (const npc of npcs) {

        npcIds.add(npc.id);

        let object =
          npcObjects.get(
            npc.id
          );

        if (!object) {

          object =
            createNPCMesh(
              npc
            );

          object.userData = {
            npc,
            initialized: false,
          };

          npcObjects.set(
            npc.id,
            object
          );

          scene.add(object);
        }

        object.userData.npc =
          npc;

        if (!object.userData.initialized) {

          object.position.set(
            num(npc.x),
            0,
            num(npc.z)
          );

          object.userData.initialized =
            true;
        }
      }

      for (
        const [
          id,
          object
        ] of npcObjects
      ) {

        if (!npcIds.has(id)) {

          scene.remove(object);

          npcObjects.delete(id);
        }
      }

      /* VEHICLES */

      const vehicleIds =
        new Set();

      for (const vehicle of vehicles) {

        vehicleIds.add(
          vehicle.id
        );

        let object =
          vehicleObjects.get(
            vehicle.id
          );

        if (!object) {

          object =
            createVehicleMesh(
              vehicle.type
            );

          object.userData = {
            vehicle,
            initialized: false,
          };

          vehicleObjects.set(
            vehicle.id,
            object
          );

          scene.add(object);
        }

        object.userData.vehicle =
          vehicle;

        if (!object.userData.initialized) {

          object.position.set(
            num(vehicle.x),
            0,
            num(vehicle.z)
          );

          object.rotation.y =
            num(vehicle.rotation);

          object.userData.initialized =
            true;
        }
      }

      for (
        const [
          id,
          object
        ] of vehicleObjects
      ) {

        if (!vehicleIds.has(id)) {

          scene.remove(object);

          vehicleObjects.delete(id);
        }
      }

      hasReceivedFirstState =
        true;
    }

    function updateBikeButton() {

      const buttons =
        document.querySelectorAll(
          ".hud-button"
        );

      for (const button of buttons) {

        if (
          button.textContent.includes(
            "Xe máy"
          )
        ) {

          const active =
            latestMe?.bike?.active;

          button.textContent =
            active
              ? "🛵 Xuống xe"
              : "🛵 Xe máy";
        }
      }
    }

    /* =====================================================
       SERVER MESSAGE
    ===================================================== */

    function handleServerMessage(msg) {

      if (!msg || typeof msg !== "object") {
        return;
      }

      switch (msg.type) {

        case "connected":

          showNotice(
            msg.message ||
              "Đã kết nối máy chủ.",
            "success"
          );

          break;

        case "welcome":

          myId =
            msg.id ||
            null;

          latestMe =
            msg.player ||
            null;

          if (
            latestMe?.gender
          ) {

            selectedGender =
              latestMe.gender;
          }

          updateHUD();

          break;

        case "state":

          latestState =
            msg;

          latestMe =
            safeArray(
              msg.players
            ).find(
              player =>
                player.id === myId
            ) ||
            latestMe;

          updateWorldObjects();
          updateHUD();

          break;

        case "notice":

          showNotice(
            msg.message ||
              "Thông báo",
            "success"
          );

          break;

        case "error":

          showNotice(
            msg.message ||
              "Có lỗi xảy ra.",
            "error"
          );

          break;

        case "interaction":

          handleInteractionResult(
            msg
          );

          break;

        case "chat":

          addChat(
            msg.name ||
              "Người chơi",
            msg.message ||
              ""
          );

          break;

        case "pong":

          break;

        default:

          break;
      }
    }

      showNotice(

        "success"
      );

      if (
        result.business

        const owned =

        if (owned) {

    /* =====================================================
       CONNECT
    ===================================================== */

    function connect() {

      if (
        socket &&
        (
          socket.readyState ===
            WebSocket.OPEN ||
          socket.readyState ===
            WebSocket.CONNECTING
        )
      ) {
        return;
      }

      const protocol =
        location.protocol === "https:"
          ? "wss:"
          : "ws:";

      const wsUrl =
        `${protocol}//${location.host}`;

      try {

        socket =
          new WebSocket(
            wsUrl
          );

      } catch (error) {

        showNotice(
          "Không thể kết nối máy chủ.",
          "error"
        );

        return;
      }

      socket.addEventListener(
        "open",
        () => {

          const savedName =
            localStorage.getItem(
              "bgb_name"
            ) ||
            "Người chơi";

          sendMessage({
            type: "join",
            name: savedName,
            gender: selectedGender,
          });

          showNotice(
            "Đã kết nối máy chủ.",
            "success"
          );
        }
      );

      socket.addEventListener(
        "message",
        event => {

          try {

            const msg =
              JSON.parse(
                event.data
              );

            handleServerMessage(
              msg
            );

          } catch {

            showNotice(
              "Máy chủ gửi dữ liệu không hợp lệ.",
              "error"
            );
          }
        }
      );

      socket.addEventListener(
        "close",
        () => {

          movementInput.dx = 0;
          movementInput.dz = 0;

          showNotice(
            "Đã mất kết nối máy chủ.",
            "error"
          );
        }
      );

      socket.addEventListener(
        "error",
        () => {

          showNotice(
            "Lỗi kết nối máy chủ.",
            "error"
          );
        }
      );
    }

    /* =====================================================
       SEND
    ===================================================== */

    function sendMessage(data) {

      if (
        !socket ||
        socket.readyState !==
          WebSocket.OPEN
      ) {

        showNotice(
          "Chưa kết nối máy chủ.",
          "error"
        );

        return false;
      }

      try {

        socket.send(
          JSON.stringify(
            data
          )
        );

        return true;

      } catch {

        showNotice(
          "Không thể gửi dữ liệu.",
          "error"
        );

        return false;
      }
    }

    /* =====================================================
       INPUT
    ===================================================== */

    function updateKeyboardInput() {

      let dx = 0;
      let dz = 0;

      if (
        keys["a"] ||
        keys["arrowleft"]
      ) {
        dx -= 1;
      }

      if (
        keys["d"] ||
        keys["arrowright"]
      ) {
        dx += 1;
      }

      if (
        keys["w"] ||
        keys["arrowup"]
      ) {
        dz -= 1;
      }

      if (
        keys["s"] ||
        keys["arrowdown"]
      ) {
        dz += 1;
      }

      if (
        joystickActive
      ) {
        return;
      }

      movementInput.dx = dx;
      movementInput.dz = dz;

      normalizeMovement();
    }

    function normalizeMovement() {

      const length =
        Math.sqrt(
          movementInput.dx *
            movementInput.dx +
          movementInput.dz *
            movementInput.dz
        );

      if (length > 1) {

        movementInput.dx /=
          length;

        movementInput.dz /=
          length;
      }
    }

    window.addEventListener(
      "keydown",
      event => {

        const key =
          String(
            event.key
          ).toLowerCase();

        keys[key] = true;

        if (
          [
            "arrowup",
            "arrowdown",
            "arrowleft",
            "arrowright",
            " ",
          ].includes(key)
        ) {
          event.preventDefault();
        }

        updateKeyboardInput();
      }
    );

    window.addEventListener(
      "keyup",
      event => {

        const key =
          String(
            event.key
          ).toLowerCase();

        keys[key] = false;

        updateKeyboardInput();
      }
    );

    setInterval(
      () => {

        sendMessage({
          type: "input",

          dz: movementInput.dz,
        });

      },

    );

    /* =====================================================
       JOYSTICK
    ===================================================== */

    const joystick =
      document.getElementById(
        "joystick"
      );

    const joystickStick =
      document.getElementById(
        "joystick-stick"
      );

    function updateJoystick(
      clientX,
      clientY
    ) {

      const rect =
        joystick.getBoundingClientRect();

      const centerX =
        rect.left +
        rect.width / 2;

      const centerY =
        rect.top +
        rect.height / 2;

      let dx =
        clientX -
        centerX;

      let dy =
        clientY -
        centerY;

      const max =
        rect.width * 0.32;

      const length =
        Math.sqrt(
          dx * dx +
          dy * dy
        );

      if (
        length > max
      ) {

        dx =
          (dx / length) *
          max;

        dy =
          (dy / length) *
          max;
      }

      joystickStick.style.transform =
        `translate(${dx}px, ${dy}px)`;

      movementInput.dx =
        dx / max;

      movementInput.dz =
        dy / max;

      normalizeMovement();
    }

    function resetJoystick() {

      joystickActive = false;
      joystickPointer = null;

      joystickStick.style.transform =
        "translate(0px, 0px)";

      movementInput.dx = 0;
      movementInput.dz = 0;

      updateKeyboardInput();
    }

    joystick.addEventListener(
      "pointerdown",
      event => {

        joystickActive = true;

        joystickPointer =
          event.pointerId;

        joystick.setPointerCapture(
          event.pointerId
        );

        updateJoystick(
          event.clientX,
          event.clientY
        );
      }
    );

    joystick.addEventListener(
      "pointermove",
      event => {

        if (
          !joystickActive ||
          event.pointerId !==
            joystickPointer
        ) {
          return;
        }

        updateJoystick(
          event.clientX,
          event.clientY
        );
      }
    );

    joystick.addEventListener(
      "pointerup",
      resetJoystick
    );

    joystick.addEventListener(
      "pointercancel",
      resetJoystick
    );

    joystick.addEventListener(
      "lostpointercapture",
      resetJoystick
    );

          );

          showNotice(

        let closest = null;
        let closestDistance =
          Infinity;

        for (

          of buildings

            distance2D(
              latestMe,
              building
            );

          if (
            d < closestDistance
          ) {

            closestDistance = d;
            closest = building;

        }

        if (
          !closest ||
          closestDistance > 15
        ) {

          showNotice(
            "Không có địa điểm nào đủ gần.",
            "error"
          );

          return;
        }

        sendMessage({
          type: "interact",
          targetId: closest.id,
        });
      };

          <div class="menu-row-title">
            🏪 Chọn cửa hàng
          </div>

          <div class="menu-row-sub">
            Nội thất sẽ được đặt vào cửa hàng đang chọn.
          </div>

        </div>

        <select
          id="furniture-business-select"
          style="
            max-width:45%;
            padding:8px;
            border-radius:9px;
            border:0;
            outline:0;
            background:#253442;
            color:white;
          "
        >
          ${myBusinesses
            .map(
              business => `
                <option
                  value="${escapeHTML(
                    business.id
                  )}"
                  ${
                    business.id ===
                    selectedBusinessId
                      ? "selected"
                      : ""
                  }
                >
                  ${escapeHTML(
                    business.name
                  )}
                </option>
              `
            )
            .join("")}
        </select>
      `;

      container.appendChild(
        selector
      );

      const select =
        selector.querySelector(
          "#furniture-business-select"
        );

      select.addEventListener(
        "change",
        () => {

          selectedBusinessId =
            select.value;

          renderFurniture();
        }
      );

      const title =
        document.createElement(
          "div"
        );

      title.className =
        "section-title";

      title.textContent =
        "🪑 Danh sách nội thất";

      container.appendChild(
        title
      );

      for (
        const [
          id,
          data
        ] of Object.entries(
          FURNITURE_DATA
        )
      ) {

        const row =
          document.createElement(
            "div"
          );

        row.className =
          "menu-row";

        row.innerHTML = `
          <div class="menu-row-info">

            <div class="menu-row-title">
              ${data.icon}
              ${escapeHTML(
                data.name
              )}
            </div>

            <div class="menu-row-sub">
              Giá:
              ${formatMoney(
                data.price
              )}
            </div>

          </div>

          <div class="menu-actions">

            <button
              class="small-button blue"
              onclick="buyFurniture('${id}')"
            >
              Mua
            </button>

          </div>
        `;

        container.appendChild(
          row
        );
      }
    }

    window.buyFurniture =
      function (furnitureType) {

        if (
          !selectedBusinessId
        ) {

          showNotice(
            "Hãy chọn cửa hàng trước.",
            "error"
          );

          return;
        }

        sendMessage({
          type: "buy_furniture",
          businessId:
            selectedBusinessId,
          furnitureType,
        });
      };

    window.openFurnitureForBusiness =
      function (businessId) {

        selectedBusinessId =
          businessId;

        openMenu(
          "furniture-menu"
        );
      };

    /* =====================================================
       EXTRA BUSINESS ACTIONS
    ===================================================== */

    window.hireEmployee =
      function (
        businessId,
        job
      ) {

        sendMessage({
          type: "hire_employee",
          businessId,
          job,
        });
      };

    window.checkinHotel =
      function (businessId) {

        sendMessage({
          type: "hotel_checkin",
          businessId,
        });
      };

    window.orderRestaurant =
      function (
        businessId,
        item
      ) {

        sendMessage({
          type: "restaurant_order",
          businessId,
          item,
        });
      };

    window.setBusinessPrice =
      function (businessId) {

        const value =
          prompt(
            "Nhập giá bán mới:",
            "100"
          );

        if (
          value === null
        ) {
          return;
        }

        sendMessage({
          type: "business_price",
          businessId,
          price:
            Math.max(
              1,
              Math.floor(
                num(value)
              )
            ),
        });
      };

    /* =====================================================
       CHAT
    ===================================================== */

    function addChat(
      name,
      message
    ) {

      const container =
        document.getElementById(
          "chat-messages"
        );

      if (!container) {
        return;
      }

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "chat-message";

      const nameSpan =
        document.createElement(
          "span"
        );

      nameSpan.className =
        "chat-name";

      nameSpan.textContent =
        name;

      const messageSpan =
        document.createElement(
          "span"
        );

      messageSpan.textContent =
        message;

      row.appendChild(
        nameSpan
      );

      row.appendChild(
        messageSpan
      );

      container.appendChild(
        row
      );

      while (
        container.children.length >
        50
      ) {

        container.firstElementChild
          ?.remove();
      }

      container.scrollTop =
        container.scrollHeight;
    }

    document
      .getElementById(
        "chat-form"
      )
      .addEventListener(
        "submit",
        event => {

          event.preventDefault();

          const input =
            document.getElementById(
              "chat-input"
            );

          const text =
            input.value
              .trim()
              .slice(0, 200);

          if (!text) {
            return;
          }

          const sent =
            sendMessage({
              type: "chat",
              message: text,
            });

          if (sent) {
            input.value = "";
          }
        }
      );

    /* =====================================================
       NOTICES
    ===================================================== */

    function showNotice(
      message,
      type = "success"
    ) {

      const container =
        document.getElementById(
          "notices"
        );

      if (!container) {
        return;
      }

      const notice =
        document.createElement(
          "div"
        );

      notice.className =
        "notice" +
        (
          type === "error"
            ? " error"
            : ""
        );

      notice.textContent =
        message;

      container.appendChild(
        notice
      );

      setTimeout(
        () => {

          notice.style.opacity =
            "0";

          notice.style.transform =
            "translateY(-6px)";

          notice.style.transition =
            "0.25s ease";

          setTimeout(
            () => notice.remove(),
            250
          );

        },
        3000
      );
    }

    /* =====================================================
       LOGIN
    ===================================================== */

    document
      .querySelectorAll(
        ".gender-btn"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              document
                .querySelectorAll(
                  ".gender-btn"
                )
                .forEach(
                  btn =>
                    btn.classList.remove(
                      "active"
                    )
                );

              button.classList.add(
                "active"
              );

              selectedGender =
                button.dataset.gender ===
                "female"
                  ? "female"
                  : "male";
            }
          );
        }
      );

    document
      .getElementById(
        "play-btn"
      )
      .addEventListener(
        "click",
        startGame
      );

    document
      .getElementById(
        "player-name"
      )
      .addEventListener(
        "keydown",
        event => {

          if (
            event.key ===
            "Enter"
          ) {

            startGame();
          }
        }
      );

    function startGame() {

      const input =
        document.getElementById(
          "player-name"
        );

      const name =
        input.value
          .trim()
          .slice(0, 20);

      const finalName =
        name ||
        "Người chơi";

      localStorage.setItem(
        "bgb_name",
        finalName
      );

      localStorage.setItem(
        "bgb_gender",
        selectedGender
      );

      document.getElementById(
        "login"
      ).style.display =
        "none";

      connect();
    }

    /* =====================================================
       CAMERA
    ===================================================== */

    function updateCamera() {

      if (
        !playerObject
      ) {
        return;
      }

      const target =
        playerObject.position;

      const desired =
        new THREE.Vector3(
          target.x + 15,
          target.y + 17,
          target.z + 15
        );

      camera.position.lerp(
        desired,
        0.08
      );

      const lookAt =
        new THREE.Vector3(
          target.x,
          target.y + 1,
          target.z
        );

      camera.lookAt(
        lookAt
      );
    }

    /* =====================================================
       RENDER OBJECTS
    ===================================================== */

    function renderObjects() {

      for (
        const [
          id,
          object
        ] of playerObjects
      ) {

        const player =
          object.userData
            ?.player;

        if (!player) {
          continue;
        }

        const targetX =
          num(player.x);

        const targetZ =
          num(player.z);

        const interpolation =
          id === myId
            ? 0.28
            : 0.18;

        object.position.x +=
          (
            targetX -
            object.position.x
          ) *
          interpolation;

        object.position.z +=
          (
            targetZ -
            object.position.z
          ) *
          interpolation;

        const rotation =
          num(
            player.rotation
          );

        object.rotation.y =
          lerpAngle(
            object.rotation.y,
            rotation,
            interpolation
          );

        object.position.y = 0;
      }

      for (
        const object
        of npcObjects.values()
      ) {

        const npc =
          object.userData
            ?.npc;

        if (!npc) {
          continue;
        }

        object.position.x +=
          (
            num(npc.x) -
            object.position.x
          ) *
          0.2;

        object.position.z +=
          (
            num(npc.z) -
            object.position.z
          ) *
          0.2;

        object.position.y = 0;
      }

      for (
        const object
        of vehicleObjects.values()
      ) {

        const vehicle =
          object.userData
            ?.vehicle;

        if (!vehicle) {
          continue;
        }

        object.position.x +=
          (
            num(vehicle.x) -
            object.position.x
          ) *
          0.35;

        object.position.z +=
          (
            num(vehicle.z) -
            object.position.z
          ) *
          0.35;

        object.rotation.y =
          lerpAngle(
            object.rotation.y,
            num(
              vehicle.rotation
            ),
            0.35
          );

        object.position.y = 0;
      }
    }

    /* =====================================================
       ANIMATE
    ===================================================== */

    function animate() {

      requestAnimationFrame(
        animate
      );

      renderObjects();
      updateCamera();

      renderer.render(
        scene,
        camera
      );
    }

    /* =====================================================
       RESIZE
    ===================================================== */

    function onResize() {

      camera.aspect =
        window.innerWidth /
        window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

      renderer.setPixelRatio(
        Math.min(
          window.devicePixelRatio || 1,
          2
        )
      );
    }

    /* =====================================================
       STARTUP
    ===================================================== */

    initThree();

    const savedName =
      localStorage.getItem(
        "bgb_name"
      );

    const savedGender =
      localStorage.getItem(
        "bgb_gender"
      );

    if (
      savedGender === "female"
    ) {

      selectedGender =
        "female";

      document
        .querySelectorAll(
          ".gender-btn"
        )
        .forEach(
          button => {

            button.classList.toggle(
              "active",
              button.dataset.gender ===
                "female"
            );
          }
        );
    }

    if (savedName) {

      document.getElementById(
        "player-name"
      ).value =
        savedName;
    }

    setTimeout(
      () => {

        const loading =
          document.getElementById(
            "loading"
          );

        loading.classList.add(
          "hidden"
        );

        setTimeout(
          () => {

            loading.style.display =
              "none";

            document.getElementById(
              "login"
            ).style.display =
              "flex";

          },
          500
        );

      },
      1200
    );

  </script>

</body>
</html>
