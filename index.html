<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BUÔN GÌ BÁN - Thành phố kinh doanh</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Arial,sans-serif;background:#b9e5a4;user-select:none}
#gameWrap{position:relative;width:100vw;height:100dvh;overflow:hidden}
#game{width:100%;height:100%;display:block;touch-action:none}
#top{position:absolute;top:6px;left:6px;right:6px;display:flex;gap:5px;justify-content:space-between;z-index:5;pointer-events:none;flex-wrap:wrap}
.box{background:#fff8e8ed;border:2px solid #e5bd91;border-radius:12px;padding:7px 9px;color:#79543c;font-weight:bold;font-size:11px;box-shadow:0 3px #cba77f}
#pad{position:absolute;bottom:15px;left:12px;width:126px;height:126px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:4px;z-index:8}
button{touch-action:manipulation;cursor:pointer;font-weight:bold}
.move{border:2px solid #d4ad81;background:#fff5dfed;color:#79543c;border-radius:50%;font-size:22px;box-shadow:0 3px #cba77f;padding:0;min-width:0;min-height:0}
.up{grid-area:1/2}.left{grid-area:2/1}.right{grid-area:2/3}.down{grid-area:3/2}
#act{position:absolute;right:13px;bottom:28px;width:76px;height:76px;border-radius:50%;border:3px solid #cba77f;background:#ffcf72ed;color:#79543c;font-size:11px;z-index:8;box-shadow:0 4px #b38a60}
#hint{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);background:#fff8e8dd;border-radius:8px;padding:5px 7px;font-size:10px;color:#79543c;z-index:4;white-space:nowrap;pointer-events:none}
#msg{position:absolute;top:94px;left:50%;transform:translateX(-50%);max-width:90%;background:#fff8e8f5;border:2px solid #e5bd91;border-radius:12px;padding:10px 12px;color:#79543c;font-weight:bold;font-size:12px;z-index:15;text-align:center;display:none;box-shadow:0 3px #cba77f}
#panel{position:absolute;z-index:12;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,92vw);max-height:76dvh;overflow:auto;background:#fff8e8;border:3px solid #d4ad81;border-radius:18px;padding:14px;color:#79543c;display:none;box-shadow:0 8px 30px #0005}
#panel h3{margin:0 0 8px;font-size:18px}
#panel p{font-size:13px;line-height:1.5}
#panel button{border:0;border-radius:10px;padding:10px;background:#ffcf72;color:#67452e;margin:4px 2px;font-size:12px}
#panel button.secondary{background:#eadcc7}
#panel input,#panel select{max-width:100%;padding:8px;border:1px solid #cba77f;border-radius:8px;background:white;color:#79543c}
#panel .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:7px 0}
#panel .row button{flex:1}
#stats{font-size:12px;background:#fff0d4;border-radius:10px;padding:8px;line-height:1.8}
@media(min-width:700px){
 #pad{width:145px;height:145px;left:22px;bottom:22px}
 #act{width:84px;height:84px;right:25px;bottom:35px}
 .box{font-size:13px}
}
</style>
</head>
<body>
<div id="gameWrap">
<canvas id="game"></canvas>
<div id="top">
 <div class="box">🏡 BUÔN GÌ BÁN</div>
 <div class="box">💰 <span id="money">1000</span> xu</div>
 <div class="box">🕒 <span id="clock">08:00</span></div>
 <div class="box">🌤️ <span id="weather">Nắng</span></div>
 <div class="box">🏪 <span id="businessStatus">Chưa thuê quán</span></div>
</div>
<div id="msg"></div>
<div id="hint">Giữ nút mũi tên để đi • Đến gần cửa nhà rồi bấm TƯƠNG TÁC</div>
<div id="pad">
 <button class="move up" data-k="up">▲</button>
 <button class="move left" data-k="left">◀</button>
 <button class="move right" data-k="right">▶</button>
 <button class="move down" data-k="down">▼</button>
</div>
<button id="act">🤝<br>TƯƠNG TÁC</button>
<div id="panel"></div>
</div>

<script>
'use strict';

const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const W=3000,H=2400;
let cw=innerWidth,ch=innerHeight,dpr=1;
let money=1000;

const keys={up:false,down:false,left:false,right:false};
const buildings=[],trees=[],flowers=[],parks=[],shops=[],npcs=[],vehicles=[],bikes=[],tables=[],signals=[];
const animals=[],butterflies=[],birds=[];
const roadsX=[500,1250,2000,2750],roadsY=[450,1050,1650,2250];
const palettes=['#fff1d4','#ffe3cf','#f9d8df','#f5e7bb','#d8eddd','#f8dfba','#e5def8','#d6e9f7'];
const roofs=['#e87b61','#d96961','#e9a25b','#c96e69','#dd875f','#b97562'];
const hairs=['#53382f','#302b35','#8c5734','#d5a04e','#493a53','#262b35'];
const skins=['#ffd9b5','#f2bd91','#e6a77d','#ffdfc5'];
const clothes=['#78bce4','#e98488','#77bd85','#f0bb5b','#9d91df','#f2eee2','#ef9bc0','#5f91c9','#70c7c0'];

const rand=(()=>{
 let s=82941;
 return ()=>((s=(s*1664525+1013904223)>>>0)/4294967296);
})();
const pick=a=>a[Math.floor(rand()*a.length)];

let worldMinutes=8*60,weather='Nắng',weatherTimer=0;
let business=null;
let staff={serve:0,chef:0,cashier:0,delivery:0};
let foodPrice=45,foodCost=20,drinkPrice=15,drinkCost=6;
let revenue=0,expenses=0,orders=0,served=0;
let msgTimer=null,autoBusinessTimer=0;

/* DỮ LIỆU KINH DOANH BỔ SUNG */
let onlineOrders=[];
let staffRequests=[];
let nextOnlineId=1;
let nextRequestId=1;
let nextDebtId=1;
let nextNpcId=1;
let businessDebt=[];
let staffLeaveUntil={serve:0,chef:0,cashier:0,delivery:0};
let rentPaidDay=-1;
let lastWageHour=-1;
let competitionNoticeTimer=0;

const player={
 x:1020,y:730,walk:0,skin:'#ffd9b5',
 hair:'#79533e',shirt:'#78bce4',pants:'#536a85',hairStyle:2
};

function resize(){
 dpr=Math.min(devicePixelRatio||1,2);
 cw=innerWidth;ch=innerHeight;
 canvas.width=Math.round(cw*dpr);
 canvas.height=Math.round(ch*dpr);
 canvas.style.width=cw+'px';
 canvas.style.height=ch+'px';
}
addEventListener('resize',resize);
resize();

function rect(x,y,w,h,c){
 ctx.fillStyle=c;ctx.fillRect(x,y,w,h);
}
function rr(x,y,w,h,r,c){
 ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();
}
function line(x,y,x2,y2,c,width=1){
 ctx.strokeStyle=c;ctx.lineWidth=width;
 ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke();
}
function el(x,y,rx,ry,c){
 ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();
}
function txt(s,x,y,size=16,c='#79543c'){
 ctx.fillStyle=c;ctx.font='bold '+size+'px Arial';
 ctx.textAlign='center';ctx.textBaseline='alphabetic';
 ctx.fillText(s,x,y);
}
function message(s){
 const e=document.getElementById('msg');
 e.textContent=s;e.style.display='block';
 clearTimeout(msgTimer);
 msgTimer=setTimeout(()=>e.style.display='none',3200);
}
function refreshHUD(){
 document.getElementById('money').textContent=Math.floor(money).toLocaleString('vi-VN');
 document.getElementById('clock').textContent=
  String(Math.floor(worldMinutes/60)%24).padStart(2,'0')+':'+
  String(Math.floor(worldMinutes%60)).padStart(2,'0');
 document.getElementById('weather').textContent=weather;
 document.getElementById('businessStatus').textContent=
  business?(business.opened?(isOpen()?'Đang kinh doanh':'Ngoài giờ bán'):'Đã đóng cửa'):'Chưa thuê quán';
}
function tree(x,y,s=1){trees.push({x,y,s})}
function flower(x,y,s=1){flowers.push({x,y,s})}

function building(x,y,w,h,type,name,color,roof){
 const b={
  x,y,w,h,type,name,color,roof,
  rent:type==='cafe'?250:type==='restaurant'?300:type==='market'?220:type==='apt'?450:type==='house'?150:200,
  price:type==='apt'?1800:type==='house'?700:type==='restaurant'?1500:type==='market'?1200:950,
  owner:null,rented:false,bought:false
 };
 buildings.push(b);
 shops.push({x:x+w/2,y:y+h+18,w,h,name,type,building:b});
 return b;
}

function drawBuilding(b){
 const {x,y,w,h,type,name,color,roof}=b;
 ctx.save();
 el(x+w/2,y+h+8,w*.48,7,'#8eaf7866');
 rr(x,y,w,h,5,color||'#fff1d4');
 rect(x,y+h-9,w,9,'#e6bd90');

 if(type==='apt'){
  rect(x-3,y-8,w+6,13,roof||'#d96961');
  rect(x-1,y-13,w+2,7,'#fff0d4');
  const cols=Math.max(2,Math.floor(w/28));
  const rows=Math.max(3,Math.floor((h-48)/34));
  for(let r=0;r<rows;r++){
   for(let c=0;c<cols;c++){
    const ww=Math.min(20,(w-16)/cols-3);
    const wx=x+8+c*(w-16)/cols;
    const wy=y+10+r*(h-45)/rows;
    rr(wx,wy,ww,22,3,'#85c9e6');
    line(wx+ww/2,wy,wx+ww/2,wy+22,'#fff5df',2);
    line(wx,wy+11,wx+ww,wy+11,'#fff5df',2);
   }
  }
  rr(x+w/2-11,y+h-36,22,36,5,'#b87d59');
 }else{
  ctx.fillStyle=roof||'#e87b61';
  ctx.beginPath();
  ctx.moveTo(x-5,y+8);ctx.lineTo(x+w/2,y-19);ctx.lineTo(x+w+5,y+8);
  ctx.closePath();ctx.fill();
  if(type==='house'){
   rr(x+w*.18,y+23,w*.24,23,3,'#89cce9');
   rr(x+w*.58,y+23,w*.24,23,3,'#89cce9');
  }else{
   rect(x+5,y+17,w-10,8,'#fff0d4');
   for(let i=0;i<4;i++)rect(x+i*w/4,y+25,w/8,12,i%2?'#fff1d8':'#e98070');
   rr(x+7,y+h-38,w-14,23,3,'#91d6e9');
   line(x+w/2,y+h-38,x+w/2,y+h-15,'#fff5e5',2);
  }
  rr(x+w/2-10,y+h-38,20,38,5,'#b77b58');
 }
 const labelWidth=Math.min(w+18,130);
 rr(x+w/2-labelWidth/2,y+h+3,labelWidth,18,5,'#fff7e5');
 txt(name.length>17?name.slice(0,16)+'…':name,x+w/2,y+h+16,8);
 if(b.owner==='player')txt(b.bought?'ĐÃ MUA':'ĐÃ THUÊ',x+w/2,y+h+33,9,'#27864a');
 ctx.restore();
}

function drawTree(o){
 ctx.save();ctx.translate(o.x,o.y);ctx.scale(o.s,o.s);
 el(2,22,32,10,'#8eaf78');
 rect(-6,-5,12,31,'#a8734f');
 line(-1,8,-17,-13,'#8b6245',5);
 line(1,3,17,-20,'#8b6245',5);
 el(-15,-14,15,15,'#4aab70');
 el(14,-20,17,18,'#55b875');
 el(-4,-35,22,23,'#7ed383');
 el(-23,-34,17,18,'#66c77b');
 el(18,-44,17,17,'#8bd98a');
 el(0,-49,17,17,'#5ab974');
 ctx.restore();
}
function drawFlower(o){
 ctx.save();ctx.translate(o.x,o.y);ctx.scale(o.s,o.s);
 el(0,6,27,10,'#66b975');
 for(let i=0;i<5;i++){
  const x=(i-2)*11,y=(i%2)*-9-5;
  const c=['#ffd0dc','#fff4df','#d9c8ff','#ff9eaa','#fff0a3'][i%5];
  for(let j=0;j<5;j++){
   const a=j*Math.PI*2/5;
   el(x+Math.cos(a)*5,y+Math.sin(a)*5,4,4,c);
  }
  el(x,y,2.5,2.5,'#f3bf57');
 }
 ctx.restore();
}
function drawAnimal(a){
 ctx.save();ctx.translate(a.x,a.y);
 const bob=Math.sin(a.walk)*1.5;ctx.translate(0,bob);
 if(a.type==='cat'){
  el(0,0,13,8,'#e8a76d');el(9,-3,7,7,'#e8a76d');
  ctx.fillStyle='#e8a76d';
  ctx.beginPath();ctx.moveTo(4,-7);ctx.lineTo(5,-15);ctx.lineTo(10,-8);ctx.fill();
  ctx.beginPath();ctx.moveTo(11,-8);ctx.lineTo(16,-15);ctx.lineTo(17,-5);ctx.fill();
  el(11,-4,1.2,1.8,'#30302c');el(16,-4,1.2,1.8,'#30302c');
  line(-11,-1,-19,-7,'#c88a57',3);line(12,1,18,3,'#f6c4a4',1);
 }else if(a.type==='dog'){
  el(0,0,14,8,'#bd865b');el(10,-3,7,7,'#bd865b');
  el(6,-8,4,6,'#80523a');el(15,-7,4,6,'#80523a');
  el(17,-2,2,2,'#302d29');el(10,-5,1.2,1.5,'#302d29');
  line(-12,-2,-19,-8,'#80523a',3);rr(-5,-3,5,3,1,'#f5e5b9');
 }else{
  el(0,0,8,4,'#b77d50');el(5,-3,3,3,'#e5bd83');
  line(-3,2,-5,7,'#725b47',1.5);line(2,2,4,7,'#725b47',1.5);
 }
 ctx.restore();
}
function drawButterfly(b){
 ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.sin(b.phase)*.22);
 const flap=Math.abs(Math.sin(b.phase*2));
 el(-4,-2,3+flap*2,5,b.color);el(4,-2,3+flap*2,5,b.color);
 el(-3,3,2,3,'#ffe9bd');el(3,3,2,3,'#ffe9bd');
 line(0,-1,0,6,'#55463a',1.5);line(0,-1,-3,-5,'#55463a',1);line(0,-1,3,-5,'#55463a',1);
 ctx.restore();
}
function drawBird(b){
 ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.sin(b.phase)*.15);
 el(0,0,7,4,b.color);el(5,-3,4,4,b.color);
 ctx.fillStyle='#f2bd59';ctx.beginPath();ctx.moveTo(8,-3);ctx.lineTo(13,-1);ctx.lineTo(8,0);ctx.fill();
 const wing=Math.sin(b.phase*3)*3;line(-2,0,-5,-3-wing,b.color,2);
 ctx.restore();
}

/* ĐẤT TRỐNG VÀ KHOẢNG CÁCH AN TOÀN */
function clearGround(x,y,pad=20){
 if(x<pad||y<pad||x>W-pad||y>H-pad)return false;
 if(roadsY.some(v=>Math.abs(y-v)<116))return false;
 if(roadsX.some(v=>Math.abs(x-v)<106))return false;
 if(buildings.some(b=>x>b.x-pad&&x<b.x+b.w+pad&&y>b.y-pad&&y<b.y+b.h+pad))return false;
 return true;
}
function buildingRoadSafe(x,y,w,h){
 const left=x-6,right=x+w+6,top=y-22,bottom=y+h+38;
 if(roadsY.some(v=>bottom>v-103&&top<v+103))return false;
 if(roadsX.some(v=>right>v-95&&left<v+95))return false;
 return true;
}
function buildingOverlap(x,y,w,h,pad=8){
 return buildings.some(b=>x<b.x+b.w+pad&&x+w>b.x-pad&&y<b.y+b.h+pad&&y+h>b.y-pad);
}

function drawWorld(){
 rect(0,0,W,H,'#b9e5a4');
 for(let y=0;y<H;y+=65)for(let x=0;x<W;x+=90)rect(x,y,88,63,((x/90+y/65)%2===0)?'#f9e4b8':'#ffebc9');
 for(const p of parks){
  rr(p.x,p.y,p.w,p.h,22,'#a6d991');
  rr(p.x+9,p.y+9,p.w-18,p.h-18,18,'#bce6a3');
  line(p.x+15,p.y+p.h*.5,p.x+p.w-15,p.y+p.h*.5,'#f8e6c3',22);
  line(p.x+p.w*.5,p.y+15,p.x+p.w*.5,p.y+p.h-15,'#f8e6c3',22);
  txt(p.name,p.x+p.w/2,p.y+28,14);
 }
 for(const y of roadsY){
  rect(0,y-85,W,170,'#aebbc1');
  rect(0,y-77,W,9,'#fff2d8');rect(0,y+68,W,9,'#fff2d8');
  rect(0,y-85,W,8,'#e6c9a0');rect(0,y+77,W,8,'#e6c9a0');
  for(let x=0;x<W;x+=100)rect(x,y-2,53,5,'#fff5df');
  line(0,y-36,W,y-36,'#d2dadd',2);line(0,y+36,W,y+36,'#d2dadd',2);
 }
 for(const x of roadsX){
  rect(x-77,0,154,H,'#aebbc1');
  rect(x-68,0,7,H,'#fff2d8');rect(x+61,0,7,H,'#fff2d8');
  rect(x-77,0,8,H,'#e6c9a0');rect(x+69,0,8,H,'#e6c9a0');
  for(let y=0;y<H;y+=100)rect(x-2,y,5,53,'#fff5df');
  line(x-36,0,x-36,H,'#d2dadd',2);line(x+36,0,x+36,H,'#d2dadd',2);
 }
 for(const y of roadsY){rect(0,y-103,W,18,'#f4d7a5');rect(0,y+85,W,18,'#f4d7a5');}
 for(const x of roadsX){rect(x-95,0,18,H,'#f4d7a5');rect(x+77,0,18,H,'#f4d7a5');}
 for(const s of signals){
  rr(s.x-9,s.y-32,18,48,4,'#4d5961');
  el(s.x,s.y-22,5,5,s.state==='red'?'#ff514e':'#773c3c');
  el(s.x,s.y-8,5,5,s.state==='yellow'?'#ffd452':'#685d36');
  el(s.x,s.y+6,5,5,s.state==='green'?'#45df77':'#345d47');
 }
}
function drawFountain(x,y){
 el(x,y+10,94,39,'#b5c2c0');el(x,y,91,36,'#fff1d4');
 el(x,y-4,78,27,'#80d4ed');el(x,y-5,52,17,'#b7e9f5');
 el(x,y-10,28,10,'#fff4df');line(x,y-8,x,y-33,'#7ac9e8',7);
}
function drawBench(x,y){
 rr(x-25,y-12,50,12,4,'#bc8057');rr(x-25,y-28,50,13,4,'#d8a174');
 line(x-17,y,x-17,y+12,'#85573c',4);line(x+17,y,x+17,y+12,'#85573c',4);
}
function drawLamp(x,y){
 line(x,y,x,y+32,'#536b7b',5);rr(x-9,y-18,18,19,4,'#ffe18c');line(x-13,y-18,x+13,y-18,'#536b7b',4);
}
function drawChibi(p,isPlayer=false){
 const {x,y}=p,step=Math.sin(p.walk||0)*2.5;
 const skin=p.skin||skins[0],hair=p.hair||hairs[0];
 ctx.save();ctx.translate(x,y);
 el(0,13,14,5,'#72966b');
 rr(-9+step,0,7,13,3,p.pants||'#526780');rr(2-step,0,7,13,3,p.pants||'#526780');
 rr(-10+step,10,9,5,2,'#f7eee2');rr(2-step,10,9,5,2,'#f7eee2');
 rr(-12,-23,24,27,8,p.shirt||'#78bce4');
 rr(-15,-20,6,18,3,skin);rr(9,-20,6,18,3,skin);
 el(-13,-35,3.5,5,skin);el(13,-35,3.5,5,skin);el(0,-36,14,16,skin);
 el(0,-46,14,9,hair);el(-11,-41,5,9,hair);el(11,-42,5,8,hair);
 if(p.gender==='female'){
  if(p.hairStyle%2===0){el(-12,-36,4,12,hair);el(12,-36,4,12,hair);}
  el(-6,-48,9,6,hair);el(5,-49,9,7,hair);
 }else{el(-7,-46,9,7,hair);el(3,-49,9,7,hair);}
 el(-5,-36,1.8,2.5,'#382d2a');el(5,-36,1.8,2.5,'#382d2a');
 el(-8,-31,3,1.5,'#f2a4a0');el(8,-31,3,1.5,'#f2a4a0');
 line(-3,-28,3,-28,'#a75f58',1.5);
 if(p.role==='chef'){rr(-10,-56,20,8,3,'#fff7e9');el(0,-57,9,7,'#fff7e9');}
 if(p.role==='police'){rr(-13,-51,26,6,3,'#31578a');el(0,-51,12,4,'#31578a');el(0,-50,3,3,'#ffd45c');}
 if(p.role==='delivery')rr(8,-22,13,15,3,'#f3a84b');
 if(isPlayer)rr(-7,-19,14,4,2,'#fff2d5');
 ctx.restore();
 if(p.label&&p.showLabel){rr(x-31,y-70,62,15,5,'#fff8e8ed');txt(p.label,x,y-59,8);}
}
function makeVehicle(type,x,y,dir,speed,horizontal,lane){
 vehicles.push({type,x,y,dir,speed,horizontal,lane,color:pick(['#e97763','#f2c65b','#79b9e1','#75bd88','#d8a7e8','#f5f0e4']),stopped:0});
}
function drawCar(v){
 ctx.save();ctx.translate(v.x,v.y);
 if(v.horizontal&&v.dir===-1)ctx.scale(-1,1);
 if(!v.horizontal)ctx.rotate(Math.PI/2);

function blockedAt(x,y,r=12){
 for(const b of buildings){
  if(x+r>b.x-3&&x-r<b.x+b.w+3&&y+7>b.y-3&&y-15<b.y+b.h+3)return true;
 }
 return false;
}
function onRoad(x,y){
 return roadsY.some(v=>Math.abs(y-v)<85)||roadsX.some(v=>Math.abs(x-v)<77);
}
function moveNPCs(){
 for(const p of npcs){
  p.moveTimer--;
  if(p.moveTimer<=0){
   p.dir=rand()<.5?-1:1;
   p.moveTimer=110+rand()*240;
  }
  let nx=p.x,ny=p.y;
  const step=p.dir*p.speed*.45;
  if(p.axis==='x')nx+=step;else ny+=step;
  const homeCoord=p.axis==='x'?p.homeX:p.homeY;
  if(Math.abs((p.axis==='x'?nx:ny)-homeCoord)<110&&!blockedAt(nx,ny,7)&&!onRoad(nx,ny)){
   p.x=nx;p.y=ny;
  }else{
   p.dir*=-1;p.moveTimer=40+rand()*90;
  }
  p.walk+=.09;
 }
}
function moveTraffic(){
 for(const s of signals){
  s.timer--;
  if(s.timer<=0){s.state=s.state==='green'?'yellow':s.state==='yellow'?'red':'green';s.timer=s.state==='green'?500:s.state==='yellow'?100:400;}
 }
 for(const v of vehicles){
  const atIntersection=roadsX.some(x=>Math.abs(v.x-x)<85)&&roadsY.some(y=>Math.abs(v.y-y)<85);
  const signal=signals.find(s=>Math.abs(s.x-v.x)<160&&Math.abs(s.y-v.y)<160);
  v.stopped=atIntersection&&signal&&signal.state==='red'?Math.min(40,v.stopped+1):0;
  if(v.stopped===0){
   if(v.horizontal){v.x+=v.speed*v.dir;if(v.x>W+70)v.x=-70;if(v.x< -70)v.x=W+70;}
   else{v.y+=v.speed*v.dir;if(v.y>H+70)v.y=-70;if(v.y< -70)v.y=H+70;}
  }
 }
 for(const v of bikes){
  if(v.horizontal){v.x+=v.speed*v.dir;if(v.x>W+50)v.x=-50;if(v.x< -50)v.x=W+50;}
  else{v.y+=v.speed*v.dir;if(v.y>H+50)v.y=-50;if(v.y< -50)v.y=H+50;}
 }
}
function moveNature(){
 for(const a of animals){
  a.timer--;
  if(a.timer<=0){a.dir*=-1;a.timer=50+rand()*140;}
  const nx=a.x+a.dir*a.speed;
  if(clearGround(nx,a.y,15))a.x=nx;else a.dir*=-1;
  a.walk+=.09;
 }
 for(const b of butterflies){
  b.phase+=.09;b.x+=Math.sin(b.phase)*b.speed;b.y+=Math.cos(b.phase*.8)*b.speed*.6;
  if(Math.hypot(b.x-b.homeX,b.y-b.homeY)>55){b.x+=(b.homeX-b.x)*.025;b.y+=(b.homeY-b.y)*.025;}
 }
 for(const b of birds){
  b.phase+=.06;b.x+=Math.sin(b.phase)*b.speed;b.y+=Math.cos(b.phase*.7)*b.speed*.35;
  if(Math.hypot(b.x-b.homeX,b.y-b.homeY)>45){b.x+=(b.homeX-b.x)*.02;b.y+=(b.homeY-b.y)*.02;}
 }
}

function rentShop(s){
 const b=s.building;
 if(b.owner==='player'){message('Mày đã sở hữu mặt bằng này rồi!');return;}
 if(b.rented){message('Mặt bằng này đang được thuê!');return;}
 if(money<b.rent){message('Không đủ xu thuê. Cần '+b.rent+' xu.');return;}
 money-=b.rent;b.owner='player';b.rented=true;b.bought=false;
 business={building:b,name:b.name,opened:true};
 saveGame();refreshHUD();closePanel();message('🎉 Thuê thành công '+b.name+'! Đã trừ '+b.rent+' xu.');
}
function buyShop(i){
 const s=shops[i];if(!s)return;
 const b=s.building;
 if(b.owner==='player'){message('Mày đã sở hữu mặt bằng này rồi!');return;}
 if(b.rented){message('Mặt bằng đang được thuê, chưa thể mua!');return;}
 if(money<b.price){message('Không đủ tiền mua! Cần '+b.price+' xu.');return;}
 money-=b.price;b.owner='player';b.bought=true;b.rented=false;
 saveGame();refreshHUD();closePanel();message('🏠 Mua thành công '+b.name+'! Đã trừ '+b.price+' xu.');
}
function rentShopByIndex(i){if(shops[i])rentShop(shops[i]);}
function buyShopByIndex(i){buyShop(i)}

function savePrices(){
 foodPrice=Math.max(1,+document.getElementById('fp').value||1);
 foodCost=Math.max(0,+document.getElementById('fc').value||0);
 drinkPrice=Math.max(1,+document.getElementById('dp').value||1);
 drinkCost=Math.max(0,+document.getElementById('dc').value||0);
 saveGame();message('Đã cập nhật giá món ăn và nước uống!');businessPanel();
}
function hire(role){
 if(!business){message('Mày cần thuê mặt bằng trước!');return;}
 if(money<100){message('Không đủ 100 xu để tuyển nhân viên!');return;}
 money-=100;staff[role]++;expenses+=100;saveGame();refreshHUD();businessPanel();
}
function toggleBusiness(){
 if(!business)return;
 business.opened=!business.opened;saveGame();refreshHUD();businessPanel();
 message(business.opened?'Quán đã mở cửa!':'Quán đã đóng cửa!');
}
function manualOrder(){
 if(!business||!business.opened||!isOpen()){message('Quán đang đóng cửa hoặc ngoài giờ kinh doanh!');return;}
 const cost=foodCost+drinkCost,price=foodPrice+drinkPrice;
 if(money<cost){message('Không đủ tiền nhập nguyên liệu!');return;}
 money-=cost;expenses+=cost;money+=price;revenue+=price;orders++;served++;
 saveGame();refreshHUD();businessPanel();message('🍜 Đơn hàng hoàn tất! Lãi đơn này: '+(price-cost)+' xu.');
}

 <div class="row"><button onclick="talkNpc(${id})">💬 Trò chuyện</button><button onclick="npcBorrowPanel(${id})">🤝 Cho vay</button></div>
 ${p.role==='customer'?`<div class="row"><button onclick="npcBuyOnCredit(${id})">🍜 Bán chịu món ăn</button></div>`:''}
 <div class="row"><button class="secondary" onclick="closePanel()">TẠM BIỆT</button></div>`);
}
function npcBorrowPanel(id){
 const p=getNpcById(id);if(!p)return;
 openPanel(`<h3>🤝 Cho ${p.label} vay</h3>
 <p>Người dân sẽ có cơ hội trả lại tiền. Mức thân thiết càng cao thì khả năng trả nợ càng tăng, nhưng không được bảo đảm.</p>
 <div id="stats">❤️ Thân thiết: ${p.affinity||0}/100<br>💰 Tiền của mày: ${money} xu</div>
 <div class="row">Số tiền <input id="loanAmount" type="number" min="1" max="${Math.max(1,money)}" value="${Math.min(100,Math.max(1,money))}"></div>
 <div class="row"><button onclick="lendNpc(${id})">CHO VAY</button><button class="secondary" onclick="npcPanel(getNpcById(${id}))">QUAY LẠI</button></div>`);
}
function lendNpc(id){
 const p=getNpcById(id);if(!p)return;
 const input=document.getElementById('loanAmount');
 const amount=Math.floor(Number(input&&input.value));
 if(!Number.isFinite(amount)||amount<1||amount>money){message('Số tiền cho vay không hợp lệ!');return;}
 money-=amount;
 businessDebt.push({id:nextDebtId++,npcId:id,npcName:p.label,kind:'loan',amount,created:worldMinutes,repayAt:worldMinutes+180+rand()*400});
 p.debt=(p.debt||0)+amount;p.repayTimer=180+rand()*400;
 saveGame();refreshHUD();closePanel();
 message('🤝 Đã cho '+p.label+' vay '+amount+' xu.');
}
function npcBuyOnCredit(id){
 const p=getNpcById(id);
 if(!p||!business||!business.opened||!isOpen()){message('Quán phải mở cửa trong giờ kinh doanh mới bán được!');return;}
 const price=foodPrice+drinkPrice,cost=foodCost+drinkCost;
 if(money<cost){message('Mày không đủ tiền nhập nguyên liệu cho đơn này!');return;}
 if(businessDebt.filter(d=>d.npcId===id).length>=3){message('Người này còn nhiều khoản nợ, chưa thể bán chịu thêm!');return;}
 money-=cost;expenses+=cost;orders++;
 businessDebt.push({id:nextDebtId++,npcId:id,npcName:p.label,kind:'sale',amount:price,created:worldMinutes,repayAt:worldMinutes+150+rand()*450});
 p.debt=(p.debt||0)+price;p.affinity=Math.min(100,(p.affinity||0)+3);
 saveGame();refreshHUD();closePanel();
 message('🧾 Đã bán chịu '+price+' xu cho '+p.label+'. Khoản nợ được ghi lại.');
}
function customerOrder(){closePanel();manualOrder();}

function debtPanel(){
 const list=businessDebt.length?businessDebt.map(d=>`<p>👤 ${d.npcName||'Người dân'} — ${d.kind==='sale'?'Tiền hàng':'Khoản vay'}: <b>${d.amount} xu</b><br><button onclick="collectDebt(${d.id})">Thu nợ</button></p>`).join(''):'<p>Hiện không có khoản nợ nào.</p>';
 openPanel(`<h3>💳 Sổ công nợ</h3>${list}<div class="row"><button class="secondary" onclick="businessPanel()">QUAY LẠI</button></div>`);
}
function collectDebt(id){
 const d=businessDebt.find(x=>x.id===id);if(!d)return;
 const p=getNpcById(d.npcId);
 const affinity=p?(p.affinity||0):0;
 const chance=.35+affinity/150;
 if(rand()<chance){
  money+=d.amount;revenue+=d.amount;
  if(p)p.debt=Math.max(0,(p.debt||0)-d.amount);
  businessDebt=businessDebt.filter(x=>x.id!==id);
  message('💰 '+d.npcName+' đã trả '+d.amount+' xu!');
 }else{
  d.repayAt=worldMinutes+180;
  if(p)p.affinity=Math.max(0,(p.affinity||0)-2);
  message(d.npcName+' xin khất nợ. Hãy thử thu lại sau!');
 }
 saveGame();refreshHUD();debtPanel();
}

/* ĐƠN ONLINE VÀ GIAO HÀNG */
function createOnlineOrder(){
 if(!business||!business.opened||!isOpen())return;
 if(onlineOrders.filter(o=>o.status==='pending').length>=8)return;
 const price=foodPrice+drinkPrice;
 onlineOrders.push({
  id:nextOnlineId++,customer:pick(['Minh Anh','Hoàng Nam','Bảo Ngọc','Gia Huy','Thanh Trúc','Khánh Linh']),
  price,cost:foodCost+drinkCost,status:'pending',created:worldMinutes,
  destination:pick(['Khu chung cư','Khu dân cư','Văn phòng','Công viên','Khu phố'])
 });
 saveGame();
 message('📱 Có đơn online mới! Mở quán để xem đơn.');
}
function onlineOrderPanel(){
 const list=onlineOrders.filter(o=>o.status==='pending');
 const html=list.length?list.map(o=>`<p>📦 Đơn #${o.id} — ${o.customer}<br>📍 ${o.destination} • Tổng tiền: ${o.price} xu<br><button onclick="fulfillOnline(${o.id})">NHẬN VÀ GIAO</button></p>`).join(''):'<p>Chưa có đơn online đang chờ. Khách sẽ gửi đơn khi quán mở cửa.</p>';
 openPanel(`<h3>📱 Đơn hàng online</h3><div id="stats">🛵 Nhân viên giao hàng: ${staff.delivery}<br>📦 Đơn chờ: ${list.length}</div>${html}<div class="row"><button class="secondary" onclick="businessPanel()">QUAY LẠI</button></div>`);
}
function fulfillOnline(id){
 const o=onlineOrders.find(x=>x.id===id&&x.status==='pending');if(!o)return;
 if(money<o.cost){message('Không đủ tiền nhập nguyên liệu để làm đơn!');return;}
 money-=o.cost;expenses+=o.cost;money+=o.price;revenue+=o.price;orders++;served++;
 o.status='completed';o.completedAt=worldMinutes;
 saveGame();refreshHUD();onlineOrderPanel();
 message('🛵 Đơn online #'+id+' đã giao thành công! Lãi '+(o.price-o.cost)+' xu.');
}

/* NHÂN VIÊN XIN NGHỈ, NGHỈ VIỆC HOẶC ỨNG LƯƠNG */
function maybeStaffRequest(){
 if(!business||!business.opened)return;
 const employed=Object.keys(staff).filter(role=>staff[role]>0);
 if(!employed.length||staffRequests.length>=8)return;
 const role=pick(employed);
 const types=['leave','advance','quit'];
 const type=pick(types);
 const labels={serve:'Phục vụ',chef:'Phụ bếp',cashier:'Thu ngân',delivery:'Giao hàng'};
 staffRequests.push({
  id:nextRequestId++,role,roleName:labels[role]||role,type,
  amount:type==='advance'?Math.min(100,Math.max(20,Math.floor(money*.15))):0,
  status:'pending',created:worldMinutes
 });
 saveGame();
}
function staffRequestPanel(){
 const list=staffRequests.filter(r=>r.status==='pending');
 const names={leave:'Xin nghỉ phép',advance:'Xin ứng lương',quit:'Xin nghỉ việc'};
 const html=list.length?list.map(r=>`<p>👤 ${r.roleName}: <b>${names[r.type]}</b>${r.type==='advance'?' — '+r.amount+' xu':''}<br><button onclick="decideStaffRequest(${r.id},true)">ĐỒNG Ý</button><button class="secondary" onclick="decideStaffRequest(${r.id},false)">TỪ CHỐI</button></p>`).join(''):'<p>Chưa có yêu cầu nào đang chờ xử lý.</p>';
 openPanel(`<h3>📋 Yêu cầu nhân viên</h3>${html}<div class="row"><button class="secondary" onclick="businessPanel()">QUAY LẠI</button></div>`);
}
function decideStaffRequest(id,approved){
 const r=staffRequests.find(x=>x.id===id&&x.status==='pending');if(!r)return;
 r.status=approved?'approved':'denied';
 if(approved){
  if(r.type==='leave'){
   staffLeaveUntil[r.role]=worldMinutes+480;
   message(r.roleName+' được nghỉ phép trong 8 giờ trong game.');
  }else if(r.type==='advance'){
   if(money<r.amount){r.status='pending';message('Không đủ xu để ứng lương!');return;}
   money-=r.amount;expenses+=r.amount;
   message('Đã ứng '+r.amount+' xu cho nhân viên.');
  }else if(r.type==='quit'){
   staff[r.role]=Math.max(0,staff[r.role]-1);
   message('Đã đồng ý cho nhân viên nghỉ việc.');
  }
 }else message('Đã từ chối yêu cầu của nhân viên.');
 saveGame();refreshHUD();staffRequestPanel();
}

/* ĐỐI THỦ KINH DOANH ẢNH HƯỞNG LƯỢNG KHÁCH */
function competitionFactor(){
 if(!business)return 1;
 const b=business.building;
 const competitors=buildings.filter(o=>
  o!==b&&['cafe','restaurant','shop','market','grocery'].includes(o.type)&&
  Math.hypot((o.x+o.w/2)-(b.x+b.w/2),(o.y+o.h/2)-(b.y+b.h/2))<500
 ).length;
 return Math.max(.35,1-Math.min(competitors,6)*.08);
}
function payHourlyWages(){
 const hour=Math.floor(worldMinutes/60);
 if(hour===lastWageHour)return;
 lastWageHour=hour;
 if(!business||!business.opened)return;
 let active=0;
 for(const role of Object.keys(staff)){
  if(staffLeaveUntil[role]&&worldMinutes<staffLeaveUntil[role])continue;
  active+=staff[role];
 }
 const wage=active*10;
 if(wage>0){
  money-=wage;expenses+=wage;
  if(money<0)message('⚠️ Tiền đang âm do chi phí lương nhân viên!');
 }
}
function updateDebts(){
 for(const d of [...businessDebt]){
  if(worldMinutes<d.repayAt)continue;
  const p=getNpcById(d.npcId);
  const affinity=p?(p.affinity||0):0;
  const chance=.38+affinity/160;
  if(rand()<chance){
   money+=d.amount;revenue+=d.amount;
   if(p)p.debt=Math.max(0,(p.debt||0)-d.amount);
   businessDebt=businessDebt.filter(x=>x.id!==d.id);
   message('💰 '+(d.npcName||'Người dân')+' đã tự trả '+d.amount+' xu.');
  }else d.repayAt=worldMinutes+180+rand()*240;
 }
}

function interact(){
 let nearest=null,dist=Infinity;
 for(const s of shops){const d=Math.hypot(player.x-s.x,player.y-s.y);if(d<dist){dist=d;nearest=s;}}
 let nearNpc=null,npcDist=Infinity;
 for(const p of npcs){const d=Math.hypot(player.x-p.x,player.y-p.y);if(d<npcDist){npcDist=d;nearNpc=p;}}
 if(nearest&&dist<115){propertyPanel(nearest);return;}
 if(nearNpc&&npcDist<80){npcPanel(nearNpc);return;}
 message('Đến gần cửa nhà hoặc cửa hàng rồi bấm TƯƠNG TÁC nhé!');
}

function saveGame(){
 try{
  localStorage.setItem('buonGiBan_save_v2',JSON.stringify({
   money,worldMinutes,revenue,expenses,orders,served,foodPrice,foodCost,drinkPrice,drinkCost,
   player:{x:player.x,y:player.y},staff,
   buildings:buildings.map((b,i)=>({i,owner:b.owner,rented:!!b.rented,bought:!!b.bought})),
   businessIndex:business?buildings.indexOf(business.building):-1,
   businessOpened:business?business.opened:false,
   onlineOrders,staffRequests,nextOnlineId,nextRequestId,nextDebtId,nextNpcId,
   businessDebt,staffLeaveUntil,rentPaidDay,lastWageHour,
   npcs:npcs.map(p=>({id:p.id,affinity:p.affinity||0,friendship:p.friendship||0,debt:p.debt||0}))
  }));
 }catch(e){console.warn('Không lưu được game:',e);}
}
function loadGame(){
 try{
  const raw=localStorage.getItem('buonGiBan_save_v2');if(!raw)return;
  const d=JSON.parse(raw);
  money=d.money??money;worldMinutes=d.worldMinutes??worldMinutes;
  revenue=d.revenue??0;expenses=d.expenses??0;orders=d.orders??0;served=d.served??0;
  foodPrice=d.foodPrice??foodPrice;foodCost=d.foodCost??foodCost;
  drinkPrice=d.drinkPrice??drinkPrice;drinkCost=d.drinkCost??drinkCost;
  if(d.player){player.x=d.player.x??player.x;player.y=d.player.y??player.y;}
  if(d.staff)Object.assign(staff,d.staff);
  for(const item of d.buildings||[]){
   const b=buildings[item.i];
   if(b){b.owner=item.owner??null;b.rented=!!item.rented;b.bought=!!item.bought;}
  }
  const i=d.businessIndex??-1;
  if(i>=0&&buildings[i])business={building:buildings[i],name:buildings[i].name,opened:d.businessOpened!==false};
  onlineOrders=d.onlineOrders||[];staffRequests=d.staffRequests||[];
  nextOnlineId=d.nextOnlineId||1;nextRequestId=d.nextRequestId||1;nextDebtId=d.nextDebtId||1;
  nextNpcId=Math.max(nextNpcId,d.nextNpcId||1);
  businessDebt=d.businessDebt||[];
  staffLeaveUntil=Object.assign(staffLeaveUntil,d.staffLeaveUntil||{});
  rentPaidDay=d.rentPaidDay??-1;lastWageHour=d.lastWageHour??-1;
  for(const saved of d.npcs||[]){
   const p=npcs.find(n=>n.id===saved.id);
   if(p){p.affinity=saved.affinity||0;p.friendship=saved.friendship||0;p.debt=saved.debt||0;}
  }
 }catch(e){console.warn('Không tải được dữ liệu:',e);}
}

function drawWeather(){
 if(weather==='Mưa'||weather==='Bão'){
  ctx.strokeStyle='#91bde5aa';ctx.lineWidth=1.5;
  for(let i=0;i<90;i++){const x=(i*73+performance.now()*.25)%cw,y=(i*137+performance.now()*.7)%ch;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-5,y+13);ctx.stroke();}
 }
 if(weather==='Tuyết'){
  ctx.fillStyle='#ffffffcc';
  for(let i=0;i<70;i++){const x=(i*97+performance.now()*.03)%cw,y=(i*61+performance.now()*.08)%ch;ctx.beginPath();ctx.arc(x,y,2.2,0,Math.PI*2);ctx.fill();}
 }
 if(weather==='Gió'||weather==='Bão'){
  for(let i=0;i<16;i++){const x=(i*101+performance.now()*.3)%cw,y=(i*53)%ch;line(x,y,x+22,y-5,'#fff5d999',1);}
 }
 if(weather==='Sương mù')rect(0,0,cw,ch,'#e9f0e899');
 const hour=Math.floor(worldMinutes/60)%24;
 if(hour>=19||hour<6)rect(0,0,cw,ch,'#15264a66');
}
function drawMiniMap(){
 const mw=Math.min(115,cw*.27),mh=mw*H/W,mx=cw-mw-10,my=ch-mh-12;
 rr(mx-4,my-4,mw+8,mh+8,7,'#fff8e8');rect(mx,my,mw,mh,'#b9e5a4');
 ctx.fillStyle='#b1bec4';
 for(const y of roadsY)ctx.fillRect(mx,my+mh*y/H,mw,mh*170/H);
 for(const x of roadsX)ctx.fillRect(mx+mw*x/W,my,mw*154/W,mh);
 ctx.fillStyle='#6bb77b';
 for(const p of parks)ctx.fillRect(mx+mw*p.x/W,my+mh*p.y/H,mw*p.w/W,mh*p.h/H);
 ctx.fillStyle='#e98070';
 for(const b of buildings)ctx.fillRect(mx+mw*b.x/W,my+mh*b.y/H,Math.max(1,mw*b.w/W),Math.max(1,mh*b.h/H));
 el(mx+mw*player.x/W,my+mh*player.y/H,3.5,3.5,'#ff5f58');
}
function render(){
 ctx.setTransform(dpr,0,0,dpr,0,0);rect(0,0,cw,ch,'#b9e5a4');
 const zoom=Math.min(cw/850,ch/570),vw=cw/zoom,vh=ch/zoom;
 const camX=Math.max(0,Math.min(W-vw,player.x-vw/2));
 const camY=Math.max(0,Math.min(H-vh,player.y-vh/2));
 ctx.setTransform(dpr*zoom,0,0,dpr*zoom,-camX*dpr*zoom,-camY*dpr*zoom);
 drawWorld();
 for(const b of buildings)drawBuilding(b);
 drawFountain(2500,210);drawFountain(320,1430);
 for(const t of trees)drawTree(t);
 for(const f of flowers)drawFlower(f);
 for(let x=80;x<W;x+=230)for(const y of roadsY){drawLamp(x,y-110);drawLamp(x+90,y+110);}
 drawBench(700,510);drawBench(1450,1110);drawBench(700,1710);
 for(const t of tables)drawTable(t);
 for(const v of vehicles)drawCar(v);
 for(const v of bikes)drawBike(v);
 for(const a of animals)drawAnimal(a);
 for(const b of birds)drawBird(b);
 for(const b of butterflies)drawButterfly(b);
 for(const p of npcs)drawChibi(p);
 drawChibi(player,true);
 ctx.setTransform(dpr,0,0,dpr,0,0);
 drawWeather();drawMiniMap();
}

function update(){
 let dx=0,dy=0;
 if(keys.left)dx--;if(keys.right)dx++;if(keys.up)dy--;if(keys.down)dy++;
 if(dx&&dy){dx*=.707;dy*=.707;}
 const speed=3.1;
 const nx=Math.max(12,Math.min(W-12,player.x+dx*speed));
 const ny=Math.max(12,Math.min(H-12,player.y+dy*speed));
 if(!blockedAt(nx,player.y))player.x=nx;
 if(!blockedAt(player.x,ny))player.y=ny;
 if(dx||dy)player.walk+=.22;

 moveNPCs();moveTraffic();moveNature();
 const previousHour=Math.floor(worldMinutes/60);
 worldMinutes+=.025;if(worldMinutes>=1440)worldMinutes=0;
 const currentHour=Math.floor(worldMinutes/60);
 if(currentHour!==previousHour)payHourlyWages();

 weatherTimer++;
 if(weatherTimer>1600){
  weatherTimer=0;
  weather=pick(['Nắng','Mưa','Tuyết','Bão','Gió','Sương mù']);
  message('🌦️ Thời tiết thay đổi: '+weather);
 }
 autoBusinessTimer++;
 if(autoBusinessTimer>300){
  autoBusinessTimer=0;
  if(business&&business.opened&&isOpen()){
   const competition=competitionFactor();
   const activeServe=worldMinutes<(staffLeaveUntil.serve||0)?0:staff.serve;
   const activeChef=worldMinutes<(staffLeaveUntil.chef||0)?0:staff.chef;
   const activeCashier=worldMinutes<(staffLeaveUntil.cashier||0)?0:staff.cashier;
   const chance=Math.min(.9,(.28+activeServe*.1+activeChef*.1+activeCashier*.08)*competition);
   if(rand()<chance&&money>=foodCost+drinkCost){
    const cost=foodCost+drinkCost,price=foodPrice+drinkPrice;
    money-=cost;expenses+=cost;money+=price;revenue+=price;orders++;served++;
    saveGame();message('🧑‍🤝‍🧑 Khách đã gọi món! Doanh thu +'+price+' xu.');
   }
   if(rand()<.42)createOnlineOrder();
   for(const t of tables)t.customer=rand()<.5;
   if(rand()<.12)maybeStaffRequest();
   competitionNoticeTimer++;
   if(competitionNoticeTimer>4){
    competitionNoticeTimer=0;
    if(competition<.7)message('🏪 Có nhiều cửa hàng cạnh tranh gần đây. Hãy cân nhắc giá bán!');
   }
  }
  updateDebts();
  saveGame();
 }
 refreshHUD();render();requestAnimationFrame(update);
}

const keyMap={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};
addEventListener('keydown',e=>{
 const k=keyMap[e.key];
 if(k){keys[k]=true;e.preventDefault();}
 if(e.key===' '||e.key==='Enter'){interact();e.preventDefault();}
});
addEventListener('keyup',e=>{const k=keyMap[e.key];if(k)keys[k]=false;});
addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));

document.querySelectorAll('[data-k]').forEach(btn=>{
 const k=btn.dataset.k;
 const start=e=>{
  e.preventDefault();keys[k]=true;btn.style.background='#ffd58a';
  try{btn.setPointerCapture(e.pointerId);}catch(_){}
 };
 const stop=e=>{
  if(e)e.preventDefault();
  keys[k]=false;btn.style.background='#fff5dfed';
 };
 btn.addEventListener('pointerdown',start);
 btn.addEventListener('pointerup',stop);
 btn.addEventListener('pointercancel',stop);
 btn.addEventListener('lostpointercapture',()=>stop());
 btn.addEventListener('contextmenu',e=>e.preventDefault());
});
document.getElementById('act').addEventListener('pointerdown',e=>e.stopPropagation());
document.getElementById('act').addEventListener('click',interact);

/* TẠO MAP TRƯỚC, RỒI TẢI DỮ LIỆU ĐÃ LƯU */
generate();
loadGame();

if(blockedAt(player.x,player.y)){
 let found=false;
 for(let radius=30;radius<700&&!found;radius+=25){
  for(let a=0;a<Math.PI*2;a+=Math.PI/8){
   const x=Math.max(15,Math.min(W-15,player.x+Math.cos(a)*radius));
   const y=Math.max(15,Math.min(H-15,player.y+Math.sin(a)*radius));
   if(!blockedAt(x,y,10)){player.x=x;player.y=y;found=true;break;}
  }
 }
 if(!found){player.x=1020;player.y=730;}
}
refreshHUD();
render();
requestAnimationFrame(update);
</script>
