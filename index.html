<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Buôn Gì Bán - Thành phố mở rộng</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#9bc9a6;font-family:Arial}
canvas{display:block;width:100vw;height:100dvh;touch-action:none}
#top{position:fixed;top:9px;left:9px;right:9px;display:flex;justify-content:space-between;gap:5px;pointer-events:none}
.box{padding:9px 13px;border:2px solid #d4a373;border-radius:14px;background:#fefae0;color:#582f0e;font-size:12px;font-weight:bold;box-shadow:0 4px #bc6c25}
#pad{position:fixed;bottom:16px;left:15px;width:140px;height:140px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:4px}
button{touch-action:none;user-select:none;-webkit-user-select:none}
.move{border:2px solid #d4a373;background:#fefae0;color:#582f0e;border-radius:13px;font-size:23px;font-weight:bold;box-shadow:0 4px #bc6c25}
.move:active,#act:active{background:#dda15e;transform:translateY(2px);box-shadow:0 2px #bc6c25}
.up{grid-area:1/2}.left{grid-area:2/1}.right{grid-area:2/3}.down{grid-area:3/2}
#act{position:fixed;right:19px;bottom:36px;width:78px;height:78px;border-radius:50%;border:3px solid #d4a373;background:#dda15e;color:#582f0e;font-weight:bold;box-shadow:0 4px #bc6c25}
#msg{position:fixed;top:66px;left:50%;transform:translateX(-50%);background:#fefae0;border:2px solid #d4a373;border-radius:14px;padding:10px 13px;color:#582f0e;font-size:12px;font-weight:bold;display:none;text-align:center;max-width:88%;white-space:normal;box-shadow:0 4px #bc6c25}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="top">
 <div class="box">🏡 BUÔN GÌ BÁN</div>
 <div class="box">💰 <span id="money">1.000</span> xu</div>
</div>
<div id="msg"></div>

<div id="pad">
 <button class="move up" data-k="up">▲</button>
 <button class="move left" data-k="left">◀</button>
 <button class="move right" data-k="right">▶</button>
 <button class="move down" data-k="down">▼</button>
</div>
<button id="act">TƯƠNG<br>TÁC</button>

<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const W=3000,H=2400;
let cw=innerWidth,ch=innerHeight,dpr=1;
let money=1000;
const keys={};
const buildings=[];
const trees=[];
const flowers=[];
const parks=[];
const shops=[];
const roadsX=[500,1250,2000,2750];
const roadsY=[450,1050,1650,2250];

function resize(){
 dpr=Math.min(devicePixelRatio||1,2);
 cw=innerWidth;ch=innerHeight;
 canvas.width=cw*dpr;canvas.height=ch*dpr;
 canvas.style.width=cw+'px';canvas.style.height=ch+'px';
}
addEventListener('resize',resize);resize();

let seed=82941;
function rand(){
 seed=(seed*1664525+1013904223)>>>0;
 return seed/4294967296;
}
function rect(x,y,w,h,c){
 ctx.fillStyle=c;ctx.fillRect(x,y,w,h);
}
function roundRect(x,y,w,h,r,c){
 ctx.fillStyle=c;ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);ctx.fill();
}
function line(x,y,x2,y2,c,width){
 ctx.strokeStyle=c;ctx.lineWidth=width;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke();
}
function text(t,x,y,size=18,color='#582f0e'){
 ctx.fillStyle=color;ctx.font=`bold ${size}px Arial`;
 ctx.textAlign='center';ctx.fillText(t,x,y);
}
function ellipse(x,y,rx,ry,c){
 ctx.fillStyle=c;ctx.beginPath();
 ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();
}

function tree(x,y,s=1){
 trees.push({x,y,s});
}
function flower(x,y,s=1){
 flowers.push({x,y,s});
}

// ĐỒ HỌA CÂY & HOA NÂNG CẤP (SINH ĐỘNG HƠN)
function drawTree(o){
 const {x,y,s}=o;
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 ellipse(2,22,34,12,'rgba(0,0,0,0.15)'); // Bóng đổ dưới gốc
 rect(-6,2,12,24,'#8d5b4c'); // Thân cây chắc chắn
 roundRect(-34,-30,42,42,20,'#40916c');
 roundRect(-10,-52,46,48,20,'#52b788');
 roundRect(8,-24,40,40,18,'#2d6a4f');
 roundRect(-22,-56,36,38,16,'#74c69d');
 for(let i=0;i<5;i++){
  const a=rand()*50-25,b=-50+rand()*55;
  ellipse(a,b,4,4,'#ffe8d6');
 }
 ctx.restore();
}
function drawFlowers(o){
 ctx.save();ctx.translate(o.x,o.y);ctx.scale(o.s,o.s);
 ellipse(0,8,30,12,'rgba(0,0,0,0.12)');
 for(let i=0;i<5;i++){
  const x=(i-2)*11,y=(i%2)*-9-5;
  for(let j=0;j<5;j++){
   const a=j*Math.PI*2/5;
   ellipse(x+Math.cos(a)*5,y+Math.sin(a)*5,5,5,
    i%2?'#ffffff':'#ffb5a7');
  }
  ellipse(x,y,3,3,'#f3c623');
 }
 ctx.restore();
}

// ĐỒ HỌA CÔNG TRÌNH, NHÀ CỬA, CỬA HÀNG NÂNG CẤP
function building(x,y,w,h,type,name,color,roof){
 buildings.push({x,y,w,h});
 shops.push({x:x+w/2,y:y+h+20,w,h,name});
}
function drawBuilding(b){
 const {x,y,w,h,type,name,color,roof}=b;
 ctx.save();
 // Đổ bóng hiện đại
 roundRect(x+10,y+14,w,h,8,'rgba(0,0,0,0.15)');
 // Tường chính
 roundRect(x,y,w,h,8,color);
 rect(x,y+h-14,w,14,'#d4a373');

 if(type==='apt'){
  rect(x-8,y-10,w+16,16,roof);
  rect(x-4,y-18,w+8,10,'#fefae0');
  for(let row=0;row<3;row++){
   for(let col=0;col<3;col++){
    const wx=x+12+col*(w-24)/3;
    const wy=y+14+row*40;
    roundRect(wx,wy,22,26,4,'#caf0f8');
    line(wx+11,wy,wx+11,wy+26,'#fff',3);
    line(wx,wy+13,wx+22,wy+13,'#fff',3);
   }
  }
  roundRect(x+w/2-15,y+h-50,30,50,10,'#b08968');
 }else{
  // Mái nhà sắc nét
  ctx.fillStyle=roof;ctx.beginPath();
  ctx.moveTo(x-12,y+8);ctx.lineTo(x+w/2,y-36);
  ctx.lineTo(x+w+12,y+8);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#7f4f24';ctx.lineWidth=3;ctx.stroke();

  // Cửa sổ kính sáng bóng
  roundRect(x+14,y+26,26,30,5,'#caf0f8');
  line(x+27,y+26,x+27,y+56,'#fff',3);
  line(x+14,y+41,x+40,y+41,'#fff',3);

  roundRect(x+w-40,y+26,26,30,5,'#caf0f8');
  line(x+w-27,y+26,x+w-27,y+56,'#fff',3);

  roundRect(x+w/2-16,y+h-52,32,52,14,'#b08968');
  ellipse(x+w/2+8,y+h-26,2.5,2.5,'#ffd166');
 }

 // Mái hiên cửa hàng trang trí bắt mắt
 if(type==='shop'){
  rect(x-6,y+60,w+12,12,'#fefae0');
  for(let i=0;i<5;i++){
   rect(x+i*w/5,y+60,w/10,18,i%2?'#fefae0':'#e76f51');
  }
  rect(x+14,y+84,w-28,5,'#9c6644');
 }

 if(type==='cafe'){
  roundRect(x+w/2-28,y-58,56,34,10,'#ffb703');
  text('☕',x+w/2,y-33,24);
 }
 if(type==='market'){
  roundRect(x+w/2-46,y-60,92,36,10,'#fefae0');
  text('CHỢ',x+w/2,y-36,18,'#bc6c25');
 }

 // Bảng tên sắc nét
 roundRect(x+w/2-58,y+h+6,116,25,10,'#fefae0');
 ctx.strokeStyle='#d4a373';ctx.lineWidth=1.5;
 ctx.stroke();
 text(name,x+w/2,y+h+23,11);

 ctx.restore();
}

// ĐỒ HỌA ĐƯỜNG PHỐ & CÔNG VIÊN
function drawWorld(){
 rect(0,0,W,H,'#b5e28c');

 // Gạch lát nền sân tinh tế
 for(let y=0;y<H;y+=65){
  for(let x=0;x<W;x+=90){
   rect(x,y,88,63,((x/90+y/65)%2===0)?'#d8f3dc':'#b7e4c7');
   line(x,y,x+88,y,'#95d5b2',0.8);
  }
 }

 // Các khu công viên
 for(const p of parks){
  roundRect(p.x,p.y,p.w,p.h,30,'#70e000');
  roundRect(p.x+10,p.y+10,p.w-20,p.h-20,26,'#9ef01a');
  // Lối đi dạo
  line(p.x+15,p.y+p.h*.5,p.x+p.w-15,p.y+p.h*.5,'#fefae0',32);
  line(p.x+p.w*.5,p.y+15,p.x+p.w*.5,p.y+p.h-15,'#fefae0',28);
  text(p.name,p.x+p.w/2,p.y+32,18,'#386641');
 }

 // Đường lớn ngang
 for(const y of roadsY){
  rect(0,y-72,W,144,'#495057');
  rect(0,y-78,W,10,'#f8f9fa');
  rect(0,y+68,W,10,'#f8f9fa');
  for(let x=0;x<W;x+=100)rect(x,y-2,54,5,'#ffb703');
  // Vỉa hè
  rect(0,y-86,W,8,'#e9edc9');
  rect(0,y+78,W,8,'#e9edc9');
 }
 // Đường lớn dọc
 for(const x of roadsX){
  rect(x-62,0,124,H,'#495057');
  rect(x-68,0,10,H,'#f8f9fa');
  rect(x+58,0,10,H,'#f8f9fa');
  for(let y=0;y<H;y+=100)rect(x-2,y,5,54,'#ffb703');
  rect(x-76,0,8,H,'#e9edc9');
  rect(x+68,0,8,H,'#e9edc9');
 }

 // Vạch sang đường
 for(const x of roadsX){
  for(const y of roadsY){
   for(let i=0;i<5;i++){
    rect(x-35+i*15,y-69,8,26,'#ffffff');
    rect(x-35+i*15,y+43,8,26,'#ffffff');
   }
  }
 }
}

// ĐỒ HỌA HỒ NƯỚC VÀ ĐÀI PHUN NƯỚC SỐNG ĐỘNG
function drawFountain(x,y){
 ellipse(x,y+12,100,42,'rgba(0,0,0,0.2)');
 ellipse(x,y,96,38,'#e9edc9');
 ellipse(x,y-4,82,30,'#00b4d8');
 ellipse(x,y-6,56,20,'#90e0ef');
 ellipse(x,y-12,30,12,'#caf0f8');
 line(x,y-10,x,y-38,'#0077b6',8);
 ellipse(x,y-39,10,6,'#ffffff');
}

// GHẾ VÀ ĐÈN ĐƯỜNG CẢI TIẾN
function drawBench(x,y){
 roundRect(x-26,y-12,52,12,5,'#bc6c25');
 roundRect(x-26,y-30,52,14,5,'#dda15e');
 line(x-18,y,x-18,y+14,'#582f0e',4);
 line(x+18,y,x+18,y+14,'#582f0e',4);
}
function drawLamp(x,y){
 line(x,y,x,y+36,'#343a40',5);
 roundRect(x-10,y-20,20,20,5,'#ffb703');
 line(x-14,y-20,x+14,y-20,'#343a40',4);
}

// TẠO KHU VỰC
function generate(){
 seed=82941;
 parks.push({x:45,y:40,w:370,h:300,name:'🌳 CÔNG VIÊN'});
 parks.push({x:2150,y:60,w:650,h:300,name:'🌷 VƯỜN HOA'});
 parks.push({x:70,y:1300,w:530,h:270,name:'🏞️ CÔNG VIÊN BỜ HỒ'});
 parks.push({x:2180,y:1300,w:590,h:270,name:'🌴 CÔNG VIÊN'});
 for(let y=0;y<H;y+=120){
  for(let x=0;x<W;x+=120){
   if(rand()<.19)tree(x+rand()*55,y+rand()*45,.65+rand()*.35);
   if(rand()<.22)flower(x+rand()*60,y+rand()*55,.6+rand()*.5);
  }
 }

 const districts=[
  {x:60,y:390,w:370,h:160,type:'house'},
  {x:560,y:390,w:650,h:160,type:'apt'},
  {x:1320,y:390,w:630,h:160,type:'house'},
  {x:2070,y:390,w:660,h:160,type:'apt'},

  {x:60,y:990,w:380,h:160,type:'shop'},
  {x:560,y:990,w:640,h:160,type:'shop'},
  {x:1320,y:990,w:640,h:160,type:'market'},
  {x:2070,y:990,w:650,h:160,type:'shop'},

  {x:60,y:1590,w:380,h:160,type:'house'},
  {x:560,y:1590,w:640,h:160,type:'apt'},
  {x:1320,y:1590,w:640,h:160,type:'shop'},
  {x:2070,y:1590,w:650,h:160,type:'house'},

  {x:60,y:2190,w:380,h:150,type:'shop'},
  {x:560,y:2190,w:640,h:150,type:'shop'},
  {x:1320,y:2190,w:640,h:150,type:'apt'},
  {x:2070,y:2190,w:650,h:150,type:'shop'}
 ];

 const palettes=['#fefae0','#faedcd','#e9edc9','#ccd5ae','#e2ece9','#ffccd5','#e2cfea'];
 const roofs=['#e76f51','#d90429','#f77f00','#d62828','#9b2226','#ae2012'];

 for(const d of districts){
  const count=Math.floor(d.w/190);
  for(let i=0;i<count;i++){
   const x=d.x+i*(d.w/count)+8;
   const w=d.type==='apt'?100:135;
   const h=d.type==='apt'?150:100;
   const type=d.type==='apt'?'apt':
    d.type==='market'?'market':
    d.type==='shop'?(i%3===0?'cafe':'shop'):'house';
   const names={
    house:['NHÀ DÂN','GIA ĐÌNH','NHÀ NHỎ'],
    apt:['CHUNG CƯ','CĂN HỘ'],
    shop:['TẠP HÓA','CỬA HÀNG','THỜI TRANG'],
    market:['CHỢ','THỰC PHẨM'],
    cafe:['CÀ PHÊ','TIỆM BÁNH']
   };
   const list=names[type]||names.house;
   building(x,d.y,w,h,type,list[i%list.length],
    palettes[Math.floor(rand()*palettes.length)],
    roofs[Math.floor(rand()*roofs.length)]);
  }
 }

 parks.push({x:1050,y:65,w:950,h:300,name:'🏙️ QUẢNG TRƯỜNG TRUNG TÂM'});
}

// ĐỒ HỌA NHÂN VẬT NÂNG CẤP
const player={x:900,y:720,dir:1};
function drawPlayer(){
 const x=player.x,y=player.y;
 ellipse(x,y+14,14,6,'rgba(0,0,0,0.2)'); // Bóng nhân vật
 // Chân
 roundRect(x-10,y,8,15,3,'#1d3557');
 roundRect(x+2,y,8,15,3,'#1d3557');
 // Thân áo thời trang
 roundRect(x-13,y-21,26,25,8,'#e63946');
 // Tay
 line(x-12,y-14,x-19,y-2,'#f4a261',6);
 line(x+12,y-14,x+19,y-2,'#f4a261',6);
 // Đầu & Tóc phong cách
 ellipse(x,y-32,14,15,'#f3c68f');
 ellipse(x,y-43,15,9,'#2b2d42');
 ellipse(x-11,y-37,5,8,'#2b2d42');
 ellipse(x+10,y-37,5,7,'#2b2d42');
 ellipse(x-5,y-32,2,2.5,'#1d3557');
 ellipse(x+5,y-32,2,2.5,'#1d3557');
 line(x-3,y-26,x+3,y-26,'#d00000',2);
}

// VẼ BẢN ĐỒ & MINI-MAP
function render(){
 ctx.setTransform(dpr,0,0,dpr,0,0);
 rect(0,0,cw,ch,'#b5e28c');

 const zoom=Math.min(cw/850,ch/570);
 const vw=cw/zoom,vh=ch/zoom;
 const camX=Math.max(0,Math.min(W-vw,player.x-vw/2));
 const camY=Math.max(0,Math.min(H-vh,player.y-vh/2));

 ctx.setTransform(dpr*zoom,0,0,dpr*zoom,
  -camX*dpr*zoom,-camY*dpr*zoom);

 drawWorld();

 for(const b of buildings)drawBuilding(b);

 drawFountain(2500,210);
 drawFountain(320,1430);

 for(const t of trees)drawTree(t);
 for(const f of flowers)drawFlowers(f);

 for(let x=80;x<W;x+=230){
  for(const y of roadsY){
   drawLamp(x,y-110);
   drawLamp(x+90,y+80);
  }
 }
 drawBench(700,510);
 drawBench(1450,1110);
 drawBench(700,1710);

 drawPlayer();

 // Bản đồ nhỏ (Mini-map)
 ctx.setTransform(dpr,0,0,dpr,0,0);
 const mw=Math.min(115,cw*.27),mh=mw*H/W;
 const mx=cw-mw-10,my=ch-mh-12;
 roundRect(mx-4,my-4,mw+8,mh+8,8,'#fefae0');
 rect(mx,my,mw,mh,'#b5e28c');

 ctx.fillStyle='#495057';
 ctx.fillRect(mx,my+mh*450/H,mw,mh*144/H);
 ctx.fillRect(mx,my+mh*1050/H,mw,mh*144/H);
 ctx.fillRect(mx+mw*500/W,my,mw*124/W,mh);
 ctx.fillRect(mx+mw*1250/W,my,mw*124/W,mh);
 ctx.fillStyle='#70e000';
 for(const p of parks){
  ctx.fillRect(mx+mw*p.x/W,my+mh*p.y/H,mw*p.w/W,mh*p.h/H);
 }
 ctx.fillStyle='#e76f51';
 for(const b of buildings){
  ctx.fillRect(mx+mw*b.x/W,my+mh*b.y/H,
   Math.max(1,mw*b.w/W),Math.max(1,mh*b.h/H));
 }
 ellipse(mx+mw*player.x/W,my+mh*player.y/H,4,4,'#ff0054');

 requestAnimationFrame(render);
}

// ĐIỀU KHIỂN
function update(){
 let dx=0,dy=0;
 if(keys.left)dx--;
 if(keys.right)dx++;
 if(keys.up)dy--;
 if(keys.down)dy++;
 if(dx&&dy){dx*=.707;dy*=.707}
 const nx=Math.max(12,Math.min(W-12,player.x+dx*3));
 const ny=Math.max(12,Math.min(H-12,player.y+dy*3));

 let blocked=false;
 for(const b of buildings){
  if(nx>b.x-14&&nx<b.x+b.w+14&&
     ny>b.y-12&&ny<b.y+b.h+5){
   blocked=true;break;
  }
 }
 if(!blocked){player.x=nx;player.y=ny}
 requestAnimationFrame(update);
}

addEventListener('keydown',e=>{
 const m={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',
 ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};
 if(m[e.key]){keys[m[e.key]]=true;e.preventDefault()}
 if(e.key===' '||e.key==='Enter')interact();
});
addEventListener('keyup',e=>{
 const m={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',
 ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};
 if(m[e.key])keys[m[e.key]]=false;
});
addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));

document.querySelectorAll('[data-k]').forEach(btn=>{
 const k=btn.dataset.k;
 btn.addEventListener('pointerdown',e=>{
  e.preventDefault();keys[k]=true;
  btn.setPointerCapture(e.pointerId);
 });
 const stop=e=>{e.preventDefault();keys[k]=false};
 btn.addEventListener('pointerup',stop);
 btn.addEventListener('pointercancel',stop);
 btn.addEventListener('lostpointercapture',stop);
});

let timer;
function message(s){
 const el=document.getElementById('msg');
 el.textContent=s;el.style.display='block';
 clearTimeout(timer);
 timer=setTimeout(()=>el.style.display='none',2400);
}
function interact(){
 let nearest=null,dist=Infinity;
 for(const s of shops){
  const d=Math.hypot(player.x-s.x,player.y-s.y);
  if(d<dist){dist=d;nearest=s}
 }
 if(nearest&&dist<115){
  message('🏪 '+nearest.name+' — Bạn đang ở gần địa điểm này!');
 }else{
  message('🗺️ Hãy đi đến gần cửa hàng hoặc công viên để khám phá!');
 }
}
document.getElementById('act').addEventListener('click',interact);

generate();
requestAnimationFrame(update);
requestAnimationFrame(render);
</script>
</body>
</html>
