<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Buôn Gì Bán 3D - Online Multiplayer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #111; }
    #canvas-container { width: 100%; height: 100%; display: block; }

    /* UI Overlay */
    #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    .interactive { pointer-events: auto; }

    /* Màn hình đăng nhập */
    #login-screen {
      position: absolute; inset: 0; background: linear-gradient(135deg, #1e3c72, #2a5298);
      display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 1000;
    }
    #login-screen h1 { font-size: 2.2rem; margin-bottom: 20px; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    .form-group { margin-bottom: 15px; display: flex; flex-direction: column; width: 280px; }
    .form-group label { margin-bottom: 5px; font-weight: bold; }
    .form-group input, .form-group select { padding: 10px; border-radius: 8px; border: none; font-size: 1rem; outline: none; }
    .btn-start { padding: 12px 30px; background: #28a745; color: white; border: none; border-radius: 25px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-start:hover { background: #218838; transform: scale(1.05); }

    /* HUD Top Left */
    .hud-top-left { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.7); color: #fff; padding: 12px 16px; border-radius: 12px; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.1); }
    .hud-stat { margin-bottom: 4px; font-size: 0.9rem; font-weight: 600; display: flex; gap: 8px; }

    /* HUD Top Right */
    .hud-top-right { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.7); color: #fff; padding: 12px 16px; border-radius: 12px; text-align: right; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.1); }

    /* Menu Thanh Công Cụ Dưới */
    .menu-bar { position: absolute; bottom: 20px; right: 20px; display: flex; gap: 8px; flex-wrap: wrap; max-width: 320px; justify-content: flex-end; }
    .btn-icon { background: rgba(255,255,255,0.95); border: none; padding: 10px 14px; border-radius: 10px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.2s; }
    .btn-icon:active { transform: scale(0.95); }

    /* Mobile Joystick Controls */
    #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; background: rgba(255,255,255,0.2); border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); touch-action: none; }
    #joystick-knob { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(255,255,255,0.85); border-radius: 50%; pointer-events: none; }

    /* Chat Box */
    #chat-container { position: absolute; bottom: 20px; left: 160px; width: 280px; height: 150px; background: rgba(0,0,0,0.6); border-radius: 8px; display: flex; flex-direction: column; padding: 8px; border: 1px solid rgba(255,255,255,0.15); }
    #chat-messages { flex: 1; overflow-y: auto; color: white; font-size: 0.85rem; margin-bottom: 5px; }
    #chat-input { background: rgba(255,255,255,0.9); border: none; padding: 6px 10px; border-radius: 4px; outline: none; }

    /* Modals Giao Diện Hàng Hóa & BĐS */
    .modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; border-radius: 12px; width: 90%; max-width: 450px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: none; z-index: 100; color: #333; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #ddd; padding-bottom: 8px; }
    .modal-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #666; }
    .modal-body { max-height: 300px; overflow-y: auto; }
    .item-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; }
    .btn-sm { padding: 6px 12px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
  </style>
  <!-- Nạp Thư viện Three.js ổn định -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="ui-layer">
    <!-- Màn Hình Đăng Nhập -->
    <div id="login-screen" class="interactive">
      <h1>BUÔN GÌ BÁN 3D</h1>
      <div class="form-group">
        <label>Tên nhân vật:</label>
        <input type="text" id="player-name-input" value="Đại Gia" maxlength="12">
      </div>
      <div class="form-group">
        <label>Giới tính:</label>
        <select id="player-gender-select">
          <option value="Nam">Nam</option>
          <option value="Nữ">Nữ</option>
        </select>
      </div>
      <button class="btn-start" onclick="startGame()">VÀO GAME</button>
    </div>

    <!-- HUD Thông Tin -->
    <div class="hud-top-left">
      <div class="hud-stat">💰 Tiền: <span id="hud-money" style="color: #4caf50;">$1,000</span></div>
      <div class="hud-stat">⚡ Năng lượng: <span id="hud-energy">100</span>/100</div>
      <div class="hud-stat">🍗 Độ đói: <span id="hud-hunger">100</span>/100</div>
      <div class="hud-stat">💼 Nghề: <span id="hud-job">Tự do</span></div>
    </div>

    <div class="hud-top-right">
      <div style="font-size: 1.1rem; font-weight: bold;" id="hud-time">08:00</div>
      <div style="font-size: 0.85rem;" id="hud-day">Ngày 1</div>
      <div style="font-size: 0.85rem; color: #ffeb3b;" id="hud-weather">☀️ Nắng</div>
    </div>

    <!-- Cần Điều Khiển Mobile -->
    <div id="joystick-zone" class="interactive">
      <div id="joystick-knob"></div>
    </div>

    <!-- Khung Chat -->
    <div id="chat-container" class="interactive">
      <div id="chat-messages"></div>
      <input type="text" id="chat-input" placeholder="Nhấn Enter để nhắn tin..." onkeydown="handleChat(event)">
    </div>

    <!-- Menu Tính Năng -->
    <div class="menu-bar">
      <button class="btn-icon interactive" onclick="openModal('inventory-modal')">🎒 Túi Đồ</button>
      <button class="btn-icon interactive" onclick="openModal('market-modal')">🛒 Chợ Hàng</button>
      <button class="btn-icon interactive" onclick="openModal('business-modal')">🏪 Cơ Sở</button>
      <button class="btn-icon interactive" onclick="toggleBike()">🛵 Xe Máy</button>
    </div>

    <!-- Cửa Sổ Modals Popup -->
    <div id="inventory-modal" class="modal interactive">
      <div class="modal-header"><h3>🎒 Túi Đồ Của Bạn</h3><button class="modal-close" onclick="closeModal('inventory-modal')">&times;</button></div>
      <div class="modal-body" id="inventory-list"></div>
    </div>

    <div id="market-modal" class="modal interactive">
      <div class="modal-header"><h3>🛒 Chợ Hàng Hóa Realtime</h3><button class="modal-close" onclick="closeModal('market-modal')">&times;</button></div>
      <div class="modal-body" id="market-list"></div>
    </div>

    <div id="business-modal" class="modal interactive">
      <div class="modal-header"><h3>🏪 Danh Sách Bất Động Sản</h3><button class="modal-close" onclick="closeModal('business-modal')">&times;</button></div>
      <div class="modal-body" id="business-list"></div>
    </div>
  </div>

  <script>
    // --- BIẾN TOÀN CỤC THIẾT LẬP KẾT NỐI & GAME ---
    let ws, myId, myName = "Đại Gia";
    let localState = { x: 0, y: 0.5, z: 0, rotY: 0, onBike: false };
    let globalGameState = { players: {}, npcs: [], world: {}, market: {} };
    let playerMeshes = {};

    // 3D Scene Variables
    let scene, camera, renderer, dirLight, hemiLight, rainParticles;

    // Direct Input Variables
    const keys = { w: false, a: false, s: false, d: false };
    let joystickVector = { x: 0, y: 0 };

    // --- KHỞI TẠO KHÔNG GIAN 3D THREE.JS ---
    function init3D() {
      const container = document.getElementById('canvas-container');
      
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb);
      scene.fog = new THREE.FogExp2(0x87ceeb, 0.012);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // System Ánh Sáng
      hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
      scene.add(hemiLight);

      dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(50, 100, 50);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      scene.add(dirLight);

      // Tạo Bản Đồ Thành Phố 3D
      buildCityMap();

      // Hệ thống mưa
      createRainEffect();

      window.addEventListener('resize', onWindowResize);
      setupInputListeners();
    }

    // --- TẠO THÀNH PHỐ THỰC TẾ ---
    function buildCityMap() {
      // Mặt Đất
      const groundGeo = new THREE.PlaneGeometry(200, 200);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      // Mặt Đường Giao Thông
      const roadMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
      const road1 = new THREE.Mesh(new THREE.PlaneGeometry(20, 200), roadMat);
      road1.rotation.x = -Math.PI / 2;
      road1.position.y = 0.01;
      road1.receiveShadow = true;
      scene.add(road1);

      const road2 = new THREE.Mesh(new THREE.PlaneGeometry(200, 20), roadMat);
      road2.rotation.x = -Math.PI / 2;
      road2.position.y = 0.01;
      road2.receiveShadow = true;
      scene.add(road2);

      // Các Khu Nhà/Cơ Sở Kinh Doanh
      const buildings = [
        { x: -35, z: -35, color: 0xe74c3c, label: 'Cà Phê' },
        { x: 35, z: -35, color: 0x3498db, label: 'Siêu Thị' },
        { x: -35, z: 35, color: 0x9b59b6, label: 'Khách Sạn' },
        { x: 35, z: 35, color: 0xf1c40f, label: 'Trà Sữa' }
      ];

      buildings.forEach(b => {
        const geo = new THREE.BoxGeometry(22, 16, 22);
        const mat = new THREE.MeshStandardMaterial({ color: b.color });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(b.x, 8, b.z);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
      });

      // Tạo Cây Xanh
      for (let i = 0; i < 35; i++) {
        const rx = (Math.random() - 0.5) * 160;
        const rz = (Math.random() - 0.5) * 160;
        if (Math.abs(rx) > 15 && Math.abs(rz) > 15) {
          const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 3), new THREE.MeshStandardMaterial({ color: 0x5c4033 }));
          trunk.position.set(rx, 1.5, rz);
          trunk.castShadow = true;
          scene.add(trunk);

          const leaves = new THREE.Mesh(new THREE.ConeGeometry(2.2, 5, 8), new THREE.MeshStandardMaterial({ color: 0x1b5e20 }));
          leaves.position.set(rx, 4, rz);
          leaves.castShadow = true;
          scene.add(leaves);
        }
      }
    }

    function createRainEffect() {
      const rainGeo = new THREE.BufferGeometry();
      const rainCount = 1200;
      const pos = new Float32Array(rainCount * 3);
      for (let i = 0; i < rainCount * 3; i += 3) {
        pos[i] = (Math.random() - 0.5) * 200;
        pos[i + 1] = Math.random() * 60;
        pos[i + 2] = (Math.random() - 0.5) * 200;
      }
      rainGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const rainMat = new THREE.PointsMaterial({ color: 0xaaaaaa, size: 0.25, transparent: true });
      rainParticles = new THREE.Points(rainGeo, rainMat);
      rainParticles.visible = false;
      scene.add(rainParticles);
    }

    // --- MÔ HÌNH NHÂN VẬT & XE MÁY 3D ---
    function createPlayerMesh() {
      const group = new THREE.Group();
      
      // Thân Nhân Vật
      const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.4, 0.9), new THREE.MeshStandardMaterial({ color: 0x0288d1 }));
      body.position.y = 0.85;
      body.castShadow = true;
      group.add(body);

      // Đầu
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.3), new THREE.MeshStandardMaterial({ color: 0xffcc80 }));
      head.position.y = 1.6;
      group.add(head);

      // Mô Hình Xe Máy
      const bikeGroup = new THREE.Group();
      bikeGroup.name = "bike";
      const bikeBody = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.5, 1.6), new THREE.MeshStandardMaterial({ color: 0xd32f2f }));
      bikeBody.position.y = 0.4;
      bikeGroup.add(bikeBody);
      bikeGroup.visible = false;
      group.add(bikeGroup);

      return group;
    }

    // --- KẾT NỐI WEBSOCKET ĐỒNG BỘ REALTIME ---
    function connectServer() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}`);

      ws.onopen = () => {
        ws.send(JSON.stringify({
          type: 'JOIN',
          id: 'player_' + Math.floor(Math.random() * 100000),
          name: myName,
          gender: document.getElementById('player-gender-select').value
        }));
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.type === 'INIT_RESPONSE') {
          myId = data.id;
        }

        if (data.type === 'STATE_UPDATE') {
          globalGameState = data.state;
          updateWorldVisuals();
          syncPlayerEntities();
        }

        if (data.type === 'CHAT') {
          const chatMsg = document.getElementById('chat-messages');
          chatMsg.innerHTML += `<div><b>${data.sender}:</b> ${data.msg}</div>`;
          chatMsg.scrollTop = chatMsg.scrollHeight;
        }
      };

      ws.onclose = () => {
        setTimeout(connectServer, 2000); // Tự động kết nối lại
      };
    }

    function updateWorldVisuals() {
      const w = globalGameState.world;
      if (!w) return;

      // Đồng bộ Giờ & Thời tiết
      const hrs = Math.floor(w.time).toString().padStart(2, '0');
      const mins = Math.floor((w.time % 1) * 60).toString().padStart(2, '0');
      document.getElementById('hud-time').innerText = `${hrs}:${mins}`;
      document.getElementById('hud-day').innerText = `Ngày ${w.day}`;
      document.getElementById('hud-weather').innerText = w.weather;

      // Đổi Màu Trời Ngày/Đêm
      const sunAngle = (w.time / 24) * Math.PI * 2 - Math.PI / 2;
      dirLight.position.x = Math.cos(sunAngle) * 100;
      dirLight.position.y = Math.sin(sunAngle) * 100;

      if (w.time > 6 && w.time < 18) {
        scene.background.setHex(0x87ceeb);
        scene.fog.color.setHex(0x87ceeb);
        dirLight.intensity = 0.9;
      } else {
        scene.background.setHex(0x0c1021);
        scene.fog.color.setHex(0x0c1021);
        dirLight.intensity = 0.15;
      }

      // Xử lý hạt mưa
      if (w.weather.includes('Rain') || w.weather === 'Storm') {
        rainParticles.visible = true;
        const positions = rainParticles.geometry.attributes.position.array;
        for (let i = 1; i < positions.length; i += 3) {
          positions[i] -= 1.5;
          if (positions[i] < 0) positions[i] = 60;
        }
        rainParticles.geometry.attributes.position.needsUpdate = true;
      } else {
        rainParticles.visible = false;
      }

      // HUD Cá Nhân
      if (myId && globalGameState.players[myId]) {
        const p = globalGameState.players[myId];
        document.getElementById('hud-money').innerText = `$${p.money}`;
        document.getElementById('hud-energy').innerText = p.energy;
        document.getElementById('hud-hunger').innerText = p.hunger;
        document.getElementById('hud-job').innerText = p.job;
      }
    }

    function syncPlayerEntities() {
      const pids = Object.keys(globalGameState.players);
      pids.forEach(pid => {
        const pData = globalGameState.players[pid];
        if (!playerMeshes[pid]) {
          playerMeshes[pid] = createPlayerMesh();
          scene.add(playerMeshes[pid]);
        }
        
        if (pid !== myId) {
          playerMeshes[pid].position.set(pData.x, pData.y, pData.z);
          playerMeshes[pid].rotation.y = pData.rotY;
        }
        
        const bike = playerMeshes[pid].getObjectByName("bike");
        if (bike) bike.visible = pData.onBike;
      });

      // Xóa mô hình khi có người thoát
      Object.keys(playerMeshes).forEach(pid => {
        if (!globalGameState.players[pid]) {
          scene.remove(playerMeshes[pid]);
          delete playerMeshes[pid];
        }
      });
    }

    // --- BỘ ĐIỀU KHIỂN & GAMELOOP ---
    function setupInputListeners() {
      window.addEventListener('keydown', e => {
        if (e.key.toLowerCase() === 'w' || e.key === 'ArrowUp') keys.w = true;
        if (e.key.toLowerCase() === 'a' || e.key === 'ArrowLeft') keys.a = true;
        if (e.key.toLowerCase() === 's' || e.key === 'ArrowDown') keys.s = true;
        if (e.key.toLowerCase() === 'd' || e.key === 'ArrowRight') keys.d = true;
      });

      window.addEventListener('keyup', e => {
        if (e.key.toLowerCase() === 'w' || e.key === 'ArrowUp') keys.w = false;
        if (e.key.toLowerCase() === 'a' || e.key === 'ArrowLeft') keys.a = false;
        if (e.key.toLowerCase() === 's' || e.key === 'ArrowDown') keys.s = false;
        if (e.key.toLowerCase() === 'd' || e.key === 'ArrowRight') keys.d = false;
      });

      // Điều khiển Joystick Mobile
      const zone = document.getElementById('joystick-zone');
      const knob = document.getElementById('joystick-knob');
      let active = false;

      const handleMove = (e) => {
        if (!active) return;
        const touch = e.touches ? e.touches[0] : e;
        const rect = zone.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        
        let dx = touch.clientX - centerX;
        let dy = touch.clientY - centerY;
        const dist = Math.min(Math.hypot(dx, dy), 40);
        const angle = Math.atan2(dy, dx);

        knob.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;
        joystickVector.x = (Math.cos(angle) * dist) / 40;
        joystickVector.y = (Math.sin(angle) * dist) / 40;
      };

      zone.addEventListener('touchstart', () => active = true);
      window.addEventListener('touchmove', handleMove);
      window.addEventListener('touchend', () => {
        active = false;
        knob.style.transform = `translate(0px, 0px)`;
        joystickVector = { x: 0, y: 0 };
      });
    }

    function renderLoop() {
      requestAnimationFrame(renderLoop);

      let moveX = joystickVector.x;
      let moveZ = joystickVector.y;

      if (keys.a) moveX = -1;
      if (keys.d) moveX = 1;
      if (keys.w) moveZ = -1;
      if (keys.s) moveZ = 1;

      if (myId && playerMeshes[myId]) {
        const pMesh = playerMeshes[myId];
        const speed = localState.onBike ? 0.45 : 0.2;

        if (Math.abs(moveX) > 0.1 || Math.abs(moveZ) > 0.1) {
          const angle = Math.atan2(moveX, moveZ);
          pMesh.rotation.y = angle;
          pMesh.position.x += Math.sin(angle) * speed;
          pMesh.position.z += Math.cos(angle) * speed;

          pMesh.position.x = Math.max(-95, Math.min(95, pMesh.position.x));
          pMesh.position.z = Math.max(-95, Math.min(95, pMesh.position.z));

          localState.x = pMesh.position.x;
          localState.z = pMesh.position.z;
          localState.rotY = angle;

          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({
              type: 'MOVE',
              x: localState.x,
              y: localState.y,
              z: localState.z,
              rotY: localState.rotY,
              onBike: localState.onBike
            }));
          }
        }

        // Camera bám theo nhân vật
        camera.position.x = pMesh.position.x;
        camera.position.y = pMesh.position.y + 12;
        camera.position.z = pMesh.position.z + 18;
        camera.lookAt(pMesh.position.x, pMesh.position.y + 1, pMesh.position.z);
      }

      renderer.render(scene, camera);
    }

    // --- EVENT VÀ NÚT TƯƠNG TÁC GIAO DIỆN ---
    function startGame() {
      const nameInput = document.getElementById('player-name-input').value.trim();
      if (!nameInput) return alert("Vui lòng nhập tên nhân vật!");
      myName = nameInput;

      document.getElementById('login-screen').style.display = 'none';

      init3D();
      connectServer();
      renderLoop();
    }

    function toggleBike() {
      localState.onBike = !localState.onBike;
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'TOGGLE_BIKE' }));
      }
    }

    function openModal(id) {
      document.getElementById(id).style.display = 'block';
      if (id === 'inventory-modal') renderInventory();
      if (id === 'market-modal') renderMarket();
      if (id === 'business-modal') renderBusiness();
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function renderInventory() {
      const p = globalGameState.players[myId];
      const el = document.getElementById('inventory-list');
      if (!p || !p.inventory) return;
      el.innerHTML = '';
      for (let item in p.inventory) {
        el.innerHTML += `<div class="item-row"><span>${item}</span> <b>x${p.inventory[item]}</b></div>`;
      }
    }

    function renderMarket() {
      const el = document.getElementById('market-list');
      el.innerHTML = '';
      for (let item in globalGameState.market) {
        const m = globalGameState.market[item];
        el.innerHTML += `
          <div class="item-row">
            <div><b>${item}</b><br><small>Giá Mua: $${m.buy} | Giá Bán: $${m.sell}</small></div>
            <div>
              <button class="btn-sm" onclick="buyItem('${item}')">Mua</button>
              <button class="btn-sm" style="background:#dc3545;" onclick="sellItem('${item}')">Bán</button>
            </div>
          </div>`;
      }
    }

    function renderBusiness() {
      const el = document.getElementById('business-list');
      el.innerHTML = '';
      globalGameState.buildings.forEach(b => {
        el.innerHTML += `
          <div class="item-row">
            <div><b>${b.name}</b><br><small>Loại: ${b.type} - Thuê: $${b.price}</small></div>
            <button class="btn-sm" onclick="alert('Đã thuê thành công!')">Thuê Cửa Hàng</button>
          </div>`;
      });
    }

    function buyItem(item) {
      ws.send(JSON.stringify({ type: 'BUY_ITEM', item: item }));
      setTimeout(renderMarket, 100);
    }

    function sellItem(item) {
      ws.send(JSON.stringify({ type: 'SELL_ITEM', item: item }));
      setTimeout(renderMarket, 100);
    }

    function handleChat(e) {
      if (e.key === 'Enter') {
        const input = document.getElementById('chat-input');
        if (input.value.trim() !== '') {
          ws.send(JSON.stringify({ type: 'CHAT', sender: myName, msg: input.value.trim() }));
          input.value = '';
        }
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
</body>
</html>
