  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#bde7f5;
  font-family:Arial,sans-serif;
}

canvas{
  display:block;
  width:100vw;
  height:100vh;
  image-rendering:auto;
}

#ui{
  position:fixed;
  inset:0;
  pointer-events:none;
}

#top{
  position:absolute;
  left:10px;
  right:10px;
  top:10px;
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

  background:rgba(255,255,255,.91);
  border:2px solid rgba(90,70,70,.15);
  border-radius:14px;
  padding:7px 11px;

  font-weight:bold;
  font-size:13px;
}

#message{

  left:50%;
  top:72px;
  transform:translateX(-50%);
  width:min(92vw,470px);
  background:rgba(255,255,255,.96);
  border-radius:17px;
  padding:12px 16px;
  text-align:center;
  box-shadow:0 7px 25px rgba(0,0,0,.13);

}

#dialog{
  position:absolute;
  left:50%;
  bottom:120px;
  transform:translateX(-50%);

  background:white;
  border:3px solid #efc5bc;

  padding:15px;

  pointer-events:auto;

#dialogName{
  font-size:18px;
  font-weight:900;
  color:#6b4d4d;
  margin-bottom:6px;
}

#dialogText{

  color:#544848;
  margin-bottom:10px;
}

.dialogButtons{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

button{
  border:0;
  border-radius:12px;
  padding:10px 14px;
  font-weight:800;
  background:#ffd0c7;
  color:#5a4141;
  cursor:pointer;
}

button:active{
  transform:scale(.96);
}

#controls{
  position:absolute;
  left:15px;
  bottom:18px;
  width:145px;
  height:145px;
  pointer-events:auto;
}

#stickBase{
  position:absolute;
  inset:10px;
  border-radius:50%;
  background:rgba(255,255,255,.28);
  border:2px solid rgba(255,255,255,.55);
}

#stick{
  position:absolute;
  width:62px;
  height:62px;
  left:41px;
  top:41px;
  border-radius:50%;
  background:rgba(255,255,255,.75);
  box-shadow:0 5px 15px rgba(0,0,0,.15);

#action{

  border-radius:50%;

  font-size:18px;

  top:10px;
  pointer-events:auto;
  display:flex;
  gap:5px;

.small{

  canvas.height = H*dpr;

}

/* =========================================================
   MOBILE JOYSTICK
========================================================= */

const base = document.getElementById("stickBase");
const stick = document.getElementById("stick");

let joy = {
  active:false,
  x:0,
  y:0
};

function joystickMove(clientX,clientY){

  const r = base.getBoundingClientRect();

  let x = clientX-(r.left+r.width/2);
  let y = clientY-(r.top+r.height/2);

  const max = r.width*.35;
  const len = Math.hypot(x,y);

  if(len>max){
    x = x/len*max;
    y = y/len*max;
  }

  joy.x=x/max;
  joy.y=y/max;

  stick.style.transform =
    `translate(${x}px,${y}px)`;
}

function joystickEnd(){
  joy.active=false;
  joy.x=0;
  joy.y=0;
  stick.style.transform="translate(0,0)";
}

base.addEventListener("pointerdown",e=>{
  joy.active=true;
  base.setPointerCapture(e.pointerId);
  joystickMove(e.clientX,e.clientY);
});

base.addEventListener("pointermove",e=>{
  if(joy.active) joystickMove(e.clientX,e.clientY);
});

base.addEventListener("pointerup",joystickEnd);
base.addEventListener("pointercancel",joystickEnd);

function rand(a,b){
  return a+Math.random()*(b-a);
}

function pick(a){
  return a[Math.floor(Math.random()*a.length)];
}

function createNPC(roleKey,index){

  const roleData =
    npcRoles.find(x=>x[0]===roleKey) ||
    npcRoles[0];

  let zone =
    roleKey==="vegetable" ||
    roleKey==="meat" ||
    roleKey==="seafood" ||
    roleKey==="rice" ||
    roleKey==="drink"
      ? zones.market
      : roleKey==="landlord" ||
        roleKey==="realestate" ||
        roleKey==="bank" ||
        roleKey==="builder"
          ? zones.residential
          : zones.street;

  const z=pick(zone);

  return {
    id:index,

    role:roleKey,
    roleName:roleData[1],

    name:pick(firstNames)+" "+(index+1),

    gender:Math.random()<.5?"male":"female",

    x:z[0]+rand(-80,80),
    y:z[1]+rand(-60,60),

    homeX:z[0],
    homeY:z[1],

    targetX:z[0],
    targetY:z[1],

    speed:rand(.45,1.05),

    hair:pick(hairStyles),
    hairColor:pick(hairColors),
    shirt:pick(shirtColors),
    skin:pick(skinColors),

    dir:Math.random()<.5?-1:1,

    state:"walking",

    talkCooldown:0,

    umbrella:false,

    vehicle:false,

    taskTimer:rand(2,8)
  };
}

/* tạo hơn 70 NPC */
function createNPCs(){

  npcs.length=0;

  const roleList=[];

  for(let i=0;i<24;i++) roleList.push("customer");
  for(let i=0;i<6;i++) roleList.push("waiter");
  for(let i=0;i<5;i++) roleList.push("cook");
  for(let i=0;i<8;i++) roleList.push("delivery");

  roleList.push(
    "vegetable",
    "meat",
    "seafood",
    "rice",
    "drink",
    "landlord",
    "realestate",
    "builder",
    "bank"

  for(let i=0;i<5;i++) roleList.push("police");
  for(let i=0;i<8;i++) roleList.push("neighbor");

  for(let i=0;i<5;i++) roleList.push("seller");
  for(let i=0;i<5;i++) roleList.push("competitor");

  roleList.forEach((role,i)=>{
    npcs.push(createNPC(role,i));
  });

  document.getElementById("npcCount").textContent=npcs.length;

  let nearRoad=false;

      x<r.x+r.w+30 &&
      y>r.y-30 &&
      y<r.y+r.h+30
    ) nearRoad=true;
  });

  if(!nearRoad){
    trees.push({
      x,y,
      size:rand(.75,1.25)
    });
  }
}

    "Vy";

  state.player.name=name;

  state.player.gender=
    document.getElementById("gender").value;

  state.player.hair=

    document.getElementById("hairColor").value;

  state.started=true;

  document.getElementById("start")
    .classList.add("hidden");

  createNPCs();

  showMessage(
    "Chào "+state.player.name+"! 💕 Hãy đi quanh thành phố. Muốn thuê mặt bằng, phải tìm đúng chủ mặt bằng và nói chuyện trực tiếp."
  );

  loadGame();
}

/* =========================================================
   DRAW HELPERS
========================================================= */

function roundRect(ctx,x,y,w,h,r){

  ctx.beginPath();

  ctx.roundRect(x,y,w,h,r);

  ctx.fill();
}

function text(t,x,y,size=12,color="#574747",align="center"){

  ctx.font=`800 ${size}px Arial`;
  ctx.fillStyle=color;
  ctx.textAlign=align;
  ctx.textBaseline="middle";
  ctx.fillText(t,x,y);
}

/* =========================================================
   WORLD DRAW
========================================================= */

function drawWorld(){

  ctx.fillStyle=COLORS.grass;
  ctx.fillRect(0,0,W,H);

  ctx.save();

  ctx.translate(-camera.x,-camera.y);

  /* nền */
  ctx.fillStyle=COLORS.grass;
  ctx.fillRect(0,0,WORLD.width,WORLD.height);

  /* hoa/cỏ nhỏ */
  ctx.fillStyle="#8cc57e";

  for(let i=0;i<250;i++){

    const x=(i*97)%WORLD.width;
    const y=(i*53)%WORLD.height;

    ctx.fillRect(x,y,3,3);
  }

  /* đường */
  roads.forEach(drawRoad);

  /* vỉa hè */
  roads.forEach(r=>{
    ctx.fillStyle=COLORS.sidewalk;

    if(r.w>r.h){
      ctx.fillRect(r.x,r.y-12,r.w,12);
      ctx.fillRect(r.x,r.y+r.h,r.w,12);
    }else{
      ctx.fillRect(r.x-12,r.y,12,r.h);
      ctx.fillRect(r.x+r.w,r.y,12,r.h);
    }
  });

  /* cây */
  trees.forEach(drawTree);

  /* đèn */
  lamps.forEach(drawLamp);

  /* buildings */
  buildings.forEach(drawBuilding);

  /* xe */
  vehicles.forEach(drawVehicle);

  /* NPC */
  npcs.forEach(n=>drawNPC(n));

  /* player */
  drawPlayer();

  ctx.restore();
}

function drawRoad(r){

  ctx.fillStyle=COLORS.road;
  ctx.fillRect(r.x,r.y,r.w,r.h);

  ctx.strokeStyle=COLORS.roadLine;
  ctx.lineWidth=3;
  ctx.setLineDash([25,25]);

  ctx.beginPath();

  if(r.w>r.h){
    ctx.moveTo(r.x,r.y+r.h/2);
    ctx.lineTo(r.x+r.w,r.y+r.h/2);
  }else{
    ctx.moveTo(r.x+r.w/2,r.y);
    ctx.lineTo(r.x+r.w/2,r.y+r.h);
  }

  ctx.stroke();

  ctx.setLineDash([]);
}

function drawTree(t){

  ctx.fillStyle=COLORS.trunk;

  ctx.fillRect(
    t.x-6*t.size,
    t.y,
    12*t.size,
    35*t.size
  );

  ctx.fillStyle=COLORS.tree;

  ctx.beginPath();
  ctx.arc(
    t.x,
    t.y-5*t.size,
    27*t.size,
    0,
    Math.PI*2
  );
  ctx.fill();

  ctx.fillStyle="#82c982";

  ctx.beginPath();
  ctx.arc(
    t.x-13*t.size,
    t.y-12*t.size,
    15*t.size,
    0,
    Math.PI*2
  );
  ctx.fill();
}

function drawLamp(l){

  ctx.fillStyle=COLORS.lamp;
  ctx.fillRect(l.x,l.y,5,70);

  ctx.fillStyle="#343033";
  ctx.beginPath();
  ctx.arc(l.x+2,l.y,10,0,Math.PI*2);
  ctx.fill();

  const night=
    state.time<6*60 ||
    state.time>18*60;

  if(night){

    ctx.fillStyle="#ffe9a7";

    ctx.beginPath();
    ctx.arc(l.x+2,l.y,17,0,Math.PI*2);
    ctx.fill();
  }
}

/* =========================================================
   BUILDING DRAW
========================================================= */

function drawBuilding(b){

  ctx.save();

  /* shadow */
  ctx.fillStyle="rgba(70,50,50,.12)";
  ctx.fillRect(
    b.x+8,
    b.y+10,
    b.w,
    b.h
  );

  /* wall */
  ctx.fillStyle=
    b.type==="restaurant"
      ? "#fff0c9"
      : b.type==="market"
        ? "#ffe2bc"
        : b.type==="police"
          ? "#d9e5f4"
          : b.type==="bank"
            ? "#e8ddfa"
            : "#ffe0d0";

  roundRect(
    ctx,
    b.x,
    b.y,
    b.w,
    b.h,
    16
  );

  /* roof */
  ctx.fillStyle=
    b.type==="police"
      ? "#7899ba"
      : b.type==="bank"
        ? "#a68acb"
        : "#d98b7d";

  ctx.beginPath();
  ctx.moveTo(b.x-12,b.y);
  ctx.lineTo(b.x+b.w/2,b.y-42);
  ctx.lineTo(b.x+b.w+12,b.y);
  ctx.closePath();
  ctx.fill();

  /* windows */
  const cols=Math.max(2,Math.floor(b.w/90));

  for(let i=0;i<cols;i++){

    const wx=
      b.x+25+
      i*((b.w-50)/(cols-1||1));

    ctx.fillStyle=COLORS.window;

    ctx.fillRect(
      wx-18,
      b.y+65,
      36,
      42
    );

    ctx.strokeStyle="#fff";
    ctx.lineWidth=3;

    ctx.strokeRect(
      wx-18,
      b.y+65,
      36,
      42
    );
  }

  /* door */
  ctx.fillStyle="#9a665d";

  ctx.fillRect(
    b.x+b.w/2-22,
    b.y+b.h-58,
    44,
    58
  );

  /* sign */
  ctx.fillStyle="rgba(255,255,255,.92)";
  roundRect(
    ctx,
    b.x+15,
    b.y+18,
    b.w-30,
    30,
    8
  );

  text(
    b.name,
    b.x+b.w/2,
    b.y+33,
    11,
    "#5c4747"
  );

  /* restaurant sign */
  if(b.type==="restaurant"){

    ctx.fillStyle="#ff8f82";

    roundRect(
      ctx,
      b.x+b.w/2-70,
      b.y-68,
      140,
      35,
      10
    );

    text(
      state.restaurantOwned
        ? "NHÀ HÀNG CỦA TÔI"
        : "CHO THUÊ",
      b.x+b.w/2,
      b.y-51,
      11,
      "#fff"
    );
  }

  ctx.restore();
}

/* =========================================================
   VEHICLE
========================================================= */

function drawVehicle(v){

  ctx.save();

  ctx.translate(v.x,v.y);

  if(!v.horizontal){
    ctx.rotate(Math.PI/2);
  }

  ctx.fillStyle="rgba(0,0,0,.15)";
  ctx.fillRect(-22,13,44,6);

  ctx.fillStyle=v.color;

  roundRect(
    ctx,
    -25,
    -12,
    50,
    25,
    8
  );

  ctx.fillStyle="#bce8f3";
  ctx.fillRect(-12,-8,20,10);

  ctx.fillStyle="#333";

  ctx.beginPath();
  ctx.arc(-16,14,5,0,Math.PI*2);
  ctx.arc(16,14,5,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

/* =========================================================
   CHARACTER ENGINE
========================================================= */

function drawCharacter(c,x,y,scale=1,isPlayer=false){

  ctx.save();

  ctx.translate(x,y);

  ctx.scale(scale,scale);

  if(c.dir<0) ctx.scale(-1,1);

  /* shadow */
  ctx.fillStyle="rgba(50,40,40,.18)";

  ctx.beginPath();
  ctx.ellipse(0,26,22,7,0,0,Math.PI*2);
  ctx.fill();

  /* legs */
  ctx.strokeStyle="#4e4854";
  ctx.lineWidth=7;
  ctx.lineCap="round";

  ctx.beginPath();
  ctx.moveTo(-7,13);
  ctx.lineTo(-10,29);
  ctx.moveTo(7,13);
  ctx.lineTo(10,29);
  ctx.stroke();

  /* shoes */
  ctx.fillStyle="#554950";

  ctx.beginPath();
  ctx.ellipse(-12,30,9,5,0,0,Math.PI*2);
  ctx.ellipse(12,30,9,5,0,0,Math.PI*2);
  ctx.fill();

  /* body */
  ctx.fillStyle=c.shirt || "#ffb0aa";

  roundRect(
    ctx,
    -17,
    -7,
    34,
    28,
    10
  );

  /* arms */
  ctx.strokeStyle=c.skin || "#f2c3a4";
  ctx.lineWidth=6;

  ctx.beginPath();
  ctx.moveTo(-16,0);
  ctx.lineTo(-25,15);

  ctx.moveTo(16,0);
  ctx.lineTo(25,15);

  ctx.stroke();

  /* neck */
  ctx.fillStyle=c.skin || "#f2c3a4";
  ctx.fillRect(-5,-14,10,10);

  /* head */
  ctx.fillStyle=c.skin || "#f2c3a4";

  ctx.beginPath();
  ctx.arc(0,-31,22,0,Math.PI*2);
  ctx.fill();

  /* ears */
  ctx.beginPath();
  ctx.arc(-20,-31,5,0,Math.PI*2);
  ctx.arc(20,-31,5,0,Math.PI*2);
  ctx.fill();

  /* hair */
  ctx.fillStyle=c.hairColor || "#3a2925";

  drawHair(
    c.hair || "short",
    c.gender || "female"
  );

  /* eyes */
  ctx.fillStyle="#493a3a";

  ctx.beginPath();
  ctx.arc(-8,-32,2.7,0,Math.PI*2);
  ctx.arc(8,-32,2.7,0,Math.PI*2);
  ctx.fill();

  /* highlights */
  ctx.fillStyle="#fff";

  ctx.beginPath();
  ctx.arc(-7,-33,1,0,Math.PI*2);
  ctx.arc(9,-33,1,0,Math.PI*2);
  ctx.fill();

  /* nose */
  ctx.strokeStyle="#bd806f";
  ctx.lineWidth=1.5;

  ctx.beginPath();
  ctx.moveTo(0,-28);
  ctx.lineTo(2,-25);
  ctx.stroke();

  /* mouth */
  ctx.strokeStyle="#8e4f59";

  ctx.beginPath();
  ctx.arc(0,-23,4,.15,Math.PI-.15);
  ctx.stroke();

  /* player marker */
  if(isPlayer){

    ctx.fillStyle="#fff";

    ctx.beginPath();
    ctx.arc(0,-64,7,0,Math.PI*2);
    ctx.fill();

    text(
      "♥",
      0,
      -64,
      10,
      "#ff7777"
    );
  }

  ctx.restore();
}

function drawHair(style,gender){

  if(style==="long"){

    ctx.beginPath();

    ctx.arc(0,-34,25,Math.PI,Math.PI*2);
    ctx.fill();

    ctx.fillRect(-23,-35,9,35);
    ctx.fillRect(14,-35,9,35);

  }else if(style==="bob"){

    ctx.beginPath();

    ctx.arc(0,-35,25,Math.PI,Math.PI*2);
    ctx.fill();

    ctx.fillRect(-23,-35,46,17);

  }else if(style==="curly"){

    for(let i=-2;i<=2;i++){

      ctx.beginPath();
      ctx.arc(
        i*9,
        -48+Math.abs(i)*2,
        10,
        0,
        Math.PI*2
      );
      ctx.fill();
    }

  }else if(style==="ponytail"){

    ctx.beginPath();
    ctx.arc(0,-35,24,Math.PI,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(24,-38,12,0,Math.PI*2);
    ctx.fill();

  }else{

    ctx.beginPath();

    ctx.arc(
      0,
      -38,
      23,
      Math.PI,
      Math.PI*2
    );

    ctx.fill();
  }
}

/* =========================================================
   DISTANCE
========================================================= */

function distance(x1,y1,x2,y2){

  return Math.hypot(
    x2-x1,
    y2-y1
  );
}

/* =========================================================
   NPC AI
========================================================= */

function chooseNPCTarget(n){

  let target;

  if(n.role==="vegetable"){
    target=[300,500];
  }

  else if(n.role==="meat"){
    target=[440,500];
  }

  else if(n.role==="seafood"){
    target=[570,500];
  }

  else if(n.role==="rice"){
    target=[680,500];
  }

  else if(n.role==="drink"){
    target=[760,500];
  }

  else if(n.role==="landlord"){
    target=[550,390];
  }

  else if(n.role==="realestate"){
    target=[1090,390];
  }

  else if(n.role==="bank"){
    target=[1450,390];
  }

  else if(n.role==="builder"){
    target=[
      900+rand(0,1000),
      500+rand(0,900)
    ];
  }

  else if(n.role==="police"){
    target=[
      pick([400,900,1560,1920]),
      pick([350,850,1400])
    ];
  }

  else if(n.role==="customer"){
    if(
      state.restaurantOpen &&
      Math.random()<.45
    ){
      target=[
        state.restaurantX+rand(-80,80),
        state.restaurantY+rand(-40,80)
      ];
    }else{
      target=[
        rand(100,WORLD.width-100),
        pick([355,855,1405])
      ];
    }
  }

  else if(n.role==="delivery"){
    target=[
      rand(100,WORLD.width-100),
      pick([355,855,1405])
    ];
  }

  else{
    target=[
      rand(80,WORLD.width-80),
      rand(80,WORLD.height-80)
    ];
  }

  n.targetX=target[0];
  n.targetY=target[1];
}

/* =========================================================
   NPC UPDATE
========================================================= */

function updateNPC(n,dt){

  n.talkCooldown-=dt;
  n.taskTimer-=dt;

  if(n.taskTimer<=0){

    chooseNPCTarget(n);

    n.taskTimer=rand(4,12);
  }

  const dx=n.targetX-n.x;
  const dy=n.targetY-n.y;

  const len=Math.hypot(dx,dy);

  if(len>8){

    n.x += dx/len*n.speed;
    n.y += dy/len*n.speed;

    if(dx!==0){
      n.dir=dx>0?1:-1;
    }
  }

  /* giới hạn thành phố */
  n.x=Math.max(25,Math.min(WORLD.width-25,n.x));
  n.y=Math.max(25,Math.min(WORLD.height-25,n.y));

  /* mưa */
  n.umbrella=
    state.weather==="rain" ||
    state.weather==="storm";
}

/* =========================================================
   VEHICLE UPDATE
========================================================= */

function updateVehicles(){

  vehicles.forEach(v=>{

    if(v.horizontal){

      v.x+=v.speed*v.dir;

      if(v.x>WORLD.width+80)
        v.x=-80;

      if(v.x<-80)
        v.x=WORLD.width+80;

    }else{

      v.y+=v.speed*v.dir;

      if(v.y>WORLD.height+80)
        v.y=-80;

      if(v.y<-80)
        v.y=WORLD.height+80;
    }
  });
}

/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updatePlayer(){

  let dx=0;
  let dy=0;

  if(keys["w"]||keys["arrowup"]) dy-=1;
  if(keys["s"]||keys["arrowdown"]) dy+=1;
  if(keys["a"]||keys["arrowleft"]) dx-=1;
  if(keys["d"]||keys["arrowright"]) dx+=1;

  if(joy.active){

    dx+=joy.x;
    dy+=joy.y;
  }

  const len=Math.hypot(dx,dy);

  if(len>0){

    dx/=len;
    dy/=len;

    state.player.x+=dx*state.player.speed;
    state.player.y+=dy*state.player.speed;

    if(dx!==0)
      state.player.dir=dx>0?1:-1;
  }

  state.player.x=
    Math.max(
      25,
      Math.min(
        WORLD.width-25,
        state.player.x
      )
    );

  state.player.y=
    Math.max(
      25,
      Math.min(
        WORLD.height-25,
        state.player.y
      )
    );
}

/* =========================================================
   DAY / NIGHT
========================================================= */

let lastTime=performance.now();

function updateClock(dt){

  /*
    1 real second = 1 game minute
  */

  state.time+=dt/1000;

  if(state.time>=24*60){

    state.time-=24*60;

    state.day++;

    dailyReport();
  }

  document.getElementById("day").textContent=
    state.day;

  const h=Math.floor(state.time/60);
  const m=Math.floor(state.time%60);

  document.getElementById("clock").textContent=
    String(h).padStart(2,"0")+
    ":"+
    String(m).padStart(2,"0");
}

   WEATHER

let weatherTimer=60;

function updateWeather(dt){

  weatherTimer-=dt/1000;

  if(weatherTimer<=0){

/* =========================================================
   WEATHER DRAW
========================================================= */

function drawWeather(){

  const night=
    state.time<6*60 ||
    state.time>18*60;

  if(night){

    ctx.fillStyle="rgba(40,50,90,.42)";
    ctx.fillRect(0,0,W,H);

  }else if(
    state.weather==="cloudy" ||
    state.weather==="rain"
  ){

    ctx.fillStyle="rgba(150,170,180,.13)";
    ctx.fillRect(0,0,W,H);
  }

  if(
    state.weather==="rain" ||
    state.weather==="storm"
  ){

    ctx.strokeStyle="rgba(160,210,255,.6)";
    ctx.lineWidth=1;

    for(const d of rainDrops){

      const x=d.x*W;
      const y=d.y*H;

      ctx.beginPath();
      ctx.moveTo(x,y);
      ctx.lineTo(x-4,y+14);
      ctx.stroke();

      d.y+=d.speed*.012;

      if(d.y>1) d.y=0;
    }
  }
}

/* =========================================================
   INTERACTION
========================================================= */

function nearestNPC(){

  let best=null;
  let bestDist=999;

  for(const n of npcs){

    const d=distance(
      state.player.x,
      state.player.y,
      n.x,
      n.y
    );

    if(d<bestDist){

      best=n;
      bestDist=d;
    }
  }

  return best;
}

function nearestBuilding(){

  let best=null;
  let bestDist=999;

  for(const b of buildings){

    const cx=b.x+b.w/2;
    const cy=b.y+b.h/2;

    const d=distance(
      state.player.x,
      state.player.y,
      cx,
      cy
    );

    if(d<bestDist){

      best=b;
      bestDist=d;
    }
  }

  return best;
}

function interact(){

  if(!state.started) return;

  const n=nearestNPC();

  if(n && distance(
    state.player.x,
    state.player.y,
    n.x,
    n.y
  )<105){

    talkNPC(n);
    return;
  }

  const b=nearestBuilding();

  if(b && distance(
    state.player.x,
    state.player.y,
    b.x+b.w/2,
    b.y+b.h/2
  )<190){

    interactBuilding(b);
  }
}

    openDialog(
      "🍚 "+title,
      "Gạo và mì mới nhập. 5 phần giá 50.000đ.",
      [
        {
          text:"Mua",
          fn:()=>buyIngredient("gao",5,50000)
        },
        {
          text:"Không",
          fn:closeDialog
        }
      ]
    );

    return;
  }

  if(n.role==="bank"){

    openDialog(
      "🏦 "+title,
      "Tôi có thể hỗ trợ khoản vay kinh doanh cho bạn.",
      [
        {
          text:"Vay 500.000đ",
          fn:()=>takeLoan(500000)
        },
        {
          text:"Để sau",
          fn:closeDialog
        }
      ]
    );

    return;
  }

  if(n.role==="realestate"){

    openDialog(
      "🏢 "+title,
      "Bên tôi đang có nhiều mặt bằng và nhà cho thuê. Khi quán phát triển, bạn có thể mở rộng thêm.",
      [
        {
          text:"Xem thông tin",
          fn:()=>showMessage("🏢 Hiện có mặt bằng nhỏ, vừa và lớn trong thành phố.")
        },
        {
          text:"Đóng",
          fn:closeDialog
        }
      ]
    );

    return;
  }

  if(n.role==="builder"){

    openDialog(
      "🧱 "+title,
      "Nếu sau này bạn muốn sửa quán, thêm phòng hoặc mở rộng nhà hàng, cứ gọi đội xây dựng.",
      [
        {
          text:"Được",
          fn:closeDialog
        }
      ]
    );

    return;
  }

  if(n.role==="police"){

    openDialog(
      "👮 "+title,
      "Xin chào! Nhớ đi đúng phần đường và cẩn thận khi trời mưa nhé.",
      [
        {
          text:"Rõ!",
          fn:closeDialog
        }
      ]
    );

    return;
  }

  if(n.role==="delivery"){

    message=
      "Tôi đang chạy đơn. Hôm nay đường khá đông!";

  }else if(n.role==="customer"){

    message=
      state.restaurantOpen
        ? "Nghe nói quán bạn đang mở, lát nữa tôi ghé ăn thử!"
        : "Khi nào quán mở thì nhớ gọi tôi nhé!";

  }else if(n.role==="waiter"){

    message=
      "Tôi đang tìm việc phục vụ. Nếu quán mở, bạn có thể thuê tôi.";

  }else if(n.role==="cook"){

    message=
      "Tôi biết nấu nhiều món. Khi nhà hàng phát triển thì thuê tôi nhé.";

  }else if(n.role==="competitor"){

    message=
      "Tôi cũng đang kinh doanh nhà hàng ở khu phố này.";

  }else{

    message=
      "Chào bạn! Thành phố hôm nay đông vui ghê.";

  }

  openDialog(
    title,
    message,
    [
      {
        text:"Đóng",
        fn:closeDialog
      }
    ]
  );
}

/* =========================================================
   BUILDING INTERACTION
========================================================= */

function interactBuilding(b){

  if(b.type==="restaurant"){

    if(!state.restaurantOwned){

      showMessage(
        "🏠 Muốn thuê mặt bằng phải tìm chủ mặt bằng đứng gần khu này và nói chuyện trực tiếp."
      );

    }else{

      restaurantMenu();
    }

    return;
  }

  if(b.type==="market"){

    showMessage(
      "🛒 Hãy tìm từng chủ sạp trong chợ để mua nguyên liệu."
    );

    return;
  }

  if(b.type==="bank"){

    showMessage(
      "🏦 Hãy tìm nhân viên cho vay để làm thủ tục."
    );

    return;
  }

  if(b.type==="realestate"){

    showMessage(
      "🏢 Hãy gặp nhân viên bất động sản."
    );

    return;
  }
}

/* =========================================================
   RENT
========================================================= */

function rentRestaurant(){

  if(state.money<350000){

    showMessage(
      "❌ Không đủ 350.000đ để thuê mặt bằng."
    );

    closeDialog();
    return;
  }

  state.money-=350000;

  state.restaurantOwned=true;
  state.rented=true;

  showMessage(
    "🎉 Đã thuê được mặt bằng! Bây giờ hãy mua nguyên liệu và mở nhà hàng."
  );

  closeDialog();
}

/* =========================================================
   INGREDIENT
========================================================= */

function buyIngredient(key,amount,cost){

  if(state.money<cost){

    showMessage("❌ Không đủ tiền.");

    closeDialog();
    return;
  }

  state.money-=cost;

  state.inventory[key]+=amount;

  showMessage(
    "🛒 Đã mua nguyên liệu."
  );

  closeDialog();
}

/* =========================================================
   LOAN
========================================================= */

function takeLoan(amount){

  state.money+=amount;

  showMessage(
    "🏦 Bạn đã nhận khoản vay "+amount.toLocaleString("vi-VN")+"đ."
  );

  closeDialog();
}

/* =========================================================
   RESTAURANT
========================================================= */

function restaurantMenu(){

  if(!state.restaurantOpen){

    openDialog(
      "🍜 Nhà hàng",
      "Bạn muốn làm gì?",
      [
        {
          text:"Mở nhà hàng",
          fn:openRestaurant
        },
        {
          text:"Thuê nhân viên",
          fn:hireStaff
        },
        {
          text:"Đóng",
          fn:closeDialog
        }
      ]
    );

  }else{

    openDialog(
      "🍜 Nhà hàng đang mở",
      "Khách đang đến. Bạn có thể tự tay nấu món hoặc thuê nhân viên.",
      [
        {
          text:"Nấu món",
          fn:cookFood
        },
        {
          text:"Thuê nhân viên",
          fn:hireStaff
        },
        {
          text:"Đóng cửa",
          fn:closeRestaurant
        }
      ]
    );
  }
}

function openRestaurant(){

  if(!state.restaurantOwned){

    showMessage("❌ Bạn chưa thuê mặt bằng.");
    closeDialog();
    return;
  }

  state.restaurantOpen=true;

  showMessage(
    "🍜 Nhà hàng đã mở cửa!"
  );

  closeDialog();
}

function closeRestaurant(){

  state.restaurantOpen=false;

  showMessage(
    "🔒 Nhà hàng đã đóng cửa."
  );

  closeDialog();
}

/* =========================================================
   COOK
========================================================= */

function cookFood(){

  if(
    state.inventory.gao<=0 ||
    state.inventory.thit<=0
  ){

    showMessage(
      "❌ Thiếu nguyên liệu để nấu."
    );

    closeDialog();
    return;
  }

  state.inventory.gao--;
  state.inventory.thit--;

  state.money+=32000;

  state.rating=
    Math.min(
      5,
      state.rating+.02
    );

  showMessage(
    "🍗 Bạn vừa tự tay nấu Cơm gà và bán được 32.000đ!"
  );

  closeDialog();
}

/* =========================================================
   STAFF
========================================================= */

function hireStaff(){

  openDialog(
    "👩‍🍳 Tuyển nhân viên",
    "Chọn nhân viên bạn muốn thuê.",
    [
      {
        text:"Thuê bếp - 100.000đ",
        fn:()=>{
          if(state.money>=100000){
            state.money-=100000;
            state.staff.kitchen++;
            showMessage("👩‍🍳 Đã thuê nhân viên bếp.");
          }else showMessage("❌ Không đủ tiền.");
          closeDialog();
        }
      },
      {
        text:"Thuê phục vụ - 80.000đ",
        fn:()=>{
          if(state.money>=80000){
            state.money-=80000;
            state.staff.waiter++;
            showMessage("🧑‍💼 Đã thuê nhân viên phục vụ.");
          }else showMessage("❌ Không đủ tiền.");
          closeDialog();
        }
      },
      {
        text:"Thuê shipper - 90.000đ",
        fn:()=>{
          if(state.money>=90000){
            state.money-=90000;
            state.staff.delivery++;
            showMessage("🛵 Đã thuê shipper.");
          }else showMessage("❌ Không đủ tiền.");
          closeDialog();
        }
      },
      {
        text:"Đóng",
        fn:closeDialog
      }
    ]
  );
}

/* =========================================================
   DIALOG
========================================================= */

function openDialog(title,message,buttons=[]){

  document.getElementById("dialogName").textContent=title;
  document.getElementById("dialogText").textContent=message;

  const box=
    document.getElementById("dialogButtons");

  box.innerHTML="";

  buttons.forEach(b=>{

    const btn=document.createElement("button");

    btn.textContent=b.text;

    btn.onclick=b.fn;

    box.appendChild(btn);
  });

  document.getElementById("dialog").style.display="block";
}

function closeDialog(){

  document.getElementById("dialog").style.display="none";
}

/* =========================================================
   MESSAGE
========================================================= */

let messageTimer=null;

function showMessage(msg){

  const el=document.getElementById("message");

  el.textContent=msg;
  el.style.opacity="1";

  clearTimeout(messageTimer);

  messageTimer=setTimeout(()=>{
    el.style.opacity="0";
  },3500);
}

/* =========================================================
   SAVE
========================================================= */

function saveGame(){

  try{

    localStorage.setItem(
      "BUON_GI_BAN_SAVE",
      JSON.stringify(state)
    );

    showMessage(
      "💾 Đã lưu game trên thiết bị."
    );

  }catch(e){

    showMessage(
      "❌ Không thể lưu game."
    );
  }
}

/* =========================================================
   LOAD
========================================================= */

function loadGame(){

  try{

    const raw=
      localStorage.getItem(
        "BUON_GI_BAN_SAVE"
      );

    if(!raw) return;

    const saved=JSON.parse(raw);

    if(saved && saved.player){

      Object.assign(
        state,
        saved
      );

      Object.assign(
        state.player,
        saved.player
      );

      showMessage(
        "💾 Đã tải dữ liệu game."
      );
    }

  }catch(e){

    console.log("Load error",e);
  }
}

/* =========================================================
   HELP
========================================================= */

function showHelp(){

  openDialog(
    "📖 HƯỚNG DẪN",
    "PC: WASD hoặc phím mũi tên để di chuyển. Điện thoại: dùng joystick. Đến gần NPC rồi bấm E để nói chuyện. Muốn thuê mặt bằng phải tìm đúng chủ mặt bằng và gặp trực tiếp. Sau đó mua nguyên liệu, nấu ăn, thuê nhân viên rồi mở quán.",
    [
      {
        text:"Đã hiểu",
        fn:closeDialog
      }
    ]
  );
}

/* =========================================================
   DAILY REPORT
========================================================= */

function dailyReport(){

  if(state.restaurantOpen){

    let income=
      Math.floor(
        Math.random()*70000
      );

    income+=
      state.staff.waiter*12000+
      state.staff.kitchen*15000;

    state.money+=income;

    state.rating=
      Math.max(
        1,
        Math.min(
          5,
          state.rating+
          (Math.random()-.45)*.08
        )
      );

    showMessage(
      "📊 Báo cáo ngày "+state.day+
      ": doanh thu khoảng "+
      income.toLocaleString("vi-VN")+
      "đ."
    );
  }

  /* chủ nhật thuế */
  if(state.day%7===0){

    const tax=50000;

    state.money-=tax;

    showMessage(
      "🧾 Thuế tuần: -50.000đ"
    );
  }

  /* tiền thuê */
  if(state.day%25===0 && state.restaurantOwned){

    state.money-=350000;

    showMessage(
      "🏠 Đã thanh toán tiền thuê mặt bằng 350.000đ."
    );
  }
}

/* =========================================================
   HUD
========================================================= */

function updateHUD(){

  document.getElementById("money").textContent=
    Math.floor(state.money)
      .toLocaleString("vi-VN");

  document.getElementById("rating").textContent=
    state.rating.toFixed(1);

  document.getElementById("level").textContent=
    state.level;
}

/* =========================================================
   GAME LOOP
========================================================= */

function update(dt){

  if(!state.started) return;

  updateClock(dt);

  updateWeather(dt);

  updatePlayer();

  npcs.forEach(n=>updateNPC(n,dt));

  updateVehicles();

  updateCamera();

  updateHUD();
}

function draw(){

  if(!state.started){

    ctx.fillStyle="#bde7f5";
    ctx.fillRect(0,0,W,H);

    return;
  }

  drawWorld();

  drawWeather();
}

function loop(now){

  const dt=
    Math.min(
      50,
      now-lastTime
    );

  lastTime=now;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

/* =========================================================
   AUTO SAVE
========================================================= */

setInterval(()=>{

  if(state.started){
    saveGame();
  }

},30000);

/* =========================================================
   INITIAL WORLD
========================================================= */

createNPCs();

</script>
