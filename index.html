<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BUÔN GÌ BÁN</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#8fd8ff;
  font-family:Arial,sans-serif;
  user-select:none;
}
canvas{
  width:100%;
  height:100%;
  display:block;
}

#hud{
  position:fixed;
  top:8px;
  left:8px;
  right:8px;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  z-index:5;
}
.pill{
  background:#fffaf0eF;
  border:2px solid white;
  border-radius:14px;
  padding:6px 10px;
  font-size:13px;
  font-weight:bold;
}

#message{
  display:none;
  position:fixed;
  top:65px;
  left:50%;
  transform:translateX(-50%);
  z-index:8;
  max-width:90%;
  background:#fffaf0;
  border:3px solid white;
  border-radius:16px;
  padding:9px 15px;
  text-align:center;
  box-shadow:0 5px 15px #0002;
}

#buttons{
  position:fixed;
  right:8px;
  bottom:8px;
  z-index:8;
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  justify-content:flex-end;
  max-width:520px;
}

button{
  border:0;
  border-radius:13px;
  padding:9px 12px;
  background:#fff0ad;
  color:#4b392b;
  font-weight:bold;
  box-shadow:0 3px #cda85f;
}
button:active{
  transform:translateY(2px);
  box-shadow:0 1px #cda85f;
}

#joystick{
  display:none;
  position:fixed;
  z-index:9;
  left:15px;
  bottom:15px;
  width:120px;
  height:120px;
  border-radius:50%;
  background:#ffffff55;
  border:3px solid #ffffff99;
}
#stick{
  position:absolute;
  width:48px;
  height:48px;
  left:33px;
  top:33px;
  border-radius:50%;
  background:#fff9;
}

#start{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
  background:linear-gradient(#82d8ff,#ffe1ae);
}
.card{
  width:min(900px,96vw);
  max-height:94vh;
  overflow:auto;
  background:#fffaf0;
  border:4px solid white;
  border-radius:25px;
  padding:20px;
  box-shadow:0 20px 60px #0003;
}
.title{
  text-align:center;
  font-size:clamp(40px,8vw,70px);
  color:#8c5149;
  margin:0 0 4px;
  text-shadow:3px 3px #ffd99b;
}
.subtitle{
  text-align:center;
  margin-top:0;
  color:#705c52;
}
input,select{
  width:100%;
  padding:10px;
  border:2px solid #dfd1bd;
  border-radius:12px;
  background:white;
}
.options{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:10px;
}
.option{
  background:white;
  border:2px solid #eadfce;
  border-radius:15px;
  padding:10px;
}
.gender{
  display:flex;
  gap:8px;
}
.gender button{
  flex:1;
}
.startbtn{
  width:100%;
  margin-top:15px;
  font-size:18px;
  background:#ffc978;
}

#panel{
  position:fixed;
  inset:0;
  z-index:15;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  background:#182333aa;
}
.panelbox{
  width:min(900px,96vw);
  max-height:90vh;
  overflow:auto;
  background:#fffaf0;
  border-radius:22px;
  padding:18px;
  border:4px solid white;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:8px;
}
.product{
  background:white;
  border:2px solid #e8dcc8;
  border-radius:14px;
  padding:10px;
}
.product button{
  width:100%;
  margin-top:6px;
}
.close{
  background:#ffb0a8;
}
.good{color:#24844b}
.bad{color:#b44444}

@media(pointer:coarse){
  #joystick{display:block}
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="pill">💰 <span id="money">1.500.000</span>đ</div>
  <div class="pill">⭐ <span id="rating">5.0</span></div>
  <div class="pill">📅 Ngày <span id="day">1</span></div>
  <div class="pill">🕐 <span id="clock">08:00</span></div>
  <div class="pill">🌤️ <span id="weather">Nắng</span></div>
  <div class="pill">🏪 <span id="shop">Chưa mở</span></div>
</div>

<div id="message"></div>

<div id="buttons">
  <button onclick="interact()">E • Tương tác</button>
  <button onclick="openRestaurant()">🏪 Mở/Đóng</button>
  <button onclick="showMenu()">🍜 Menu</button>
  <button onclick="showInventory()">📦 Kho</button>
  <button onclick="showManage()">👥 Nhân viên</button>
  <button onclick="showWardrobe()">👕 Tủ đồ</button>
  <button onclick="saveGame()">💾 Lưu</button>
</div>

<div id="joystick">
  <div id="stick"></div>
</div>

<div id="start">
  <div class="card">
    <h1 class="title">BUÔN GÌ BÁN</h1>
    <p class="subtitle">Từ hai bàn tay trắng xây nên nhà hàng của riêng bạn 🍜</p>

    <div class="options">

      <div class="option">
        <b>👤 Tên nhân vật</b>
        <input id="playerName" maxlength="18" placeholder="Nhập tên...">
      </div>

      <div class="option">
        <b>⚥ Giới tính</b>
        <div class="gender">
          <button onclick="chooseGender('male')" id="maleBtn">👦 Nam</button>
          <button onclick="chooseGender('female')" id="femaleBtn">👧 Nữ</button>
        </div>
      </div>

      <div class="option">
        <b>💇 Kiểu tóc</b>
        <select id="hair">
          <option value="short">Tóc ngắn</option>
          <option value="long">Tóc dài</option>
          <option value="bob">Tóc bob</option>
          <option value="spiky">Tóc dựng</option>
        </select>
      </div>

      <div class="option">
        <b>🎨 Màu tóc</b>
        <select id="hairColor">
          <option value="#38251f">Nâu đậm</option>
          <option value="#171717">Đen</option>
          <option value="#6b3f24">Nâu</option>
          <option value="#d99a45">Vàng</option>
          <option value="#a65c91">Tím</option>
        </select>
      </div>

      <div class="option">
        <b>👕 Áo</b>
        <select id="shirt">
          <option value="#ff9fb2">Hồng</option>
          <option value="#76b8ff">Xanh</option>
          <option value="#ffd66b">Vàng</option>
          <option value="#8bd49a">Xanh lá</option>
          <option value="#c39bff">Tím</option>
          <option value="#ffffff">Trắng</option>
        </select>
      </div>

    </div>

    <button class="startbtn" onclick="startGame()">BẮT ĐẦU KINH DOANH</button>
  </div>
</div>

<div id="panel">
  <div class="panelbox" id="panelContent"></div>
</div>

<script>
"use strict";

/* =========================
   CANVAS
========================= */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){
  W=canvas.width=innerWidth*devicePixelRatio;
  H=canvas.height=innerHeight*devicePixelRatio;
  canvas.style.width=innerWidth+"px";
  canvas.style.height=innerHeight+"px";
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  W=innerWidth;
  H=innerHeight;
}
addEventListener("resize",resize);
resize();

/* =========================
   GAME STATE
========================= */

const state={
  started:false,
  name:"Bạn",
  gender:"female",
  hair:"long",
  hairColor:"#38251f",
  shirt:"#ff9fb2",

  money:1500000,
  rating:5,
  day:1,
  minutes:480,

  weather:"Nắng",
  restaurantOpen:false,
  rented:false,

  level:1,
  inventory:{
    "Rau":20,
    "Thịt":10,
    "Hải sản":5,
    "Gạo":20,
    "Mì":20,
    "Nước":20
  },

  equipment:[],
  employees:[],
  menu:[],
  salesToday:0,
  costsToday:0,

  tax:0,
  rentDue:25,

  tutorialStep:0,

  player:{
    x:700,
    y:720,
    speed:3.2,
    dir:1
  }
};

/* =========================
   MENU
========================= */

const foods=[
 ["Mì trứng",18000,1,["Mì","Trứng"]],
 ["Cơm gà",32000,1,["Gạo","Thịt"]],
 ["Bánh mì thịt",22000,1,["Thịt","Rau"]],
 ["Mì bò",42000,2,["Mì","Thịt"]],
 ["Cơm sườn",45000,2,["Gạo","Thịt"]],
 ["Gà chiên",38000,3,["Thịt","Dầu"]],
 ["Khoai chiên",20000,3,["Khoai","Dầu"]],
 ["Mì cay",48000,4,["Mì","Thịt","Rau"]],
 ["Cơm bò sốt",55000,4,["Gạo","Thịt"]],
 ["Bún thịt nướng",45000,5,["Bún","Thịt","Rau"]],
 ["Cơm chiên hải sản",65000,5,["Gạo","Hải sản"]],
 ["Pizza mini",60000,6,["Bột","Thịt","Rau"]],
 ["Mì hải sản",70000,6,["Mì","Hải sản"]],
 ["Bò lúc lắc",85000,7,["Thịt","Rau"]],
 ["Gà sốt cay",62000,7,["Thịt","Ớt"]],
 ["Lẩu mini",110000,8,["Thịt","Hải sản","Rau"]],
 ["Steak sốt tiêu",150000,8,["Thịt","Rau"]],
 ["Sushi set",135000,9,["Gạo","Hải sản"]],
 ["Combo nhà hàng",180000,9,["Gạo","Thịt","Nước"]],
 ["Đại tiệc đặc biệt",250000,10,["Thịt","Hải sản","Rau","Gạo"]]
];

const drinks=[
 ["Nước suối",10000,1,["Nước"]],
 ["Nước ngọt",15000,1,["Nước"]],
 ["Trà đá",8000,1,["Nước"]],
 ["Cà phê sữa",25000,2,["Cà phê","Nước"]],
 ["Trà chanh",22000,2,["Nước","Chanh"]],
 ["Trà đào",28000,3,["Nước","Đào"]],
 ["Nước cam",30000,3,["Nước","Cam"]],
 ["Trà sữa",35000,4,["Nước","Trà"]],
 ["Matcha latte",42000,5,["Nước","Matcha"]],
 ["Cacao đá",38000,5,["Nước","Cacao"]],
 ["Sinh tố dâu",45000,6,["Nước","Dâu"]],
 ["Nước ép dứa",40000,6,["Nước","Dứa"]],
 ["Cà phê cold brew",48000,7,["Cà phê","Nước"]],
 ["Soda trái cây",50000,7,["Nước","Trái cây"]],
 ["Matcha dâu",55000,8,["Matcha","Dâu"]],
 ["Đá xay socola",60000,8,["Nước","Socola"]],
 ["Trà sữa đặc biệt",65000,9,["Nước","Trà"]],
 ["Nước ép premium",70000,9,["Nước","Trái cây"]],
 ["Mocktail hoàng gia",90000,10,["Nước","Trái cây"]]
];

state.menu=foods.slice(0,3).map(x=>x[0]);

/* =========================
   WORLD
========================= */

const world={
  width:2400,
  height:1500
};

const buildings=[
 {x:450,y:250,w:350,h:230,type:"home",name:"🏠 Nhà bạn"},
 {x:1000,y:220,w:420,h:270,type:"restaurant",name:"🍜 Mặt bằng nhà hàng"},
 {x:1650,y:220,w:300,h:230,type:"market",name:"🥬 Chợ"},
 {x:350,y:900,w:320,h:230,type:"cloth",name:"👕 Cửa hàng quần áo"},
 {x:850,y:900,w:320,h:230,type:"loan",name:"💰 Tiệm cho vay"},
 {x:1350,y:900,w:330,h:230,type:"furniture",name:"🪑 Nội thất"}
];

const stalls=[
 {x:1640,y:510,name:"🥬 Rau củ",role:"seller",item:"Rau",color:"#8bd49a"},
 {x:1850,y:510,name:"🥩 Quầy thịt",role:"seller",item:"Thịt",color:"#ff9b9b"},
 {x:2060,y:510,name:"🐟 Hải sản",role:"seller",item:"Hải sản",color:"#82cfff"},
 {x:1640,y:760,name:"🍚 Gạo & mì",role:"seller",item:"Gạo",color:"#fff0ad"},
 {x:1850,y:760,name:"🥤 Đồ uống",role:"seller",item:"Nước",color:"#c39bff"},
 {x:2060,y:760,name:"💸 Cho vay",role:"lender",item:"money",color:"#ffd66b"}
];

/* =========================
   NPC
========================= */

const npcs=[
 {x:1600,y:300,name:"Lan",role:"vegetable",hair:"#38251f",shirt:"#8bd49a",speed:0.6},
 {x:1810,y:300,name:"Hùng",role:"meat",hair:"#171717",shirt:"#ff9b9b",speed:0.55},
 {x:2020,y:300,name:"Mai",role:"seafood",hair:"#d99a45",shirt:"#82cfff",speed:0.5},
 {x:1660,y:650,name:"Tâm",role:"rice",hair:"#6b3f24",shirt:"#fff0ad",speed:0.55},
 {x:1870,y:650,name:"Vy",role:"drink",hair:"#a65c91",shirt:"#c39bff",speed:0.7},
 {x:2080,y:650,name:"Ông Bảy",role:"lender",hair:"#777",shirt:"#ffd66b",speed:0.4}
];

for(let i=0;i<8;i++){
  npcs.push({
    x:850+Math.random()*700,
    y:550+Math.random()*650,
    name:["An","Bình","Chi","Duy","Hà","Khoa","Linh","Nam"][i],
    role:"customer",
    hair:["#171717","#38251f","#6b3f24","#d99a45","#a65c91"][i%5],
    shirt:["#ff9fb2","#76b8ff","#ffd66b","#8bd49a","#c39bff"][i%5],
    speed:.4+Math.random()*.5,
    targetX:850+Math.random()*700,
    targetY:550+Math.random()*650,
    speech:"",
    speechTime:0
  });
}

/* =========================
   INPUT
========================= */

const keys={};

addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;

  if(e.key.toLowerCase()==="e") interact();

  if(e.key==="Escape") closePanel();
});

addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()]=false;
});

let joyX=0,joyY=0;
const joy=document.getElementById("joystick");
const stick=document.getElementById("stick");

let touching=false;

joy.addEventListener("pointerdown",e=>{
  touching=true;
  joy.setPointerCapture(e.pointerId);
  moveJoy(e);
});

joy.addEventListener("pointermove",e=>{
  if(touching) moveJoy(e);
});

joy.addEventListener("pointerup",()=>{
  touching=false;
  joyX=0;
  joyY=0;
  stick.style.left="33px";
  stick.style.top="33px";
});

function moveJoy(e){
  const r=joy.getBoundingClientRect();
  let x=e.clientX-(r.left+r.width/2);
  let y=e.clientY-(r.top+r.height/2);

  const max=38;
  const len=Math.hypot(x,y);

  if(len>max){
    x=x/len*max;
    y=y/len*max;
  }

  joyX=x/max;
  joyY=y/max;

  stick.style.left=(33+x)+"px";
  stick.style.top=(33+y)+"px";
}

/* =========================
   CAMERA
========================= */

let camera={x:0,y:0};

function updateCamera(){
  camera.x=state.player.x-W/2;
  camera.y=state.player.y-H/2;

  camera.x=Math.max(0,Math.min(world.width-W,camera.x));
  camera.y=Math.max(0,Math.min(world.height-H,camera.y));
}

/* =========================
   DRAWING
========================= */

function rect(x,y,w,h,c){
  ctx.fillStyle=c;
  ctx.fillRect(x-camera.x,y-camera.y,w,h);
}

function circle(x,y,r,c){
  ctx.fillStyle=c;
  ctx.beginPath();
  ctx.arc(x-camera.x,y-camera.y,r,0,Math.PI*2);
  ctx.fill();
}

function text(t,x,y,size=14,c="#3f3440"){
  ctx.fillStyle=c;
  ctx.font="bold "+size+"px Arial";
  ctx.textAlign="center";
  ctx.fillText(t,x-camera.x,y-camera.y);
}

function rounded(x,y,w,h,r,c){
  ctx.fillStyle=c;
  ctx.beginPath();
  ctx.roundRect(x-camera.x,y-camera.y,w,h,r);
  ctx.fill();
}

function drawWorld(){

  ctx.fillStyle="#8bd18c";
  ctx.fillRect(0,0,W,H);

  // nền
  for(let x=0;x<world.width;x+=80){
    for(let y=0;y<world.height;y+=80){
      const shade=(x/80+y/80)%2;
      rect(x,y,80,80,shade?"#8fd58f":"#86cf88");
    }
  }

  // đường
  rect(0,600,world.width,180,"#c8b79e");
  rect(760,0,180,world.height,"#c8b79e");
  rect(1450,0,150,world.height,"#c8b79e");

  for(let x=0;x<world.width;x+=80){
    rect(x,685,45,7,"#fff6b0");
  }

  // sông
  rect(0,1250,world.width,250,"#69c8ef");

  // cây
  for(let i=0;i<55;i++){
    const x=(i*431)%2300;
    const y=(i*271)%1100;

    if(x>700&&x<1600&&y>560&&y<800) continue;

    circle(x,y,22,"#55a76a");
    circle(x-12,y+8,17,"#66b879");
    rect(x-5,y+18,10,25,"#8b6748");
  }

  buildings.forEach(b=>{
    rounded(b.x,b.y,b.w,b.h,20,
      b.type==="restaurant"?"#ffd5b7":
      b.type==="market"?"#ffe69b":
      b.type==="loan"?"#d9c2ff":
      b.type==="cloth"?"#ffbfd0":
      b.type==="furniture"?"#d5c6a8":"#bde5ff"
    );

    text(b.name,b.x+b.w/2,b.y+38,20);

    // cửa
    rounded(b.x+b.w/2-35,b.y+b.h-75,70,75,10,"#8d6754");

    // cửa sổ
    rect(b.x+30,b.y+80,70,55,"#9ee7ff");
    rect(b.x+b.w-100,b.y+80,70,55,"#9ee7ff");

    if(b.type==="restaurant"){
      text("BUÔN GÌ BÁN",b.x+b.w/2,b.y+175,24,"#8c5149");
    }
  });

  stalls.forEach(s=>{
    rounded(s.x,s.y,180,120,15,s.color);
    text(s.name,s.x+90,s.y+27,15);
    rect(s.x+55,s.y+45,70,45,"#fffaf0");
    text("E",s.x+90,s.y+75,18);
  });

  // ghế bàn nhà hàng
  for(let i=0;i<5;i++){
    const x=1080+(i%2)*160;
    const y=540+Math.floor(i/2)*140;
    circle(x,y,27,"#8d6754");
    rounded(x-45,y-15,90,30,8,"#fff0ad");
  }
}

/* =========================
   CHIBI
========================= */

function drawCharacter(p,player=false){

  const x=p.x-camera.x;
  const y=p.y-camera.y;

  // bóng
  ctx.fillStyle="#0002";
  ctx.beginPath();
  ctx.ellipse(x,y+27,25,9,0,0,Math.PI*2);
  ctx.fill();

  // chân
  ctx.strokeStyle="#49372e";
  ctx.lineWidth=7;
  ctx.lineCap="round";

  ctx.beginPath();
  ctx.moveTo(x-9,y+10);
  ctx.lineTo(x-13,y+31);
  ctx.moveTo(x+9,y+10);
  ctx.lineTo(x+13,y+31);
  ctx.stroke();

  // giày
  circle(x-14,y+32,7,"#49372e");
  circle(x+14,y+32,7,"#49372e");

  // tay
  ctx.strokeStyle=p.shirt||"#ff9fb2";
  ctx.lineWidth=9;

  ctx.beginPath();
  ctx.moveTo(x-20,y-3);
  ctx.lineTo(x-32,y+14);
  ctx.moveTo(x+20,y-3);
  ctx.lineTo(x+32,y+14);
  ctx.stroke();

  // thân
  rounded(x-25,y-13,50,50,13,p.shirt||"#ff9fb2");

  // cổ
  circle(x,y-19,8,"#ffd0ad");

  // đầu
  circle(x,y-48,31,"#ffd0ad");

  // tai
  circle(x-29,y-48,7,"#ffd0ad");
  circle(x+29,y-48,7,"#ffd0ad");

  // tóc
  drawHair(x,y-48,p.hair||"short",p.hairColor||p.hair||"#38251f");

  // mắt
  circle(x-10,y-48,4,"#332b2b");
  circle(x+10,y-48,4,"#332b2b");

  // mũi
  circle(x,y-42,2,"#c88470");

  // miệng
  ctx.strokeStyle="#9c4d54";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(x,y-39,6,0.15,Math.PI-0.15);
  ctx.stroke();

  if(player){
    text(state.name,x,y-90,14,"#513d39");
  }else if(p.name){
    text(p.name,x,y-90,12,"#513d39");
  }
}

function drawHair(x,y,type,color){

  ctx.fillStyle=color;

  if(type==="long"){
    ctx.beginPath();
    ctx.arc(x,y,34,Math.PI,Math.PI*2);
    ctx.fill();
    ctx.fillRect(x-33,y,x-0+1,48);
    ctx.fillRect(x+20,y,13,48);
  }

  else if(type==="bob"){
    ctx.beginPath();
    ctx.arc(x,y,35,Math.PI,Math.PI*2);
    ctx.fill();
    ctx.fillRect(x-34,y-2,68,30);
  }

  else if(type==="spiky"){
    ctx.beginPath();
    ctx.moveTo(x-34,y-22);
    for(let i=0;i<8;i++){
      ctx.lineTo(x-34+i*9,y-50-(i%2)*12);
    }
    ctx.lineTo(x+34,y-22);
    ctx.arc(x,y-20,34,0,Math.PI,true);
    ctx.fill();
  }

  else{
    ctx.beginPath();
    ctx.arc(x,y,34,Math.PI,Math.PI*2);
    ctx.fill();
    ctx.fillRect(x-32,y-5,64,18);
  }
}

/* =========================
   NPC MOVEMENT
========================= */

function updateNPCs(){

  for(const n of npcs){

    if(n.role==="customer"){

      if(Math.random()<0.008){
        n.targetX=700+Math.random()*850;
        n.targetY=450+Math.random()*750;
      }

      const dx=n.targetX-n.x;
      const dy=n.targetY-n.y;
      const d=Math.hypot(dx,dy);

      if(d>5){
        n.x+=dx/d*n.speed;
        n.y+=dy/d*n.speed;
      }

      if(state.restaurantOpen &&
         n.x>1000&&n.x<1420&&
         n.y>220&&n.y<500 &&
         Math.random()<0.002){
        n.speech="Cho mình một món nhé!";
        n.speechTime=180;
      }

    }else{

      if(Math.random()<0.004){
        n.targetX=1450+Math.random()*800;
        n.targetY=250+Math.random()*650;
      }

      if(n.targetX){
        const dx=n.targetX-n.x;
        const dy=n.targetY-n.y;
        const d=Math.hypot(dx,dy);

        if(d>5){
          n.x+=dx/d*n.speed;
          n.y+=dy/d*n.speed;
        }
      }
    }

    if(n.speechTime>0)n.speechTime--;
  }
}

const weatherList=[

 "Nhiều mây",

function drawWeather(){

  if(state.weather==="Mưa"||
     state.weather==="Mưa lớn"||
     state.weather==="Bão"){

    ctx.strokeStyle="#ffffff66";
    ctx.lineWidth=2;

    const amount=state.weather==="Bão"?180:90;

    for(let i=0;i<amount;i++){
      const x=Math.random()*W;
      const y=Math.random()*H;

      ctx.beginPath();
      ctx.moveTo(x,y);
      ctx.lineTo(x-5,y+18);
      ctx.stroke();
    }
  }

  if(state.weather==="Sương mù"){
    ctx.fillStyle="#ffffff44";
    ctx.fillRect(0,0,W,H);
  }

  // đêm
  const hour=state.minutes/60;

  if(hour<6 || hour>=19){
    ctx.fillStyle="#17254d88";
    ctx.fillRect(0,0,W,H);
  }
}

/* =========================
   DAY / TIME
========================= */

let timeCounter=0;

function updateTime(){

  timeCounter++;

  if(timeCounter<60)return;

  timeCounter=0;

  state.minutes++;

  if(state.minutes>=1440){

    state.minutes=0;
    state.day++;

    endDay();
  }

  if(state.minutes%60===0){

    // tiền lương
    if(state.employees.length){
      const wage=state.employees.reduce((a,b)=>a+b.wage,0);
      state.money-=wage;
      state.costsToday+=wage;
    }

    // thuế chủ nhật
    if(state.day%7===0){
      const tax=Math.max(10000,Math.floor(state.money*.01));
      state.money-=tax;
      state.tax=tax;
    }

    // tiền thuê
    if(state.rented && state.day%25===0){
      state.money-=150000;
      say("Đã thanh toán 150.000đ tiền thuê mặt bằng.");
    }
  }

  updateHUD();
}

function endDay(){

  state.restaurantOpen=false;

  if(state.salesToday>0){
    const profit=state.salesToday-state.costsToday;
    state.money+=profit;
  }

  state.salesToday=0;
  state.costsToday=0;

  saveGame(false);
}

   PLAYER
========================= */

function updatePlayer(){

  let dx=0,dy=0;

  if(keys["w"]||keys["arrowup"])dy--;
  if(keys["s"]||keys["arrowdown"])dy++;
  if(keys["a"]||keys["arrowleft"])dx--;
  if(keys["d"]||keys["arrowright"])dx++;

  dx+=joyX;
  dy+=joyY;

  if(dx||dy){

    const len=Math.hypot(dx,dy);

    dx/=len;
    dy/=len;

    state.player.x+=dx*state.player.speed;
    state.player.y+=dy*state.player.speed;

    if(dx!==0)state.player.dir=dx>0?1:-1;
  }

  state.player.x=Math.max(30,Math.min(world.width-30,state.player.x));
  state.player.y=Math.max(30,Math.min(world.height-30,state.player.y));
}

/* =========================
   INTERACTION
========================= */

function nearest(){

  let best=null;
  let dist=Infinity;

  const objects=[
    ...buildings.map(b=>({
      x:b.x+b.w/2,
      y:b.y+b.h/2,
      obj:b
    })),
    ...stalls.map(s=>({
      x:s.x+90,
      y:s.y+60,
      obj:s
    }))
  ];

  for(const o of objects){
    const d=Math.hypot(
      state.player.x-o.x,
      state.player.y-o.y
    );

    if(d<dist){
      dist=d;
      best=o;
    }
  }

  for(const n of npcs){
    const d=Math.hypot(
      state.player.x-n.x,
      state.player.y-n.y
    );

    if(d<dist){
      dist=d;
      best={x:n.x,y:n.y,obj:n};
    }
  }

  return dist<130?best:null;
}

function interact(){

  if(!state.started)return;

  const near=nearest();

  if(!near){
    say("Đi lại gần một địa điểm hoặc NPC rồi bấm E.");
    return;
  }

  const o=near.obj;

  if(o.type==="restaurant"){
    if(!state.rented){
      rentRestaurant();
    }else{
      openRestaurant();
    }
    return;
  }

  if(o.type==="market"){
    showMarket();
    return;
  }

  if(o.type==="cloth"){
    showWardrobe();
    return;
  }

  if(o.type==="loan"){
    showLoan();
    return;
  }

  if(o.type==="furniture"){
    buyEquipment();
    return;
  }

  if(o.role==="seller"){
    buyIngredient(o.item);
    return;
  }

  if(o.role==="lender"){
    showLoan();
    return;
  }

  if(o.role==="customer"){
    say(o.name+": Mình muốn thử món của bạn!");
    return;
  }

  say(o.name+" đang bán hàng.");
}

/* =========================
   COOKING
========================= */

function cook(name){

  const item=[...foods,...drinks].find(x=>x[0]===name);

  if(!item)return;

  if(state.level<item[2]){
    say("Bạn chưa đạt cấp nhà hàng cần thiết.");
    return;
  }

  for(const ingredient of item[3]){
    if((state.inventory[ingredient]||0)<=0){
      say("Thiếu nguyên liệu: "+ingredient);
      return;
    }
  }

  for(const ingredient of item[3]){
    state.inventory[ingredient]--;
  }

  const revenue=item[1];

  state.money+=revenue;
  state.salesToday+=revenue;

  // đánh giá biến động nhẹ
  state.rating=Math.max(
    1,
    Math.min(5,state.rating+(Math.random()*.08-.02))
  );

  say(`👨‍🍳 Bạn vừa làm ${name}! +${revenue.toLocaleString("vi-VN")}đ`);

  updateHUD();
}

  updateHUD();
}

function purchaseEquipment(name,cost){

  if(state.equipment.includes(name)){
    return;
  }

  if(state.money<cost){
    say("Không đủ tiền.");
    return;
  }

  state.money-=cost;
  state.equipment.push(name);

  if(name==="Bếp gas")state.level=Math.min(10,state.level+1);
  if(name==="Bàn ghế")state.rating=Math.min(5,state.rating+.1);
  if(name==="Trang trí")state.rating=Math.min(5,state.rating+.15);

  say("Đã mua "+name+".");

  buyEquipment();
  updateHUD();
}

/* =========================
   SAVE
========================= */

function saveGame(show=true){

  const save={
    ...state,
    player:{...state.player},
    employees:[...state.employees],
    equipment:[...state.equipment],
    inventory:{...state.inventory},
    menu:[...state.menu],
    debt
  };

  localStorage.setItem(
    "BUON_GI_BAN_SAVE",
    JSON.stringify(save)
  );

  if(show)say("💾 Đã lưu game.");
}

function loadGame(){

  const raw=localStorage.getItem("BUON_GI_BAN_SAVE");

  if(!raw)return false;

  try{

    const s=JSON.parse(raw);

    Object.assign(state,s);

    debt=s.debt||0;

    return true;

  }catch(e){
    return false;
  }
}

function updateHUD(){

    state.rating.toFixed(1);

  document.getElementById("day").textContent=

  const m=state.minutes%60;

  document.getElementById("clock").textContent=
    String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");

  document.getElementById("weather").textContent=
    state.weather;

  document.getElementById("shop").textContent=
    state.restaurantOpen?"Đang mở":
    state.rented?"Đã thuê":"Chưa mở";

  checkLevel();
}

/* =========================
   START
========================= */

let gender="female";

function chooseGender(g){

  gender=g;

  document.getElementById("maleBtn").style.background=
    g==="male"?"#a9d7ff":"#fff0ad";

  document.getElementById("femaleBtn").style.background=
    g==="female"?"#ffb8cb":"#fff0ad";
}

function startGame(){

  state.name=
    document.getElementById("playerName").value.trim()||"Bạn";

  state.gender=gender;
  state.hair=document.getElementById("hair").value;
  state.hairColor=document.getElementById("hairColor").value;
  state.shirt=document.getElementById("shirt").value;

  state.player.hair=state.hair;
  state.player.hairColor=state.hairColor;
  state.player.shirt=state.shirt;

  state.started=true;

  document.getElementById("start").style.display="none";

  say(
    "👋 Chào "+state.name+
    "! Hãy đi tới mặt bằng màu cam và bấm E để thuê nhà hàng."
  );

  updateHUD();
}

function init(){

  chooseGender("female");

  if(loadGame()){

    state.started=true;

    document.getElementById("start").style.display="none";

    say("💾 Đã tải lại tiến trình.");

    updateHUD();
  }
}

/* =========================
   GAME LOOP
========================= */

function loop(){

  if(state.started){

    updatePlayer();
    updateNPCs();
    updateTime();
    updateWeather();
    updateCamera();

    ctx.clearRect(0,0,W,H);

    drawWorld();

    // NPC
    for(const n of npcs){

      drawCharacter(n);

      if(n.speechTime>0){

        const x=n.x-camera.x;
        const y=n.y-camera.y-105;

        rounded(x-80,y-25,160,42,12,"#fffaf0");

        text(n.speech,x,y,11);
      }
    }

    drawCharacter({
      ...state.player,
      hair:state.hair,
      hairColor:state.hairColor,
      shirt:state.shirt,
      name:state.name
    },true);

    drawWeather();

    if(messageTimer>0){
      messageTimer--;
      if(messageTimer<=0){
        document.getElementById("message").style.display="none";
      }
    }
  }

  requestAnimationFrame(loop);
}

/* =========================
   MOBILE TAP
========================= */

canvas.addEventListener("pointerdown",e=>{

  if(!state.started)return;

  // tap màn hình gần nhân vật = tương tác
  if(e.pointerType==="touch"){
    const near=nearest();

    if(near){
      interact();
    }
  }
});

/* =========================
   START
========================= */

init();
loop();

</script>
