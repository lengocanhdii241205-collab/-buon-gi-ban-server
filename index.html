<style>
*{

html,body{

/* DIALOG */

}

.card{

.card b{

.card button{

/* MOBILE */
#mobile{

/* tutorial */

    padding:13px;
    border-radius:15px;

    line-height:1.5;
}

<script>
"use strict";

/* =========================================================
   BASIC
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){
    W=canvas.width=innerWidth*devicePixelRatio;
    H=canvas.height=innerHeight*devicePixelRatio;
    canvas.style.width=innerWidth+"px";
    canvas.style.height=innerHeight+"px";
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    W=innerWidth;
    H=innerHeight;
}
addEventListener("resize",resize);
resize();

const WORLD_W=3600;
const WORLD_H=2700;

let gameStarted=false;
let last=performance.now();

const keys={};
let joy={x:0,y:0};

addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()]=true;

    if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(e.key.toLowerCase())){
        e.preventDefault();
    }

    if(e.key.toLowerCase()==="e"){
        interact();
    }
});

addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});

document.getElementById("action").onclick=interact;

/* =========================================================
   PLAYER
========================================================= */

const player={
    x:1800,
    y:1900,
    speed:180,
    dir:"down",
    moving:false,
    walk:0,

    name:"Vy",
    gender:"female",
    hair:"long",
    hairColor:"#39291f",
    shirt:"#ff7d9d",

    money:1500000,
    level:1,
    xp:0,

    inventory:{
        "trứng":10,
        "thịt gà":10,
        "thịt bò":5,
        "rau":15,
        "gạo":15,
        "mì":15,
        "hải sản":5,
        "nước":10
    },

    clothes:{
        current:"Áo khởi nghiệp",
        owned:["Áo khởi nghiệp"]
    },

    restaurant:null,
    loan:0
};

/* =========================================================
   CAMERA
========================================================= */

const camera={
    x:0,
    y:0
};

function updateCamera(){
    camera.x=player.x-W/2;
    camera.y=player.y-H/2;

    camera.x=Math.max(0,Math.min(WORLD_W-W,camera.x));
    camera.y=Math.max(0,Math.min(WORLD_H-H,camera.y));
}

/* =========================================================
   ROAD GRAPH
========================================================= */

const roads=[];
const nodes=[];
const adjacency=new Map();

function addNode(x,y){
    const n={
        id:nodes.length,
        x,y
    };
    nodes.push(n);
    adjacency.set(n.id,[]);
    return n;
}

function connect(a,b){
    adjacency.get(a.id).push(b.id);
    adjacency.get(b.id).push(a.id);

    roads.push({
        a,b,
        width:70
    });
}

/*
    Thành phố có lưới đường thật.
    NPC chỉ được đi trên graph này.
*/

const xs=[250,850,1450,2050,2650,3350];
const ys=[250,850,1450,2050,2450];

for(const y of ys){
    for(const x of xs){
        addNode(x,y);
    }
}

function nodeAt(ix,iy){
    return nodes[iy*xs.length+ix];
}

for(let iy=0;iy<ys.length;iy++){
    for(let ix=0;ix<xs.length;ix++){
        if(ix<xs.length-1){
            connect(nodeAt(ix,iy),nodeAt(ix+1,iy));
        }
        if(iy<ys.length-1){
            connect(nodeAt(ix,iy),nodeAt(ix,iy+1));
        }
    }
}

/* đường phụ */
function nearestNode(x,y){
    let best=null;
    let dist=Infinity;

    for(const n of nodes){
        const d=(n.x-x)**2+(n.y-y)**2;
        if(d<dist){
            dist=d;
            best=n;
        }
    }

    return best;
}

/* BFS */
function findPath(start,end){
    if(!start||!end)return [];

    const q=[start.id];
    const prev=new Map();
    const seen=new Set([start.id]);

    while(q.length){
        const id=q.shift();

        if(id===end.id)break;

        for(const next of adjacency.get(id)){
            if(!seen.has(next)){
                seen.add(next);
                prev.set(next,id);
                q.push(next);
            }
        }
    }

    if(!seen.has(end.id))return [];

    const result=[];
    let cur=end.id;

    while(cur!==undefined){
        result.unshift(nodes[cur]);
        cur=prev.get(cur);
    }

    return result;
}

/* =========================================================
   BUILDINGS
========================================================= */

const buildings=[];

function building(x,y,w,h,name,type,color="#f7d8c7"){
    buildings.push({
        x,y,w,h,
        name,type,color
    });
}

/*
    Các công trình đặt xen giữa các đường.
*/
for(let iy=0;iy<ys.length-1;iy++){
    for(let ix=0;ix<xs.length-1;ix++){

        const left=xs[ix]+90;
        const top=ys[iy]+90;
        const width=xs[ix+1]-xs[ix]-180;
        const height=ys[iy+1]-ys[iy]-180;

        let type="house";
        let name="Nhà dân";
        let color="#f7d8c7";

        if(ix===0 && iy===0){
            type="market";
            name="Chợ Thành Phố";
            color="#ffd88d";
        }

        if(ix===2 && iy===1){
            type="restaurant";
            name="Nhà Hàng Của Bạn";
            color="#ff9bb4";
        }

        if(ix===3 && iy===0){
            type="bank";
            name="Ngân Hàng";
            color="#a9d8ff";
        }

        if(ix===4 && iy===0){
            type="loan";
            name="Công Ty Cho Vay";
            color="#d5b4ff";
        }

        if(ix===1 && iy===2){
            type="clothes";
            name="Shop Thời Trang";
            color="#f4b2df";
        }

        if(ix===3 && iy===2){
            type="furniture";
            name="Nội Thất";
            color="#c9b08e";
        }

        building(left,top,width,height,name,type,color);
    }
}

/* =========================================================
   NPC DATABASE
========================================================= */

const roles=[
    "khách hàng",
    "khách hàng",
    "khách hàng",
    "phục vụ",
    "phục vụ",
    "đầu bếp",
    "giao hàng",
    "chủ rau",
    "chủ thịt",
    "chủ hải sản",
    "chủ gạo",
    "chủ nước",
    "hàng xóm",
    "tài xế",
    "thợ sửa xe",
    "lao công",
    "công nhân xây dựng",
    "môi giới bất động sản",
    "chủ nhà",
    "nhân viên ngân hàng",
    "nhân viên cho vay",
    "cảnh sát giao thông",
    "chủ quán cạnh tranh",
    "nhân viên quán cạnh tranh",
    "shipper",
    "nhân viên siêu thị"
];

const names=[
    "An","Bình","Chi","Dũng","Hà","Huy","Khoa","Lan",
    "Linh","Mai","Nam","Nga","Phúc","Quân","Trang",
    "Thảo","Tuấn","Vy","Yến","Minh","Tâm","Long",
    "My","Khánh","Hạnh","Tùng","Giang","Kiệt","Ngọc",
    "Sơn","Thư","Vân","Đạt","Nhi","Hoàng","Phương"
];

const hairColors=[
    "#191919",
    "#39291f",
    "#70482e",
    "#8d5939",
    "#d88b55",
    "#7040a0",
    "#d65d87"
];

const shirtColors=[
    "#ff7594",
    "#6ea9ff",
    "#72c99b",
    "#ffb35e",
    "#a680e4",
    "#70cbd2",
    "#f4e48b"
];

const npcs=[];

function randomChoice(a){
    return a[Math.floor(Math.random()*a.length)];
}

function createNPC(i){
    const role=roles[i%roles.length];
    const nnode=randomChoice(nodes);

    const npc={
        id:i,
        name:names[i%names.length]+" "+(i+1),
        role,

        x:nnode.x,
        y:nnode.y,

        target:null,
        path:[],
        pathIndex:0,

        speed:55+Math.random()*25,

        dir:"down",
        moving:false,
        walk:Math.random()*10,

        hairColor:randomChoice(hairColors),
        shirt:randomChoice(shirtColors),

        skin:["#f4c7a1","#e7aa7d","#ffd0aa"][i%3],

        hair:["short","long","bob","curly"][i%4],

        money:100000+Math.floor(Math.random()*900000),

        inventory:{
            "rau":10+Math.floor(Math.random()*20),
            "thịt":10+Math.floor(Math.random()*20),
            "gạo":10+Math.floor(Math.random()*20),
            "nước":10+Math.floor(Math.random()*20)
        },

        home:randomChoice(nodes),
        work:randomChoice(nodes),

        wait:Math.random()*5,

        order:null,
        satisfaction:70+Math.random()*25
    };

    chooseNPCDestination(npc);
    return npc;
}

/* >70 NPC */
for(let i=0;i<100;i++){
    npcs.push(createNPC(i));
}

/* =========================================================
   NPC PATH / SCHEDULE
========================================================= */

function chooseNPCDestination(npc){

    let target;

    if(
        npc.role==="chủ rau" ||
        npc.role==="chủ thịt" ||
        npc.role==="chủ hải sản" ||
        npc.role==="chủ gạo" ||
        npc.role==="chủ nước"
    ){
        target=nearestNode(
            250+Math.random()*600,
            250+Math.random()*600
        );
    }
    else if(npc.role==="khách hàng"){
        const r=buildings.find(b=>b.type==="restaurant");

        if(r && Math.random()<0.45){
            target=nearestNode(
                r.x+r.w/2,
                r.y+r.h/2
            );
        }else{
            target=randomChoice(nodes);
        }
    }
    else{
        target=randomChoice(nodes);
    }

    npc.target=target;

    const start=nearestNode(npc.x,npc.y);

    npc.path=findPath(start,target);
    npc.pathIndex=0;
}

function updateNPC(npc,dt){

    if(npc.wait>0){
        npc.wait-=dt;
        npc.moving=false;
        return;
    }

    if(
        !npc.path ||
        npc.pathIndex>=npc.path.length
    ){
        chooseNPCDestination(npc);
        npc.wait=1+Math.random()*3;
        return;
    }

    const p=npc.path[npc.pathIndex];

    const dx=p.x-npc.x;
    const dy=p.y-npc.y;
    const dist=Math.hypot(dx,dy);

    if(dist<7){
        npc.x=p.x;
        npc.y=p.y;
        npc.pathIndex++;
        return;
    }

    npc.moving=true;

    const vx=dx/dist;
    const vy=dy/dist;

    npc.x+=vx*npc.speed*dt;
    npc.y+=vy*npc.speed*dt;

    /*
        Đây là phần quan trọng:
        NPC đổi hướng theo vector thật.
        Có walk phase để chân trái/phải luân phiên.
    */

    if(Math.abs(vx)>Math.abs(vy)){
        npc.dir=vx>0?"right":"left";
    }else{
        npc.dir=vy>0?"down":"up";
    }

    npc.walk+=dt*(npc.speed/20);
}

/* =========================================================
   COLLISION
========================================================= */

function circleRectCollision(x,y,r,b){
    const cx=Math.max(b.x,Math.min(x,b.x+b.w));
    const cy=Math.max(b.y,Math.min(y,b.y+b.h));

    const dx=x-cx;
    const dy=y-cy;

    return dx*dx+dy*dy<r*r;
}

function blocked(x,y){
    const r=18;

    for(const b of buildings){
        if(circleRectCollision(x,y,r,b)){
            return true;
        }
    }

    return x<20||y<20||x>WORLD_W-20||y>WORLD_H-20;
}

/* =========================================================
   PLAYER
========================================================= */

function updatePlayer(dt){

    let x=0;
    let y=0;

    if(keys["w"]||keys["arrowup"])y--;
    if(keys["s"]||keys["arrowdown"])y++;
    if(keys["a"]||keys["arrowleft"])x--;
    if(keys["d"]||keys["arrowright"])x++;

    x+=joy.x;
    y+=joy.y;

    const len=Math.hypot(x,y);

    if(len>0){
        x/=len;
        y/=len;

        const nx=player.x+x*player.speed*dt;
        const ny=player.y+y*player.speed*dt;

        if(!blocked(nx,player.y)){
            player.x=nx;
        }

        if(!blocked(player.x,ny)){
            player.y=ny;
        }

        player.moving=true;

        if(Math.abs(x)>Math.abs(y)){
            player.dir=x>0?"right":"left";
        }else{
            player.dir=y>0?"down":"up";
        }

        player.walk+=dt*8;
    }else{
        player.moving=false;
    }
}

/* =========================================================
   DRAW CHARACTER
========================================================= */

function drawCharacter(c,scale=1,isPlayer=false){

    const x=c.x;
    const y=c.y;

    const moving=c.moving;
    const step=moving?Math.sin(c.walk*2):0;

    /*
        Chân luân phiên:
        trái tiến -> phải lùi
        rồi ngược lại.
    */
    const legA=step*5;
    const legB=-step*5;

    ctx.save();
    ctx.translate(x,y);

    /* bóng */
    ctx.fillStyle="#0002";
    ctx.beginPath();
    ctx.ellipse(0,17*scale,16*scale,6*scale,0,0,Math.PI*2);
    ctx.fill();

    /*
        CHÂN
    */
    ctx.strokeStyle="#4a3b3b";
    ctx.lineWidth=5*scale;
    ctx.lineCap="round";

    if(c.dir==="left"||c.dir==="right"||c.dir==="down"){
        ctx.beginPath();
        ctx.moveTo(-5*scale,8*scale);
        ctx.lineTo((-7+legA)*scale,20*scale);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(5*scale,8*scale);
        ctx.lineTo((7+legB)*scale,20*scale);
        ctx.stroke();
    }else{
        ctx.beginPath();
        ctx.moveTo(-5*scale,8*scale);
        ctx.lineTo((-7-legA)*scale,20*scale);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(5*scale,8*scale);
        ctx.lineTo((7-legB)*scale,20*scale);
        ctx.stroke();
    }

    /* giày */
    ctx.fillStyle="#3e3e4d";

    ctx.beginPath();
    ctx.ellipse((-7+legA)*scale,21*scale,6*scale,3*scale,0,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse((7+legB)*scale,21*scale,6*scale,3*scale,0,0,Math.PI*2);
    ctx.fill();

    /*
        THÂN
    */
    ctx.fillStyle=c.shirt||"#ff7898";
    roundRect(
        ctx,
        -12*scale,
        -8*scale,
        24*scale,
        22*scale,
        8*scale
    );
    ctx.fill();

    /* tay */
    ctx.strokeStyle=c.skin||"#f2bd98";
    ctx.lineWidth=5*scale;

    ctx.beginPath();
    ctx.moveTo(-11*scale,-3*scale);
    ctx.lineTo(-17*scale,7*scale+(moving?step:0));
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(11*scale,-3*scale);
    ctx.lineTo(17*scale,7*scale-(moving?step:0));
    ctx.stroke();

    /*
        ĐẦU
    */
    ctx.fillStyle=c.skin||"#f2bd98";

    ctx.beginPath();
    ctx.arc(0,-20*scale,14*scale,0,Math.PI*2);
    ctx.fill();

    /*
        tóc
    */
    ctx.fillStyle=c.hairColor||"#38281f";

    if(c.hair==="long"){
        ctx.beginPath();
        ctx.arc(0,-23*scale,15*scale,Math.PI,Math.PI*2);
        ctx.fill();

        if(c.dir==="left"||c.dir==="right"){
            ctx.fillRect(
                (c.dir==="left"?-15:8)*scale,
                -25*scale,
                7*scale,
                24*scale
            );
        }
    }
    else if(c.hair==="bob"){
        ctx.beginPath();
        ctx.arc(0,-22*scale,15*scale,Math.PI,Math.PI*2);
        ctx.fill();
        ctx.fillRect(-15*scale,-23*scale,5*scale,17*scale);
        ctx.fillRect(10*scale,-23*scale,5*scale,17*scale);
    }
    else if(c.hair==="curly"){
        for(let i=-1;i<=1;i++){
            ctx.beginPath();
            ctx.arc(i*8*scale,-31*scale,7*scale,0,Math.PI*2);
            ctx.fill();
        }
    }
    else{
        ctx.beginPath();
        ctx.arc(0,-25*scale,15*scale,Math.PI,Math.PI*2);
        ctx.fill();
    }

    /*
        MẶT THEO HƯỚNG
    */
    if(c.dir==="down"){

        ctx.fillStyle="#292929";

        ctx.beginPath();
        ctx.arc(-5*scale,-21*scale,2*scale,0,Math.PI*2);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(5*scale,-21*scale,2*scale,0,Math.PI*2);
        ctx.fill();

        ctx.strokeStyle="#9b594d";
        ctx.lineWidth=1.5*scale;

        ctx.beginPath();
        ctx.arc(0,-16*scale,4*scale,0.1,Math.PI-0.1);
        ctx.stroke();

    }else if(c.dir==="left"||c.dir==="right"){

        ctx.fillStyle="#292929";

        const side=c.dir==="left"?-1:1;

        ctx.beginPath();
        ctx.arc(side*8*scale,-21*scale,2*scale,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle="#d98972";

        ctx.beginPath();
        ctx.arc(side*14*scale,-18*scale,2*scale,0,Math.PI*2);
        ctx.fill();

    }else{
        /*
            Nhìn lưng: tóc che mặt
        */
        ctx.fillStyle=c.hairColor||"#38281f";
        ctx.beginPath();
        ctx.arc(0,-22*scale,15*scale,0,Math.PI*2);
        ctx.fill();
    }

    ctx.restore();
}

function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
}

/* =========================================================
   WORLD DRAW
========================================================= */

function drawWorld(){

    ctx.save();
    ctx.translate(-camera.x,-camera.y);

    /* grass */
    ctx.fillStyle="#a8d995";
    ctx.fillRect(0,0,WORLD_W,WORLD_H);

    /* small grass dots */
    ctx.fillStyle="#80bf75";

    for(let x=0;x<WORLD_W;x+=90){
        for(let y=0;y<WORLD_H;y+=90){
            ctx.fillRect(
                x+((y/90)%2)*20,
                y+18,
                3,
                3
            );
        }
    }

    /* roads */
    for(const r of roads){

        ctx.strokeStyle="#d2d0ca";
        ctx.lineWidth=r.width+12;
        ctx.lineCap="round";

        ctx.beginPath();
        ctx.moveTo(r.a.x,r.a.y);
        ctx.lineTo(r.b.x,r.b.y);
        ctx.stroke();

        ctx.strokeStyle="#85858a";
        ctx.lineWidth=r.width;
        ctx.beginPath();
        ctx.moveTo(r.a.x,r.a.y);
        ctx.lineTo(r.b.x,r.b.y);
        ctx.stroke();

        ctx.strokeStyle="#e9d77c";
        ctx.lineWidth=3;
        ctx.setLineDash([18,18]);

        ctx.beginPath();
        ctx.moveTo(r.a.x,r.a.y);
        ctx.lineTo(r.b.x,r.b.y);
        ctx.stroke();

        ctx.setLineDash([]);
    }

    /* buildings */
    for(const b of buildings){

        ctx.fillStyle="#0002";
        roundRect(
            ctx,
            b.x+8,
            b.y+10,
            b.w,
            b.h,
            18
        );
        ctx.fill();

        ctx.fillStyle=b.color;

        roundRect(
            ctx,
            b.x,
            b.y,
            b.w,
            b.h,
            18
        );
        ctx.fill();

        /* roof */
        ctx.fillStyle="#ffffff55";
        ctx.fillRect(
            b.x+10,
            b.y+10,
            b.w-20,
            20
        );

        /* windows */
        ctx.fillStyle="#9ad8ed";

        for(let wx=b.x+35;wx<b.x+b.w-25;wx+=55){
            ctx.fillRect(wx,b.y+45,25,25);
        }

        ctx.fillStyle="#674c44";
        ctx.fillRect(
            b.x+b.w/2-15,
            b.y+b.h-45,
            30,
            45
        );

        ctx.fillStyle="#533";
        ctx.font="bold 14px Arial";
        ctx.textAlign="center";

        ctx.fillText(
            b.name,
            b.x+b.w/2,
            b.y-8
        );
    }

    /* cây */
    for(let i=0;i<100;i++){
        const tx=(i*311)%WORLD_W;
        const ty=(i*197)%WORLD_H;

        let bad=false;

        for(const b of buildings){
            if(
                tx>b.x-30 &&
                tx<b.x+b.w+30 &&
                ty>b.y-30 &&
                ty<b.y+b.h+30
            ){
                bad=true;
                break;
            }
        }

        if(bad)continue;

        ctx.fillStyle="#805d42";
        ctx.fillRect(tx-4,ty,8,22);

        ctx.fillStyle="#4d9c60";
        ctx.beginPath();
        ctx.arc(tx,ty,18,0,Math.PI*2);
        ctx.fill();
    }

    /* vehicles */
    drawVehicles();

    /* NPC */
    for(const npc of npcs){
        drawCharacter(npc,.85);

        if(
            Math.hypot(npc.x-player.x,npc.y-player.y)<120
        ){
            ctx.fillStyle="#ffffffdd";
            roundRect(
                ctx,
                npc.x-48,
                npc.y-63,
                96,
                25,
                8
            );
            ctx.fill();

            ctx.fillStyle="#3c4950";
            ctx.font="bold 11px Arial";
            ctx.textAlign="center";
            ctx.fillText(
                npc.name,
                npc.x,
                npc.y-47
            );
        }
    }

    /* player */
    drawCharacter(player,1.1,true);

    /* interaction marker */
    const n=nearestInteractable();

    if(n){
        ctx.fillStyle="#ffffffdd";
        ctx.beginPath();
        ctx.arc(player.x,player.y-65,17,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle="#444";
        ctx.font="bold 15px Arial";
        ctx.textAlign="center";
        ctx.fillText(
            "E",
            player.x,
            player.y-60
        );
    }

    ctx.restore();
}

const vehicles=[];

for(let i=0;i<30;i++){

    const horizontal=Math.random()<.5;

    const road=horizontal
        ?randomChoice(roads.filter(r=>r.a.y===r.b.y))
        :randomChoice(roads.filter(r=>r.a.x===r.b.x));

    vehicles.push({
        horizontal,
        x:horizontal?Math.min(road.a.x,road.b.x):road.a.x,
        y:horizontal?road.a.y:Math.min(road.a.y,road.b.y),
        speed:50+Math.random()*60,
        dir:Math.random()<.5?1:-1,
        color:randomChoice([
            "#ef6969",
            "#6b9bea",
            "#f4bf60",
            "#77b981",
            "#bd80ce"
        ])
    });
}

function drawVehicles(){

    for(const v of vehicles){

        if(v.horizontal){
            v.x+=v.speed*v.dir*0.016;

            if(v.x<100||v.x>3500){
                v.dir*=-1;
            }
        }else{
            v.y+=v.speed*v.dir*0.016;

            if(v.y<100||v.y>2600){
                v.dir*=-1;
            }
        }

        ctx.save();
        ctx.translate(v.x,v.y);

        ctx.fillStyle=v.color;

        roundRect(
            ctx,
            -16,
            -10,
            32,
            20,
            5
        );
        ctx.fill();

        ctx.fillStyle="#bde9ff";

        if(v.horizontal){
            ctx.fillRect(-7,-7,14,7);
        }else{
            ctx.fillRect(-7,-7,7,14);
        }

        ctx.restore();
    }
}

function drawWeather(){

    if(weather==="rain"||weather==="storm"){

        ctx.strokeStyle="#7bb5e688";
        ctx.lineWidth=1;

        const count=weather==="storm"?350:180;

        for(let i=0;i<count;i++){

            const x=(i*73+performance.now()/5)%W;
            const y=(i*47+performance.now()/3)%H;

            ctx.beginPath();
            ctx.moveTo(x,y);
            ctx.lineTo(x-4,y+15);
            ctx.stroke();
        }
    }

    if(weather==="fog"){

        ctx.fillStyle="#ffffff35";
        ctx.fillRect(0,0,W,H);
    }

    if(weather==="storm"){

        if(Math.random()<.004){
            ctx.fillStyle="#ffffff99";
            ctx.fillRect(0,0,W,H);
        }
    }
}

/* =========================================================
   DAY NIGHT
========================================================= */

let gameMinutes=8*60;

function updateTime(dt){

    /*
       1 real second = 1 game minute
    */
    gameMinutes+=dt;

    if(gameMinutes>=1440){
        gameMinutes-=1440;
        newDay();
    }
}

function timeText(){

    const h=Math.floor(gameMinutes/60);
    const m=Math.floor(gameMinutes%60);

    return String(h).padStart(2,"0")+":"+
           String(m).padStart(2,"0");
}

function nightAlpha(){

    const h=gameMinutes/60;

    if(h>=19||h<6)return .38;
    if(h>=17)return (h-17)*.08;
    if(h<8)return (8-h)*.15;

    return 0;
}

/* =========================================================
   INTERACTION
========================================================= */

function nearestNPC(){

    let best=null;
    let d=Infinity;

    for(const npc of npcs){

        const dist=Math.hypot(
            npc.x-player.x,
            npc.y-player.y
        );

        if(dist<d&&dist<90){
            d=dist;
            best=npc;
        }
    }

    return best;
}

function nearestBuilding(){

    let best=null;
    let d=Infinity;

    for(const b of buildings){

        const cx=b.x+b.w/2;
        const cy=b.y+b.h/2;

        const dist=Math.hypot(
            cx-player.x,
            cy-player.y
        );

        if(dist<d&&dist<130){
            d=dist;
            best=b;
        }
    }

    return best;
}

function nearestInteractable(){
    return nearestNPC()||nearestBuilding();
}

function interact(){

    if(!gameStarted)return;

    const npc=nearestNPC();

    if(npc){
        openNPC(npc);
        return;
    }

    const b=nearestBuilding();

    if(b){
        openBuilding(b);
    }
}

function buyItem(id,item,price){

    const npc=npcs[id];

    if(player.money<price){
        toast("Không đủ tiền.");
        return;
    }

    player.money-=price;
    player.inventory[item]=(player.inventory[item]||0)+1;

    npc.money+=price;
    npc.inventory[item]=(npc.inventory[item]||0)-1;

    updateHUD();
    toast("Đã mua "+item+".");
}

function sellToCustomer(id){

    const npc=npcs[id];

    let html=`
        <div class="panelTitle">
            <span>🍜 Bán món</span>
            <button class="close" onclick="closePanel()">×</button>
        </div>
        <div class="cards">
    `;

    for(const f of foods){

        if(f[2]>player.level)continue;

        html+=`
            <div class="card">
                <b>${f[0]}</b>
                <span>${formatMoney(f[1])}đ</span>
                <button onclick="serveCustomer(${id},${f[1]})">
                    Bán
                </button>
            </div>
        `;
    }

    html+="</div>";

    showPanel(html);
}

function serveCustomer(id,price){

    const npc=npcs[id];

    if(!player.restaurant.rented){
        toast("Bạn chưa thuê nhà hàng.");
        return;
    }

    if(!player.restaurant.open){
        toast("Nhà hàng đang đóng cửa.");
        return;
    }

    if(npc.money<price){
        toast("Khách không đủ tiền.");
        return;
    }

    npc.money-=price;
    player.money+=price;

    player.restaurant.revenue+=price;
    player.restaurant.customers++;

    player.xp+=5;

    if(player.xp>=100){
        player.xp-=100;
        player.level=Math.min(10,player.level+1);
        toast("🎉 Nhà hàng lên cấp "+player.level+"!");
    }else{
        toast("Khách đã thanh toán "+formatMoney(price)+"đ.");
    }

    updateHUD();
    closePanel();
}

function openCooking(){

    let html=`
        <div class="panelTitle">
            <span>👨‍🍳 BẾP</span>
            <button class="close" onclick="closePanel()">×</button>
        </div>
        <div class="cards">
    `;

    for(let i=0;i<foods.length;i++){

        const f=foods[i];

        if(f[2]>player.level)continue;

        html+=`
            <div class="card">
                <b>${f[0]}</b>
                <span>Bán: ${formatMoney(f[1])}đ</span>
                <button onclick="cook(${i})">
                    Nấu
                </button>
            </div>
        `;
    }

    html+="</div>";

    showPanel(html);
}

function hasIngredients(list){

    const need={};

    for(const x of list){
        need[x]=(need[x]||0)+1;
    }

    for(const k in need){
        if((player.inventory[k]||0)<need[k]){
            return false;
        }
    }

    return true;
}

function cook(index){

    const f=foods[index];

    if(f[2]>player.level){
        toast("Chưa mở khóa.");
        return;
    }

    if(!hasIngredients(f[3])){
        toast("Thiếu nguyên liệu.");
        return;
    }

    for(const x of f[3]){
        player.inventory[x]--;
    }

    player.restaurant.cooked++;
    player.xp+=8;

    toast("👨‍🍳 Đã nấu "+f[0]);

    updateHUD();
}

function takeLoan(amount){

    player.money+=amount;
    player.loan+=Math.floor(amount*1.15);

    toast("Đã vay "+formatMoney(amount)+"đ.");
    updateHUD();
}

function repayLoan(){

    const amount=Math.min(100000,player.loan);

    if(amount<=0){
        toast("Bạn không còn nợ.");
        return;
    }

    if(player.money<amount){
        toast("Không đủ tiền.");
        return;
    }

    player.money-=amount;
    player.loan-=amount;

    toast("Đã trả nợ.");
    updateHUD();
}

let days=1;

function newDay(){

    days++;

    const wages=player.restaurant.staff
        .reduce((a,b)=>a+b.wage,0);

    player.money-=wages;

    if(days%25===0 && player.restaurant.rented){
        player.money-=500000;
        toast("📅 Đã trừ 500.000đ tiền thuê.");
    }

    if(gameMinutes>=6*60&&gameMinutes<7*60){
        toast("🌅 Ngày mới bắt đầu!");
    }

    if(days%7===0){
        player.money-=Math.max(0,Math.floor(player.money*0.03));
        toast("🧾 Đã thu thuế tuần.");
    }
}

/* =========================================================
   SAVE
========================================================= */

const SERVER_URL="";

let PLAYER_ID=
    localStorage.getItem("BG_PLAYER_ID");

if(!PLAYER_ID){

    if(window.crypto&&crypto.randomUUID){
        PLAYER_ID=crypto.randomUUID();
    }else{
        PLAYER_ID=
            Date.now()+"-"+Math.random();
    }

    localStorage.setItem(
        "BG_PLAYER_ID",
        PLAYER_ID
    );
}

function saveGame(){

    const data={
        player,
        gameMinutes,
        days,
        weather,
        npcs:npcs.map(n=>({
            id:n.id,
            x:n.x,
            y:n.y,
            money:n.money
        }))
    };

    localStorage.setItem(
        "BUON_GI_BAN_SAVE",
        JSON.stringify(data)
    );

    if(SERVER_URL){

        fetch(SERVER_URL+"/api/save",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                id:PLAYER_ID,
                game:data
            })
        }).catch(()=>{});
    }

    toast("💾 Đã lưu game.");
}

function loadGame(){

    const raw=
        localStorage.getItem("BUON_GI_BAN_SAVE");

    if(!raw)return;

    try{

        const data=JSON.parse(raw);

        Object.assign(player,data.player);

        gameMinutes=data.gameMinutes||480;
        days=data.days||1;
        weather=data.weather||"sunny";

        if(data.npcs){

            for(const saved of data.npcs){

                const npc=npcs.find(
                    n=>n.id===saved.id
                );

                if(npc){
                    npc.x=saved.x;
                    npc.y=saved.y;
                    npc.money=saved.money;
                    chooseNPCDestination(npc);
                }
            }
        }

    }catch(e){
        console.warn("Save lỗi",e);
    }
}

/* =========================================================
   MOBILE JOYSTICK
========================================================= */

const mobile=document.getElementById("mobile");
const stick=document.getElementById("stick");

let joyActive=false;

function joystickMove(clientX,clientY){

    const rect=mobile.getBoundingClientRect();

    const cx=rect.left+rect.width/2;
    const cy=rect.top+rect.height/2;

    let dx=clientX-cx;
    let dy=clientY-cy;

    const max=43;
    const len=Math.hypot(dx,dy);

    if(len>max){
        dx=dx/len*max;
        dy=dy/len*max;
    }

    joy.x=dx/max;
    joy.y=dy/max;

    stick.style.left=
        `calc(50% + ${dx}px)`;

    stick.style.top=
        `calc(50% + ${dy}px)`;
}

mobile.addEventListener("pointerdown",e=>{
    joyActive=true;
    mobile.setPointerCapture(e.pointerId);
    joystickMove(e.clientX,e.clientY);
});

mobile.addEventListener("pointermove",e=>{
    if(joyActive){
        joystickMove(e.clientX,e.clientY);
    }
});

mobile.addEventListener("pointerup",()=>{
    joyActive=false;
    joy.x=0;
    joy.y=0;
    stick.style.left="50%";
    stick.style.top="50%";
});

/* =========================================================
   GAME LOOP
========================================================= */

function update(dt){

    if(!gameStarted)return;

    updatePlayer(dt);

    for(const npc of npcs){
        updateNPC(npc,dt);
    }

    updateTime(dt);
    updateWeather(dt);
    updateCamera();
    updateHUD();
}

function draw(){

    ctx.clearRect(0,0,W,H);

    if(!gameStarted)return;

    drawWorld();

    /* night */
    const na=nightAlpha();

    if(na>0){

        ctx.fillStyle=
            `rgba(30,45,95,${na})`;

        ctx.fillRect(0,0,W,H);
    }

    drawWeather();
}

function loop(now){

    const dt=Math.min(
        .05,
        (now-last)/1000
    );

    last=now;

    update(dt);
    draw();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

/* =========================================================
   AUTOSAVE
========================================================= */

setInterval(()=>{
    if(gameStarted){
        saveGame();
    }
},30000);

/* =========================================================
   INITIAL
========================================================= */

updateHUD();
