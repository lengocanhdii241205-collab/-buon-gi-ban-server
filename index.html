<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">

<title>Buôn Gì Bán Nấy 3D</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
    font-family:Arial,Helvetica,sans-serif;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

button,
input,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

#canvas-container{
    position:fixed;
    inset:0;
    z-index:1;
}

#canvas-container canvas{
    display:block;
}

/* LOGIN */

#login-screen{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 50% 20%,rgba(0,200,255,.25),transparent 35%),
        linear-gradient(135deg,#081b33,#123f70,#06111f);
    color:#fff;
}

.login-box{
    width:min(90%,360px);
    padding:30px;
    border-radius:24px;
    background:rgba(10,20,35,.78);
    border:1px solid rgba(255,255,255,.2);
    backdrop-filter:blur(18px);
    box-shadow:0 25px 70px rgba(0,0,0,.6);
    text-align:center;
}

.login-box h1{
    font-size:25px;
    margin-bottom:8px;
}

.login-box p{
    color:#b9c9dc;
    font-size:12px;
    margin-bottom:20px;
}

.login-box input,
.login-box select{
    width:100%;
    padding:13px;
    margin-top:10px;
    border:0;
    outline:0;
    border-radius:10px;
    background:#fff;
    color:#111;
    font-size:15px;
}

.login-box button{
    width:100%;
    margin-top:15px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:linear-gradient(135deg,#ff7a00,#ffb000);
    color:white;
    font-weight:bold;
    font-size:16px;
}

/* HUD */

#hud{
    position:fixed;
    inset:0;
    z-index:10;
    display:none;
    pointer-events:none;
}

.hud-panel{
    background:rgba(5,10,18,.72);
    border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(12px);
    box-shadow:0 8px 25px rgba(0,0,0,.25);
}

#hud-left{
    position:absolute;
    top:12px;
    left:12px;
    padding:11px 14px;
    border-radius:14px;
    color:#fff;
    min-width:190px;
}

.stat{
    display:flex;
    align-items:center;
    gap:6px;
    margin:4px 0;
    font-size:12px;
}

.stat-value{
    color:#ffd84a;
    font-weight:bold;
}

.bar{
    width:90px;
    height:6px;
    background:rgba(255,255,255,.15);
    border-radius:99px;
    overflow:hidden;
}

.bar-inner{
    width:100%;
    height:100%;
    background:#35d07f;
}

#energy-bar{
    background:#3bb5ff;
}

#hunger-bar{
    background:#ff9e3b;
}

#hud-right{
    position:absolute;
    top:12px;
    right:12px;
    padding:11px 14px;
    border-radius:14px;
    color:#fff;
    text-align:right;
}

#hud-time{
    font-size:18px;
    font-weight:bold;
}

#hud-day{
    font-size:11px;
    color:#c8d2df;
    margin-top:3px;
}

#hud-weather{
    margin-top:4px;
    color:#ffd84a;
    font-size:12px;
}

/* ACTION BUTTONS */

#buttons{
    position:absolute;
    right:14px;
    bottom:15px;
    width:min(390px,48vw);
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    pointer-events:auto;
}

.game-btn{
    border:1px solid rgba(255,255,255,.2);
    border-radius:11px;
    padding:10px 5px;
    color:#fff;
    background:rgba(10,20,30,.76);
    backdrop-filter:blur(10px);
    font-size:11px;
    font-weight:bold;
}

.game-btn:active{
    transform:scale(.96);
    background:rgba(255,255,255,.22);
}

#interaction-btn{
    background:linear-gradient(135deg,#ff7b00,#ffb000);
}

#taxi-btn{
    background:linear-gradient(135deg,#168aff,#0061d9);
}

/* JOYSTICK */

#joystick{
    position:absolute;
    left:25px;
    bottom:28px;
    width:125px;
    height:125px;
    border-radius:50%;
    background:rgba(255,255,255,.11);
    border:2px solid rgba(255,255,255,.2);
    pointer-events:auto;
    touch-action:none;
}

#joystick-stick{
    position:absolute;
    left:37px;
    top:37px;
    width:48px;
    height:48px;
    border-radius:50%;
    background:rgba(255,255,255,.62);
    box-shadow:0 5px 18px rgba(0,0,0,.35);
}

/* CHAT */

#chat{
    position:absolute;
    left:165px;
    bottom:18px;
    width:270px;
    height:155px;
    display:flex;
    flex-direction:column;
    padding:8px;
    border-radius:12px;
    pointer-events:auto;
    background:rgba(0,0,0,.48);
    border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(8px);
}

#chat-messages{
    flex:1;
    overflow-y:auto;
    color:white;
    font-size:11px;
    line-height:1.45;
    margin-bottom:6px;
}

#chat-input{
    width:100%;
    padding:7px;
    border:0;
    outline:0;
    border-radius:7px;
    background:rgba(255,255,255,.15);
    color:#fff;
}

#chat-input::placeholder{
    color:#ccc;
}

/* NOTIFICATION */

#notification{
    position:absolute;
    z-index:2000;
    left:50%;
    top:80px;
    transform:translateX(-50%);
    min-width:200px;
    max-width:85%;
    padding:11px 18px;
    border-radius:30px;
    background:rgba(5,10,15,.88);
    color:#fff;
    border:2px solid #35d07f;
    text-align:center;
    font-size:13px;
    font-weight:bold;
    display:none;
}

/* MODAL */

.modal{
    position:fixed;
    z-index:500;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(92%,520px);
    max-height:82vh;
    overflow-y:auto;
    padding:18px;
    border-radius:18px;
    background:rgba(8,13,22,.96);
    border:1px solid rgba(255,255,255,.16);
    color:#fff;
    display:none;
    box-shadow:0 25px 80px rgba(0,0,0,.7);
    pointer-events:auto;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
    padding-bottom:10px;
    border-bottom:1px solid rgba(255,255,255,.12);
}

.modal-header h2{
    color:#ffab22;
    font-size:17px;
}

.close{
    color:#aaa;
    font-size:25px;
    cursor:pointer;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
}

.card{
    padding:11px;
    border-radius:10px;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.09);
    font-size:12px;
}

.card.full{
    grid-column:1/-1;
}

.card b{
    color:#fff;
}

.card small{
    color:#aaa;
}

.card button{
    width:100%;
    margin-top:7px;
    padding:8px;
    border:0;
    border-radius:7px;
    background:#209653;
    color:#fff;
    font-weight:bold;
    font-size:11px;
}

.card button.red{
    background:#d83b3b;
}

.card button.orange{
    background:#e88917;
}

.card button.blue{
    background:#1675d1;
}

/* CONNECTION */

#connection-status{
    position:absolute;
    left:50%;
    bottom:10px;
    transform:translateX(-50%);
    z-index:20;
    color:#fff;
    font-size:10px;
    opacity:.7;
    pointer-events:none;
}

@media(max-width:700px){

    #buttons{
        width:210px;
        grid-template-columns:repeat(2,1fr);
        right:8px;
        bottom:8px;
    }

    .game-btn{
        padding:8px 4px;
        font-size:10px;
    }

    #joystick{
        width:110px;
        height:110px;
        left:16px;
        bottom:18px;
    }

    #joystick-stick{
        left:31px;
        top:31px;
    }

    #chat{
        left:135px;
        bottom:12px;
        width:180px;
        height:125px;
    }

    #hud-left{
        min-width:165px;
        top:8px;
        left:8px;
    }

    #hud-right{
        top:8px;
        right:8px;
    }
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
"use strict";

/* =========================================================
   GLOBAL
========================================================= */

let ws = null;
let myId = null;

let reconnectTimer = null;
let connecting = false;

let scene = null;
let camera = null;
let renderer = null;
let clock = null;

let ambientLight = null;
let sunLight = null;

let weatherParticles = null;

let localState = {
    world:{
        day:1,
        time:8,
        weather:"sunny"
    },
    players:{},
    npcs:[],
    vehicles:[],
    buildings:[],
    market:{},
    businesses:{}
};

const playerMeshes = {};
const npcMeshes = {};
const vehicleMeshes = {};
const buildingMeshes = {};

const keys = {
    w:false,
    a:false,
    s:false,
    d:false,
    ArrowUp:false,
    ArrowDown:false,
    ArrowLeft:false,
    ArrowRight:false
};

let joystick = {
    active:false,
    x:0,
    y:0,
    pointerId:null
};

let initialized3D = false;
let cityBuilt = false;

let targetCamera = new THREE.Vector3();
let cameraLook = new THREE.Vector3();

/* =========================================================
   UTILITY
========================================================= */

function escapeHTML(value){
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function send(data){
    if(ws && ws.readyState === WebSocket.OPEN){
        ws.send(JSON.stringify(data));
    }
}

function notify(text, success=true){
    const el = document.getElementById("notification");

    el.textContent = text;
    el.style.borderColor = success ? "#35d07f" : "#ff4141";
    el.style.display = "block";

    clearTimeout(notify.timer);

    notify.timer = setTimeout(()=>{
        el.style.display = "none";
    },2500);
}

function action(action, extra={}){
    send({
        type:"ACTION",
        action,
        ...extra
    });
}

/* =========================================================
   LOGIN / WEBSOCKET
========================================================= */

function joinGame(){

    if(connecting) return;

    const name =
        document.getElementById("player-name")
            .value.trim()
            .slice(0,20) || "Người chơi";

    const gender =
        document.getElementById("player-gender").value;

    if(location.protocol === "file:"){
        notify(
            "Hãy chạy game bằng node server.js, không mở index.html trực tiếp.",
            false
        );
        return;
    }

    connecting = true;

    document.getElementById("join-button").disabled = true;
    document.getElementById("join-button").textContent =
        "ĐANG KẾT NỐI...";

    connectSocket(name,gender);
}

function connectSocket(name,gender){

    clearTimeout(reconnectTimer);

    const protocol =
        location.protocol === "https:"
            ? "wss:"
            : "ws:";

    const url =
        `${protocol}//${location.host}`;

    try{
        ws = new WebSocket(url);
    }catch(error){

        connecting = false;

        document.getElementById("join-button").disabled = false;
        document.getElementById("join-button").textContent =
            "VÀO THÀNH PHỐ";

        notify("Không thể tạo kết nối WebSocket.",false);

        return;
    }

    setConnection("Đang kết nối...");

    ws.onopen = ()=>{

        connecting = false;

        setConnection("🟢 Đã kết nối");

        send({
            type:"JOIN",
            name,
            gender
        });

        document.getElementById("login-screen")
            .style.display = "none";

        document.getElementById("hud")
            .style.display = "block";

        if(!initialized3D){
            init3D();
        }
    };

    ws.onmessage = event=>{

        try{
            const data = JSON.parse(event.data);

            handleServerMessage(data);

        }catch(error){

            console.error(
                "Invalid server message:",
                error
            );
        }
    };

    ws.onerror = ()=>{
        setConnection("🔴 Lỗi kết nối");
    };

    ws.onclose = ()=>{

        setConnection("🟠 Mất kết nối");

        if(myId){
            notify(
                "Mất kết nối máy chủ. Đang thử kết nối lại...",
                false
            );
        }

        reconnectTimer =
            setTimeout(()=>{

                connecting = false;

                connectSocket(name,gender);

            },3000);
    };
}

function setConnection(text){
    document.getElementById(
        "connection-status"
    ).textContent = text;
}

function handleServerMessage(data){

    if(data.type === "INIT"){

        myId = data.id;

        localState = data.state;

        updateHUD();
        syncEntities();

        buildCity();

        return;
    }

    if(data.type === "TICK"){

        localState = data.state;

        updateHUD();
        syncEntities();
        updateWeather();

        return;
    }

    if(data.type === "WEATHER"){

        if(data.weather){
            localState.world.weather =
                data.weather;
        }

        if(data.market){
            localState.market =
                data.market;
        }

        updateWeather();

        notify(
            "Thời tiết thay đổi.",
            true
        );

        return;
    }

    if(data.type === "NOTIF"){

        notify(
            data.text,
            data.success
        );

        refreshOpenModal();

        return;
    }

    if(data.type === "CHAT_MSG"){

        addChat(
            data.sender,
            data.text
        );

        return;
    }

    if(data.type === "SYSTEM"){

        addChat(
            "HỆ THỐNG",
            data.text
        );
    }
}

/* =========================================================
   THREE.JS
========================================================= */

function init3D(){

    if(initialized3D) return;

    initialized3D = true;

    const container =
        document.getElementById(
            "canvas-container"
        );

    scene = new THREE.Scene();

    scene.background =
        new THREE.Color(0x86c9ef);

    scene.fog =
        new THREE.FogExp2(
            0x86c9ef,
            0.007
        );

    camera =
        new THREE.PerspectiveCamera(
            60,
            window.innerWidth /
            window.innerHeight,
            .1,
            500
        );

    camera.position.set(
        0,
        10,
        15
    );

    renderer =
        new THREE.WebGLRenderer({
            antialias:true,
            powerPreference:"high-performance"
        });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio || 1,
            1.5
        )
    );

    renderer.shadowMap.enabled = true;

    renderer.shadowMap.type =
        THREE.PCFSoftShadowMap;

    container.appendChild(
        renderer.domElement
    );

    clock = new THREE.Clock();

    ambientLight =
        new THREE.AmbientLight(
            0xffffff,
            .65
        );

    scene.add(ambientLight);

    sunLight =
        new THREE.DirectionalLight(
            0xffffff,
            1
        );

    sunLight.position.set(
        80,
        120,
        60
    );

    sunLight.castShadow = true;

    sunLight.shadow.mapSize.width = 1024;
    sunLight.shadow.mapSize.height = 1024;

    sunLight.shadow.camera.left = -120;
    sunLight.shadow.camera.right = 120;
    sunLight.shadow.camera.top = 120;
    sunLight.shadow.camera.bottom = -120;

    scene.add(sunLight);

    createWorldBase();
    createWeatherSystem();

    setupKeyboard();
    setupJoystick();

    window.addEventListener(
        "resize",
        resizeRenderer
    );

    animate();
}

/* =========================================================
   CITY
========================================================= */

function createWorldBase(){

    const ground =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                260,
                260
            ),
            new THREE.MeshStandardMaterial({
                color:0x3c7d43,
                roughness:1
            })
        );

    ground.rotation.x =
        -Math.PI / 2;

    ground.receiveShadow = true;

    scene.add(ground);

    createRoad(
        0,
        0,
        260,
        14
    );

    createRoad(
        0,
        0,
        14,
        260
    );

    createRoad(
        0,
        -55,
        260,
        10
    );

    createRoad(
        0,
        55,
        260,
        10
    );

    createRoad(
        -55,
        0,
        10,
        260
    );

    createRoad(
        55,
        0,
        10,
        260
    );

    createPark(
        -70,
        -70,
        38,
        38
    );

    createPark(
        70,
        70,
        38,
        38
    );

    for(let i=0;i<80;i++){

        const x =
            Math.random()*240-120;

        const z =
            Math.random()*240-120;

        if(
            Math.abs(x)<9 ||
            Math.abs(z)<9
        ){
            continue;
        }

        createTree(x,z);
    }

    cityBuilt = true;
}

function createRoad(x,z,width,depth){

    const road =
        new THREE.Mesh(
            new THREE.PlaneGeometry(

/* =========================================================
   SYNC
========================================================= */

function syncEntities(){

    if(!scene) return;

    /* PLAYER */

    Object.values(
        localState.players || {}
    ).forEach(player=>{

        if(!playerMeshes[player.id]){

            playerMeshes[player.id] =
                createPlayerMesh(player);
        }

        const mesh =
            playerMeshes[player.id];

        mesh.position.set(
            player.x,
            player.y,
            player.z
        );

        mesh.rotation.y =
            player.rot || 0;

        const bike =
            mesh.getObjectByName("bike");

        if(bike){
            bike.visible =
                !!player.onBike;
        }
    });

    Object.keys(
        playerMeshes
    ).forEach(id=>{

        if(!localState.players[id]){

            scene.remove(
                playerMeshes[id]
            );

            delete playerMeshes[id];
        }
    });

    /* NPC */

    (localState.npcs || [])
        .forEach(npc=>{

            if(!npcMeshes[npc.id]){
                npcMeshes[npc.id] =
                    createNPCMesh();
            }

            const mesh =
                npcMeshes[npc.id];

            mesh.position.set(
                npc.x,
                .0,
                npc.z
            );

            mesh.rotation.y =
                npc.rot || 0;
        });

    /* VEHICLES */

    (localState.vehicles || [])
        .forEach(vehicle=>{

            if(!vehicleMeshes[vehicle.id]){
                vehicleMeshes[vehicle.id] =
                    createVehicleMesh(
                        vehicle.type
                    );
            }

            const mesh =
                vehicleMeshes[
                    vehicle.id
                ];

            mesh.position.set(
                vehicle.x,
                mesh.position.y,
                vehicle.z
            );

            mesh.rotation.y =
                vehicle.rot || 0;
        });
}

function setupKeyboard(){

    window.addEventListener(
        "keydown",
        event=>{

            if(
                event.target.tagName ===
                "INPUT"
            ){
                return;
            }

            if(
                Object.prototype.hasOwnProperty.call(
                    keys,
                    event.key
                )
            ){
                keys[event.key]=true;

                event.preventDefault();
            }
        }
    );

    window.addEventListener(
        "keyup",
        event=>{

            if(
                Object.prototype.hasOwnProperty.call(
                    keys,
                    event.key
                )
            ){
                keys[event.key]=false;
            }
        }
    );
}

function setupJoystick(){

    const wrapper =
        document.getElementById(
            "joystick"
        );

    const stick =
        document.getElementById(
            "joystick-stick"
        );

    wrapper.addEventListener(
        "pointerdown",
        event=>{

            event.preventDefault();

            joystick.active=true;
            joystick.pointerId=
                event.pointerId;

            try{
                wrapper.setPointerCapture(
                    event.pointerId
                );
            }catch(_){}

            updateJoystick(
                event,
                wrapper,
                stick
            );
        }
    );

    wrapper.addEventListener(
        "pointermove",
        event=>{

            if(
                !joystick.active ||
                event.pointerId !==
                joystick.pointerId
            ){
                return;
            }

            updateJoystick(
                event,
                wrapper,
                stick
            );
        }
    );

    wrapper.addEventListener(
        "pointerup",
        resetJoystick
    );

    wrapper.addEventListener(
        "pointercancel",
        resetJoystick
    );
}

function updateJoystick(
    event,
    wrapper,
    stick
){

    const rect =
        wrapper.getBoundingClientRect();

    const centerX =
        rect.left +
        rect.width/2;

    const centerY =
        rect.top +
        rect.height/2;

    let dx =
        event.clientX-centerX;

    let dy =
        event.clientY-centerY;

    const max =
        rect.width/2-25;

    const length =
        Math.sqrt(
            dx*dx+dy*dy
        );

    if(length>max){

        dx =
            dx/length*max;

        dy =
            dy/length*max;
    }

    joystick.x =
        dx/max;

    joystick.y =
        dy/max;

    stick.style.transform =
        `translate(${dx}px,${dy}px)`;
}

function resetJoystick(){

    joystick.active=false;
    joystick.x=0;
    joystick.y=0;

    const stick =
        document.getElementById(
            "joystick-stick"
        );

    stick.style.transform =
        "translate(0,0)";
}

function updateMovement(){

    if(
        !myId ||
        !localState.players ||
        !localState.players[myId]
    ){
        return;
    }

    const me =
        localState.players[myId];

    let x=0;
    let z=0;

    if(keys.w || keys.ArrowUp){
        z-=1;
    }

    if(keys.s || keys.ArrowDown){
        z+=1;
    }

    if(keys.a || keys.ArrowLeft){
        x-=1;
    }

    if(keys.d || keys.ArrowRight){
        x+=1;
    }

    if(
        Math.abs(joystick.x)>.05 ||
        Math.abs(joystick.y)>.05
    ){
        x=joystick.x;
        z=joystick.y;
    }

    const length =
        Math.sqrt(
            x*x+z*z
        );

    if(length<.01){
        return;
    }

    x/=Math.max(length,1);
    z/=Math.max(length,1);

    const speed =
        me.onBike
            ? .34
            : .15;

    me.x += x*speed;
    me.z += z*speed;

    me.x =
        Math.max(
            -105,
            Math.min(
                105,
                me.x
            )
        );

    me.z =
        Math.max(
            -105,
            Math.min(
                105,
                me.z
            )
        );

    me.rot =
        Math.atan2(
            x,
            z
        );

    send({
        type:"UPDATE_MOVE",
        x:me.x,
        y:.5,
        z:me.z,
        rot:me.rot,
        onBike:!!me.onBike
    });
}

function updateCamera(){

            distance,

        player.position.y+

    camera.position.lerp(

        player.position.y+1,
        player.position.z
    );

    camera.lookAt(
        cameraLook
    );
}

/* =========================================================
   WEATHER
========================================================= */

function createWeatherSystem(){

    const count=900;

    const positions =
        new Float32Array(
            count*3
        );

    for(
        let i=0;
        i<count;
        i++
    ){

        positions[i*3] =
            Math.random()*200-100;

        positions[i*3+1] =
            Math.random()*50;

        positions[i*3+2] =
            Math.random()*200-100;
    }

    const geometry =
        new THREE.BufferGeometry();

    geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            positions,
            3
        )
    );

    const material =
        new THREE.PointsMaterial({
            color:0xbad8ff,
            size:.28,
            transparent:true,
            opacity:.7
        });

    weatherParticles =
        new THREE.Points(
            geometry,
            material
        );

    weatherParticles.visible=false;

    scene.add(
        weatherParticles
    );
}

function updateWeather(){

    if(
        !scene ||
        !localState.world
    ){
        return;
    }

    const weather =
        localState.world.weather;

    const rain =
        weather === "light_rain" ||
        weather === "heavy_rain" ||
        weather === "storm";

    if(weatherParticles){
        weatherParticles.visible=rain;
    }

    const colors={
        sunny:0x86c9ef,
        cloudy:0x778899,
        light_rain:0x647b92,
        heavy_rain:0x425467,
        storm:0x202938,
        windy:0x9db7c8
    };

    const color =
        colors[weather] ||
        colors.sunny;

    scene.background =
        new THREE.Color(color);

    scene.fog.color =
        new THREE.Color(color);

    if(ambientLight){

        ambientLight.intensity =
            weather === "storm"
                ? .25
                : weather === "cloudy"
                    ? .45
                    : .65;
    }

    if(sunLight){

        sunLight.intensity =
            weather === "storm"
                ? .25
                : weather === "cloudy"
                    ? .55
                    : .95;
    }
}

function updateRainAnimation(){

    if(
        !weatherParticles ||
        !weatherParticles.visible
    ){
        return;
    }

    const positions =
        weatherParticles
            .geometry
            .attributes
            .position
            .array;

    const weather =
        localState.world.weather;

    const speed =
        weather === "storm"
            ? 1.5
            : weather === "heavy_rain"
                ? 1
                : .55;

    for(
        let i=1;
        i<positions.length;
        i+=3
    ){

        positions[i]-=speed;

        if(positions[i]<0){
            positions[i]=50;
        }
    }

    weatherParticles
        .geometry
        .attributes
        .position
        .needsUpdate=true;
}

/* =========================================================
   DAY / NIGHT
========================================================= */

function updateDayNight(){

    const time =
        localState.world.time || 8;

    let daylight=1;

    if(time<6 || time>19){
        daylight=.25;
    }else if(time<8){
        daylight=.55;
    }else if(time>17){
        daylight=.55;
    }

    if(ambientLight){
        ambientLight.intensity =
            daylight *
            (
                localState.world.weather ===
                "storm"
                    ? .4
                    : .65
            );
    }

    if(sunLight){
        sunLight.intensity =
            daylight *
            (
                localState.world.weather ===
                "storm"
                    ? .35
                    : .95
            );
    }
}

function openModal(id){

    document
        .querySelectorAll(".modal")
        .forEach(modal=>{
            modal.style.display="none";
        });

    const modal =
        document.getElementById(id);

    if(!modal) return;

    modal.style.display="block";

    if(id==="inventory-modal"){
        renderInventory();
    }

    if(id==="market-modal"){
        renderMarket();
    }

    if(id==="job-modal"){
        renderJobs();
    }

    if(id==="business-modal"){
        renderBusinesses();
    }

    if(id==="furniture-modal"){
        renderFurniture();
    }
}

function closeAllModals(){

        .querySelectorAll(".modal")
        .forEach(modal=>{
            modal.style.display="none";

}

function refreshOpenModal(){

    const visible =
        Array.from(
            document.querySelectorAll(".modal")
        ).find(
            modal =>
                modal.style.display === "block"
        );

    if(!visible) return;

    if(
        visible.id ===
        "inventory-modal"
    ){
        renderInventory();

    if(
        visible.id ===
        "market-modal"
    ){
        renderMarket();
    }

    if(
        visible.id ===
        "job-modal"
    ){
        renderJobs();
    }

    if(

        "business-modal"
    ){
        renderBusinesses();
    }

    if(

    ){

    }
}

/* =========================================================
   CHAT
========================================================= */

function sendChat(){

    const input =
        document.getElementById(
            "chat-input"
        );

    const text =
        input.value.trim();

    if(!text) return;

    send({
        type:"CHAT",
        text
    });

    input.value="";
}

document
    .getElementById("chat-input")
    .addEventListener(
        "keydown",
        event=>{

            if(event.key==="Enter"){
                event.preventDefault();
                sendChat();
            }
        }
    );

function addChat(sender,text){

    const box =
        document.getElementById(
            "chat-messages"
        );

    const row =
        document.createElement(
            "div"
        );

    row.innerHTML=
        `<b>${escapeHTML(sender)}:</b>
         ${escapeHTML(text)}`;

    box.appendChild(row);

    while(
        box.children.length>80
    ){
        box.removeChild(
            box.firstChild
        );
    }

    box.scrollTop =
        box.scrollHeight;
}

/* =========================================================
   ANIMATION
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    if(!renderer || !scene || !camera){
        return;
    }

    updateMovement();
    updateCamera();
    updateRainAnimation();
    updateDayNight();

    renderer.render(
        scene,
        camera
    );
}

/* =========================================================
   RESIZE
========================================================= */

function resizeRenderer(){

    if(!camera || !renderer){
        return;
    }

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}
