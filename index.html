<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BUÔN GÌ BÁN — Pastel Town</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#b8d9e8;color:#795740}
canvas{display:block;width:100%;height:100%;touch-action:none}
button,input{font-weight:bold;cursor:pointer;touch-action:manipulation;color:#795740}
button{border:2px solid #edc99a;border-radius:10px;background:#fff0d3;padding:10px}
#hud{position:fixed;top:7px;left:7px;right:7px;display:flex;gap:5px;flex-wrap:wrap;pointer-events:none;z-index:2}
.pill,.quick,.businessBtn{padding:7px 9px;background:#fff9e9;border:2px solid #edc99a;border-radius:11px;box-shadow:0 3px #d8ae82;font-size:11px}
#stats{position:fixed;top:50px;left:7px;display:flex;gap:4px;flex-wrap:wrap;max-width:calc(100% - 150px);pointer-events:none;z-index:2}
.stat{padding:5px 7px;background:#fff9e9ed;border:1px solid #edc99a;border-radius:8px;font-size:10px}
#menuBtn{position:fixed;top:88px;right:8px;z-index:6;max-width:140px;padding:8px}
#quick{position:fixed;top:130px;right:8px;display:flex;flex-direction:column;align-items:stretch;gap:6px;width:138px;max-height:calc(100dvh - 265px);overflow-y:auto;overscroll-behavior:contain;padding:2px 4px 6px;z-index:6}
#quick button{display:block;width:100%;min-width:0;min-height:36px;padding:8px 5px;font-size:11px;line-height:1.25;white-space:normal;overflow-wrap:anywhere}
#businessButtons{position:fixed;top:310px;right:8px;display:flex;flex-direction:column;align-items:stretch;gap:7px;width:138px;z-index:6}
.businessBtn{display:block;width:100%;min-width:0;min-height:39px;padding:8px 5px;background:#fff0d3;font-size:11px;line-height:1.25;white-space:normal;overflow-wrap:anywhere}
#pad{position:fixed;bottom:12px;left:10px;width:112px;height:112px;display:grid;grid-template:repeat(3,minmax(0,1fr))/repeat(3,minmax(0,1fr));gap:4px;z-index:5}
.move{border:2px solid #edc99a;border-radius:12px;background:#fff9e9;font-size:20px;box-shadow:0 3px #d8ae82;min-width:0;min-height:0;padding:0}
.up{grid-area:1/2}.left{grid-area:2/1}.right{grid-area:2/3}.down{grid-area:3/2}
#act{position:fixed;right:12px;bottom:18px;width:76px;height:76px;border:3px solid #edc99a;border-radius:50%;background:#f5c879;box-shadow:0 4px #d8ae82;z-index:7;font-size:11px}
#hint{position:fixed;bottom:132px;left:50%;transform:translateX(-50%);width:max-content;max-width:48%;background:#fff9e9;border:2px solid #edc99a;border-radius:11px;padding:7px;font-size:10px;text-align:center;pointer-events:none;z-index:2}
#map{position:fixed;right:98px;bottom:12px;width:68px;height:54px;border:2px solid #fff9e9;border-radius:7px;background:#b4e49b;pointer-events:none;z-index:3}
#modal{display:none;position:fixed;inset:0;background:#4b423b88;z-index:10;align-items:center;justify-content:center;padding:12px}
#panel{width:min(540px,100%);max-height:83dvh;overflow:auto;background:#fff9e9;border:3px solid #edc99a;border-radius:18px;padding:14px;box-shadow:0 8px #896653}
#panel h2{margin:0 0 8px;font-size:19px}
#panel p{font-size:13px;line-height:1.5}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:10px}
.action{border:2px solid #edc99a;background:#fff0d3;border-radius:10px;padding:10px 6px;line-height:1.3;overflow-wrap:anywhere}
.action:disabled{opacity:.45}
.close{width:100%;margin-top:10px;border:0;background:#d96855;color:white;border-radius:10px;padding:11px}
#toast{position:fixed;top:100px;left:50%;transform:translateX(-50%);background:#fff9e9;border:2px solid #edc99a;border-radius:11px;padding:9px;display:none;z-index:20;font-weight:bold;font-size:12px;text-align:center;max-width:90%}
#startScreen{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(#b8d9e8dd,#b4e49bee)}
#startCard{width:min(420px,100%);background:#fff9e9;border:4px solid #edc99a;border-radius:24px;padding:22px;text-align:center;box-shadow:0 9px #d8ae82}
#startCard h1{font-size:27px;margin:4px 0 8px;color:#d96855}
#startCard p{font-size:13px;line-height:1.5}
#playerName{width:100%;padding:12px;border:2px solid #edc99a;border-radius:10px;margin:8px 0 12px;font-size:16px;background:white}
.genderChoices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.genderChoice{font-size:17px;padding:15px 5px}
.genderChoice.selected{background:#f5c879;border-color:#d96855}
#startGame{width:100%;margin-top:14px;background:#d96855;color:white;border:0;font-size:16px;padding:14px}
@media(max-width:430px){
 #hud{top:5px;left:4px;right:4px;gap:4px}.pill{font-size:9px;padding:5px}
 #stats{top:44px;left:5px;max-width:calc(100% - 140px);gap:3px}
 .stat{font-size:9px;padding:4px 5px}
 #menuBtn{top:84px;right:5px;padding:7px;font-size:10px}
 #quick{top:124px;right:4px;width:126px;max-height:calc(100dvh - 260px);gap:5px}
 #quick button{min-height:33px;padding:7px 4px;font-size:10px}
 #businessButtons{top:290px;right:4px;width:126px;gap:6px}
 .businessBtn{min-height:36px;padding:7px 4px;font-size:10px}
 #pad{left:6px;bottom:9px;width:104px;height:104px}
 .move{font-size:18px}
 #act{right:7px;bottom:14px;width:70px;height:70px;font-size:10px}
 #map{right:84px;bottom:10px;width:62px;height:49px}
 #hint{bottom:122px;max-width:46%;font-size:9px;padding:6px}
 #toast{top:100px;max-width:78%}
}
@media(max-height:600px){
 #quick{max-height:135px;overflow-y:auto}
 #businessButtons{top:auto;bottom:150px}
 #hint{bottom:108px}
 #pad{width:92px;height:92px}
 #act{width:62px;height:62px}
}
@media(max-width:360px){
 #quick,#businessButtons{width:112px;right:3px}
 #quick button,.businessBtn{font-size:9px;padding:6px 3px}
 #menuBtn{right:3px;font-size:9px}
 #stats{max-width:calc(100% - 122px)}
 #map{right:76px;width:54px;height:44px}
 #act{right:5px;width:60px;height:60px}
 #pad{left:5px;width:88px;height:88px}
 #hint{max-width:43%;font-size:8px}
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
 <div class="pill">🏡 BUÔN GÌ BÁN</div>
 <div class="pill">💰 <span id="money">1.500.000</span>đ</div>
 <div class="pill">⭐ LV <span id="level">1</span></div>
</div>

<div id="stats">
 <div class="stat">📅 Ngày <span id="day">1</span></div>
 <div class="stat">🍜 Kho <span id="stock">0</span></div>
 <div class="stat">❤️ Uy tín <span id="rep">0</span></div>
 <div class="stat">🪑 Bàn <span id="tableCount">5</span></div>
 <div class="stat">🕒 <span id="clock">08:00</span></div>
</div>

<button id="menuBtn" class="quick">📋 Trạng thái</button>
<div id="quick">
 <button class="quick" id="marketBtn">🛍️ Cửa hàng</button>
 <button class="quick" id="staffBtn">👩‍💼 Nhân viên</button>
 <button class="quick" id="findBtn">📍 Về quán của tôi</button>
 <button class="quick" id="musicBtn">🎵 Nhạc chill: Tắt</button>
</div>
<div id="businessButtons">
 <button class="businessBtn" id="rentBtn">🏪 Thuê mặt bằng</button>
 <button class="businessBtn" id="sellBtn">🍱 Bán đồ ăn</button>
</div>
<div id="hint">🌷 Chạm NPC, công trình hoặc bấm TƯƠNG TÁC để chơi</div>
<div id="toast"></div>
<div id="pad">
 <button class="move up" data-k="up">▲</button>
 <button class="move left" data-k="left">◀</button>
 <button class="move right" data-k="right">▶</button>
 <button class="move down" data-k="down">▼</button>
</div>
<button id="act">TƯƠNG<br>TÁC</button>
<canvas id="map" width="300" height="240"></canvas>

<div id="modal">
 <div id="panel">
  <h2 id="panelTitle">BUÔN GÌ BÁN</h2>
  <div id="panelBody"></div>
  <div class="actions" id="actions"></div>
  <button class="close" id="close">ĐÓNG</button>
 </div>
</div>

<div id="startScreen">
 <div id="startCard">
  <h1>🏡 BUÔN GÌ BÁN</h1>
  <p>Chào mừng đến với thị trấn Pastel!<br>Chọn nhân vật và đặt tên trước khi bắt đầu.</p>
  <div class="genderChoices">
   <button class="genderChoice selected" id="chooseBoy">👦 Nhân vật nam</button>
   <button class="genderChoice" id="chooseGirl">👧 Nhân vật nữ</button>
  </div>
  <input id="playerName" maxlength="18" placeholder="Nhập tên nhân vật..." value="Người chơi">
  <button id="startGame">🎮 BẮT ĐẦU CHƠI</button>
 </div>
</div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const canvas=$('game'),ctx=canvas.getContext('2d');
const map=$('map'),mctx=map.getContext('2d');
const WORLD={w:3000,h:2400};
const roadsX=[500,1250,2000,2750],roadsY=[450,1050,1650,2250];
let cw=innerWidth,ch=innerHeight,dpr=1,zoom=1,camX=0,camY=0;
let last=0,gameTime=0,clockMinutes=480,dayTimer=0,toastTimer=0;
let modalOpen=false,insideShop=false,musicOn=false,audioCtx=null,musicTimer=null,musicStep=0;
let chosenGender='boy',gameStarted=false,eventElapsed=0,lastRentDay=0,lastTaxDay=0;
const keys={};

const state={
 money:1500000,day:1,level:1,xp:0,rep:0,
 restaurantRented:false,restaurantOpen:false,
 shopX:690,shopY:625,shopTables:5,decor:0,
 staff:0,staffRoles:{cook:0,server:0,cashier:0},
 mealsSold:0,drinksSold:0,reviews:0,rating:5,
 playerName:'Người chơi',playerGender:'boy',
 lastRentDay:0,lastTaxDay:0,
 inventory:{rice:5,meat:3,vegetables:5,noodles:3,coffee:2,milk:2,sugar:3,water:2,petfood:2},
 cooked:{},drinks:{},saveVersion:5,expanded:false
};

function save(){
 try{localStorage.setItem('buonGiBanSave',JSON.stringify(state))}catch(e){}
}
function load(){
 try{
  const d=JSON.parse(localStorage.getItem('buonGiBanSave')||'null');
  if(d&&d.saveVersion>=2)Object.assign(state,d);
 }catch(e){}
 if(!state.inventory)state.inventory={rice:5,meat:3,vegetables:5,noodles:3,coffee:2,milk:2,sugar:3,water:2,petfood:2};
 if(!state.cooked)state.cooked={};
 if(!state.drinks)state.drinks={};
 if(!state.staffRoles)state.staffRoles={cook:0,server:0,cashier:0};
 if(!Number.isFinite(state.shopTables)||state.shopTables<0)state.shopTables=5;
 if(state.level>=5&&!state.expanded){state.shopTables+=10;state.expanded=true}
 lastRentDay=state.lastRentDay||0;
 lastTaxDay=state.lastTaxDay||0;
}
load();

const player={x:680,y:560,skin:'#ffd4b5',hair:'#54332b',shirt:'#e9786e',pants:'#303344',speed:210,gender:state.playerGender||'boy',name:state.playerName||'Người chơi'};
const buildings=[],npcs=[],cars=[],pets=[],customers=[],staffActors=[];
const landlord={x:1165,y:535,phase:0,skin:'#eac09b',hair:'#453126',shirt:'#673ab7',pants:'#24243b',gender:'boy',name:'CHỦ MẶT BẰNG'};
let eventCharacter=null,eventPoliceUntil=0,robberyUntil=0;

const parks=[
 {x:50,y:35,w:370,h:290,name:'🌳 CÔNG VIÊN HOA'},
 {x:2180,y:35,w:570,h:290,name:'🌷 VƯỜN HOA'},
 {x:65,y:1250,w:420,h:280,name:'🏞️ CÔNG VIÊN BỜ HỒ'},
 {x:2200,y:1250,w:520,h:280,name:'🌴 CÔNG VIÊN'},
 {x:1050,y:55,w:900,h:280,name:'⛲ QUẢNG TRƯỜNG'}
];
function addBuilding(x,y,w,h,type,name,color,roof,shopType=''){
 buildings.push({x,y,w,h,type,name,color,roof,shopType,occupied:false});
}

function generateBuildings(){
 // Đảm bảo đúng 5 loại cửa hàng theo yêu cầu và luôn hiển thị trên bản đồ
 addBuilding(565,625,120,110,'shop','Cửa hàng Quần Áo','#f7d7bf','#e58d89','quanao');
 addBuilding(715,625,120,110,'market','Tiệm Gạo','#cce5d4','#76b7a0','gao');
 addBuilding(865,625,120,110,'cafe','Quán Trà Sữa','#f3d3b6','#efa76b','trasua');
 addBuilding(1015,625,120,110,'restaurant','Quán Cơm Tấm','#d9d6f3','#8a9ee2','comtam');
 addBuilding(1165,625,120,110,'restaurant','Quán Bún Bò','#f6d9e6','#d96855','bunbo');

 const blocks=[
 [55,235,370,['house','house','house']],
 [1320,235,620,['house','house','house','house']],
 [2070,235,620,['apt','house','house','house']],
 [55,625,370,['house','house','house']],
 [1320,625,620,['market','restaurant','shop','supermarket']],
 [2070,625,620,['supermarket','shop','restaurant','cafe']],
 [55,1225,370,['house','house','house']],
 [565,1225,620,['apt','house','house','house']],
 [1320,1225,620,['restaurant','supermarket','shop','cafe']],
 [2070,1225,620,['house','house','house','house']],
 [55,1825,370,['house','house','house']],
 [565,1825,620,['restaurant','shop','supermarket','cafe']],
 [1320,1825,620,['apt','house','house','house']],
 [2070,1825,620,['restaurant','supermarket','shop','market']]
 ];
 const colors=['#fff5df','#f7d7bf','#cce5d4','#f3d3b6','#d9d6f3','#f6d9e6','#e8e6b8'];
 const roofs=['#e58d89','#76b7a0','#efa76b','#8a9ee2','#d96855','#d88c66'];
 const labels={house:['NHÀ DÂN','NHÀ NHỎ','GIA ĐÌNH'],apt:['CHUNG CƯ','CĂN HỘ'],shop:['TẠP HÓA','CỬA HÀNG'],restaurant:['QUÁN ĂN','CƠM NGON','MÌ GÀ'],supermarket:['SIÊU THỊ MINI','SIÊU THỊ'],market:['CHỢ','THỰC PHẨM'],cafe:['QUÁN CÀ PHÊ','TIỆM BÁNH']};
 for(const [bx,by,bw,types] of blocks){
  const gap=10,n=types.length,cell=(bw-gap*(n-1))/n;
  types.forEach((type,i)=>{
   const w=type==='apt'?105:Math.min(130,cell-5),h=type==='apt'?145:110;
   const x=bx+i*(cell+gap)+(cell-w)/2,y=by+(type==='apt'?-25:0);
   const list=labels[type]||labels.house;
   addBuilding(x,y,w,h,type,list[i%list.length],colors[(buildings.length*3+i)%colors.length],roofs[(buildings.length+i)%roofs.length],'');
  });
 }
 addBuilding(1430,845,125,105,'pharmacy','NHÀ THUỐC','#d9f1e4','#4dba91','');
 addBuilding(1580,845,125,105,'NỘI THẤT','#f6dfbd','#d88c66','');
}
generateBuildings();

function restoreRentedBuilding(){
 if(state.restaurantRented){
  const b=buildings.find(b=>Math.abs(b.x-state.shopX)<2&&Math.abs(b.y-state.shopY)<2);
  if(b)b.occupied=true;
 }
}
restoreRentedBuilding();

let seed=82741;
function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
const npcShirts=['#f28cab','#258bd4','#3474a8','#bb83c9','#31313f','#70b7a1','#f2b75f','#e9786e','#8a9ee2','#c17b58'];
for(let i=0;i<100;i++){
 const y=roadsY[i%roadsY.length]+(i%3===0?-125:125);
 npcs.push({x:80+rand()*(WORLD.w-160),y,phase:rand()*6,skin:['#ffd4b5','#f4c6a1','#eac09b'][i%3],hair:['#54332b','#30262b','#80502e'][i%3],shirt:npcShirts[i%npcShirts.length],pants:'#303344',bag:i%5===0,gender:i%2?'girl':'boy',speed:20+rand()*25,talk:rand()*5});
}
const vehicleTypes=['car','car','car','taxi','bus','truck','ambulance','police','motorbike'];
for(let i=0;i<28;i++){
 const type=vehicleTypes[i%vehicleTypes.length];
 cars.push({x:rand()*WORLD.w,y:roadsY[i%4]+(i%2?37:-37),speed:(type==='bus'?65:type==='truck'?58:85)+rand()*45,dir:i%2?1:-1,type,color:['#e63946','#457b9d','#ffb703','#6a4c93','#2a9d8f','#f6f0e8'][i%6]});
}
for(let i=0;i<16;i++)pets.push({x:120+rand()*(WORLD.w-240),y:120+rand()*(WORLD.h-240),type:i%2?'🐈':'🐕',phase:rand()*8});

function resize(){
 dpr=Math.min(devicePixelRatio||1,2);cw=innerWidth;ch=innerHeight;
 canvas.width=cw*dpr;canvas.height=ch*dpr;zoom=Math.min(cw/780,ch/550);
}
addEventListener('resize',resize);resize();
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function ellipse(x,y,rx,ry,c){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=c;ctx.fill()}
function rounded(x,y,w,h,r,c){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=c;ctx.fill()}
function line(x,y,x2,y2,c,w=2){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.strokeStyle=c;ctx.lineWidth=w;ctx.stroke()}
function label(t,x,y,size=12,c='#795740'){ctx.font=`bold ${size}px Arial`;ctx.textAlign='center';ctx.fillStyle=c;ctx.fillText(t,x,y)}

function drawTree(x,y,s=1){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);ellipse(0,22,34,12,'#a4c58b');rect(-6,2,12,24,'#ad7651');
 ellipse(-19,-1,24,24,'#55b879');ellipse(13,-10,28,28,'#69c77d');ellipse(27,8,21,21,'#50b977');ellipse(-5,-28,22,22,'#91dc85');ctx.restore();
}
function drawFlowers(x,y,s=1){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);ellipse(0,7,27,10,'#67bd74');
 for(let i=0;i<3;i++){const px=(i-1)*18,py=(i%2)*-5;for(let j=0;j<5;j++){let a=j*Math.PI*2/5;ellipse(px+Math.cos(a)*5,py+Math.sin(a)*5,4,4,['#fff5df','#f5a4ce','#d9c7ff'][i])}ellipse(px,py,2.5,2.5,'#f2c158')}
 ctx.restore();
}
function drawRoads(){
 rect(0,0,WORLD.w,WORLD.h,'#b4e49b');
 for(let y=0;y<WORLD.h;y+=90)for(let x=0;x<WORLD.w;x+=100)rect(x,y,98,88,'#f7e4bd');
 for(const p of parks){
  rounded(p.x,p.y,p.w,p.h,25,'#8dce7e');rounded(p.x+8,p.y+8,p.w-16,p.h-16,22,'#b4e49b');
  line(p.x+15,p.y+p.h/2,p.x+p.w-15,p.y+p.h/2,'#f7e4bd',22);line(p.x+p.w/2,p.y+15,p.x+p.w/2,p.y+p.h-15,'#f7e4bd',20);
  label(p.name,p.x+p.w/2,p.y+28,14);
  for(let i=0;i<p.w/100;i++){drawTree(p.x+35+i*90,p.y+65,.5);drawFlowers(p.x+45+i*80,p.y+p.h-32,.6)}
 }
 for(const y of roadsY){
  rect(0,y-72,WORLD.w,144,'#87949e');rect(0,y-78,WORLD.w,7,'#fff4dd');rect(0,y+71,WORLD.w,7,'#fff4dd');
  for(let x=0;x<WORLD.w;x+=110)rect(x,y-2,55,4,'#fff4dd');
 }
 for(const x of roadsX){
  rect(x-62,0,124,WORLD.h,'#87949e');rect(x-69,0,7,WORLD.h,'#fff4dd');rect(x+62,0,7,WORLD.h,'#fff4dd');
  for(let y=0;y<WORLD.h;y+=110)rect(x-2,y,4,55,'#fff4dd');
 }
}
function drawHouse(b){
 const{x,y,w,h,type,name,color,roof}=b;
 rounded(x+5,y+8,w,h,7,'#a9b69a');rounded(x,y,w,h,7,color);rect(x+3,y+h-9,w-6,9,'#e9c99c');
 ctx.beginPath();ctx.moveTo(x-8,y+12);ctx.lineTo(x+w/2,y-27);ctx.lineTo(x+w+8,y+12);ctx.closePath();ctx.fillStyle=roof;ctx.fill();ctx.strokeStyle='#896653';ctx.lineWidth=2;ctx.stroke();
 rounded(x+9,y+24,23,25,3,'#8ccce9');rounded(x+w-32,y+24,23,25,3,'#8ccce9');rounded(x+w/2-11,y+h-38,22,38,5,'#b77c58');

function update(dt){
 let dx=0,dy=0;if(keys.left)dx--;if(keys.right)dx++;if(keys.up)dy--;if(keys.down)dy++;
 if(dx&&dy){dx*=.707;dy*=.707}
 if(!insideShop&&gameStarted){
  const nx=Math.max(15,Math.min(WORLD.w-15,player.x+dx*player.speed*dt)),ny=Math.max(15,Math.min(WORLD.h-15,player.y+dy*player.speed*dt));
  if(!collides(nx,player.y))player.x=nx;if(!collides(player.x,ny))player.y=ny;
 }
 for(const n of npcs){
  n.x=Math.max(20,Math.min(WORLD.w-20,n.x+Math.sin(gameTime*.00045+n.phase)*25*dt));
  n.y+=Math.cos(gameTime*.00035+n.phase)*5*dt;
 }
 for(const c of cars){c.x+=c.speed*c.dir*dt;if(c.dir>0&&c.x>WORLD.w+80)c.x=-80;if(c.dir<0&&c.x<-80)c.x=WORLD.w+80}
 for(const p of pets){p.x+=Math.sin(gameTime*.001+p.phase)*12*dt;p.y+=Math.cos(gameTime*.0008+p.phase)*3*dt}
 for(const s of staffActors){
  if(s.role==='server'&&customers.length){
   const c=customers[Math.floor(gameTime/1800)%customers.length];
   s.x+=(c.x-s.x)*Math.min(1,dt*.4);s.y+=(c.y-20-s.y)*Math.min(1,dt*.4);
  }
 }
 updateCustomers(dt);
 if(gameStarted){
  clockMinutes+=dt/6;
  if(clockMinutes>=1440){
   clockMinutes-=1440;state.day++;save();toast('🌞 Bắt đầu ngày '+state.day);
   checkPayments();
  }
  eventElapsed+=dt;
  if(eventElapsed>=1800){eventElapsed-=1800;triggerRandomEvent()}
 }
 if(eventCharacter&&Date.now()>eventCharacter.until)eventCharacter=null;
 if(Date.now()>eventPoliceUntil)eventPoliceUntil=0;
 if(Date.now()>robberyUntil)robberyUntil=0;
 updateHUD();
}

function collides(x,y){
 for(const b of buildings){
  if(state.restaurantRented&&Math.abs(b.x-state.shopX)<2&&Math.abs(b.y-state.shopY)<2){
   if(x>b.x-30&&x<b.x+b.w+30&&y>b.y-15&&y<b.y+b.h+35)return true;
  }else if(x>b.x-12&&x<b.x+b.w+12&&y>b.y-14&&y<b.y+b.h+8)return true;
 }
 if(Math.hypot(x-landlord.x,y-landlord.y)<16)return true;
 return false;
}

function updateCustomers(dt){
 if(!state.restaurantRented||!state.restaurantOpen)return;
 const b=buildings.find(b=>b.x===state.shopX&&b.y===state.shopY);if(!b)return;
 if(customers.length<Math.min(15,Math.max(3,state.shopTables))&&Math.random()<dt*.7){
  const i=customers.length;
  customers.push({x:b.x-60-Math.random()*100,y:b.y+b.h+70+Math.random()*90,tx:b.x+20+(i%5)*29,ty:b.y+b.h+35+Math.floor(i/5)*38,phase:Math.random()*8,eat:0,shirt:npcShirts[i%npcShirts.length],skin:'#ffd4b5',hair:'#54332b',pants:'#303344',gender:i%2?'girl':'boy',mode:'walk'});
 }
 for(let i=customers.length-1;i>=0;i--){
  const c=customers[i];
  if(c.mode==='walk'){
   const dx=c.tx-c.x,dy=c.ty-c.y,d=Math.hypot(dx,dy);
   if(d<3){c.mode='eat';c.eat=8+Math.random()*8;c.paid=false}
   else{c.x+=dx/d*45*dt;c.y+=dy/d*45*dt}
  }else if(c.mode==='eat'){
   c.eat-=dt;
   if(c.eat<=0){
    if(state.staffRoles.server>0)toast('🍱 Nhân viên đang bưng đồ ăn ra bàn!');
    c.mode='leave';c.tx=b.x+b.w+80;c.ty=b.y+b.h+90;
   }
  }else{
   const dx=c.tx-c.x,dy=c.ty-c.y,d=Math.hypot(dx,dy);
   if(d<4){
    if(!c.paid){
     c.paid=true;
     if(Math.random()<.12){
      state.rep=Math.max(0,state.rep-1);toast('🏃 Khách ăn quỵt rồi bỏ chạy!');
     }else{
      state.money+=12000;state.rep++;state.mealsSold++;gainXP(2);
      if(state.staffRoles.cashier>0)toast('🧾 Thu ngân đã nhận tiền của khách!');
     }
     save();
    }
    customers.splice(i,1);
   }else{c.x+=dx/d*55*dt;c.y+=dy/d*55*dt}
  }
 }
}

function checkPayments(){
 if(!state.restaurantRented)return;
 if(state.day%15===0&&state.day!==lastRentDay){
  lastRentDay=state.day;state.lastRentDay=state.day;
  const rent=250000;
  if(state.money>=rent){state.money-=rent;toast('🏠 Đã trả tiền mặt bằng 250.000đ!')}
  else{state.rep=Math.max(0,state.rep-3);toast('⚠️ Không đủ tiền thuê mặt bằng! Uy tín giảm.')}
  save();
 }
 if(state.day%30===0&&state.day!==lastTaxDay){
  lastTaxDay=state.day;state.lastTaxDay=state.day;
  const tax=150000;
  if(state.money>=tax){state.money-=tax;toast('🧾 Đã đóng thuế tháng: 150.000đ')}
  else{state.rep=Math.max(0,state.rep-2);toast('⚠️ Thiếu tiền đóng thuế! Uy tín giảm.')}
  save();
 }
}

  else toast('🎤 Sơn Tùng M-TP xuất hiện ở thị trấn!');
 }else if(type==='tiktoker'){
  if(state.restaurantRented&&state.restaurantOpen){
   const good=Math.random()<.7;
   if(good){state.rep+=4;state.reviews++;state.money+=50000;toast('📱 TikToker review tốt về quán! +50.000đ, +4 uy tín')}
   else{state.rep=Math.max(0,state.rep-2);toast('📱 TikToker chê món ăn! Uy tín giảm 2')}

 }else if(type==='police'){
  eventPoliceUntil=Date.now()+60000;
  const outdoor=state.restaurantRented&&state.shopTables>5;
  if(outdoor){state.money=Math.max(0,state.money-100000);toast('🚓 Công an kiểm tra lấn chiếm vỉa hè! Phạt 100.000đ')}
  else toast('🚓 Công an đang tuần tra các tuyến phố!');
 }else if(type==='robbery'){
  if(state.restaurantRented&&state.restaurantOpen&&state.money>0){
   const loss=Math.min(state.money,Math.floor(50000+Math.random()*100000));
   state.money-=loss;robberyUntil=Date.now()+30000;toast('🚨 Có vụ cướp! Quán mất '+loss.toLocaleString('vi-VN')+'đ');
  }else toast('🚨 Có vụ cướp xảy ra ở khu phố. Hãy cẩn thận!');
 }else{
  if(state.restaurantRented&&state.restaurantOpen){
   state.rep=Math.max(0,state.rep-1);toast('🏃 Khách ăn quỵt, không trả tiền! Uy tín giảm 1');
  }else toast('🏃 Có khách ăn quỵt trong khu phố!');
 }
 save();updateHUD();

const meals=[['Cơm trắng',12000,'rice'],['Cơm trứng',20000,'rice'],['Cơm gà',35000,'meat'],['Phở bò',40000,'meat'],['Bún bò',38000,'meat'],['Mì xào',30000,'noodles'],['Bánh mì',20000,'meat'],['Gỏi cuốn',25000,'vegetables']];
const drinks=[['Trà đá',5000,'water'],['Trà chanh',15000,'sugar'],['Trà sữa',28000,'milk'],['Cà phê đen',18000,'coffee'],['Nước cam',22000,'sugar']];
const names={rice:'Gạo',meat:'Thịt',vegetables:'Rau củ',noodles:'Mì và bún',coffee:'Cà phê',milk:'Sữa',sugar:'Đường',water:'Nước',petfood:'Thức ăn thú cưng'};
const prices={rice:12000,meat:30000,vegetables:10000,noodles:15000,coffee:25000,milk:18000,sugar:8000,water:5000,petfood:15000};

function openStatus(){
 openPanel('📋 TRẠNG THÁI',
 `Tên: ${state.playerName} • ${state.playerGender==='girl'?'Nhân vật nữ':'Nhân vật nam'}<br>
 Ngày ${state.day} • Cấp ${state.level} • XP ${state.xp}/${state.level*100}<br>
 Tiền: ${state.money.toLocaleString('vi-VN')}đ<br>Uy tín: ${state.rep}<br>
 Quán: ${state.restaurantRented?'Đã thuê':'Chưa thuê'} • ${state.restaurantOpen?'Đang mở':'Đang đóng'}<br>
 Bàn ghế: ${state.shopTables}<br>Nhân viên: ${state.staff}<br>
 Đánh giá: ${state.rating.toFixed(1)}⭐<br>
 Kho: ${Object.keys(state.inventory).map(k=>(names[k]||k)+': '+(state.inventory[k]||0)).join(' • ')}`,
 [btn('💾 Lưu game',()=>{save();toast('Đã lưu game!')}),btn('🍜 Quản lý quán',openRestaurant),btn('📦 Kho nguyên liệu',openWarehouse),btn('🪑 Bàn ghế & trang trí',openFurniture),btn('🎵 Nhạc chill',toggleMusic),btn('📍 Tìm quán',findMyShop)]);
}
function openRestaurant(){
 if(!state.restaurantRented){
  openPanel('🏠 GẶP CHỦ MẶT BẰNG','Muốn thuê quán, hãy chạm trực tiếp vào các cửa hàng trên bản đồ hoặc tìm chủ mặt bằng mặc áo tím.',
   [btn('📍 Đi gặp chủ mặt bằng',()=>{closePanel();player.x=landlord.x+65;player.y=landlord.y+45;toast('Đã tìm chủ mặt bằng!')})]);return;
 }
 openPanel('🍜 QUẢN LÝ QUÁN',`Quán ${state.restaurantOpen?'đang mở cửa':'đang đóng cửa'}.<br>🪑 Có ${state.shopTables} bàn.<br>Khách sẽ đến khi quán mở cửa.`,
 [
  btn(state.restaurantOpen?'🔒 Đóng cửa quán':'🔓 Mở cửa đón khách',()=>{state.restaurantOpen=!state.restaurantOpen;save();closePanel();updateHUD();toast(state.restaurantOpen?'🍜 Quán mở cửa, khách bắt đầu đến!':'Đã đóng cửa quán')}),
  btn('📍 Về quán của tôi',findMyShop),btn('👨‍🍳 Nấu món ăn',openCooking),btn('🥤 Pha đồ uống',openDrinks),btn('💰 Bán món đã nấu',sellCooked),btn('🪑 Mua bàn ghế',openFurniture)
 ]);
}
function rentShop(){
 if(state.money<250000)return toast('Không đủ tiền thuê!');
 const choices=buildings.filter(b=>['restaurant','cafe','shop','market'].includes(b.type)&&!b.occupied);
 if(!choices.length)return toast('Không còn mặt bằng trống!');
 const b=choices[0];b.occupied=true;state.shopX=b.x;state.shopY=b.y;state.restaurantRented=true;state.restaurantOpen=false;state.shopTables=5;
 state.lastRentDay=state.day;lastRentDay=state.day;
 moneyChange(-250000);save();closePanel();updateHUD();player.x=b.x+b.w+55;player.y=b.y+b.h+65;
 toast('Đã thuê '+b.name+'! Giá 250.000đ.');
 syncStaff();
}
function findMyShop(){
 if(!state.restaurantRented){toast('Mày chưa thuê mặt bằng! Hãy gặp chủ mặt bằng.');player.x=landlord.x+65;player.y=landlord.y+45;return}
 const b=buildings.find(b=>b.x===state.shopX&&b.y===state.shopY);if(!b){toast('Không tìm thấy mặt bằng đã thuê.');return}
 closePanel();insideShop=false;player.x=b.x+b.w+65;player.y=b.y+b.h+65;
 camX=Math.max(0,Math.min(WORLD.w-cw/zoom,player.x-cw/zoom/2));camY=Math.max(0,Math.min(WORLD.h-ch/zoom,player.y-ch/zoom/2));
 toast('📍 Đã đưa mày về '+b.name);
}
function openCooking(){
 openPanel('👨‍🍳 BẾP','Chọn món để chế biến.',
 meals.map((m,i)=>btn(m[0]+' — '+m[1].toLocaleString('vi-VN')+'đ',()=>{
  if(!state.restaurantRented)return toast('Thuê mặt bằng trước!');
  if((state.inventory[m[2]]||0)<1)return toast('Thiếu '+names[m[2]]+'!');
  state.inventory[m[2]]--;state.cooked[i]=(state.cooked[i]||0)+1;save();closePanel();toast('👨‍🍳 Đã nấu '+m[0]);updateHUD();
 }))
 );
}
function openDrinks(){
 openPanel('🥤 QUẦY PHA CHẾ','Chọn đồ uống để pha.',
 drinks.map((d,i)=>btn(d[0]+' — '+d[1].toLocaleString('vi-VN')+'đ',()=>{
  if((state.inventory[d[2]]||0)<1)return toast('Thiếu '+names[d[2]]+'!');
  state.inventory[d[2]]--;state.drinks[i]=(state.drinks[i]||0)+1;save();closePanel();toast('Đã pha '+d[0]);
 }))
 );
}
function sellCooked(){
 if(!state.restaurantRented)return openRestaurant();
 if(!state.restaurantOpen)return toast('Mở cửa quán trước!');
 const mi=Object.keys(state.cooked).find(k=>state.cooked[k]>0),di=Object.keys(state.drinks).find(k=>state.drinks[k]>0);
 if(mi===undefined&&di===undefined)return toast('Chưa có món nào được nấu hoặc pha!');
 let earned=0;
 if(mi!==undefined){earned+=meals[+mi][1];state.cooked[mi]--;state.mealsSold++;state.rep++}
 if(di!==undefined){earned+=drinks[+di][1];state.drinks[di]--;state.drinksSold++;state.rep++}
 moneyChange(earned);gainXP(15);save();toast('Bán hàng thành công! +'+earned.toLocaleString('vi-VN')+'đ');
}
function openWarehouse(){
 openPanel('📦 KHO NGUYÊN LIỆU',Object.keys(state.inventory).map(k=>(names[k]||k)+': '+state.inventory[k]).join('<br>'),
 Object.keys(prices).map(k=>btn('Mua '+names[k]+' — '+prices[k].toLocaleString('vi-VN')+'đ',()=>{
  if(state.money<prices[k])return toast('Không đủ tiền!');
  moneyChange(-prices[k]);state.inventory[k]=(state.inventory[k]||0)+1;save();closePanel();toast('Đã mua '+names[k]);
 }))
 );
}
function openMarket(){openWarehouse()}
function openFurniture(){
 openPanel('🪑 BÀN GHẾ & TRANG TRÍ',`Số bàn hiện tại: ${state.shopTables}.`,
 [
  btn('🪑 Mua thêm 1 bàn — 80.000đ',()=>{if(!state.restaurantRented)return toast('Thuê quán trước!');if(state.money<80000)return toast('Không đủ tiền!');moneyChange(-80000);state.shopTables++;save();closePanel();toast('Đã thêm 1 bàn!')}),
  btn('🌷 Chậu hoa — 25.000đ',()=>{if(state.money<25000)return toast('Không đủ tiền!');moneyChange(-25000);state.decor++;save();closePanel();toast('Đã trang trí quán!')})
 ]);
}
function openStaff(){
 openPanel('👩‍🍳 NHÂN VIÊN',
 `Tổng nhân viên: ${state.staff}<br>👨‍🍳 Đầu bếp: ${state.staffRoles.cook||0}<br>🍱 Phục vụ: ${state.staffRoles.server||0}<br>🧾 Thu ngân: ${state.staffRoles.cashier||0}<br><br>Giá 120.000đ/người.`,
 [
  btn('👨‍🍳 Thuê đầu bếp — 120.000đ',()=>hireStaff('cook'),state.level<5),
  btn('🍱 Thuê nhân viên phục vụ — 120.000đ',()=>hireStaff('server'),state.level<5),
  btn('🧾 Thuê thu ngân — 120.000đ',()=>hireStaff('cashier'),state.level<5)
 ]);
}
function hireStaff(role){
 if(!state.restaurantRented)return toast('Phải thuê quán trước!');
 if(state.level<5)return toast('Cần lên cấp 5!');
 if(state.money<120000)return toast('Không đủ tiền!');
 moneyChange(-120000);state.staff++;state.staffRoles[role]=(state.staffRoles[role]||0)+1;
 gainXP(5);save();closePanel();syncStaff();
 toast('Đã thuê nhân viên thành công!');
}

function buildingActions(b){
 if(state.restaurantRented&&Math.abs(b.x-state.shopX)<2&&Math.abs(b.y-state.shopY)<2)return openRestaurant();
 if(['restaurant','cafe','shop','market'].includes(b.type)){
  return openPanel('🏪 '+b.name,'Mặt bằng kinh doanh. Bạn có muốn thuê địa điểm này không?',
   [btn('🔑 Thuê mặt bằng — 250.000đ',()=>{
    if(state.money<250000)return toast('Không đủ tiền!');
    b.occupied=true;state.shopX=b.x;state.shopY=b.y;state.restaurantRented=true;state.restaurantOpen=false;state.shopTables=5;
    moneyChange(-250000);save();closePanel();updateHUD();toast('Đã thuê '+b.name+' thành công!');syncStaff();
   },state.money<250000),btn('Đóng',closePanel)]);
 }
 if(b.type==='pharmacy'||b.type==='furniture')return openFurniture();
 return openPanel('🏡 '+b.name,'Một công trình trong thành phố.',[btn('📋 Trạng thái',openStatus)]);
}

function nearestThing(){
 let best=null,dist=Infinity;
 const dL=Math.hypot(player.x-landlord.x,player.y-landlord.y);
 best={kind:'landlord',item:landlord,d:dL};dist=dL;
 for(const b of buildings){const d=Math.hypot(player.x-(b.x+b.w/2),player.y-(b.y+b.h/2));if(d<dist){dist=d;best={kind:'building',item:b,d}}}
 for(const n of npcs){const d=Math.hypot(player.x-n.x,player.y-n.y);if(d<dist){dist=d;best={kind:'npc',item:n,d}}}
 for(const p of pets){const d=Math.hypot(player.x-p.x,player.y-p.y);if(d<dist){dist=d;best={kind:'pet',item:p,d}}}
 return best;
}

function interact(){
 if(!gameStarted)return;
 const t=nearestThing();
 if(!t||t.d>140)return toast('Lại gần NPC hoặc công trình rồi bấm tương tác nhé!');
 if(t.kind==='landlord'){
  if(state.restaurantRented)return openPanel('🏠 CHỦ MẶT BẰNG','Mày đã thuê mặt bằng rồi.',[btn('📍 Về quán',findMyShop)]);
  return openPanel('🏠 CHỦ MẶT BẰNG','Chào mày! Cho thuê mặt bằng giá 250.000đ.',[btn('🔑 Thuê',rentShop,state.money<250000),btn('Đóng',closePanel)]);
 }
 if(t.kind==='building')return buildingActions(t.item);
 if(t.kind==='npc')return openPanel('💬 Người dân','Chào '+state.playerName+'! Chúc mày buôn bán tốt nhé!',[btn('Đóng',closePanel)]);
}

// ---- TÍCH HỢP CHẠM (CLICK/TAP) TRỰC TIẾP TRÊN MÀN HÌNH GAME ----
canvas.addEventListener('click', function(event) {
    if(!gameStarted) return;
    const rect = canvas.getBoundingClientRect();
    const clickX = event.clientX - rect.left + camX;
    const clickY = event.clientY - rect.top + camY;

    // 1. Kiểm tra bấm vào NPC (khoảng cách < 100px)
    for(const npc of npcs){
        const dist = Math.hypot(player.x - npc.x, player.y - npc.y);
        if(clickX >= npc.x - 20 && clickX <= npc.x + 20 && clickY >= npc.y - 50 && clickY <= npc.y + 10){
            if(dist <= 120){
                openPanel('💬 Người dân', 'Chào ' + state.playerName + '! Chúc bạn một ngày tốt lành.', [btn('Đóng', closePanel)]);
                return;
            } else {
                toast('Lại gần NPC hơn để trò chuyện!');
                return;
            }
        }
    }

    // 2. Kiểm tra bấm trực tiếp vào công trình / mặt bằng (khoảng cách < 150px)
    for(const b of buildings){
        if(clickX >= b.x && clickX <= b.x + b.w && clickY >= b.y && clickY <= b.y + b.h){
            const dist = Math.hypot(player.x - (b.x + b.w/2), player.y - (b.y + b.h/2));
            if(dist <= 160){
                buildingActions(b);
            } else {
                toast('Lại gần công trình hơn để tương tác!');
            }
            return;
        }
    }
});

function toggleMusic(){
 if(musicOn){musicOn=false;if(musicTimer)clearInterval(musicTimer);musicTimer=null;$('musicBtn').textContent='🎵 Nhạc chill: Tắt';toast('Đã tắt nhạc chill');return}
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC){toast('Không hỗ trợ nhạc');return}
 try{
  audioCtx=audioCtx||new AC();audioCtx.resume();musicOn=true;$('musicBtn').textContent='🎵 Nhạc chill: Bật';musicStep=0;
  const notes=[261.63,329.63,392,329.63,293.66,349.23,440,349.23];
  function playNote(){
   if(!musicOn||!audioCtx)return;
   const now=audioCtx.currentTime,f=notes[musicStep%notes.length];musicStep++;
   const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.setValueAtTime(f,now);
   gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.045,now+.08);gain.gain.exponentialRampToValueAtTime(.0001,now+.75);
   osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+.8);
  }
  playNote();musicTimer=setInterval(playNote,650);toast('🎵 Đang phát nhạc chill');
 }catch(e){musicOn=false;}
}

$('act').onclick=interact;
$('menuBtn').onclick=openStatus;$('marketBtn').onclick=openMarket;$('staffBtn').onclick=openStaff;
$('rentBtn').onclick=openRestaurant;$('sellBtn').onclick=sellCooked;$('findBtn').onclick=findMyShop;$('musicBtn').onclick=toggleMusic;

$('chooseBoy').onclick=()=>{chosenGender='boy';$('chooseBoy').classList.add('selected');$('chooseGirl').classList.remove('selected')};
$('chooseGirl').onclick=()=>{chosenGender='girl';$('chooseGirl').classList.add('selected');$('chooseBoy').classList.remove('selected')};$('startGame').onclick=()=>{
 const nm=$('playerName').value.trim()||'Người chơi';
 state.playerName=nm.slice(0,18);state.playerGender=chosenGender;
 player.name=state.playerName;player.gender=chosenGender;
 if(chosenGender==='girl'){player.shirt='#c17bce';player.hair='#54332b'}
 else{player.shirt='#e9786e';player.hair='#30262b'}
 gameStarted=true;$('startScreen').style.display='none';save();toast('🎮 Chào '+state.playerName+'! Hãy chạm trực tiếp vào công trình để thuê mặt bằng.');
};

addEventListener('keydown',e=>{
 const m={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};
 if(m[e.key]){keys[m[e.key]]=true;e.preventDefault()}
 if((e.key===' '||e.key==='Enter')&&!modalOpen&&gameStarted)interact();
 if(e.key==='Escape')closePanel();
});
addEventListener('keyup',e=>{
 const m={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};
 if(m[e.key])keys[m[e.key]]=false;
});
addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));
document.querySelectorAll('[data-k]').forEach(el=>{
 const k=el.dataset.k;
 el.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;try{el.setPointerCapture(e.pointerId)}catch(_){}});
 const stop=e=>{e.preventDefault();keys[k]=false};
 el.addEventListener('pointerup',stop);el.addEventListener('pointercancel',stop);el.addEventListener('lostpointercapture',stop);
});
updateHUD();
})();
</script>
