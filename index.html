<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Buôn Gì Bán Nấy 3D</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05080d;
    font-family:Arial,Helvetica,sans-serif;
}

button,input,select{
    font:inherit;
}

button{
    cursor:pointer;
}

#game{
    position:fixed;
    inset:0;
}

#game canvas{
    display:block;
    width:100%;
    height:100%;
}

/* ================= LOGIN ================= */

#login{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(
            circle at 50% 15%,
            #1f77a855,
            transparent 35%
        ),
        linear-gradient(
            145deg,
            #071321,
            #102f4e 55%,
            #06101c
        );
    color:white;
}

.login-box{
    width:min(92%,380px);
    padding:30px;
    border-radius:24px;
    text-align:center;
    background:#07111de6;
    border:1px solid #ffffff22;
    box-shadow:0 25px 80px #000b;
    backdrop-filter:blur(18px);
}

.login-box h1{
    font-size:27px;
    margin-bottom:7px;
    text-shadow:0 5px 20px #000;
}

.login-box p{
    font-size:11px;
    color:#a9bdd2;
    margin-bottom:20px;
    letter-spacing:2px;
}

.login-box input,
.login-box select{
    width:100%;
    height:46px;
    margin-top:10px;
    padding:0 13px;
    border:0;
    border-radius:11px;
    outline:0;
    background:#fff;
    color:#111;
}

.login-box button{
    width:100%;
    height:48px;
    margin-top:15px;
    border:0;
    border-radius:11px;
    color:#fff;
    font-weight:bold;
    background:linear-gradient(
        135deg,
        #ff6d00,
        #ffb300
    );
    box-shadow:0 7px 20px #ff810044;
}

.login-box button:disabled{
    opacity:.6;
}

/* ================= HUD ================= */

#hud{
    position:fixed;
    inset:0;
    z-index:20;
    display:none;
    pointer-events:none;
}

.panel{
    background:#06101dcc;
    border:1px solid #ffffff1c;
    box-shadow:0 10px 35px #0006;
    backdrop-filter:blur(12px);
}

#stats{
    position:absolute;
    left:10px;
    top:10px;
    min-width:205px;
    padding:11px 13px;
    border-radius:14px;
    color:white;
    font-size:12px;
}

.row{
    display:flex;
    align-items:center;
    gap:7px;
    margin:5px 0;
}

.money{
    color:#ffd34d;
    font-weight:bold;
}

.bar{
    width:85px;
    height:6px;
    border-radius:20px;
    background:#ffffff20;
    overflow:hidden;
}

.fill{
    height:100%;
    width:100%;
    background:#35d17b;
}

#energy-fill{
    background:#32b8ff;
}

#hunger-fill{
    background:#ff9d3e;
}

#clock{
    position:absolute;
    right:10px;
    top:10px;
    padding:11px 14px;
    border-radius:14px;
    color:white;
    text-align:right;
}

#clock-time{
    font-size:19px;
    font-weight:bold;
}

#clock-day,
#weather{
    font-size:11px;
    color:#b9c9d8;
    margin-top:3px;
}

#weather{
    color:#ffd34d;
}

/* ================= BUTTONS ================= */

#buttons{
    position:absolute;
    right:10px;
    bottom:10px;
    width:min(330px,46vw);
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    pointer-events:auto;
}

.game-btn{
    min-height:42px;
    padding:7px 4px;
    border:1px solid #ffffff22;
    border-radius:10px;
    color:#fff;
    background:#08131ed9;
    font-size:11px;
    font-weight:bold;
    box-shadow:0 5px 15px #0004;
}

.game-btn:active{
    transform:scale(.96);
}

.orange{
    background:linear-gradient(
        135deg,
        #e96900,
        #ffad00
    );
}

.blue{
    background:linear-gradient(
        135deg,
        #0877e8,
        #0751a9
    );
}

.green{
    background:linear-gradient(
        135deg,
        #168e52,
        #0d6239
    );
}

/* ================= JOYSTICK ================= */

#joystick{
    position:absolute;
    left:18px;
    bottom:22px;
    width:122px;
    height:122px;
    border-radius:50%;
    pointer-events:auto;
    touch-action:none;
    background:#ffffff12;
    border:2px solid #ffffff20;
    box-shadow:inset 0 0 20px #0005;
}

#stick{
    position:absolute;
    width:48px;
    height:48px;
    left:35px;
    top:35px;
    border-radius:50%;
    background:#ffffff99;
    box-shadow:0 5px 20px #0007;
}

/* ================= CHAT ================= */

#chat{
    position:absolute;
    left:155px;
    bottom:10px;
    width:275px;
    height:145px;
    padding:8px;
    border-radius:12px;
    pointer-events:auto;
    background:#0008;
    border:1px solid #ffffff17;
    backdrop-filter:blur(8px);
}

#messages{
    height:105px;
    overflow-y:auto;
    color:#fff;
    font-size:11px;
    line-height:1.45;
}

#chat-input{
    width:100%;
    height:27px;
    padding:0 8px;
    border:0;
    border-radius:6px;
    outline:0;
    background:#ffffff16;
    color:white;
    font-size:11px;
}

#chat-input::placeholder{
    color:#aaa;
}

/* ================= NOTIFICATION ================= */

#notify{
    position:fixed;
    z-index:2000;
    top:76px;
    left:50%;
    transform:translateX(-50%);
    display:none;
    max-width:88%;
    padding:10px 17px;
    border-radius:30px;
    background:#07101bea;
    color:white;
    border:2px solid #35d17b;
    text-align:center;
    font-size:12px;
    font-weight:bold;
}

#status{
    position:fixed;
    z-index:30;
    left:50%;
    bottom:3px;
    transform:translateX(-50%);
    color:#fff9;
    font-size:9px;
    pointer-events:none;
}

/* ================= MODALS ================= */

.modal{
    position:fixed;
    z-index:500;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    display:none;
    width:min(92%,520px);
    max-height:82vh;
    overflow:auto;
    padding:17px;
    border-radius:18px;
    background:#07101cf7;
    color:#fff;
    border:1px solid #ffffff20;
    box-shadow:0 25px 80px #000c;
}

.modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-bottom:11px;
    margin-bottom:12px;
    border-bottom:1px solid #ffffff14;
}

.modal-head h2{
    font-size:17px;
    color:#ffad2e;
}

.close{
    font-size:25px;
    color:#aaa;
    cursor:pointer;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.card{
    padding:10px;
    border-radius:10px;
    background:#ffffff08;
    border:1px solid #ffffff0e;
    font-size:12px;
}

.card small{
    display:block;
    color:#9eabb8;
    margin-top:4px;
}

.card button{
    width:100%;
    margin-top:7px;
    height:31px;
    border:0;
    border-radius:7px;
    color:#fff;
    background:#15884b;
    font-size:11px;
    font-weight:bold;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    #buttons{
        width:205px;
        grid-template-columns:repeat(2,1fr);
        right:7px;
        bottom:7px;
    }

    .game-btn{
        font-size:10px;
        min-height:39px;
    }

    #joystick{
        width:108px;
        height:108px;
        left:14px;
        bottom:15px;
    }

    #stick{
        width:44px;
        height:44px;
        left:30px;
        top:30px;
    }

    #chat{
        left:130px;
        bottom:8px;
        width:175px;
        height:120px;
    }

    #messages{
        height:83px;
    }

    #stats{
        left:7px;
        top:7px;
        min-width:165px;
        font-size:10px;
    }

    #clock{
        right:7px;
        top:7px;
    }
}
</style>

<script>

"use strict";

/* =========================================================
   CONNECTION
========================================================= */

let ws = null;

let myId = null;

let reconnectTimer = null;

let connecting = false;


/* =========================================================
   GAME STATE
========================================================= */

let state = {

    world:{
        day:1,
        time:8,
        weather:"sunny"
    },

    players:{},

    npcs:[],

    vehicles:[],

    buildings:[],

    market:{},

    businesses:{}

};


/* =========================================================
   THREE
========================================================= */

let scene = null;

let camera = null;

let renderer = null;

let ambient = null;

let sun = null;

let initialized = false;

let cityBuilt = false;

let targetCamera = new THREE.Vector3();

let lookTarget = new THREE.Vector3();


/* =========================================================
   MOVEMENT
========================================================= */

let lastMoveSend = 0;

const MOVE_SEND_INTERVAL = 60;


/* =========================================================
   MESHES
========================================================= */

const playerMeshes = {};

const npcMeshes = {};

const vehicleMeshes = {};

const buildingMeshes = {};


/* =========================================================
   KEYBOARD
========================================================= */

const keys = {

    w:false,

    a:false,

    s:false,

    d:false,

    ArrowUp:false,

    ArrowDown:false,

    ArrowLeft:false,

    ArrowRight:false

};


/* =========================================================
   JOYSTICK
========================================================= */

const joystick = {

    active:false,

    x:0,

    y:0,

    pointerId:null

};


/* =========================================================
   HELPERS
========================================================= */

function esc(value){

    return String(value ?? "")

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");
}


function send(data){

    if(
        ws &&
        ws.readyState === WebSocket.OPEN
    ){

        ws.send(
            JSON.stringify(data)
        );

    }

}


function action(name,extra={}){

    send({

        type:"ACTION",

        action:name,

        ...extra

    });

}


function notify(text,success=true){

    const element =
        document.getElementById("notify");

    element.textContent = text;

    element.style.borderColor =
        success
        ? "#35d17b"
        : "#ff4545";

    element.style.display = "block";

    clearTimeout(notify.timer);

    notify.timer = setTimeout(()=>{

        element.style.display = "none";

    },2500);

}


function setStatus(text){

    document.getElementById(
        "status"
    ).textContent = text;

}


/* =========================================================
   LOGIN
========================================================= */

function joinGame(){

    if(connecting){

        return;

    }


    if(location.protocol === "file:"){

        notify(
            "Hãy chạy bằng node server.js, không mở file trực tiếp.",
            false
        );

        return;

    }


    connecting = true;


    const button =
        document.getElementById("join");

    button.disabled = true;

    button.textContent =
        "ĐANG KẾT NỐI...";


    const name =
        (
            document
            .getElementById("name")
            .value
            .trim() ||
            "Trader"
        ).slice(0,20);


    const gender =
        document
        .getElementById("gender")
        .value;


    connectSocket(
        name,
        gender
    );

}


/* =========================================================
   WEBSOCKET
========================================================= */

function connectSocket(
    name,
    gender
){

    clearTimeout(
        reconnectTimer
    );


    const protocol =
        location.protocol === "https:"
        ? "wss:"
        : "ws:";


    const url =
        protocol +
        "//" +
        location.host;


    try{

        ws = new WebSocket(url);

    }catch(error){

        connecting = false;

        resetJoin();

        notify(
            "Không thể tạo WebSocket.",
            false
        );

        return;

    }


    setStatus(
        "🟡 Đang kết nối..."
    );


    ws.onopen = ()=>{

        connecting = false;

        setStatus(
            "🟢 Đã kết nối"
        );


        send({

            type:"JOIN",

            name:name,

            gender:gender

        });

    };


    ws.onmessage = event=>{

        try{

            const data =
                JSON.parse(
                    event.data
                );

            handleServerMessage(data);

        }catch(error){

            console.error(
                "Server message error:",
                error
            );

        }

    };


    ws.onerror = ()=>{

        setStatus(
            "🔴 Lỗi kết nối"
        );

    };


    ws.onclose = ()=>{

        setStatus(
            "🟠 Mất kết nối"
        );


        if(myId){

            notify(
                "Mất kết nối. Đang thử lại...",
                false
            );

        }


        reconnectTimer =
            setTimeout(()=>{

                connectSocket(
                    name,
                    gender
                );

            },3000);

    };

}


function resetJoin(){

    const button =
        document.getElementById(
            "join"
        );

    button.disabled = false;

    button.textContent =
        "VÀO THÀNH PHỐ";

}


/* =========================================================
   SERVER MESSAGE
========================================================= */

function handleServerMessage(data){

    if(data.type === "INIT"){

        myId = data.id;

        state =
            data.state ||
            state;


        document.getElementById(
            "login"
        ).style.display = "none";


        document.getElementById(
            "hud"
        ).style.display = "block";


        resetJoin();


        init3D();

        buildCity();

        syncEntities();

        updateHUD();

        return;

    }


    if(data.type === "TICK"){

        state =
            data.state ||
            state;


        updateHUD();

        syncEntities();

        return;

    }


    if(data.type === "WEATHER"){

        if(
            data.weather !== undefined
        ){

            state.world.weather =
                data.weather;

        }


        if(data.market){

            state.market =
                data.market;

        }


        updateHUD();

        return;

    }


    if(data.type === "NOTIF"){

        notify(
            data.text ||
            "Đã thực hiện.",
            data.success !== false
        );


        refreshModals();

        return;

    }


    if(data.type === "CHAT_MSG"){

        addChat(
            data.sender ||
            "Player",

            data.text ||
            ""
        );

        return;

    }


    if(data.type === "SYSTEM"){

        addChat(
            "HỆ THỐNG",

            data.text ||
            ""
        );

    }

}


/* =========================================================
   THREE INIT
========================================================= */

function init3D(){

    if(initialized){

        return;

    }


    initialized = true;


    scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0x83c8ee
        );


    scene.fog =
        new THREE.FogExp2(
            0x83c8ee,
            0.0065
        );


    camera =
        new THREE.PerspectiveCamera(

            60,

            innerWidth / innerHeight,

            0.1,

            500

        );


    renderer =
        new THREE.WebGLRenderer({

            antialias:true,

            powerPreference:
                "high-performance"

        });


    renderer.setSize(
        innerWidth,
        innerHeight
    );


    renderer.setPixelRatio(
        Math.min(
            devicePixelRatio || 1,
            1.5
        )
    );


    renderer.shadowMap.enabled =
        true;


    renderer.shadowMap.type =
        THREE.PCFSoftShadowMap;


    document
        .getElementById("game")
        .appendChild(
            renderer.domElement
        );


    ambient =
        new THREE.AmbientLight(
            0xffffff,
            0.62
        );


    scene.add(
        ambient
    );


    sun =
        new THREE.DirectionalLight(
            0xffffff,
            1.05
        );


    sun.position.set(
        70,
        110,
        50
    );


    sun.castShadow =
        true;


    sun.shadow.mapSize.set(
        1024,
        1024
    );


    sun.shadow.camera.left =
        -130;

    sun.shadow.camera.right =
        130;

    sun.shadow.camera.top =
        130;

    sun.shadow.camera.bottom =
        -130;


    scene.add(
        sun
    );


    createWorld();

    setupInput();

    animate();

}


/* =========================================================
   3D HELPERS
========================================================= */

function material(
    color,
    roughness=1
){

function createBuildingMesh(
    building
){

    const group =
        new THREE.Group();


    const width =
        Math.max(
            5,
            Number(
                building.w ||
                building.width ||
                8
            )
        );


    const depth =
        Math.max(
            5,
            Number(
                building.d ||
                building.depth ||
                8
            )
        );


    const height =
        Math.max(
            3,
            Number(
                building.h ||
                building.height ||
                7
            )
        );


    const body =
        cube(
            width,
            height,
            depth,
            Number(
                building.color
            ) ||
            0x64748b
        );


    body.position.y =
        height / 2;


    group.add(
        body
    );


    const roof =
        cube(
            width + .5,
            .4,
            depth + .5,
            0x263241
        );


    roof.position.y =
        height + .2;


    group.add(
        roof
    );


    const sign =
        cube(
            Math.min(
                width*.7,
                5
            ),
            .7,
            .12,
            0xffa11a
        );


    sign.position.set(
        0,
        height*.55,
        depth/2+.08
    );


    group.add(
        sign
    );


    group.position.set(
        Number(building.x)||0,
        0,
        Number(building.z)||0
    );


    scene.add(
        group
    );


    return group;

}


function buildCity(){

    cityBuilt = true;


    Object.values(

            const id =

            if(
                !buildingMeshes[id]

                buildingMeshes[id] =

                    );

            }

        }
    );

}

/* =========================================================
   SYNC
========================================================= */

function syncEntities(){

    if(!scene){

        return;

    }


    const players =
        state.players || {};


    Object.keys(
        playerMeshes
    ).forEach(
        id=>{

            if(!players[id]){

                scene.remove(
                    playerMeshes[id]
                );

                delete playerMeshes[id];

            }

        }
    );


    Object.entries(
        players
    ).forEach(
        ([id,player])=>{

            if(
                !playerMeshes[id]
            ){

                playerMeshes[id] =
                    createPlayerMesh(
                        player
                    );

            }


            if(id !== myId){

                const mesh =
                    playerMeshes[id];


                mesh.position.set(
                    player.x||0,
                    player.y||0,
                    player.z||0
                );


                mesh.rotation.y =
                    player.rot || 0;

            }

        }
    );


    const npcs =
        Array.isArray(state.npcs)
        ? state.npcs
        : Object.values(
            state.npcs || {}
        );


    npcs.forEach(
        (npc,index)=>{

            const id =
                npc.id ||
                "npc_"+index;


            if(
                !npcMeshes[id]
            ){

                npcMeshes[id] =
                    createNPCMesh(
                        npc
                    );

            }


            npcMeshes[id].position.set(
                npc.x||0,
                npc.y||0,
                npc.z||0
            );

        }
    );


    const vehicles =
        Array.isArray(
            state.vehicles
        )
        ? state.vehicles
        : Object.values(
            state.vehicles || {}
        );


    vehicles.forEach(
        (vehicle,index)=>{

            const id =
                vehicle.id ||
                "vehicle_"+index;


            if(
                !vehicleMeshes[id]
            ){

                vehicleMeshes[id] =
                    createVehicleMesh(
                        vehicle
                    );

            }


            vehicleMeshes[id].position.set(
                vehicle.x||0,
                0,
                vehicle.z||0
            );


            vehicleMeshes[id].rotation.y =
                vehicle.rot || 0;

        }
    );


    buildCity();

}

/* =========================================================
   MOVEMENT
========================================================= */

function updateMovement(){

    if(
        !myId ||
        !state.players ||
        !state.players[myId]
    ){

        return;

    }


    const player =
        state.players[myId];


    let x = 0;

    let z = 0;


    if(
        keys.w ||
        keys.ArrowUp
    ){

        z -= 1;

    }


    if(
        keys.s ||
        keys.ArrowDown
    ){

        z += 1;

    }


    if(
        keys.a ||
        keys.ArrowLeft
    ){

        x -= 1;

    }


    if(
        keys.d ||
        keys.ArrowRight
    ){

        x += 1;

    }


    if(
        Math.abs(
            joystick.x
        ) > .05 ||
        Math.abs(
            joystick.y
        ) > .05
    ){

        x =
            joystick.x;

        z =
            joystick.y;

    }


    const length =
        Math.sqrt(
            x*x +
            z*z
        );


    if(
        length < .01
    ){

        return;

    }


    x /= Math.max(
        length,
        1
    );


    z /= Math.max(
        length,
        1
    );


    const speed =
        player.onBike
        ? .34
        : .15;


    player.x =
        (Number(
            player.x
        ) || 0) +
        x * speed;


    player.z =
        (Number(
            player.z
        ) || 0) +
        z * speed;


    player.x =
        Math.max(
            -125,
            Math.min(
                125,
                player.x
            )
        );


    player.z =
        Math.max(
            -125,
            Math.min(
                125,
                player.z
            )
        );


    player.rot =
        Math.atan2(
            x,
            z
        );


    const now =
        performance.now();


    if(
        now -
        lastMoveSend >=
        MOVE_SEND_INTERVAL
    ){

        lastMoveSend =
            now;


        send({

            type:"UPDATE_MOVE",

            x:player.x,

            y:Number(
                player.y
            ) || .5,

            z:player.z,

            rot:player.rot

        });

    }

}

function updateCamera(){

    if(
        !myId ||
        !state.players ||
        !state.players[myId] ||
        !playerMeshes[myId]
    ){

        return;

    }


    const player =
        state.players[myId];


    const mesh =
        playerMeshes[myId];


    mesh.position.set(
        player.x,
        player.y,
        player.z
    );


    mesh.rotation.y =
        player.rot || 0;


    const distance =
        player.onBike
        ? 14
        : 11;


    const height =
        player.onBike
        ? 8.5
        : 7;


    targetCamera.set(

        player.x -
        Math.sin(
            player.rot || 0
        ) *
        distance,

        player.y +
        height,

        player.z -
        Math.cos(
            player.rot || 0
        ) *
        distance

    );


    camera.position.lerp(
        targetCamera,
        .13
    );


    lookTarget.set(

        player.x,

        player.y + 1,

        player.z

    );


    camera.lookAt(
        lookTarget
    );

}


/* =========================================================
   INPUT
========================================================= */

function setupInput(){

    window.addEventListener(
        "keydown",
        event=>{

            const key =
                event.key.length === 1
                ? event.key.toLowerCase()
                : event.key;


            if(
                key in keys
            ){

                keys[key] =
                    true;

                event.preventDefault();

            }


            if(
                event.key === "Enter" &&
                document.activeElement ===
                document.getElementById(
                    "chat-input"
                )
            ){

                sendChat();

            }


            if(
                event.key === "Escape"
            ){

                closeModals();

            }

        }
    );


    window.addEventListener(
        "keyup",
        event=>{

            const key =
                event.key.length === 1
                ? event.key.toLowerCase()
                : event.key;


            if(
                key in keys
            ){

                keys[key] =
                    false;

                event.preventDefault();

            }

        }
    );


    const joystickElement =
        document.getElementById(
            "joystick"
        );


    const stick =
        document.getElementById(
            "stick"
        );


    joystickElement.addEventListener(
        "pointerdown",
        event=>{

            joystick.active =
                true;

            joystick.pointerId =
                event.pointerId;


            joystickElement.setPointerCapture(
                event.pointerId
            );


            moveJoystick(
                event
            );

        }
    );


    joystickElement.addEventListener(
        "pointermove",
        event=>{

            if(
                joystick.active
            ){

                moveJoystick(
                    event
                );

            }

        }
    );


    joystickElement.addEventListener(
        "pointerup",
        resetJoystick
    );


    joystickElement.addEventListener(
        "pointercancel",
        resetJoystick
    );


    function moveJoystick(event){

        const rect =
            joystickElement
            .getBoundingClientRect();


        const centerX =
            rect.left +
            rect.width/2;


        const centerY =
            rect.top +
            rect.height/2;


        let dx =
            event.clientX -
            centerX;


        let dy =
            event.clientY -
            centerY;


        const max =
            rect.width*.34;


        const length =
            Math.hypot(
                dx,
                dy
            );


        if(
            length > max
        ){

            dx =
                dx/length *
                max;

            dy =
                dy/length *
                max;

        }


        joystick.x =
            dx/max;


        joystick.y =
            dy/max;


        stick.style.transform =
            `translate(${dx}px,${dy}px)`;

    }


    function resetJoystick(){

        joystick.active =
            false;

        joystick.x =
            0;

        joystick.y =
            0;

        stick.style.transform =
            "translate(0,0)";

    }


    document
        .getElementById(
            "chat-input"
        )
        .addEventListener(
            "keydown",
            event=>{

                if(
                    event.key === "Enter"
                ){

                    sendChat();

                }

            }
        );


    window.addEventListener(
        "resize",
        resizeRenderer
    );

}


/* =========================================================
   CHAT
========================================================= */

function sendChat(){

    const input =
        document.getElementById(
            "chat-input"
        );


    const text =
        input.value.trim();


    if(!text){

        return;

    }


    send({

        type:"CHAT",

        text:text.slice(
            0,
            300
        )

    });


    input.value = "";

    input.blur();

}


function addChat(
    sender,
    text
){

    const box =
        document.getElementById(
            "messages"
        );


    const line =
        document.createElement(
            "div"
        );


    line.innerHTML =
        "<b>" +
        esc(sender) +
        ":</b> " +
        esc(text);


    box.appendChild(
        line
    );


    box.scrollTop =
        box.scrollHeight;


    while(
        box.children.length >
        80
    ){

        box.removeChild(
            box.firstChild
        );

    }

}

            <small>
                ${esc(description || "")}
            </small>

            ${
                buttonText
                ?
                `
                    <button
                        class="${className}"
                        onclick="${onclick}"
                    >
                        ${esc(buttonText)}
                    </button>
                `
                :
                ""
            }

        </div>

    `;

}


/* =========================================================
   MODAL DATA
========================================================= */

function refreshModals(){

    const player =
        state.players &&
        state.players[myId];


    if(!player){

        return;

    }


    /* INVENTORY */

    const inventory =
        player.inventory ||
        player.items ||
        {};


    let inventoryHTML = "";


    const inventoryEntries =
        Array.isArray(
            inventory
        )
        ?
        inventory.map(
            (item,index)=>[
                item.name ||
                "Item "+index,

                item.qty ??
                item.quantity ??
                1
            ]
        )
        :
        Object.entries(
            inventory
        );


    if(
        inventoryEntries.length
    ){

        inventoryEntries.forEach(
            ([name,value])=>{

                const quantity =
                    typeof value ===
                    "object"
                    ?
                    (
                        value.qty ??
                        value.quantity ??
                        1
                    )
                    :
                    value;


                inventoryHTML +=
                    makeCard(
                        name,
                        "Số lượng: "+
                        quantity
                    );

            }
        );

    }else{

        inventoryHTML =
            makeCard(
                "Túi đồ trống",
                "Chưa có vật phẩm."
            );

    }


    document.getElementById(
        "inventory-list"
    ).innerHTML =
        inventoryHTML;


    /* MARKET */

    const market =
        state.market ||
        {};


    let marketHTML = "";


    const marketEntries =
        Array.isArray(
            market
        )
        ?
        market.map(
            (item,index)=>[
                item.id ||
                item.name ||
                index,

                item
            ]
        )
        :
        Object.entries(
            market
        );


    marketEntries.forEach(
        ([id,item])=>{

            const name =
                typeof item ===
                "object"
                ?
                (
                    item.name ||
                    id
                )
                :
                id;


            const price =
                typeof item ===
                "object"
                ?
                (
                    item.price ??
                    0
                )
                :
                item;


            marketHTML +=
                makeCard(

                    name,

                    "Giá: "+
                    price+
                    "$",

                    "Mua",

                    "buyItem('"+
                    String(id)
                    .replace(
                        /'/g,
                        "\\'"
                    )+
                    "')",

                    "orange"

                );

        }
    );


    if(!marketHTML){

        marketHTML =
            makeCard(
                "Thị trường",
                "Chưa có dữ liệu."
            );

    }


    document.getElementById(
        "market-list"
    ).innerHTML =
        marketHTML;


    /* JOBS */

    const jobs = [

        "Nông dân",

        "Tài xế",

        "Nhân viên cửa hàng",

        "Thợ sửa xe",

        "Ngư dân",

        "Chủ doanh nghiệp"

    ];


    document.getElementById(
        "job-list"
    ).innerHTML =
        jobs.map(
            job=>

                makeCard(

                    job,

                    "Đổi nghề",

                    "Chọn",

                    "changeJob('"+
                    job.replace(
                        /'/g,
                        "\\'"
                    )+
                    "')",

                    "blue"

                )

        ).join("");


    /* BUSINESS */

    const businesses =
        state.businesses ||
        {};


    let businessHTML = "";


    Object.entries(
        businesses
    ).forEach(
        ([id,business])=>{

            businessHTML +=
                makeCard(

                    business.name ||
                    id,

                    "Vốn: "+
                    (
                        business.capital ??
                        0
                    )+
                    "$",

                    "Vận hành",

                    "operateBusiness('"+
                    String(id)
                    .replace(
                        /'/g,
                        "\\'"
                    )+
                    "')",

                    "green"

                );

        }
    );


    if(!businessHTML){

        businessHTML =
            makeCard(
                "Kinh doanh",
                "Bạn chưa sở hữu cửa hàng."
            );

    }


    document.getElementById(
        "business-list"
    ).innerHTML =
        businessHTML;


    /* FURNITURE */

    const furniture = [

        [
            "Bàn",
            "table",
            120
        ],

        [
            "Ghế",
            "chair",
            60
        ],

        [
            "Tủ",
            "cabinet",
            180
        ],

        [
            "Giường",
            "bed",
            250
        ],

        [
            "TV",
            "tv",
            400
        ],

        [
            "Cây cảnh",
            "plant",
            80
        ]

    ];


    document.getElementById(
        "furniture-list"
    ).innerHTML =
        furniture.map(
            item=>

                makeCard(

                    item[0],

                    "Giá: "+
                    item[2]+
                    "$",

                    "Mua",

                    "buyFurniture('"+
                    item[1]+
                    "')",

                    "orange"

                )

        ).join("");

}

/* =========================================================
   RENDER LOOP
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    if(!renderer){

        return;

    }


    updateMovement();

    updateCamera();


    renderer.render(
        scene,
        camera
    );

}


/* =========================================================
   RESIZE
========================================================= */

function resizeRenderer(){

    if(
        !camera ||
        !renderer
    ){

        return;

    }


    camera.aspect =
        innerWidth /
        innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        innerWidth,
        innerHeight
    );


    renderer.setPixelRatio(
        Math.min(
            devicePixelRatio || 1,
            1.5
        )
    );

}
