<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<title>BUÔN GÌ BÁN</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#101522;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

button,input,select{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    background:#a8d99c;
    touch-action:none;
}

#hud{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:20;
    pointer-events:none;
    padding:
        max(10px,env(safe-area-inset-top))
        10px
        0;
}

.hud-row{
    display:flex;
    align-items:center;
    gap:7px;
    flex-wrap:wrap;
}

.hud-box{
    background:rgba(22,27,39,.88);
    color:#fff;
    border:1px solid rgba(255,255,255,.13);
    box-shadow:0 5px 20px rgba(0,0,0,.18);
    border-radius:14px;
    padding:8px 11px;
    font-size:12px;
    backdrop-filter:blur(8px);
}

.hud-box b{
    color:#ffe38a;
}

#topButtons{
    position:fixed;
    top:max(10px,env(safe-area-inset-top));
    right:10px;
    z-index:30;
    display:flex;
    gap:7px;
}

.top-btn{
    width:42px;
    height:42px;
    border-radius:13px;
    background:rgba(25,30,43,.88);
    color:#fff;
    border:1px solid rgba(255,255,255,.12);
    font-size:18px;
    box-shadow:0 5px 18px rgba(0,0,0,.18);
}

#mobileControls{
    position:fixed;
    inset:0;
    z-index:25;
    pointer-events:none;
}

#joystick{
    position:absolute;
    left:20px;
    bottom:
        max(22px,calc(env(safe-area-inset-bottom) + 15px));
    width:132px;
    height:132px;
    border-radius:50%;
    background:rgba(20,25,38,.26);
    border:2px solid rgba(255,255,255,.24);
    pointer-events:auto;
    touch-action:none;
}

#joyKnob{
    position:absolute;
    width:58px;
    height:58px;
    left:37px;
    top:37px;
    border-radius:50%;
    background:rgba(255,255,255,.78);
    box-shadow:0 5px 18px rgba(0,0,0,.22);
}

#actionButton{
    position:absolute;
    right:22px;
    bottom:
        max(28px,calc(env(safe-area-inset-bottom) + 21px));
    min-width:92px;
    height:58px;
    padding:0 15px;
    border-radius:20px;
    background:#ff7b9c;
    color:white;
    font-weight:800;
    font-size:13px;
    box-shadow:0 8px 22px rgba(0,0,0,.25);

}

#actionButton.show{

}

#dialogue{

    bottom:18px;
    transform:translateX(-50%);

.dialogue-card{

.dialogue-name{

}

.dialogue-text{

}

.dialogue-options{

.dialogue-options button,

#speech{

#speech:after{

.modal-bg{

.modal{

.form-grid label{

.form-grid input,

.big-button{

<script>
"use strict";

/* =========================================================
   BUÔN GÌ BÁN
   GAME CORE
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let DPR = Math.min(window.devicePixelRatio || 1,2);

function resizeCanvas(){
    DPR = Math.min(window.devicePixelRatio || 1,2);

    canvas.width = innerWidth * DPR;
    canvas.height = innerHeight * DPR;

    canvas.style.width = innerWidth + "px";
    canvas.style.height = innerHeight + "px";

    ctx.setTransform(DPR,0,0,DPR,0,0);
}

addEventListener("resize",resizeCanvas);
resizeCanvas();

/* =========================================================
   CONSTANTS
========================================================= */

const WORLD_W = 3600;
const WORLD_H = 2700;

const ROAD_W = 118;
const SIDEWALK_W = 42;

const SAVE_KEY = "BUON_GI_BAN_SAVE_V3";
const PLAYER_ID_KEY = "BG_PLAYER_ID";

const SERVER_URL = "";

/* =========================================================
   PLAYER
========================================================= */

const player = {

    x:1460,
    y:1320,

    radius:17,
    speed:205,

    dir:"down",
    moving:false,
    walk:0,

    name:"Vy",
    gender:"female",

    hair:"long",
    hairColor:"#39291f",
    shirt:"#ff789d",
    style:"cute",

    money:1500000,

    level:1,
    xp:0,

    rating:5,

    inventory:{
        vegetable:10,
        meat:10,
        seafood:5,
        rice:15,
        noodle:15,
        drink:10
    },

    dishes:{
        noodle:false,
        chickenRice:false,
        banhMi:false
    },

    clothes:{
        hair:"long",
        shirt:"#ff789d"
    },

    restaurant:null,

    loan:0,

    reputation:0,

    customersServed:0,

    conversations:0
};

/* =========================================================
   GAME STATE
========================================================= */

let gameStarted = false;

let gameMinutes = 8 * 60;
let day = 1;

let weather = "sunny";

let weatherTimer = 0;
let weatherDuration = 0;

let camera = {
    x:0,
    y:0
};

let keys = {};

let joy = {
    x:0,
    y:0,
    active:false
};

let activeDialogue = null;
let modalOpen = false;

let lastTime = performance.now();

let toastTimer = 0;

/* =========================================================
   PLAYER ID
========================================================= */

let PLAYER_ID =
    localStorage.getItem(PLAYER_ID_KEY);

if(!PLAYER_ID){

    if(
        window.crypto &&
        crypto.randomUUID
    ){
        PLAYER_ID = crypto.randomUUID();
    }else{
        PLAYER_ID =
            Date.now()+"-"+Math.random();
    }

    localStorage.setItem(
        PLAYER_ID_KEY,
        PLAYER_ID
    );
}

/* =========================================================
   MAP
========================================================= */

const roadX = [
    260,
    860,
    1460,
    2060,
    2660,
    3340
];

const roadY = [
    250,
    820,
    1380,
    1940,
    2440
];

const buildings = [];

const specialBuildings = {

    restaurant:{
        x:1540,
        y:1435,
        w:400,
        h:310,
        color:"#f3a8a8",
        label:"NHÀ HÀNG"
    },

    market:{
        x:270,
        y:300,
        w:400,
        h:270,
        color:"#e9b96f",
        label:"CHỢ"
    },

    bank:{
        x:2720,
        y:300,
        w:400,
        h:270,
        color:"#9ebde8",
        label:"NGÂN HÀNG"
    },

    clothing:{
        x:2080,
        y:300,
        w:400,
        h:270,
        color:"#d5a6e8",
        label:"THỜI TRANG"
    },

    realEstate:{
        x:2720,
        y:1960,
        w:400,
        h:270,
        color:"#a5d5bd",
        label:"BẤT ĐỘNG SẢN"
    }
};

function addBuilding(
    x,
    y,
    w,
    h,
    color,
    label,
    type="building"
){

    buildings.push({
        x,y,w,h,
        color,
        label,
        type
    });
}

for(let ix=0;ix<roadX.length-1;ix++){

    for(let iy=0;iy<roadY.length-1;iy++){

        const x =
            roadX[ix] + 80;

        const y =
            roadY[iy] + 80;

        const w =
            roadX[ix+1]-roadX[ix]-160;

        const h =
            roadY[iy+1]-roadY[iy]-160;

        if(
            x > 1400 &&
            x < 2100 &&
            y > 1300 &&
            y < 2000
        ){
            continue;
        }

        addBuilding(
            x,
            y,
            w,
            h,
            "#f5d5b6",
            "Nhà dân"
        );
    }
}

for(const b of Object.values(specialBuildings)){
    addBuilding(
        b.x,
        b.y,
        b.w,
        b.h,
        b.color,
        b.label,
        "special"
    );
}

/* =========================================================
   ROAD GRAPH
========================================================= */

const nodes = [];
const nodeMap = new Map();

function nodeKey(x,y){
    return x+"_"+y;
}

for(let y of roadY){

    for(let x of roadX){

        const node = {
            id:nodes.length,
            x,
            y,
            links:[]
        };

        nodes.push(node);

        nodeMap.set(
            nodeKey(x,y),
            node
        );
    }
}

function connect(a,b){

    if(!a.links.includes(b)){
        a.links.push(b);
    }

    if(!b.links.includes(a)){
        b.links.push(a);
    }
}

for(const n of nodes){

    for(const m of nodes){

        if(
            n===m
        )continue;

        if(
            (n.x===m.x &&
             Math.abs(n.y-m.y)<=600) ||

            (n.y===m.y &&
             Math.abs(n.x-m.x)<=600)
        ){
            connect(n,m);
        }
    }
}

function nearestNode(x,y){

    let best = nodes[0];
    let dist = Infinity;

    for(const n of nodes){

        const d =
            (n.x-x)**2+
            (n.y-y)**2;

        if(d<dist){
            dist=d;
            best=n;
        }
    }

    return best;
}

function findPath(start,end){

    const s = nearestNode(
        start.x,
        start.y
    );

    const e = nearestNode(
        end.x,
        end.y
    );

    const queue = [s];

    const prev =
        new Map();

    prev.set(s,null);

    while(queue.length){

        const current =
            queue.shift();

        if(current===e)
            break;

        for(const next of current.links){

            if(!prev.has(next)){

                prev.set(
                    next,
                    current
                );

                queue.push(next);
            }
        }
    }

    if(!prev.has(e)){
        return [s,e];
    }

    const result=[];

    let cur=e;

    while(cur){

        result.unshift(cur);
        cur=prev.get(cur);
    }

    return result;
}

/* =========================================================

========================================================= */

    construction:{

function distance(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );
}

function blocked(x,y,r=17){

    if(
        x<25 ||
        y<25 ||
        x>WORLD_W-25 ||
        y>WORLD_H-25
    ){
        return true;
    }

    for(const b of buildings){

        if(
            x+r>b.x &&
            x-r<b.x+b.w &&
            y+r>b.y &&
            y-r<b.y+b.h
        ){
            return true;
        }
    }

    return false;
}

const joystick =
    document.getElementById(
        "joystick"
    );

const joyKnob =
    document.getElementById(
        "joyKnob"
    );

function setJoystick(
    clientX,
    clientY
){

    const rect =
        joystick.getBoundingClientRect();

    const cx =
        rect.left+
        rect.width/2;

    const cy =
        rect.top+
        rect.height/2;

    let dx =
        clientX-cx;

    let dy =
        clientY-cy;

    const max =
        rect.width*.34;

    const len =
        Math.hypot(dx,dy);

    if(len>max){

        dx =
            dx/len*max;

        dy =
            dy/len*max;
    }

    joy.x =
        dx/max;

    joy.y =
        dy/max;

    joyKnob.style.transform =
        `translate(${dx}px,${dy}px)`;
}

function resetJoystick(){

    joy.x=0;
    joy.y=0;

    joyKnob.style.transform =
        "translate(0,0)";
}

joystick.addEventListener(
    "pointerdown",
    e=>{
        joy.active=true;
        joystick.setPointerCapture(e.pointerId);
        setJoystick(
            e.clientX,
            e.clientY
        );
    }
);

joystick.addEventListener(
    "pointermove",
    e=>{
        if(joy.active){
            setJoystick(
                e.clientX,
                e.clientY
            );
        }
    }
);

joystick.addEventListener(
    "pointerup",
    ()=>{
        joy.active=false;
        resetJoystick();
    }
);

joystick.addEventListener(
    "pointercancel",
    ()=>{
        joy.active=false;
        resetJoystick();
    }
);

function nearestNPC(){

    let best=null;
    let bestDist=Infinity;

    for(const npc of npcs){

        const d =
            distance(
                player,
                npc
            );

        if(
            d<bestDist &&
            d<105
        ){
            best=npc;
            bestDist=d;
        }
    }

    return best;
}

function openDialogue(npc){

    if(!npc)return;

    activeDialogue=npc;

    player.moving=false;

    npc.dir =
        Math.abs(
            player.x-npc.x
        ) >
        Math.abs(
            player.y-npc.y
        )
        ?
        (
            player.x>npc.x
                ?"right"
                :"left"
        )
        :
        (
            player.y>npc.y
                ?"down"
                :"up"
        );

    player.dir =
        npc.dir==="left"
            ?"right"
            :
        npc.dir==="right"
            ?"left"
            :
        npc.dir==="up"
            ?"down"
            :"up";

    document
    .getElementById("dialogue")
    .style.display="block";

    document
    .getElementById("dialogueName")
    .textContent=
        npc.name;

    document
    .getElementById("dialogueText")
    .textContent=
        npcGreeting(npc);

    renderDialogueOptions(npc);

    npc.talkCooldown=2;

    player.conversations++;
}

            "meat",

function getWeatherTalk(npc){

    if(weather==="sunny")

    if(weather==="cloudy")
        return "Hôm nay trời âm u, chắc mọi người sẽ ra ngoài ít hơn.";

    if(weather==="rain")
        return "Mưa rồi. Nhớ chuẩn bị áo mưa nếu đi giao hàng nhé.";

    if(weather==="storm")

                "meat",
                "seafood",

            ].includes(npc.role)
        ){
            openShop(npc);

        ){
            rentRestaurant();
            return;
        }

        if(
            npc.role==="lender"
        ){
            openBank();
            return;
        }

        openDialogue(npc);

        return;
    }

    const location =
        nearestLocation();

    if(!location){
        return;
    }

    if(
        location.type==="restaurant"
    ){
        openRestaurant();
    }

    if(
        location.type==="kitchen"
    ){
        openKitchen();
    }

    if(
        location.type==="market"
    ){
        openMarket();
    }

    if(
        location.type==="bank"
    ){
        openBank();
    }

    if(
        location.type==="clothing"

    }

    if(

function money(n){

    return Math.floor(n)
        .toLocaleString("vi-VN")
        +"đ";
}

function earn(amount){

    player.money += amount;

    player.xp +=
        Math.max(
            1,
            Math.floor(amount/5000)
        );

    checkLevel();
}

function spend(amount){

    if(player.money<amount){
        toast("❌ Không đủ tiền.");
        return false;
    }

    player.money-=amount;
    return true;
}

function checkLevel(){

    const required =
        player.level*100;

    if(
        player.xp>=required &&
        player.level<10
    ){

        player.xp-=required;
        player.level++;

        toast(
            `🎉 Lên cấp ${player.level}!`
        );
    }
}

function buyFromNPC(
    npcId,
    key,
    amount,
    total
){

    const npc =
        npcs.find(
            n=>n.id===npcId
        );

    if(!npc)return;

    if(
        (npc.inventory[key]||0)
        <amount
    ){
        toast("❌ Người bán hết hàng.");
        return;
    }

    if(!spend(total))
        return;

    npc.inventory[key]-=amount;

    player.inventory[key] =
        (player.inventory[key]||0)
        +amount;

    npc.money+=total;

    toast(
        `🛒 Đã mua ${amount} ${key}.`
    );

    openShop(npc);
}

function hasIngredients(
    ingredients
){

    for(const key in ingredients){

        if(
            (player.inventory[key]||0)
            <
            ingredients[key]
        ){
            return false;
        }
    }

    return true;
}

function useIngredients(
    ingredients
){

    for(const key in ingredients){

        player.inventory[key]-=
            ingredients[key];
    }
}

function cookDish(key){

    const dish=dishes[key];

    if(
        player.level<
        dish.level
    ){
        toast(
            `🔒 Cần cấp ${dish.level}.`
        );
        return;
    }

    if(
        !hasIngredients(
            dish.ingredients
        )
    ){
        toast(
            "❌ Không đủ nguyên liệu."
        );
        return;
    }

    useIngredients(
        dish.ingredients
    );

    restaurantState.cooked[key] =
        (restaurantState.cooked[key]||0)
        +1;

    restaurantState.menu[key]=true;

    player.xp+=10;

    checkLevel();

    toast(
        `👨‍🍳 Đã nấu ${dish.name}!`
    );

    openKitchen();
}

function cookDrink(key){

    const drink=drinks[key];

    if(
        player.level<

function sellPreparedFood(key){

    const dish=dishes[key];

    if(
        !restaurantState.cooked[key] ||
        restaurantState.cooked[key]<=0
    ){
        toast(
            "❌ Chưa có món đã nấu."
        );
        return;
    }

    restaurantState.cooked[key]--;

    const finalPrice =
        Math.round(
            dish.price*
            (0.95+
             Math.random()*.2)
        );

    earn(finalPrice);

    restaurantState.revenueToday+=
        finalPrice;

    restaurantState.customersToday++;

    player.customersServed++;

    player.reputation++;

    toast(
        `💵 Khách mua ${dish.name}: ${money(finalPrice)}`
    );

    openMenu();
}

    toast(

    );

    openMenu();
}

function takeLoan(amount){

    if(amount<=0)return;

    player.money+=amount;

    player.loan+=
        Math.round(
            amount*1.08
        );

    toast(
        `🏦 Đã vay ${money(amount)}.`
    );

    openBank();
}

function repayLoan(){

    const amount =
        Math.min(
            500000,
            player.loan
        );

    if(amount<=0){
        toast("Bạn không có nợ.");
        return;
    }

    if(!spend(amount))
        return;

    player.loan-=amount;

    toast(
        `💳 Đã trả ${money(amount)}.`
    );

    openBank();
}

    const data =
        gameData();

    localStorage.setItem(
        SAVE_KEY,
        JSON.stringify(data)
    );

    if(SERVER_URL){

        fetch(
            SERVER_URL+
            "/api/save",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:JSON.stringify({
                    id:PLAYER_ID,
                    game:data
                })
            }
        ).catch(()=>{});
    }

    toast("💾 Đã lưu game.");
}

function loadGame(){

    const raw =
        localStorage.getItem(
            SAVE_KEY
        );

    if(!raw){

        player.x=1460;
        player.y=1320;

        return;
    }

    try{

        const data =
            JSON.parse(raw);

        if(data.player){

            Object.assign(
                player,
                data.player
            );
        }

        if(data.restaurantState){

            Object.assign(
                restaurantState,
                data.restaurantState
            );
        }

        gameMinutes =
            data.gameMinutes ??
            480;

        day =
            data.day ??
            1;

        weather =
            data.weather ??
            "sunny";

        if(
            blocked(
                player.x,
                player.y,
                player.radius
            )
        ){

            const road =
                nearestNode(
                    player.x,
                    player.y
                );

            player.x=road.x;
            player.y=road.y;
        }

        if(
            Array.isArray(data.npcs)
        ){

            for(
                const saved
                of data.npcs
            ){

                const npc =
                    npcs.find(
                        n=>
                            n.id===
                            saved.id
                    );

                if(!npc)continue;

                npc.x=saved.x;
                npc.y=saved.y;
                npc.money=
                    saved.money;

                npc.friendliness=
                    saved.friendliness;

                chooseNPCDestination(
                    npc
                );
            }
        }

    }catch(error){

        console.warn(
            "Save lỗi:",
            error
        );

        player.x=1460;
        player.y=1320;
    }
}

function toast(text){

            "toast"
        );

/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(dt){

    if(
        modalOpen ||
        activeDialogue
    ){
        player.moving=false;
        return;
    }

    let x=0;
    let y=0;

    if(keys["w"]||keys["arrowup"])
        y--;

    if(keys["s"]||keys["arrowdown"])
        y++;

    if(keys["a"]||keys["arrowleft"])
        x--;

    if(keys["d"]||keys["arrowright"])
        x++;

    x+=joy.x;
    y+=joy.y;

    const len =
        Math.hypot(x,y);

    if(len<=0.05){

        player.moving=false;

        return;
    }

    x/=len;
    y/=len;

    const nx =
        player.x+
        x*
        player.speed*
        dt;

    const ny =
        player.y+
        y*
        player.speed*
        dt;

    if(
        !blocked(
            nx,
            player.y,
            player.radius
        )
    ){
        player.x=nx;
    }

    if(
        !blocked(
            player.x,
            ny,
            player.radius
        )
    ){
        player.y=ny;
    }

    player.moving=true;

    if(
        Math.abs(x)>
        Math.abs(y)
    ){

        player.dir =
            x>0
            ?"right"
            :"left";

    }else{

        player.dir =
            y>0
            ?"down"
            :"up";
    }

    player.walk+=dt*10;
}

/* =========================================================
   NPC UPDATE
========================================================= */

function updateNPCs(dt){

    for(const npc of npcs){

        npc.talkCooldown=
            Math.max(
                0,
                npc.talkCooldown-dt
            );

        if(
            activeDialogue===
            npc
        ){
            npc.moving=false;
            continue;
        }

        if(
            !npc.path ||
            npc.pathIndex>=
            npc.path.length
        ){

            chooseNPCDestination(
                npc
            );
        }

        const target =
            npc.path[
                npc.pathIndex
            ];

        if(!target){
            chooseNPCDestination(npc);
            continue;
        }

        let tx=target.x;
        let ty=target.y;

        const dx=tx-npc.x;
        const dy=ty-npc.y;

        const dist=Math.hypot(dx,dy);

        if(dist<12){

            npc.pathIndex++;

            if(
                npc.pathIndex>=
                npc.path.length
            ){
                chooseNPCDestination(
                    npc
                );
            }

            continue;
        }

        const vx=dx/dist;
        const vy=dy/dist;

        let speed=npc.speed;

        if(
            weather==="rain"
        ){
            speed*=.88;
        }

        if(
            weather==="storm"
        ){
            speed*=.72;
        }

        npc.x+=
            vx*
            speed*
            dt;

        npc.y+=
            vy*
            speed*
            dt;

        npc.moving=true;

        if(
            Math.abs(vx)>
            Math.abs(vy)
        ){

            npc.dir =
                vx>0
                ?"right"
                :"left";

        }else{

            npc.dir =
                vy>0
                ?"down"
                :"up";
        }

        npc.walk+=dt*9;
    }
}

/* =========================================================
   TIME
========================================================= */

function updateTime(dt){

    if(
        modalOpen ||
        activeDialogue
    ){
        return;
    }

    gameMinutes+=
        dt*2.2;

    if(gameMinutes>=1440){

        gameMinutes-=1440;

        endDay();
    }

    weatherTimer+=dt;

    if(
        weatherTimer>
        weatherDuration
    ){

        changeWeather();
    }
}

function endDay(){

    day++;

    const wages =
        restaurantState.staff
        .reduce(
            (sum,s)=>
                sum+s.wage,
            0
        );

    const utilities =
        restaurantState.open
        ?50000
        :10000;

    const rent =
        restaurantState.rented &&
        day%25===0
        ?300000
        :0;

    const tax =
        restaurantState.revenueToday>
        500000
        ?
        Math.round(
            restaurantState.revenueToday*
            .05
        )
        :0;

    const debt =
        player.loan>0
        ?
        Math.min(
            50000,
            player.loan
        )
        :0;

    const expenses =
        wages+
        utilities+
        rent+
        tax+
        debt;

    if(
        player.money>=expenses
    ){

        player.money-=expenses;

    }else{

        player.money=0;
        player.rating=
            Math.max(
                1,
                player.rating-.1
            );
    }

    if(debt>0){

        player.loan=
            Math.max(
                0,
                player.loan-debt
            );
    }

    restaurantState.expenseToday=
        expenses;

    restaurantState.customersToday=0;
    restaurantState.revenueToday=0;

    if(
        restaurantState.open
    ){
        simulateCustomers();
    }

    saveGame();

    toast(
        `🌅 Ngày ${day} bắt đầu.`
    );
}

function simulateCustomers(){

    if(
        !restaurantState.open
    ){
        return;
    }

    let amount =
        2+
        Math.floor(
            Math.random()*7
        );

    if(weather==="rain")
        amount=Math.floor(amount*.7);

    if(weather==="storm")
        amount=Math.floor(amount*.35);

    for(let i=0;i<amount;i++){

        restaurantState.customersToday++;

        if(
            Math.random()<.75
        ){
            player.reputation++;
        }
    }
}

function changeWeather(){

    const list=[
        "sunny",
        "sunny",
        "cloudy",
        "rain",
        "rain",
        "wind",
        "fog",
        "storm"
    ];

    weather=
        list[
            Math.floor(
                Math.random()*list.length
            )
        ];

    weatherTimer=0;

    weatherDuration=
        70+
        Math.random()*150;

    toast(
        "🌦️ Thời tiết: "+
        weatherName()
    );
}

function weatherName(){

    return {
        sunny:"Nắng",
        cloudy:"Nhiều mây",
        rain:"Mưa",
        storm:"Bão",
        wind:"Gió mạnh",
        fog:"Sương mù"
    }[weather];
}

/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

    const maxX =
        Math.max(
            0,
            WORLD_W-innerWidth
        );

    const maxY =
        Math.max(
            0,
            WORLD_H-innerHeight
        );

    camera.x =
        Math.max(
            0,
            Math.min(
                maxX,
                player.x-
                innerWidth/2
            )
        );

    camera.y =
        Math.max(
            0,
            Math.min(
                maxY,
                player.y-
                innerHeight/2
            )
        );
}

/* =========================================================
   DRAW WORLD
========================================================= */

function drawWorld(){

    ctx.save();

    ctx.translate(
        -camera.x,
        -camera.y
    );

    ctx.fillStyle="#a8d99c";

    ctx.fillRect(
        0,
        0,
        WORLD_W,
        WORLD_H
    );

    drawGroundDetails();

    drawRoads();

    drawBuildings();

    drawTrees();

    drawVehicles();

    for(const npc of npcs){
        drawCharacter(
            npc,
            false
        );
    }

    drawCharacter(
        player,
        true
    );

    drawWeather();

    ctx.restore();
}

function drawGroundDetails(){

    ctx.fillStyle=
        "rgba(255,255,255,.16)";

    for(let x=0;x<WORLD_W;x+=80){

        for(
            let y=0;
            y<WORLD_H;
            y+=80
        ){

            if(
                (x+y)%240===0
            ){
                ctx.fillRect(
                    x,
                    y,
                    2,
                    2
                );
            }
        }
    }
}

function drawRoads(){

    ctx.fillStyle="#727983";

    for(const x of roadX){

        ctx.fillRect(
            x-ROAD_W/2,
            0,
            ROAD_W,
            WORLD_H
        );
    }

    for(const y of roadY){

        ctx.fillRect(
            0,
            y-ROAD_W/2,
            WORLD_W,
            ROAD_W
        );
    }

    ctx.fillStyle="#8f959c";

    for(const x of roadX){

        ctx.fillRect(
            x-ROAD_W/2,
            0,
            12,
            WORLD_H
        );

        ctx.fillRect(
            x+ROAD_W/2-12,
            0,
            12,
            WORLD_H
        );
    }

    for(const y of roadY){

        ctx.fillRect(
            0,
            y-ROAD_W/2,
            WORLD_W,
            12
        );

        ctx.fillRect(
            0,
            y+ROAD_W/2-12,
            WORLD_W,
            12
        );
    }

    ctx.strokeStyle=
        "rgba(255,255,255,.55)";

    ctx.lineWidth=4;

    ctx.setLineDash([30,28]);

    for(const x of roadX){

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            WORLD_H
        );

        ctx.stroke();
    }

    for(const y of roadY){

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            WORLD_W,
            y
        );

        ctx.stroke();
    }

    ctx.setLineDash([]);
}

function drawBuildings(){

    for(const b of buildings){

        ctx.fillStyle=
            "rgba(0,0,0,.12)";

        ctx.fillRect(
            b.x+8,
            b.y+10,
            b.w,
            b.h
        );

        ctx.fillStyle=
            b.color;

        ctx.fillRect(
            b.x,
            b.y,
            b.w,
            b.h
        );

        ctx.fillStyle=
            "rgba(255,255,255,.35)";

        ctx.fillRect(
            b.x+10,
            b.y+10,
            b.w-20,
            28
        );

        const cols =
            Math.max(
                2,
                Math.floor(b.w/75)
            );

        const rows =
            Math.max(
                1,
                Math.floor(b.h/75)
            );

        for(let cx=0;cx<cols;cx++){

            for(let cy=0;cy<rows;cy++){

                const wx =
                    b.x+
                    25+
                    cx*
                    ((b.w-50)/
                     Math.max(
                        1,
                        cols-1
                     ));

                const wy =
                    b.y+
                    58+
                    cy*
                    ((b.h-75)/
                     Math.max(
                        1,
                        rows-1
                     ));

                ctx.fillStyle=
                    "#a7d4e8";

                ctx.fillRect(
                    wx-9,
                    wy-8,
                    18,
                    16
                );
            }
        }

        ctx.fillStyle=
            "#774d48";

        ctx.fillRect(
            b.x+b.w/2-18,
            b.y+b.h-48,
            36,
            48
        );

        if(b.label){

            ctx.fillStyle="#273040";

            ctx.font=
                "bold 17px system-ui";

            ctx.textAlign="center";

            ctx.fillText(
                b.label,
                b.x+b.w/2,
                b.y+27
            );
        }
    }
}

function drawTrees(){

    const trees=[
        [110,120],
        [720,150],
        [1250,120],
        [2300,130],
        [3300,130],
        [110,1000],
        [700,1100],
        [2200,1000],
        [3300,1100],
        [100,2200],
        [800,2300],
        [2200,2300],
        [3350,2250]
    ];

    for(const [x,y] of trees){

        ctx.fillStyle="#76583d";

        ctx.arc(

        );

const vehicles=[];

for(let i=0;i<28;i++){

    const horizontal =
        Math.random()>.5;

    vehicles.push({

        x:
            horizontal
            ?
            Math.random()*WORLD_W
            :
            roadX[
                Math.floor(
                    Math.random()*roadX.length
                )
            ],

        y:
            horizontal
            ?
            roadY[
                Math.floor(
                    Math.random()*roadY.length
                )
            ]
            :
            Math.random()*WORLD_H,

        horizontal,

        speed:
            55+
            Math.random()*80,

        color:
            shirtColors[
                Math.floor(
                    Math.random()*
                    shirtColors.length
                )
            ],

        dir:
            Math.random()>.5
            ?1
            :-1
    });
}

function updateVehicles(dt){

    for(const v of vehicles){

        if(v.horizontal){

            v.x+=
                v.speed*
                dt*
                v.dir;

            if(v.x>WORLD_W+100)
                v.x=-100;

            if(v.x<-100)
                v.x=WORLD_W+100;

        }else{

            v.y+=
                v.speed*
                dt*
                v.dir;

            if(v.y>WORLD_H+100)
                v.y=-100;

            if(v.y<-100)
                v.y=WORLD_H+100;
        }
    }
}

function drawVehicles(){

    for(const v of vehicles){

        ctx.save();

        ctx.translate(
            v.x,
            v.y
        );

        if(
            !v.horizontal
        ){
            ctx.rotate(
                Math.PI/2
            );
        }

        if(v.dir<0)
            ctx.scale(-1,1);

        ctx.fillStyle=
            "rgba(0,0,0,.2)";

        ctx.fillRect(
            -22,
            -9,
            44,
            18
        );

        ctx.fillStyle=
            v.color;

        roundRect(
            ctx,
            -22,
            -10,
            44,
            20,
            7
        );

        ctx.fillStyle="#b9e4f2";

        ctx.fillRect(
            -7,
            -7,
            14,
            8
        );

        ctx.restore();
    }
}

/* =========================================================
   CHARACTER RENDERER
========================================================= */

function drawCharacter(
    c,
    isPlayer
){

    const x=c.x;
    const y=c.y;

    const step =
        c.moving
        ?
        Math.sin(c.walk)*4
        :
        0;

    ctx.save();

    ctx.translate(
        x,
        y
    );

    /* shadow */

    ctx.fillStyle=
        "rgba(0,0,0,.18)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        17,
        16,
        7,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* legs */

    const skin =
        c.gender==="male"
        ?" #f0b88f"
        :"#f4c09b";

    ctx.strokeStyle=
        "#3e4050";

    ctx.lineWidth=5;

    ctx.lineCap="round";

    if(c.dir!=="up"){

        ctx.beginPath();

        ctx.moveTo(
            -6,
            8
        );

        ctx.lineTo(
            -7+step,
            22
        );

        ctx.stroke();

        ctx.beginPath();

        ctx.moveTo(
            6,
            8
        );

        ctx.lineTo(
            7-step,
            22
        );

        ctx.stroke();

    }else{

        ctx.beginPath();

        ctx.moveTo(
            -6,
            8
        );

        ctx.lineTo(
            -7-step,
            22
        );

        ctx.stroke();

        ctx.beginPath();

        ctx.moveTo(
            6,
            8
        );

        ctx.lineTo(
            7+step,
            22
        );

        ctx.stroke();
    }

    /* shoes */

    ctx.fillStyle="#303443";

    ctx.beginPath();
    ctx.ellipse(
        -8+step,
        22,
        6,
        3,
        0,
        0,
        Math.PI*2
    );
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(
        8-step,
        22,
        6,
        3,
        0,
        0,
        Math.PI*2
    );
    ctx.fill();

    /* body */

    ctx.fillStyle=
        c.shirt ||
        "#ff789d";

    roundRect(
        ctx,
        -14,
        -6,
        28,
        24,
        10
    );

    ctx.fill();

    /* arms */

    ctx.strokeStyle=
        skin.trim();

    ctx.lineWidth=5;

    const armStep =
        c.moving
        ?
        Math.sin(c.walk+Math.PI)*3
        :
        0;

    ctx.beginPath();

    ctx.moveTo(
        -13,
        -1
    );

    ctx.lineTo(
        -19,
        8+armStep
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
        13,
        -1
    );

    ctx.lineTo(
        19,
        8-armStep
    );

    ctx.stroke();

    /* neck */

    ctx.fillStyle=
        skin.trim();

    ctx.fillRect(
        -4,
        -14,
        8,
        8
    );

    /* head */

    ctx.fillStyle=
        skin.trim();

    ctx.beginPath();

    ctx.arc(
        0,
        -25,
        17,
        0,
        Math.PI*2
    );

    ctx.fill();

    drawFace(
        c
    );

    drawHair(
        c
    );

    /* NPC role badge */

    if(!isPlayer){

        const role =
            roleData[c.role];

        if(role){

            ctx.font=
                "12px sans-serif";

            ctx.textAlign="center";

            ctx.fillStyle="#fff";

            ctx.fillText(
                role.icon,
                0,
                -49
            );
        }
    }

    /* name */

    if(
        isPlayer ||
        distance(
            player,
            c
        )<130
    ){

        ctx.font=
            "bold 9px system-ui";

        ctx.textAlign="center";

        ctx.fillStyle=
            "rgba(20,25,35,.9)";

        ctx.fillText(
            c.name||
            "Người chơi",
            0,
            38
        );
    }

    ctx.restore();
}

function drawFace(c){

    if(c.dir==="up"){
        return;
    }

    ctx.fillStyle="#2b2a35";

    if(c.dir==="left"){

        ctx.beginPath();

        ctx.arc(
            -7,
            -27,
            2,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle="#8f554b";

        ctx.beginPath();

        ctx.arc(
            -17,
            -24,
            2,
            0,
            Math.PI*2
        );

        ctx.fill();

    }else if(
        c.dir==="right"
    ){

        ctx.beginPath();

        ctx.arc(
            7,
            -27,
            2,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle="#8f554b";

        ctx.beginPath();

        ctx.arc(
            17,
            -24,
            2,
            0,
            Math.PI*2
        );

        ctx.fill();

    }else{

        ctx.beginPath();

        ctx.arc(
            -6,
            -28,
            2.3,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.beginPath();

        ctx.arc(
            6,
            -28,
            2.3,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle="#9b5d51";

        ctx.fillRect(
            -1,
            -24,
            2,
            2
        );

        ctx.strokeStyle="#8b4c58";

        ctx.lineWidth=1.5;

        ctx.beginPath();

        ctx.arc(
            0,
            -21,
            4,
            0.15,
            Math.PI-.15
        );

        ctx.stroke();
    }
}

function drawHair(c){

    ctx.fillStyle=
        c.hairColor ||
        "#39291f";

    if(c.dir==="up"){

        ctx.beginPath();

        ctx.arc(
            0,
            -28,
            19,
            Math.PI,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillRect(
            -18,
            -28,
            36,
            12
        );

        return;
    }

    if(c.hair==="short"){

        ctx.beginPath();

        ctx.arc(
            0,
            -33,
            17,
            Math.PI,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillRect(
            -16,
            -34,
            7,
            13
        );

        ctx.fillRect(
            9,
            -34,
            7,
            13
        );

    }else if(
        c.hair==="bob"
    ){

        ctx.beginPath();

        ctx.arc(
            0,
            -32,
            19,
            Math.PI,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillRect(
            -18,
            -33,
            9,
            18
        );

        ctx.fillRect(
            9,
            -33,
            9,
            18
        );

    }else if(
        c.hair==="ponytail"
    ){

        ctx.beginPath();

        ctx.arc(
            0,
            -32,
            18,
            Math.PI,
            Math.PI*2
        );

        ctx.fill();

        ctx.beginPath();

        ctx.arc(
            18,
            -31,
            9,
            0,
            Math.PI*2
        );

        ctx.fill();

    }else if(
        c.hair==="curly"
    ){

        for(let i=-2;i<=2;i++){

            ctx.beginPath();

            ctx.arc(
                i*8,
                -37+
                Math.abs(i)*2,
                9,
                0,
                Math.PI*2
            );

            ctx.fill();
        }

    }else{

        ctx.beginPath();

        ctx.arc(
            0,
            -33,
            18,
            Math.PI,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillRect(
            -17,
            -34,
            7,
            25
        );

        ctx.fillRect(
            10,
            -34,
            7,
            25
        );
    }
}

/* =========================================================
   WEATHER DRAW
========================================================= */

function drawWeather(){

    const w=innerWidth;
    const h=innerHeight;

    ctx.save();

    ctx.translate(
        camera.x,
        camera.y
    );

    if(
        weather==="rain" ||
        weather==="storm"
    ){

        ctx.strokeStyle=
            "rgba(150,200,255,.55)";

        ctx.lineWidth=1;

        for(let i=0;i<130;i++){

            const x =
                camera.x+
                Math.random()*w;

            const y =
                camera.y+
                Math.random()*h;

            ctx.beginPath();

            ctx.moveTo(
                x,
                y
            );

            ctx.lineTo(
                x-4,
                y+13
            );

            ctx.stroke();
        }
    }

    if(weather==="fog"){

        ctx.fillStyle=
            "rgba(235,240,245,.18)";

        ctx.fillRect(
            camera.x,
            camera.y,
            w,
            h
        );
    }

    if(weather==="storm"){

        ctx.fillStyle=
            "rgba(40,45,70,.12)";

        ctx.fillRect(
            camera.x,
            camera.y,
            w,
            h
        );
    }

    /* night */

    const hour =
        gameMinutes/60;

    if(
        hour<6 ||
        hour>=19
    ){

        ctx.fillStyle=
            "rgba(18,27,58,.42)";

        ctx.fillRect(
            camera.x,
            camera.y,
            w,
            h
        );
    }

    ctx.restore();
}

/* =========================================================
   SPEECH BUBBLE
========================================================= */

function updateSpeech(){

    const el=
        document.getElementById(
            "speech"
        );

    if(
        !activeDialogue
    ){

        el.style.display="none";
        return;
    }

    const npc=
        activeDialogue;

    const sx =
        npc.x-camera.x;

    const sy =
        npc.y-camera.y;

    if(
        sx<-100 ||
        sx>innerWidth+100 ||
        sy<-100 ||
        sy>innerHeight+100
    ){

        el.style.display="none";
        return;
    }

    el.style.display="block";

    el.style.left=
        Math.max(
            8,
            Math.min(
                innerWidth-245,
                sx+camera.x-
                110
            )
        )+"px";

    el.style.top=
        Math.max(
            60,
            sy+camera.y-
            80
        )+"px";

    el.textContent=
        "💬 "+
        npcGreeting(npc);
}

/* =========================================================
   DRAW LOOP
========================================================= */

function updateHUD(){

    document
    .getElementById("money")
    .textContent=
        money(player.money);

    document
    .getElementById("level")
    .textContent=
        player.level;

    document
    .getElementById("day")
    .textContent=
        day;

    const h =
        Math.floor(
            gameMinutes/60
        );

    const m =
        Math.floor(
            gameMinutes%60
        );

    document
    .getElementById("clock")
    .textContent=
        String(h).padStart(2,"0")+
        ":"+
        String(m).padStart(2,"0");

    document
    .getElementById("weather")
    .textContent=
        weatherName();
}

function update(){

    const now=
        performance.now();

    let dt=
        (now-lastTime)/1000;

    lastTime=now;

    dt=
        Math.min(
            dt,
            .05
        );

    if(gameStarted){

        updatePlayer(dt);

        updateNPCs(dt);

        updateVehicles(dt);

        updateTime(dt);

        updateCamera();

        updateActionButton();

        updateSpeech();

        updateHUD();
    }

    ctx.clearRect(
        0,
        0,
        innerWidth,
        innerHeight
    );

    if(gameStarted){

        drawWorld();
    }

    requestAnimationFrame(
        update
    );
}

/* =========================================================
   ROUND RECT
========================================================= */

function roundRect(
    context,
    x,
    y,
    w,
    h,
    r
){

    const rr =
        Math.min(
            r,
            w/2,
            h/2
        );

    context.beginPath();

    context.moveTo(
        x+rr,
        y
    );

    context.arcTo(
        x+w,
        y,
        x+w,
        y+h,
        rr
    );

    context.arcTo(
        x+w,
        y+h,
        x,
        y+h,
        rr
    );

    context.arcTo(
        x,
        y+h,
        x,
        y,
        rr
    );

    context.arcTo(
        x,
        y,
        x+w,
        y,
        rr
    );

    context.closePath();

    context.fill();
}

/* =========================================================
   PREVIEW
========================================================= */

const preview =
    document.getElementById(
        "previewCanvas"
    );

const pctx=
    preview.getContext("2d");

function drawPreview(){

    preview.width=
        preview.clientWidth*
        DPR;

    preview.height=
        preview.clientHeight*
        DPR;

    pctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );

    const w=
        preview.clientWidth;

    const h=
        preview.clientHeight;

    pctx.clearRect(
        0,
        0,
        w,
        h
    );

    pctx.fillStyle=
        "#a8d99c";

    pctx.fillRect(
        0,
        0,
        w,
        h
    );

    pctx.fillStyle=
        "#747983";

    pctx.fillRect(
        0,
        h-45,
        w,
        45
    );

    pctx.save();

    pctx.translate(
        w/2,
        h/2+20
    );

    const fake={
        x:0,
        y:0,
        gender:
            document
            .getElementById(
                "genderInput"
            ).value,

        hair:
            document
            .getElementById(
                "hairInput"
            ).value,

        hairColor:
            document
            .getElementById(
                "hairColorInput"
            ).value,

        shirt:
            document
            .getElementById(
                "shirtInput"
            ).value,

        dir:"down",
        moving:false,
        walk:0,
        name:""
    };

    drawCharacterPreview(
        fake
    );

    pctx.restore();
}

function drawCharacterPreview(c){

    pctx.fillStyle=
        "rgba(0,0,0,.2)";

    pctx.beginPath();

    pctx.ellipse(
        0,
        26,
        25,
        8,
        0,
        0,
        Math.PI*2
    );

    pctx.fill();

    pctx.strokeStyle="#3e4050";
    pctx.lineWidth=8;
    pctx.lineCap="round";

    pctx.beginPath();
    pctx.moveTo(-9,13);
    pctx.lineTo(-12,34);
    pctx.stroke();

    pctx.beginPath();
    pctx.moveTo(9,13);
    pctx.lineTo(12,34);
    pctx.stroke();

    pctx.fillStyle=
        c.shirt;

    roundRectPreview(
        -23,
        -15,
        46,
        40,
        13
    );

    pctx.fillStyle="#f4c09b";

    pctx.beginPath();
    pctx.arc(
        0,
        -38,
        27,
        0,
        Math.PI*2
    );
    pctx.fill();

    pctx.fillStyle=
        c.hairColor;

    pctx.beginPath();

    pctx.arc(
        0,
        -45,
        28,
        Math.PI,
        Math.PI*2
    );

    pctx.fill();

    pctx.fillRect(
        -26,
        -46,
        10,
        30
    );

    pctx.fillRect(
        16,
        -46,
        10,
        30
    );

    pctx.fillStyle="#2b2a35";

    pctx.beginPath();
    pctx.arc(-9,-40,3,0,Math.PI*2);
    pctx.fill();

    pctx.beginPath();
    pctx.arc(9,-40,3,0,Math.PI*2);
    pctx.fill();

    pctx.strokeStyle="#8b4c58";
    pctx.lineWidth=2;

    pctx.beginPath();
    pctx.arc(0,-32,6,.15,Math.PI-.15);
    pctx.stroke();
}

function roundRectPreview(
    x,y,w,h,r
){

    pctx.beginPath();

    pctx.roundRect(
        x,y,w,h,r
    );

    pctx.fill();
}

[

    document
    .getElementById(id)

    );
